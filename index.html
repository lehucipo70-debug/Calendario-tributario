<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner del Equipo</title>
<meta name="description" content="Planner de tareas del equipo: tablero, lista, calendario y rendimiento por colaborador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   PLANNER DEL EQUIPO — estilos
   Tokens de color arriba (claro y oscuro); componentes debajo.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  color-scheme: light;
  --bg: #f4f4f5; --bg2: #ffffff; --bg3: #f1f1f4; --borde: #e4e4e7;
  --text: #09090b; --text2: #52525b; --text3: #6b6b74;
  --acento: #e11d48; --acento-2: #ea580c; --acento-solido: #e11d48; --acento-suave: #ffe4e6; --acento-texto: #be123c;
  --primario-bg: #09090b; --primario-texto: #fafafa;
  --indigo-suave: #e0e7ff; --indigo-texto: #3730a3;
  --verde: #15803d; --verde-suave: #e6f6ec;
  --ambar: #a16207; --ambar-suave: #fdf3dc;
  --rojo: #c8102e; --rojo-suave: #fdecef;
  --azul: #2563eb; --azul-suave: #e8f0fe;

  /* Series de gráficas (validadas para daltonismo, orden fijo) */
  --serie-ok: #008300; --serie-tarde: #eda100; --serie-curso: #2a78d6; --serie-vencida: #e34948;
  --nivel-excelente: #008300; --nivel-bueno: #2a78d6; --nivel-regular: #eda100; --nivel-bajo: #e34948; --nivel-na: #c4c4cc;

  /* Prioridades */
  --p-urgente: #c8102e; --p-alta: #c2410c; --p-media: #4f46e5; --p-baja: #71717a;

  /* Bloque de bienvenida: tonos oscuros para que el texto blanco tenga contraste */
  --hero-1: #d61a44; --hero-2: #c2410c; --hero-3: #6d28d9;

  --sombra: 0 1px 2px rgba(9,9,11,.04); --sombra-2: 0 12px 30px rgba(9,9,11,.08); --sombra-3: 0 24px 60px rgba(9,9,11,.18);
  --r: 20px; --r-lg: 28px;
  --alto-barra: 68px;
  /* Vidrio de las tablas (tema claro): esmerilado blanco con color detrás */
  --vidrio-borde: rgba(255,255,255,.95); --vidrio-anim: none;
  --vidrio-sombra: 0 0 0 1px rgba(9,9,11,.07), 0 24px 50px -20px rgba(9,9,11,.22), 0 8px 20px rgba(9,9,11,.05);
  --vidrio-fondo: rgba(255,255,255,.72); --vidrio-filo: #ffffff; --vidrio-reflejo: rgba(255,255,255,.6);
  --vidrio-cab: rgba(244,244,245,.6); --vidrio-linea-cab: rgba(9,9,11,.07); --vidrio-texto-cab: #27272a;
  --vidrio-linea: rgba(9,9,11,.06); --vidrio-hover: rgba(255,255,255,.9); --vidrio-brillo-barra: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #09090b; --bg2: #18181b; --bg3: #232327; --borde: #2b2b30;
    --text: #fafafa; --text2: #a1a1aa; --text3: #8e8e98;
    --acento: #ff4d6d; --acento-2: #ff8a3d; --acento-solido: #e11d48; --acento-suave: rgba(255,77,109,.14); --acento-texto: #fda4af;
    --primario-bg: #fafafa; --primario-texto: #09090b;
    --indigo-suave: rgba(165,180,252,.14); --indigo-texto: #c7d2fe;
    --verde: #4ade80; --verde-suave: rgba(74,222,128,.12);
    --ambar: #fbbf24; --ambar-suave: rgba(251,191,36,.12);
    --rojo: #fb7185; --rojo-suave: rgba(251,113,133,.13);
    --azul: #93c5fd; --azul-suave: rgba(147,197,253,.13);
    --serie-ok: #199e70; --serie-tarde: #c98500; --serie-curso: #3987e5; --serie-vencida: #e66767;
    --nivel-excelente: #199e70; --nivel-bueno: #3987e5; --nivel-regular: #c98500; --nivel-bajo: #e66767; --nivel-na: #3f3f46;
    --p-urgente: #fb7185; --p-alta: #fb923c; --p-media: #a5b4fc; --p-baja: #8e8e98;
    --sombra: none; --sombra-2: 0 12px 30px rgba(0,0,0,.45); --sombra-3: 0 24px 60px rgba(0,0,0,.65);
    /* Vidrio de las tablas (tema oscuro): borde de luz en degradado */
    --vidrio-borde: linear-gradient(120deg, rgba(255,77,109,.85), rgba(255,255,255,.10) 30%, rgba(255,255,255,.04) 55%, rgba(109,40,217,.8) 80%, rgba(255,138,61,.8));
    --vidrio-anim: flujo 9s ease infinite;
    --vidrio-sombra: 0 30px 80px rgba(0,0,0,.5);
    --vidrio-fondo: rgba(18,18,22,.84); --vidrio-filo: rgba(255,255,255,.08); --vidrio-reflejo: rgba(255,255,255,.07);
    --vidrio-cab: transparent; --vidrio-linea-cab: rgba(255,255,255,.10); --vidrio-texto-cab: #e4e4e7;
    --vidrio-linea: rgba(255,255,255,.06); --vidrio-hover: linear-gradient(90deg, rgba(255,77,109,.10), rgba(255,255,255,.03) 60%);
    --vidrio-brillo-barra: 0 0 10px rgba(255,77,109,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #09090b; --bg2: #18181b; --bg3: #232327; --borde: #2b2b30;
  --text: #fafafa; --text2: #a1a1aa; --text3: #8e8e98;
  --acento: #ff4d6d; --acento-2: #ff8a3d; --acento-solido: #e11d48; --acento-suave: rgba(255,77,109,.14); --acento-texto: #fda4af;
  --primario-bg: #fafafa; --primario-texto: #09090b;
  --indigo-suave: rgba(165,180,252,.14); --indigo-texto: #c7d2fe;
  --verde: #4ade80; --verde-suave: rgba(74,222,128,.12);
  --ambar: #fbbf24; --ambar-suave: rgba(251,191,36,.12);
  --rojo: #fb7185; --rojo-suave: rgba(251,113,133,.13);
  --azul: #93c5fd; --azul-suave: rgba(147,197,253,.13);
  --serie-ok: #199e70; --serie-tarde: #c98500; --serie-curso: #3987e5; --serie-vencida: #e66767;
  --nivel-excelente: #199e70; --nivel-bueno: #3987e5; --nivel-regular: #c98500; --nivel-bajo: #e66767; --nivel-na: #3f3f46;
  --p-urgente: #fb7185; --p-alta: #fb923c; --p-media: #a5b4fc; --p-baja: #8e8e98;
  --sombra: none; --sombra-2: 0 12px 30px rgba(0,0,0,.45); --sombra-3: 0 24px 60px rgba(0,0,0,.65);
  /* Vidrio de las tablas (tema oscuro): borde de luz en degradado */
  --vidrio-borde: linear-gradient(120deg, rgba(255,77,109,.85), rgba(255,255,255,.10) 30%, rgba(255,255,255,.04) 55%, rgba(109,40,217,.8) 80%, rgba(255,138,61,.8));
  --vidrio-anim: flujo 9s ease infinite;
  --vidrio-sombra: 0 30px 80px rgba(0,0,0,.5);
  --vidrio-fondo: rgba(18,18,22,.84); --vidrio-filo: rgba(255,255,255,.08); --vidrio-reflejo: rgba(255,255,255,.07);
  --vidrio-cab: transparent; --vidrio-linea-cab: rgba(255,255,255,.10); --vidrio-texto-cab: #e4e4e7;
  --vidrio-linea: rgba(255,255,255,.06); --vidrio-hover: linear-gradient(90deg, rgba(255,77,109,.10), rgba(255,255,255,.03) 60%);
  --vidrio-brillo-barra: 0 0 10px rgba(255,77,109,.6);
}

/* ── Base ─────────────────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { -webkit-font-smoothing: antialiased; }
body {
  font-family: Inter, 'Segoe UI', Roboto, system-ui, sans-serif; font-size: 14px; line-height: 1.5;
  color: var(--text); background: var(--bg);
}
h1, h2, h3, h4 { font-family: Unbounded, Inter, sans-serif; font-weight: 700; letter-spacing: -.3px; }
/* Las cifras van en Inter: en Unbounded el 0 se confunde con la O */
.kpi-valor, .anillo-centro strong, .colab-stats strong { font-family: Inter, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--acento-solido); color: #fff; }
code { font-family: 'Cascadia Code', Consolas, monospace; font-size: .9em; background: var(--bg3); padding: 1px 5px; border-radius: 5px; }
kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--borde); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg2); }
@keyframes malla { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes brillo { 0% { transform: translateX(-120%); } 60%, 100% { transform: translateX(260%); } }
@keyframes girar { to { transform: rotate(360deg); } }
@keyframes trazo { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes flujo { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.muted { color: var(--text2); }
.mini { font-size: 12px; }
.pad { padding: 12px; }
.mt { margin-top: 16px; }
.centrado { text-align: center; }
.ancho { width: 100%; }
.separador { flex: 1; }
.txt-rojo { color: var(--rojo); }
.txt-ambar { color: var(--ambar); }

/* ── Botones y controles ──────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--borde); background: var(--bg2);
  color: var(--text2); font-weight: 600; font-size: 13px; transition: background .15s, border-color .15s, transform .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg3); color: var(--text); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-sm { padding: 5px 11px; font-size: 12px; }
.btn-primario { background: var(--primario-bg); border-color: transparent; color: var(--primario-texto); }
.btn-primario:hover { background: var(--primario-bg); color: var(--primario-texto); transform: translateY(-1px); box-shadow: 0 8px 24px color-mix(in srgb, var(--acento) 35%, transparent); }
.btn-peligro { color: var(--rojo); }
.btn-peligro:hover { background: var(--rojo-suave); color: var(--rojo); border-color: var(--rojo); }
.btn-icono {
  width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  border-radius: 999px; border: 1px solid var(--borde); background: var(--bg2); color: var(--text2); font-size: 16px;
}
.btn-icono:hover { background: var(--bg3); color: var(--text); }
.btn-icono.btn-sm { width: 26px; height: 26px; font-size: 13px; border-radius: 999px; }
.btn-icono svg { width: 18px; height: 18px; }
.btn-icono[aria-pressed="true"] { color: var(--acento); border-color: color-mix(in srgb, var(--acento) 45%, var(--borde)); }

input, select, textarea {
  padding: 8px 12px; border-radius: 12px; border: 1px solid var(--borde); background: var(--bg2);
  outline: none; transition: border-color .15s, box-shadow .15s; min-width: 0;
}
input:focus, select:focus, textarea:focus { border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-suave); }
input:disabled, select:disabled, textarea:disabled { background: var(--bg3); color: var(--text2); }
textarea { width: 100%; resize: vertical; }

.segmentado { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--bg3); flex-wrap: wrap; }
.segmentado button { border: none; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--text2); }
.segmentado button.on { background: var(--primario-bg); color: var(--primario-texto); }
.seg-etiqueta { font-size: 12px; color: var(--text3); padding: 0 6px 0 8px; }

/* ── Chips ────────────────────────────────────────────────────────── */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; line-height: 1.6; }
.chip-suave { background: var(--bg3); color: var(--text2); font-weight: 500; }
.prio-urgente { background: var(--rojo-suave); color: var(--p-urgente); }
.prio-alta { background: color-mix(in srgb, var(--p-alta) 14%, transparent); color: var(--p-alta); }
.prio-media { background: var(--indigo-suave); color: var(--indigo-texto); }
.prio-baja { background: var(--bg3); color: var(--text2); }
.est-pendiente { background: var(--bg3); color: var(--text2); }
.est-en_progreso { background: var(--azul-suave); color: var(--azul); }
.est-en_revision { background: var(--ambar-suave); color: var(--ambar); }
.est-completada { background: var(--verde-suave); color: var(--verde); }
.est-vencida { background: var(--rojo-suave); color: var(--rojo); }
.nivel { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 12.5px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.nivel small { font-weight: 500; font-size: 11px; }
.nivel-excelente { background: var(--verde-suave); color: var(--verde); }
.nivel-bueno { background: var(--azul-suave); color: var(--azul); }
.nivel-regular { background: var(--ambar-suave); color: var(--ambar); }
.nivel-bajo { background: var(--rojo-suave); color: var(--rojo); }
.nivel-na { background: var(--bg3); color: var(--text3); }

.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; flex-shrink: 0; letter-spacing: 0; box-shadow: 0 0 0 2px var(--bg2); }

/* ── Login ────────────────────────────────────────────────────────── */
.login { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden;
  background: radial-gradient(1000px 460px at 50% 115%, rgba(255,77,109,.26), transparent 65%), radial-gradient(900px 520px at 100% 0%, rgba(109,40,217,.16), transparent 55%); }
/* Fondo animado (ola de partículas) detrás de todo: inicio de sesión y aplicación */
#fondo-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.app { position: relative; z-index: 1; }
.login-caja { position: relative; width: 100%; max-width: 380px; padding: 36px 30px; border-radius: var(--r-lg); text-align: center;
  background: color-mix(in srgb, var(--bg2) 82%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--borde); box-shadow: var(--sombra-3); }
.login-logo { justify-content: center; font-size: 26px; margin: 0 0 6px; }
.login h1 { font-size: 20px; margin-top: 6px; letter-spacing: -.6px; }
.login-sub { color: var(--text2); font-size: 13px; margin: 2px 0 18px; }
.login form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
.login label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text2); }
.login .btn-primario { padding: 12px; font-size: 14px; margin-top: 4px; }
.login-link { background: none; border: none; color: var(--acento-texto); font-size: 12px; text-decoration: underline; align-self: center; }
.login-demo { background: var(--acento-suave); color: var(--acento-texto); border-radius: 14px; padding: 10px 12px; font-size: 12px; margin-bottom: 14px; text-align: left; }
.login-msg { border-radius: 10px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; text-align: left; }
.login-msg.error { background: var(--rojo-suave); color: var(--rojo); }
.login-msg.ok { background: var(--verde-suave); color: var(--verde); }

/* ── Estructura ───────────────────────────────────────────────────── */
.barra-sup {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; height: var(--alto-barra); padding: 0 24px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--borde);
}
.marca { display: flex; align-items: baseline; font-family: Unbounded, Inter, sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -.6px; white-space: nowrap; margin-right: 10px; }
.marca-punto { color: var(--acento); font-size: .75em; margin-left: 2px; }
.lateral { display: flex; align-items: center; min-width: 0; }
.nav { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--borde); }
.nav button { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border: none; background: transparent; border-radius: 999px; color: var(--text2); font-weight: 500; font-size: 13px; white-space: nowrap; transition: background .15s, color .15s; }
.nav button:hover { background: var(--bg3); color: var(--text); }
.nav button.activo { background: var(--primario-bg); color: var(--primario-texto); }
.nav-icono { display: none; }
.nav-badge { background: var(--acento-solido); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 7px; line-height: 18px; }
.lateral-pie { display: none; }
.capa-menu { display: none; }
.menu-movil { display: none; }
.usuario { display: flex; align-items: center; gap: 8px; padding-left: 4px; }
.usuario .avatar { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--acento); }
.usuario-info { display: none; flex-direction: column; line-height: 1.25; font-size: 12px; }
.usuario-info span { color: var(--text3); font-size: 11px; }
.punto-conexion { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); }
.punto-conexion.off { background: var(--text3); }
.contenido { min-height: calc(100vh - var(--alto-barra)); }
.titulo-vista { max-width: 1500px; margin: 0 auto; padding: 28px 24px 0; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
body[data-vista="inicio"] .titulo-vista { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.main { padding: 18px 24px 48px; max-width: 1500px; margin: 0 auto; }
.cargando { padding: 60px; text-align: center; color: var(--text2); }
@media (min-width: 1440px) { .usuario-info { display: flex; } }
@media (max-width: 1240px) {
  .menu-movil { display: inline-flex; }
  .barra-sup { backdrop-filter: none; background: var(--bg); }
  .lateral {
    position: fixed; inset: 0 auto 0 0; width: 272px; z-index: 40; flex-direction: column; align-items: stretch; gap: 14px;
    padding: 22px 14px; background: var(--bg2); border-right: 1px solid var(--borde); overflow-y: auto;
    transform: translateX(-100%); transition: transform .2s ease;
  }
  body.menu-abierto .lateral { transform: none; box-shadow: var(--sombra-3); }
  body.menu-abierto .capa-menu { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.5); }
  .nav { flex-direction: column; align-items: stretch; padding: 0; border: none; background: none; border-radius: 0; }
  .nav button { padding: 11px 14px; font-size: 14px; border-radius: 14px; }
  .nav-icono { display: inline; width: 22px; text-align: center; }
  .nav-texto { flex: 1; text-align: left; }
  .lateral-pie { display: block; margin-top: auto; padding: 0 6px; }
}

/* ── Paneles, KPIs y rejillas ─────────────────────────────────────── */
.panel { background: var(--bg2); border: 1px solid var(--borde); border-radius: var(--r); padding: 20px; box-shadow: var(--sombra); min-width: 0; }
.panel-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-cab h3 { font-size: 15px; }
.contador { background: var(--bg3); color: var(--text2); font-size: 12px; font-weight: 700; border-radius: 999px; padding: 0 8px; line-height: 20px; }
.contador.rojo { background: var(--rojo-suave); color: var(--rojo); }
.contador.ambar { background: var(--ambar-suave); color: var(--ambar); }
.contador.azul { background: var(--azul-suave); color: var(--azul); }
.rejilla-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.rejilla-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.rejilla-graficas { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpis-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.kpi { display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: flex-start; gap: 12px; background: var(--bg2); border: 1px solid var(--borde); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--sombra); transition: transform .2s ease, border-color .2s ease; }
.kpi:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--acento) 45%, var(--borde)); }
.kpi > div { display: flex; flex-direction: column-reverse; gap: 4px; }
.kpi-icono { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
.kpi-valor { font-size: 34px; line-height: 1.05; letter-spacing: -1.2px; }
.kpi-etiqueta { font-size: 13px; color: var(--text2); }
.kpi-rojo .kpi-icono { background: var(--rojo-suave); color: var(--rojo); }
.kpi-ambar .kpi-icono { background: var(--ambar-suave); color: var(--ambar); }
.kpi-azul .kpi-icono { background: var(--azul-suave); color: var(--azul); }
.kpi-verde .kpi-icono { background: var(--verde-suave); color: var(--verde); }
.kpi-violeta .kpi-icono { background: var(--acento-suave); color: var(--acento-texto); }

.vacio { text-align: center; padding: 56px 20px; color: var(--text2); }
.vacio-icono { font-size: 40px; margin-bottom: 8px; }
.vacio h3 { color: var(--text); margin-bottom: 6px; }
.vacio p { max-width: 520px; margin: 0 auto 16px; }

/* ── Inicio ───────────────────────────────────────────────────────── */
.hero {
  position: relative; overflow: hidden; isolation: isolate;
  display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 16px;
  padding: 32px 34px; border-radius: var(--r-lg); color: #fff;
  background: linear-gradient(120deg, var(--hero-1), var(--hero-2), var(--hero-3), var(--hero-1)); background-size: 300% 300%;
  animation: malla 16s ease infinite;
}
.hero::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; z-index: -1; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); animation: brillo 7s ease-in-out infinite; }
.hero::after { content: ''; position: absolute; right: -80px; top: -110px; width: 300px; height: 300px; z-index: -1; pointer-events: none;
  border-radius: 50%; border: 1px dashed rgba(255,255,255,.35); animation: girar 60s linear infinite; }
.hero > div:first-child { flex: 1; min-width: 260px; }
.hero h2 { font-size: 34px; font-weight: 800; letter-spacing: -1.4px; line-height: 1.1; margin: 6px 0 8px; color: #fff; }
.hero-fecha { color: rgba(255,255,255,.92); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.hero .muted { color: rgba(255,255,255,.92); }
.hero .txt-rojo { color: #fff; background: rgba(0,0,0,.28); padding: 1px 8px; border-radius: 999px; }
.hero :focus-visible { outline-color: #fff; }
.captura-rapida { margin-top: 18px; max-width: 560px; }
.captura-rapida input { width: 100%; padding: 12px 18px; border-radius: 999px; font-size: 14px; color: #fff; background: rgba(0,0,0,.24); border-color: rgba(255,255,255,.28); }
.captura-rapida input::placeholder { color: rgba(255,255,255,.82); }
.captura-rapida input:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
.hero .anillo svg circle:first-child { stroke: rgba(255,255,255,.22); }
.hero .anillo svg circle + circle { stroke: #fff; }
.hero .anillo-centro span, .hero .anillo-etiqueta { color: rgba(255,255,255,.92); }
.anillo { position: relative; display: flex; flex-direction: column; align-items: center; }
.anillo svg circle { transition: stroke-dasharray .6s ease; }
.anillo-centro { position: absolute; top: 0; height: 118px; width: 118px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.anillo-centro strong { font-size: 30px; line-height: 1; letter-spacing: -1px; }
.anillo-centro span { font-size: 11px; color: var(--text2); margin-top: 3px; }
.anillo-etiqueta { font-size: 11.5px; color: var(--text2); margin-top: 4px; }

.lista-tarjetas { display: flex; flex-direction: column; gap: 8px; }
.fila-tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.equipo-mini { display: flex; flex-direction: column; }
.equipo-fila { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border: none; background: none; border-bottom: 1px solid var(--borde); text-align: left; border-radius: 12px; }
.equipo-fila:hover { background: var(--bg3); }
.equipo-fila:last-child { border-bottom: none; }
.equipo-nombre { font-weight: 600; min-width: 140px; }
.equipo-fila .muted { flex: 1; font-size: 12.5px; }

/* ── Tarjeta de tarea ─────────────────────────────────────────────── */
.tarjeta {
  position: relative; background: var(--bg2); border: 1px solid var(--borde); border-left: 3px solid var(--p-media);
  border-radius: 14px; padding: 12px 14px; cursor: pointer; box-shadow: var(--sombra); transition: box-shadow .15s, transform .15s, opacity .15s, border-color .15s;
}
.tarjeta:hover { box-shadow: var(--sombra-2); transform: translateY(-2px); border-color: color-mix(in srgb, var(--acento) 35%, var(--borde)); }
.tarjeta[draggable="true"] { cursor: grab; }
.tarjeta.arrastrando, .ev.arrastrando { opacity: .4; }
.prio-borde-urgente { border-left-color: var(--p-urgente); }
.prio-borde-alta { border-left-color: var(--p-alta); }
.prio-borde-media { border-left-color: var(--p-media); }
.prio-borde-baja { border-left-color: var(--p-baja); }
.tarjeta.hecha { opacity: .62; }
.tarjeta.hecha .tarjeta-titulo { text-decoration: line-through; }
.tarjeta-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-right: 28px; }
.tarjeta-titulo { font-family: Inter, sans-serif; font-size: 13.5px; font-weight: 600; margin: 7px 0 3px; line-height: 1.35; word-break: break-word; }
.tarjeta-empresa { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tarjeta-pie { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; }
.pie-der { display: inline-flex; align-items: center; gap: 8px; }
.fecha { color: var(--text2); white-space: nowrap; }
.fecha.vencida { color: var(--rojo); font-weight: 600; }
.fecha.pronto { color: var(--ambar); font-weight: 600; }
.mini-barra { height: 4px; border-radius: 4px; background: var(--bg3); margin-top: 8px; overflow: hidden; }
.mini-barra span { display: block; height: 100%; background: linear-gradient(90deg, var(--acento-2), var(--acento)); border-radius: 4px; }
.check {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text3); background: var(--bg2); color: transparent;
  font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; flex-shrink: 0; transition: all .15s;
}
.tarjeta .check { position: absolute; top: 9px; right: 9px; }
.check:hover { border-color: var(--verde); color: var(--verde); }
.check.on { background: var(--verde); border-color: var(--verde); color: #fff; }

/* ── Barra de filtros ─────────────────────────────────────────────── */
.barra-filtros { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.barra-filtros input[type="search"] { flex: 1; min-width: 200px; max-width: 360px; }
.barra-vista { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }

/* ── Tablero ──────────────────────────────────────────────────────── */
.tablero { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.columna { background: var(--bg3); border-radius: var(--r); padding: 12px; min-height: 200px; border: 2px dashed transparent; transition: border-color .15s, background .15s; }
.columna.sobre, .dia.sobre, .semana-dia.sobre { border-color: var(--acento); background: var(--acento-suave); }
.columna-cab { display: flex; align-items: center; gap: 8px; padding: 2px 4px 10px; }
.columna-cab h3 { font-family: Inter, sans-serif; font-size: 13.5px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.columna.est-completada .columna-cab h3 { color: var(--verde); }
.columna.est-en_progreso .columna-cab h3 { color: var(--azul); }
.columna.est-en_revision .columna-cab h3 { color: var(--ambar); }
.columna.prio-urgente, .columna.prio-alta, .columna.prio-media, .columna.prio-baja { background: var(--bg3); }
.columna-cuerpo { display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 330px); overflow-y: auto; padding: 2px; }
.columna-vacia { text-align: center; color: var(--text3); font-size: 12px; padding: 24px 8px; border: 1px dashed var(--borde); border-radius: 14px; }

/* ── Lista (tabla) ────────────────────────────────────────────────── */
.tarjeta-tabla { background: var(--bg2); border: 1px solid var(--borde); border-radius: var(--r); box-shadow: var(--sombra); overflow: hidden; }
.tabla-scroll { overflow-x: auto; }
.tabla { width: 100%; border-collapse: collapse; }
.tabla th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); padding: 10px 12px; border-bottom: 1px solid var(--borde); background: var(--bg3); white-space: nowrap; }
.tabla td { padding: 9px 12px; border-bottom: 1px solid var(--borde); font-size: 13px; vertical-align: middle; }
.tabla tbody tr:hover td { background: color-mix(in srgb, var(--bg3) 60%, transparent); }
.tabla tr:last-child td { border-bottom: none; }
.tabla .num { text-align: right; font-variant-numeric: tabular-nums; }
.th-orden { border: none; background: none; font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; }
.th-orden.on { color: var(--acento-texto); }
.td-titulo { min-width: 260px; }
/* La celda sigue siendo de tabla (con display:flex sus líneas no coincidían con las demás columnas) */
.td-titulo-in { display: flex; align-items: center; gap: 8px; }
.enlace-tarea { border: none; background: none; text-align: left; font-weight: 600; color: var(--text); }
.enlace-tarea:hover { color: var(--acento-texto); text-decoration: underline; }
.fila-hecha .enlace-tarea { text-decoration: line-through; color: var(--text2); }
.fila-vencida td:first-child { box-shadow: inset 3px 0 0 var(--rojo); }

/* ── Tablas con efecto vidrio (los valores cambian por tema en los tokens --vidrio-*) ── */
.vidrio { position: relative; isolation: isolate; padding: 1px; border-radius: calc(var(--r) + 5px); box-shadow: var(--vidrio-sombra); }
/* El degradado va solo en el contorno de 1px (la máscara recorta el centro); si cubriera todo el fondo, se transparentaría a través del vidrio */
.vidrio::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit; padding: 1px;
  background: var(--vidrio-borde); background-size: 220% 220%; animation: var(--vidrio-anim);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.vidrio-interior { position: relative; border-radius: calc(var(--r) + 4px); overflow: hidden; background: var(--vidrio-fondo);
  backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%); box-shadow: inset 0 1px 0 var(--vidrio-filo); }
.vidrio-interior::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 120px; pointer-events: none; background: linear-gradient(180deg, var(--vidrio-reflejo), transparent); }
.vidrio-interior > * { position: relative; }
.vidrio-interior > .panel-cab { padding: 18px 20px 4px; }
.vidrio .tabla th { background: var(--vidrio-cab); border-bottom-color: var(--vidrio-linea-cab); color: var(--vidrio-texto-cab); padding: 13px 14px; }
.vidrio .tabla td { border-bottom-color: var(--vidrio-linea); padding: 10px 14px; transition: background .2s; }
.vidrio .tabla tbody tr:hover td { background: var(--vidrio-hover); }
.vidrio .tabla tbody tr:not(.fila-vencida):hover td:first-child { box-shadow: inset 3px 0 0 var(--acento); }
.vidrio .barra-progreso { background: color-mix(in srgb, var(--text) 10%, transparent); }
.vidrio .barra-progreso span { box-shadow: var(--vidrio-brillo-barra); }
.celda-colab { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.sel-estado { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: none; }
.barra-progreso { width: 90px; height: 6px; background: var(--bg3); border-radius: 6px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.barra-progreso span { display: block; height: 100%; background: linear-gradient(90deg, var(--acento-2), var(--acento)); border-radius: 6px; transition: width .3s; }
.barra-progreso.grande { width: 100%; height: 8px; margin: 10px 0; }
.fila-click { cursor: pointer; }

/* ── Calendario ───────────────────────────────────────────────────── */
.cal-barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.cal-nav { display: flex; align-items: center; gap: 8px; }
.cal-titulo { font-size: 19px; margin-left: 8px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 10px; font-size: 12px; color: var(--text2); }
.leyenda-item { display: inline-flex; align-items: center; gap: 6px; }
.muestra { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.mes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--bg2); border: 1px solid var(--borde); border-radius: var(--r); overflow: hidden; box-shadow: var(--sombra); }
.mes-cab { padding: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); text-align: center; background: var(--bg3); border-bottom: 1px solid var(--borde); }
.dia { min-height: 118px; padding: 6px; border-right: 1px solid var(--borde); border-bottom: 1px solid var(--borde); display: flex; flex-direction: column; gap: 3px; cursor: pointer; border-width: 0 1px 1px 0; transition: background .15s; min-width: 0; outline: 2px dashed transparent; outline-offset: -3px; }
.dia:nth-child(7n) { border-right: none; }
.dia:hover { background: color-mix(in srgb, var(--acento-suave) 50%, transparent); }
.dia.sobre { outline-color: var(--acento); }
.dia.finde, .mes-cab.finde, .semana-dia.finde { background: color-mix(in srgb, var(--bg3) 45%, var(--bg2)); }
.dia.fuera .dia-num { color: var(--text3); }
.dia.fuera { background: color-mix(in srgb, var(--bg3) 30%, var(--bg2)); }
.dia-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.dia-num { font-size: 12.5px; font-weight: 600; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.es-hoy .dia-num { background: var(--acento-solido); color: #fff; }
.dia-carga { font-size: 10.5px; font-weight: 700; color: var(--text2); background: var(--bg3); border-radius: 999px; padding: 0 6px; }
.ev {
  display: flex; align-items: center; gap: 5px; width: 100%; padding: 3px 7px; border-radius: 8px; border: none; text-align: left;
  font-size: 11.5px; font-weight: 500; background: var(--bg3); color: var(--text); min-width: 0;
}
.ev:hover { box-shadow: 0 0 0 1px var(--acento); }
.ev[draggable="true"] { cursor: grab; }
.ev-punto { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1.5px var(--bg2); }
.ev-prio { font-size: 9px; }
.ev-texto { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-vencida { background: var(--rojo-suave); color: var(--rojo); }
.ev-completada { opacity: .6; }
.ev-completada .ev-texto { text-decoration: line-through; }
.ev-en_progreso { background: var(--azul-suave); }
.ev-en_revision { background: var(--ambar-suave); }
.ev-muestra { display: inline-flex; width: auto; cursor: default; }
.ev-mas { border: none; background: none; color: var(--acento-texto); font-size: 11.5px; font-weight: 600; text-align: left; padding: 1px 6px; }
.semana { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.semana-dia { background: var(--bg2); border: 2px dashed transparent; border-radius: var(--r); min-height: 360px; display: flex; flex-direction: column; box-shadow: var(--sombra); outline: 1px solid var(--borde); }
.semana-dia header { display: flex; align-items: center; gap: 6px; padding: 10px; border-bottom: 1px solid var(--borde); }
.semana-dia .dia-nombre { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text2); }
.semana-dia header .btn-icono { margin-left: auto; }
.semana-cuerpo { padding: 8px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.semana-dia.es-hoy { outline: 2px solid var(--acento); }

/* ── Rendimiento (gráficas) ───────────────────────────────────────── */
.grafica-barras { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.barra-fila { display: grid; grid-template-columns: 130px minmax(0, 1fr) 34px; align-items: center; gap: 10px; }
.barra-nombre { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-pista { display: flex; gap: 2px; height: 24px; }
.seg { display: flex; align-items: center; justify-content: center; min-width: 3px; height: 100%; transition: filter .15s; }
.seg:first-child { border-radius: 7px 0 0 7px; }
.seg:last-child { border-radius: 0 7px 7px 0; }
.seg:only-child { border-radius: 7px; }
.seg:hover { filter: brightness(1.12); }
.seg-num { font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.35); }
.barra-total { font-size: 12.5px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.grafica-linea { width: 100%; height: auto; display: block; }
.grafica-linea .grid { stroke: var(--borde); stroke-width: 1; }
.grafica-linea .eje { fill: var(--text3); font-size: 11px; }
.grafica-linea .linea { fill: none; stroke: url(#grad-tendencia); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; animation: trazo 1.6s ease-out both; }
.grafica-linea .area { fill: var(--acento); opacity: .1; }
.grafica-linea .punto { fill: var(--acento); stroke: var(--bg2); stroke-width: 2; opacity: 0; transition: opacity .1s; }
.grafica-linea .guia { stroke: var(--text3); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
.grafica-linea .banda:hover .punto, .grafica-linea .banda:hover .guia { opacity: 1; }
.grafica-linea .valor-final { fill: var(--text); font-size: 12px; font-weight: 700; }
.tooltip {
  position: fixed; top: 0; left: 0; z-index: 200; pointer-events: none; max-width: 280px;
  background: var(--text); color: var(--bg2); font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 8px; box-shadow: var(--sombra-2);
}

/* ── Colaboradores ────────────────────────────────────────────────── */
.rejilla-colabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.colab { background: var(--bg2); border: 1px solid var(--borde); border-radius: var(--r); padding: 20px; box-shadow: var(--sombra); display: flex; flex-direction: column; gap: 12px; }
.colab-cab { display: flex; align-items: center; gap: 12px; }
.colab-nombre { flex: 1; min-width: 0; }
.colab-nombre h3 { font-size: 15px; }
.colab-nombre span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.colab-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.colab-stats div { background: var(--bg3); border-radius: 14px; padding: 8px 2px; }
.colab-stats strong { display: block; font-size: 19px; }
.colab-stats span { font-size: 11px; color: var(--text2); }
.carga { height: 6px; background: var(--bg3); border-radius: 6px; overflow: hidden; }
.carga span { display: block; height: 100%; border-radius: 6px; }
.colab-pie { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* ── Admin ────────────────────────────────────────────────────────── */
.lista-ayuda { margin: 8px 0 10px 18px; color: var(--text2); font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.datos-sistema { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin-bottom: 14px; font-size: 13px; }
.datos-sistema dt { color: var(--text2); }
.fila-botones { display: flex; gap: 8px; flex-wrap: wrap; }
.panel > p, .panel > ul { margin-bottom: 10px; }
.imp-log { font-size: 12px; color: var(--text2); max-height: 200px; overflow-y: auto; line-height: 1.7; }

/* ── Modal ────────────────────────────────────────────────────────── */
.capa-modal { position: fixed; inset: 0; z-index: 100; background: rgba(9,9,11,.6); backdrop-filter: blur(6px); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto; }
.modal { width: 100%; background: var(--bg2); border: 1px solid var(--borde); border-radius: var(--r-lg); box-shadow: var(--sombra-3); padding: 22px 24px; animation: aparecer .16s ease; }
@keyframes aparecer { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.modal-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.modal-cab h3 { flex: 1; font-size: 16px; text-transform: none; }
.modal-pie { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--borde); flex-wrap: wrap; }
.input-titulo { flex: 1; font-family: Unbounded, Inter, sans-serif; font-size: 18px; font-weight: 600; border-color: transparent; padding: 6px 8px; background: transparent; }
.input-titulo:hover { border-color: var(--borde); }
.meta-tarea { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: -4px 0 12px 8px; }
.tarea-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; }
.tarea-grid.sin-seguimiento { grid-template-columns: 1fr; }

<script>
/* ── js/utils.js ── */
// ═══════════════════════════════════════════════════════════════════
// UTILIDADES — funciones puras sin dependencias del DOM ni de datos
// ═══════════════════════════════════════════════════════════════════

const Util = {
  esc(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },

  uid() {
    if (window.crypto?.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  },

  normalizar(s) {
    return String(s ?? '').trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  },

  iniciales(nombre) {
    const partes = String(nombre || '?').trim().split(/\s+/).filter(Boolean);
    return ((partes[0]?.[0] || '?') + (partes[1]?.[0] || '')).toUpperCase();
  },

  // ── Fechas ──────────────────────────────────────────────────────────
  // Las fechas de tareas se guardan como 'AAAA-MM-DD' y se interpretan en
  // hora local. new Date('2026-07-14') las leería en UTC y en Colombia
  // (UTC-5) caerían un día antes.
  aISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  },

  deISO(s) {
    if (!s) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  },

  // Fecha local (AAAA-MM-DD) de un timestamp ISO completo.
  fechaDeTimestamp(ts) {
    if (!ts) return null;
    const d = new Date(ts);
    return isNaN(d) ? null : Util.aISO(d);
  },

  hoyISO() { return Util.aISO(new Date()); },

  sumarDias(iso, n) {
    const d = Util.deISO(iso);
    d.setDate(d.getDate() + n);
    return Util.aISO(d);
  },

  diasEntre(desdeISO, hastaISO) {
    const a = Util.deISO(desdeISO), b = Util.deISO(hastaISO);
    return Math.round((b - a) / 86400000);
  },

  // Lunes de la semana de una fecha (semana laboral colombiana empieza en lunes).
  inicioSemana(iso) {
    const d = Util.deISO(iso);
    const dia = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - dia);
    return Util.aISO(d);
  },

  MESES: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
  MESES_CORTOS: ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'],
  DIAS_CORTOS: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'],

  fmtFecha(iso) {
    const d = Util.deISO(iso);
    if (!d) return '—';
    return d.getDate() + ' ' + Util.MESES_CORTOS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
  },

  // "Hoy", "Mañana", "Ayer", "en 3 días", "hace 5 días"
  fmtRelativa(iso) {
    if (!iso) return 'Sin fecha';
    const n = Util.diasEntre(Util.hoyISO(), iso);
    if (n === 0) return 'Hoy';
    if (n === 1) return 'Mañana';
    if (n === -1) return 'Ayer';
    if (n > 1 && n <= 6) return 'En ' + n + ' días';
    if (n < -1 && n >= -30) return 'Hace ' + (-n) + ' días';
    return Util.fmtFecha(iso);
  },

  fmtFechaHora(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  },

  // Convierte casi cualquier valor de celda de Excel a 'AAAA-MM-DD'.
  parsearFecha(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) {
      if (isNaN(v)) return null;
      // Las fechas de Excel a veces llegan corridas por zona horaria (p. ej. 19:00 del
      // día anterior = medianoche UTC en Colombia): de 18:00 en adelante es el día siguiente.
      const d = new Date(v);
      if (d.getHours() >= 18) d.setDate(d.getDate() + 1);
      return Util.aISO(d);
    }
    if (typeof v === 'number') {
      // Número de serie de Excel (días desde 1899-12-30)
      if (v > 20000 && v < 80000) return Util.aISO(new Date(Math.round((v - 25569) * 86400000) + new Date().getTimezoneOffset() * 60000));
      return null;
    }
    const s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
    const p = s.split(/[\/\-.]/);
    if (p.length === 3 && p.every(x => /^\d+$/.test(x))) {
      if (p[2].length === 4) return p[2] + '-' + p[1].padStart(2, '0') + '-' + p[0].padStart(2, '0');
      if (p[0].length === 4) return p[0] + '-' + p[1].padStart(2, '0') + '-' + p[2].padStart(2, '0');
    }
    if (!/[a-zA-Z]/.test(s)) return null; // números sueltos nunca son fechas
    const d = new Date(s);
    if (!isNaN(d) && d.getFullYear() >= 2000 && d.getFullYear() <= 2100) return Util.aISO(d);
    return null;
  },

  // ── Colores ─────────────────────────────────────────────────────────
  textoSobre(hex) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.62 ? '#1b1a22' : '#ffffff';
  },

  pct(n, d) { return d ? Math.round((n / d) * 100) : 0; },

  agruparPor(arr, fn) {
    const m = new Map();
    for (const x of arr) {
      const k = fn(x);
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(x);
    }
    return m;
  },
};

if (typeof module !== 'undefined') module.exports = { Util };

</script>
<script>
/* ── js/metricas.js ── */
// ═══════════════════════════════════════════════════════════════════
// MÉTRICAS DE RENDIMIENTO — funciones puras (se prueban en tests/)
//
// Índice de rendimiento (0–100) de un colaborador en un periodo:
//   evaluables  = tareas completadas + tareas vencidas sin completar
//                 (las que aún no vencen no cuentan ni a favor ni en contra)
//   cumplimiento = completadas / evaluables
//   puntualidad  = completadas a tiempo / completadas con fecha límite
//   índice       = 50 % cumplimiento + 50 % puntualidad
//                  (si ninguna completada tenía fecha, solo cumplimiento)
// ═══════════════════════════════════════════════════════════════════

const Metricas = (() => {
  const U = typeof Util !== 'undefined' ? Util : require('./utils.js').Util;
  const DIAS_ALERTA = typeof CONFIG !== 'undefined' ? CONFIG.DIAS_ALERTA : 3;

  function estaCompletada(t) { return t.estado === 'completada'; }

  // pendiente | en_progreso | en_revision | completada | vencida
  function estadoEfectivo(t, hoy) {
    if (estaCompletada(t)) return 'completada';
    if (t.fecha_vencimiento && t.fecha_vencimiento < hoy) return 'vencida';
    return t.estado || 'pendiente';
  }

  function porVencer(t, hoy) {
    if (estaCompletada(t) || !t.fecha_vencimiento) return false;
    return t.fecha_vencimiento >= hoy && t.fecha_vencimiento <= U.sumarDias(hoy, DIAS_ALERTA);
  }

  // true / false; null si no se puede evaluar (sin fecha límite o sin completar)
  function aTiempo(t) {
    if (!estaCompletada(t) || !t.fecha_vencimiento) return null;
    const fin = U.fechaDeTimestamp(t.completada_at) || t.fecha_vencimiento;
    return fin <= t.fecha_vencimiento;
  }

  function rangoPeriodo(periodo, hoy) {
    const d = U.deISO(hoy);
    const y = d.getFullYear(), m = d.getMonth();
    const iso = (yy, mm, dd) => U.aISO(new Date(yy, mm, dd));
    switch (periodo) {
      case 'semana': { const desde = U.inicioSemana(hoy); return { desde, hasta: U.sumarDias(desde, 6) }; }
      case 'mes': return { desde: iso(y, m, 1), hasta: iso(y, m + 1, 0) };
      case 'mes_anterior': return { desde: iso(y, m - 1, 1), hasta: iso(y, m, 0) };
      case 'trimestre': { const q = Math.floor(m / 3) * 3; return { desde: iso(y, q, 1), hasta: iso(y, q + 3, 0) }; }
      case 'anio': return { desde: iso(y, 0, 1), hasta: iso(y, 11, 31) };
      default: return { desde: null, hasta: null };
    }
  }

  // Fecha con la que una tarea "pertenece" a un periodo: su vencimiento o, si no tiene, su creación.
  function fechaReferencia(t) {
    return t.fecha_vencimiento || U.fechaDeTimestamp(t.created_at);
  }

  function enRango(t, rango) {
    if (!rango.desde) return true;
    const f = fechaReferencia(t);
    return !!f && f >= rango.desde && f <= rango.hasta;
  }

  function claveColaborador(t) {
    if (t.asignado_a) return t.asignado_a;
    if (t.asignado_nombre) return 'n:' + U.normalizar(t.asignado_nombre);
    return 'sin';
  }

  function calcular(tareas, hoy) {
    const r = { total: tareas.length, completadas: 0, aTiempo: 0, tarde: 0, conFecha: 0, vencidas: 0, enCurso: 0, porVencer: 0, diasTotales: 0, diasMuestras: 0 };
    for (const t of tareas) {
      const est = estadoEfectivo(t, hoy);
      if (est === 'completada') {
        r.completadas++;
        const ok = aTiempo(t);
        if (ok !== null) { r.conFecha++; ok ? r.aTiempo++ : r.tarde++; }
        const ini = U.fechaDeTimestamp(t.created_at), fin = U.fechaDeTimestamp(t.completada_at);
        if (ini && fin) { r.diasTotales += Math.max(0, U.diasEntre(ini, fin)); r.diasMuestras++; }
      } else if (est === 'vencida') {
        r.vencidas++;
      } else {
        r.enCurso++;
        if (porVencer(t, hoy)) r.porVencer++;
      }
    }
    const evaluables = r.completadas + r.vencidas;
    r.cumplimiento = evaluables ? r.completadas / evaluables : null;
    r.puntualidad = r.conFecha ? r.aTiempo / r.conFecha : null;
    r.indice = r.cumplimiento === null ? null
      : Math.round(100 * (r.puntualidad === null ? r.cumplimiento : 0.5 * r.cumplimiento + 0.5 * r.puntualidad));
    r.diasPromedio = r.diasMuestras ? r.diasTotales / r.diasMuestras : null;
    return r;
  }

  // Una fila por colaborador (incluye a quienes no tienen tareas en el periodo).
  function porColaborador(tareas, colaboradores, { periodo = 'todo', hoy = U.hoyISO() } = {}) {
    const rango = rangoPeriodo(periodo, hoy);
    const delPeriodo = tareas.filter(t => enRango(t, rango));
    const grupos = U.agruparPor(delPeriodo, claveColaborador);
    const filas = [];
    const vistos = new Set();

    for (const c of colaboradores) {
      vistos.add(c.id);
      filas.push({ clave: c.id, nombre: c.nombre, colaborador: c, ...calcular(grupos.get(c.id) || [], hoy) });
    }
    for (const [clave, lista] of grupos) {
      if (vistos.has(clave)) continue;
      const nombre = clave === 'sin' ? 'Sin asignar' : (lista[0].asignado_nombre || 'Sin asignar');
      filas.push({ clave, nombre, colaborador: null, ...calcular(lista, hoy) });
    }
    return filas;
  }

  function resumenEquipo(filas) {
    const s = { total: 0, completadas: 0, aTiempo: 0, conFecha: 0, vencidas: 0, enCurso: 0, porVencer: 0 };
    for (const f of filas) for (const k in s) s[k] += f[k];
    const evaluables = s.completadas + s.vencidas;
    s.cumplimiento = evaluables ? s.completadas / evaluables : null;
    s.puntualidad = s.conFecha ? s.aTiempo / s.conFecha : null;
    const conIndice = filas.filter(f => f.indice !== null && f.colaborador);
    s.indicePromedio = conIndice.length ? Math.round(conIndice.reduce((a, f) => a + f.indice, 0) / conIndice.length) : null;
    return s;
  }

  // Tareas completadas por semana (lunes a domingo), las últimas N semanas.
  function tendenciaSemanal(tareas, semanas, hoy = U.hoyISO()) {
    const actual = U.inicioSemana(hoy);
    const serie = [];
    for (let i = semanas - 1; i >= 0; i--) serie.push({ semana: U.sumarDias(actual, -7 * i), completadas: 0, aTiempo: 0 });
    const idx = new Map(serie.map((s, i) => [s.semana, i]));
    for (const t of tareas) {
      if (!estaCompletada(t)) continue;
      const fin = U.fechaDeTimestamp(t.completada_at);
      if (!fin) continue;
      const i = idx.get(U.inicioSemana(fin));
      if (i === undefined) continue;
      serie[i].completadas++;
      if (aTiempo(t) !== false) serie[i].aTiempo++;
    }
    return serie;
  }

  function nivel(indice) {
    if (indice === null || indice === undefined) return { id: 'na', label: 'Sin datos', icon: '—' };
    if (indice >= 85) return { id: 'excelente', label: 'Excelente', icon: '★' };
    if (indice >= 70) return { id: 'bueno', label: 'Bueno', icon: '▲' };
    if (indice >= 50) return { id: 'regular', label: 'Regular', icon: '■' };
    return { id: 'bajo', label: 'Bajo', icon: '▼' };
  }

  return { estadoEfectivo, porVencer, aTiempo, rangoPeriodo, enRango, claveColaborador, calcular, porColaborador, resumenEquipo, tendenciaSemanal, nivel };
})();

if (typeof module !== 'undefined') module.exports = { Metricas };

<script>
/* ── js/datos.js ── */
// ═══════════════════════════════════════════════════════════════════
// CAPA DE DATOS
//
// Dos implementaciones con la misma interfaz:
//   · SupabaseStore — producción (tablas: tareas, tarea_actividad, perfiles)
//   · LocalStore    — modo demo, guarda en el navegador
// El resto de la app solo usa `Datos`, nunca Supabase directamente.
//
// Interfaz:
//   iniciar() · login(email, pass) · sesion() · logout() · recuperar(email)
//   colaboradores() · tareas() · crearTarea(t) · actualizarTarea(id, cambios)
//   eliminarTarea(id) · actividad(tareaId) · registrarActividad(tareaId, tipo, texto)
//   importarTareas(lista) · suscribir(cb)
// ═══════════════════════════════════════════════════════════════════

class ErrorDatos extends Error {
  constructor(mensaje, { codigo, original, faltaEsquema = false } = {}) {
    super(mensaje);
    this.codigo = codigo;
    this.original = original;
    this.faltaEsquema = faltaEsquema;
  }
}

const CAMPOS_TAREA = ['titulo', 'descripcion', 'asignado_a', 'asignado_nombre', 'empresa', 'categoria', 'prioridad', 'estado',
  'fecha_inicio', 'fecha_vencimiento', 'progreso', 'checklist', 'etiquetas', 'completada_at', 'origen_ref'];

function normalizarTarea(t) {
  return {
    ...t,
    titulo: t.titulo || '(sin título)',
    estado: t.estado || 'pendiente',
    prioridad: t.prioridad || 'media',
    progreso: Number(t.progreso) || 0,
    checklist: Array.isArray(t.checklist) ? t.checklist : [],
    etiquetas: Array.isArray(t.etiquetas) ? t.etiquetas : [],
  };
}

// Solo columnas conocidas; evita mandar campos internos a la base de datos.
function limpiarParaGuardar(obj) {
  const out = {};
  for (const k of CAMPOS_TAREA) if (k in obj) out[k] = obj[k] === '' ? null : obj[k];
  return out;
}

// ─────────────────────────────────────────────────────────────────────
// SUPABASE
// ─────────────────────────────────────────────────────────────────────
class SupabaseStore {
  constructor() { this.sb = null; this.canal = null; this.usuario = null; this.perfil = null; }

  get modo() { return 'supabase'; }

  async iniciar() {
    if (!window.supabase?.createClient) throw new ErrorDatos('No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.');
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth: { autoRefreshToken: true, persistSession: true },
    });
  }

  _error(error, accion) {
    const msg = error?.message || String(error);
    const faltaEsquema = error?.code === '42P01' || error?.code === 'PGRST205' || /does not exist|could not find the table/i.test(msg);
    if (faltaEsquema) return new ErrorDatos('Falta crear las tablas del planner en Supabase (ejecuta supabase/schema.sql).', { codigo: error.code, original: error, faltaEsquema });
    if (error?.code === 'PGRST116' || error?.code === '42501' || /row-level security|permission denied/i.test(msg)) {
      return new ErrorDatos('No tienes permiso para ' + accion + '.', { codigo: error.code, original: error });
    }
    return new ErrorDatos('Error al ' + accion + ': ' + msg, { codigo: error?.code, original: error });
  }

  async _cargarPerfil(user) {
    const { data } = await this.sb.from(CONFIG.TABLAS.perfiles).select('*').eq('id', user.id).maybeSingle();
    this.usuario = user;
    this.perfil = {
      id: user.id,
      nombre: data?.nombre || user.email.split('@')[0],
      correo: data?.correo || user.email,
      rol: (data?.rol || 'colaborador').toLowerCase(),
    };
    return this.perfil;
  }

  async login(email, pass) {
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw new ErrorDatos(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message);
    return this._cargarPerfil(data.user);
  }

  async sesion() {
    const { data } = await this.sb.auth.getSession();
    return data?.session?.user ? this._cargarPerfil(data.session.user) : null;
  }

  async logout() {
    if (this.canal) { this.sb.removeChannel(this.canal); this.canal = null; }
    await this.sb.auth.signOut();
    this.usuario = this.perfil = null;
  }

  async recuperar(email) {
    const { error } = await this.sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
    if (error) throw new ErrorDatos('No se pudo enviar el enlace: ' + error.message);
  }

  async colaboradores() {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.perfiles).select('*').order('nombre');
    if (error) throw this._error(error, 'leer los colaboradores');
    return (data || [])
      .filter(p => p.activo !== false)
      .map(p => ({ id: p.id, nombre: p.nombre || p.correo || 'Sin nombre', correo: p.correo || '', rol: (p.rol || 'colaborador').toLowerCase() }));
  }

  async tareas() {
    // PostgREST devuelve como máximo 1000 filas por consulta: se pagina.
    const todas = [];
    const PAGINA = 1000;
    for (let desde = 0; ; desde += PAGINA) {
      const { data, error } = await this.sb.from(CONFIG.TABLAS.tareas).select('*')
        .order('fecha_vencimiento', { ascending: true, nullsFirst: false })
        .order('id')
        .range(desde, desde + PAGINA - 1);
      if (error) throw this._error(error, 'leer las tareas');
      todas.push(...data);
      if (data.length < PAGINA) break;
    }
    return todas.map(normalizarTarea);
  }

  async crearTarea(t) {
    const fila = { ...limpiarParaGuardar(t), creado_por: this.usuario?.id };
    const { data, error } = await this.sb.from(CONFIG.TABLAS.tareas).insert(fila).select().single();
    if (error) throw this._error(error, 'crear la tarea');
    return normalizarTarea(data);
  }

  async actualizarTarea(id, cambios) {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.tareas).update(limpiarParaGuardar(cambios)).eq('id', id).select().single();
    if (error) throw this._error(error, 'modificar esta tarea');
    return normalizarTarea(data);
  }

  async eliminarTarea(id) {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.tareas).delete().eq('id', id).select('id');
    if (error) throw this._error(error, 'eliminar esta tarea');
    if (!data?.length) throw new ErrorDatos('No tienes permiso para eliminar esta tarea.');
  }

  async actividad(tareaId) {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.actividad).select('*').eq('tarea_id', tareaId).order('created_at');
    if (error) throw this._error(error, 'leer el seguimiento');
    return data || [];
  }

  async registrarActividad(tareaId, tipo, texto) {
    const fila = { tarea_id: tareaId, tipo, texto, autor_id: this.usuario?.id, autor_nombre: this.perfil?.nombre };
    const { data, error } = await this.sb.from(CONFIG.TABLAS.actividad).insert(fila).select().single();
    if (error) throw this._error(error, 'guardar el seguimiento');
    return data;
  }

  async importarTareas(lista, alAvanzar) {
    let hechas = 0;
    const filas = lista.map(t => ({ ...limpiarParaGuardar(t), creado_por: this.usuario?.id }));
    for (let i = 0; i < filas.length; i += 500) {
      const lote = filas.slice(i, i + 500);
      // origen_ref evita duplicados al reimportar el mismo archivo
      const { error } = await this.sb.from(CONFIG.TABLAS.tareas).upsert(lote, { onConflict: 'origen_ref', ignoreDuplicates: true });
      if (error) throw this._error(error, 'importar tareas');
      hechas += lote.length;
      alAvanzar?.(hechas, filas.length);
    }
    return hechas;
  }

  // cb(evento, tareaNueva, tareaAnterior, estadoConexion)
  suscribir(cb) {
    if (this.canal) this.sb.removeChannel(this.canal);
    this.canal = this.sb.channel('tareas-rt')
      .on('postgres_changes', { event: '*', schema: 'public', table: CONFIG.TABLAS.tareas }, p => {
        cb(p.eventType, p.new && Object.keys(p.new).length ? normalizarTarea(p.new) : null, p.old || null);
      })
      .subscribe(estado => cb('estado', null, null, estado === 'SUBSCRIBED'));
  }
}

// ─────────────────────────────────────────────────────────────────────
// LOCAL (modo demo)
// ─────────────────────────────────────────────────────────────────────
class LocalStore {
  constructor() { this.CLAVE = 'planner_demo_v1'; this.db = null; this.perfil = null; }

  get modo() { return 'demo'; }

  async iniciar() {
    try { this.db = JSON.parse(localStorage.getItem(this.CLAVE) || 'null'); } catch { this.db = null; }
    if (!this.db?.colaboradores) { this.db = DatosDemo.generar(); this._guardar(); }
  }

  _guardar() { try { localStorage.setItem(this.CLAVE, JSON.stringify(this.db)); } catch { /* almacenamiento lleno o bloqueado */ } }

  reiniciar() { this.db = DatosDemo.generar(); this._guardar(); }

  async login(email) {
    const correo = String(email).trim().toLowerCase();
    const c = this.db.colaboradores.find(x => x.correo === correo) || this.db.colaboradores.find(x => x.rol === 'admin');
    this.perfil = { ...c };
    sessionStorage.setItem('planner_demo_sesion', c.id);
    return this.perfil;
  }

  async sesion() {
    const id = sessionStorage.getItem('planner_demo_sesion');
    const c = id && this.db.colaboradores.find(x => x.id === id);
    return c ? (this.perfil = { ...c }) : null;
  }

  async logout() { sessionStorage.removeItem('planner_demo_sesion'); this.perfil = null; }
  async recuperar() { /* en demo no hay correos */ }

  async colaboradores() { return this.db.colaboradores.map(c => ({ ...c })); }
  async tareas() { return this.db.tareas.map(t => normalizarTarea(structuredClone(t))); }

  async crearTarea(t) {
    const ahora = new Date().toISOString();
    const nueva = normalizarTarea({
      estado: 'pendiente', prioridad: 'media', progreso: 0, checklist: [], etiquetas: [],
      ...limpiarParaGuardar(t), id: Util.uid(), creado_por: this.perfil?.id, created_at: ahora, updated_at: ahora,
    });
    if (nueva.estado === 'completada' && !nueva.completada_at) nueva.completada_at = ahora;
    this.db.tareas.push(nueva);
    this._guardar();
    return structuredClone(nueva);
  }

  async actualizarTarea(id, cambios) {
    const t = this.db.tareas.find(x => x.id === id);
    if (!t) throw new ErrorDatos('La tarea ya no existe.');
    const limpio = limpiarParaGuardar(cambios);
    // Igual que el trigger de la base de datos: completada_at se gestiona solo.
    if (limpio.estado && limpio.estado !== t.estado) {
      limpio.completada_at = limpio.estado === 'completada' ? new Date().toISOString() : null;
    }
    Object.assign(t, limpio, { updated_at: new Date().toISOString() });
    this._guardar();
    return normalizarTarea(structuredClone(t));
  }

  async eliminarTarea(id) {
    this.db.tareas = this.db.tareas.filter(x => x.id !== id);
    this.db.actividad = this.db.actividad.filter(a => a.tarea_id !== id);
    this._guardar();
  }

  async actividad(tareaId) { return this.db.actividad.filter(a => a.tarea_id === tareaId).sort((a, b) => a.created_at.localeCompare(b.created_at)); }

  async registrarActividad(tareaId, tipo, texto) {
    const a = { id: Util.uid(), tarea_id: tareaId, tipo, texto, autor_id: this.perfil?.id, autor_nombre: this.perfil?.nombre, created_at: new Date().toISOString() };
    this.db.actividad.push(a);
    this._guardar();
    return a;
  }

  async importarTareas(lista, alAvanzar) {
    const refs = new Set(this.db.tareas.map(t => t.origen_ref).filter(Boolean));
    let n = 0;
    for (const t of lista) {
      if (t.origen_ref && refs.has(t.origen_ref)) continue;
      await this.crearTarea(t);
      if (t.origen_ref) refs.add(t.origen_ref);
      n++;
    }
    alAvanzar?.(lista.length, lista.length);
    return n;
  }

  suscribir(cb) {
    // Sincroniza entre pestañas del mismo navegador.
    window.addEventListener('storage', e => {
      if (e.key !== this.CLAVE) return;
      try { this.db = JSON.parse(e.newValue); cb('recargar'); } catch { /* ignorar */ }
    });
    cb('estado', null, null, true);
  }
}

// ─────────────────────────────────────────────────────────────────────
// Datos de ejemplo para el modo demo
// ─────────────────────────────────────────────────────────────────────
const DatosDemo = {
  generar() {
    const hoy = Util.hoyISO();
    const colaboradores = [
      { id: 'u-admin', nombre: 'Administrador', correo: 'admin@demo.co', rol: 'admin' },
      { id: 'u-ana', nombre: 'Ana Gómez', correo: 'ana@demo.co', rol: 'colaborador' },
      { id: 'u-carlos', nombre: 'Carlos Ruiz', correo: 'carlos@demo.co', rol: 'colaborador' },
      { id: 'u-yohana', nombre: 'Yohana Pérez', correo: 'yohana@demo.co', rol: 'colaborador' },
      { id: 'u-andres', nombre: 'Andrés Mora', correo: 'andres@demo.co', rol: 'colaborador' },
    ];
    const empresas = ['Comercial Andina SAS', 'Inversiones del Valle', 'Textiles Medellín', 'Agro Caribe', 'Logística Bogotá'];
    const plantillas = [
      ['Declaración de IVA bimestral', 'Tributario', 'alta'],
      ['Retención en la fuente', 'Tributario', 'urgente'],
      ['Conciliación bancaria', 'Contable', 'media'],
      ['Liquidación de nómina', 'Nómina', 'alta'],
      ['Cierre contable mensual', 'Contable', 'alta'],
      ['Informe exógena', 'Tributario', 'media'],
      ['Reunión de seguimiento con cliente', 'Cliente', 'baja'],
      ['Revisión de soportes', 'Auditoría', 'media'],
      ['ICA municipal', 'Tributario', 'alta'],
      ['Actualizar RUT', 'Administrativo', 'baja'],
    ];
    // Generador pseudoaleatorio con semilla: los datos demo son siempre iguales.
    let semilla = 7;
    const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
    const elegir = arr => arr[Math.floor(azar() * arr.length)];
    const ts = (iso, h = 10) => { const d = Util.deISO(iso); d.setHours(h); return d.toISOString(); };

    const tareas = [];
    const equipo = colaboradores.filter(c => c.rol !== 'admin');
    // Cada colaborador tiene un ritmo distinto para que el rendimiento varíe.
    const ritmo = { 'u-ana': 0.92, 'u-carlos': 0.7, 'u-yohana': 0.82, 'u-andres': 0.5 };
    for (let i = 0; i < 64; i++) {
      const c = equipo[i % equipo.length];
      const [titulo, categoria, prioridad] = elegir(plantillas);
      const offset = Math.round(azar() * 70) - 45; // de -45 a +25 días
      const vence = Util.sumarDias(hoy, offset);
      const creada = Util.sumarDias(vence, -(3 + Math.round(azar() * 10)));
      let estado = 'pendiente', completada_at = null;
      if (offset < 0) {
        if (azar() < ritmo[c.id]) {
          estado = 'completada';
          const retraso = azar() < ritmo[c.id] ? -Math.round(azar() * 3) : 1 + Math.round(azar() * 5);
          completada_at = ts(Util.sumarDias(vence, retraso) > hoy ? hoy : Util.sumarDias(vence, retraso));
        } else {
          estado = elegir(['pendiente', 'en_progreso']);
        }
      } else {
        estado = elegir(['pendiente', 'pendiente', 'en_progreso', 'en_revision', 'completada']);
        if (estado === 'completada') completada_at = ts(hoy, 8);
      }
      const checklist = azar() < 0.5 ? [
        { id: Util.uid(), texto: 'Recopilar información', hecho: estado !== 'pendiente' },
        { id: Util.uid(), texto: 'Preparar borrador', hecho: estado === 'completada' || estado === 'en_revision' },
        { id: Util.uid(), texto: 'Validar y enviar', hecho: estado === 'completada' },
      ] : [];
      tareas.push({
        id: 't-' + i, titulo, descripcion: '', asignado_a: c.id, asignado_nombre: null, creado_por: 'u-admin',
        empresa: elegir(empresas), categoria, prioridad, estado,
        fecha_inicio: null, fecha_vencimiento: vence,
        progreso: estado === 'completada' ? 100 : estado === 'en_revision' ? 80 : estado === 'en_progreso' ? 40 : 0,
        checklist, etiquetas: [], completada_at, origen_ref: null,
        created_at: ts(creada, 9), updated_at: ts(creada, 9),
      });
    }
    return { colaboradores, tareas, actividad: [] };
  },
};

const Datos = MODO_DEMO ? new LocalStore() : new SupabaseStore();
