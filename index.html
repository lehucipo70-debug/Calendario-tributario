<script>
/* ── js/avisos.js ── */
// ═══════════════════════════════════════════════════════════════════
// AVISOS DE ESCRITORIO (Notification API del navegador)
// Funcionan mientras la página esté abierta, aunque sea en otra pestaña
// o minimizada. Cada usuario los activa con la campana de la barra.
// ═══════════════════════════════════════════════════════════════════

const Avisos = {
  CLAVE: 'planner_avisos',
  CLAVE_VISTOS: 'planner_avisos_vistos',
  temporizador: null,

  soportado() { return 'Notification' in window; },

  activos() {
    if (!this.soportado() || Notification.permission !== 'granted') return false;
    try { return localStorage.getItem(this.CLAVE) !== 'no'; } catch { return true; }
  },

  async alternar() {
    if (!this.soportado()) { UI.toast('Este navegador no permite avisos de escritorio.', { tipo: 'error' }); return; }
    if (Notification.permission === 'denied') {
      UI.toast('Los avisos están bloqueados. Permítelos desde el candado junto a la dirección de la página.', { tipo: 'error', ms: 8000 });
      return;
    }
    if (Notification.permission === 'default') {
      const r = await Notification.requestPermission();
      if (r !== 'granted') { this.pintarBoton(); return; }
      this._guardar('si');
    } else {
      this._guardar(this.activos() ? 'no' : 'si');
    }
    this.pintarBoton();
    if (this.activos()) {
      UI.toast('Avisos de escritorio activados', { tipo: 'ok' });
      this.revisar({ forzar: true });
    } else {
      UI.toast('Avisos de escritorio desactivados');
    }
  },

  _guardar(v) { try { localStorage.setItem(this.CLAVE, v); } catch { /* sin almacenamiento */ } },

  pintarBoton() {
    const b = document.getElementById('btn-avisos');
    if (!b) return;
    b.hidden = !this.soportado();
    const on = this.activos();
    b.setAttribute('aria-pressed', String(on));
    b.title = on ? 'Avisos de escritorio activados (clic para desactivar)' : 'Activar avisos de escritorio';
    b.setAttribute('aria-label', b.title);
    b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/>${on ? '' : '<path d="M3 3l18 18"/>'}</svg>`;
  },

  mostrar(titulo, cuerpo, { tag, tareaId, alClic } = {}) {
    if (!this.activos()) return;
    try {
      // renotify: sin esto, un aviso con la misma etiqueta reemplaza al anterior sin sonar ni mostrarse.
      const n = new Notification(titulo, { body: cuerpo, tag, renotify: !!tag, lang: 'es' });
      n.onclick = () => {
        window.focus();
        if (alClic) alClic();
        else if (tareaId && App.tarea(tareaId)) TareaModal.abrir(tareaId);
        n.close();
      };
    } catch (e) { console.warn('[Avisos] No se pudo mostrar:', e); }
  },

  // Tareas propias vencidas o por vencer. Cada tarea avisa una vez al día.
  revisar({ forzar = false } = {}) {
    if (!this.activos() || !App.estado.perfil) return;
    const hoy = Util.hoyISO();
    let vistos = {};
    try { vistos = JSON.parse(localStorage.getItem(this.CLAVE_VISTOS) || '{}'); } catch { /* ignorar */ }
    if (vistos.fecha !== hoy || vistos.uid !== Permisos.uid) vistos = { fecha: hoy, uid: Permisos.uid, ids: [] };

    const pendientes = App.estado.tareas.filter(t => App.esMia(t) && t.estado !== 'completada' && t.fecha_vencimiento && t.fecha_vencimiento <= Util.sumarDias(hoy, CONFIG.DIAS_ALERTA));
    const nuevas = forzar ? pendientes : pendientes.filter(t => !vistos.ids.includes(t.id));
    if (!nuevas.length) return;

    const vencidas = nuevas.filter(t => t.fecha_vencimiento < hoy);
    const paraHoy = nuevas.filter(t => t.fecha_vencimiento === hoy);
    const proximas = nuevas.filter(t => t.fecha_vencimiento > hoy);

    if (nuevas.length === 1) {
      const t = nuevas[0];
      const cuando = t.fecha_vencimiento < hoy ? 'Vencida ' + Util.fmtRelativa(t.fecha_vencimiento).toLowerCase()
        : t.fecha_vencimiento === hoy ? 'Vence hoy' : 'Vence ' + Util.fmtRelativa(t.fecha_vencimiento).toLowerCase();
      this.mostrar(t.fecha_vencimiento < hoy ? '⚠️ Tarea vencida' : '⏰ Tarea por vencer',
        `${t.titulo}${t.empresa ? ' · ' + t.empresa : ''}\n${cuando} (${Util.fmtFecha(t.fecha_vencimiento)})`, { tag: 'venc-' + t.id, tareaId: t.id });
    } else {
      const partes = [];
      if (vencidas.length) partes.push(`${vencidas.length} vencida${vencidas.length > 1 ? 's' : ''}`);
      if (paraHoy.length) partes.push(`${paraHoy.length} para hoy`);
      if (proximas.length) partes.push(`${proximas.length} en los próximos ${CONFIG.DIAS_ALERTA} días`);
      const lista = nuevas.slice(0, 4).map(t => '• ' + t.titulo).join('\n') + (nuevas.length > 4 ? `\n… y ${nuevas.length - 4} más` : '');
      this.mostrar(vencidas.length ? '⚠️ Tienes tareas vencidas' : '⏰ Tareas por vencer', partes.join(', ') + '\n' + lista, { tag: 'vencimientos' });
    }

    vistos.ids = [...new Set([...vistos.ids, ...nuevas.map(t => t.id)])];
    try { localStorage.setItem(this.CLAVE_VISTOS, JSON.stringify(vistos)); } catch { /* sin almacenamiento */ }
  },

  // Cambio en tiempo real hecho por otra persona.
  alCambiarRemoto(evento, nueva, previa) {
    this._avisarAsignacion(evento, nueva, previa);
    this._avisarActividad(evento, nueva, previa);
  },

  // Administradores (y quien creó la tarea) se enteran cuando un colaborador crea una tarea o le
  // cambia el estado. Los cambios propios no avisan: la copia local ya trae el estado nuevo
  // antes de que llegue el eco en tiempo real.
  _avisarActividad(evento, nueva, previa) {
    if (!nueva || !Permisos.uid || nueva.asignado_a === Permisos.uid) return;
    if (!Permisos.esAdmin() && nueva.creado_por !== Permisos.uid) return;
    const quien = App.colaboradorDe(nueva)?.nombre || 'Un colaborador';
    const detalle = `${nueva.titulo}${nueva.empresa ? ' · ' + nueva.empresa : ''}`;
    const estado = id => ESTADOS.find(e => e.id === id)?.label || id;
    if (evento === 'INSERT' && !previa && nueva.creado_por !== Permisos.uid) {
      this.mostrar(`🆕 ${quien} tiene una tarea nueva`, detalle, { tag: 'nueva-' + nueva.id, tareaId: nueva.id });
    } else if (evento === 'UPDATE' && previa && previa.estado !== nueva.estado) {
      const titulo = nueva.estado === 'completada' ? `✅ ${quien} completó una tarea` : `🔄 ${quien} actualizó una tarea`;
      this.mostrar(titulo, `${detalle}\n${estado(previa.estado)} → ${estado(nueva.estado)}`, { tag: 'estado-' + nueva.id, tareaId: nueva.id });
    }
  },

  // ¿Me asignaron una tarea?
  _avisarAsignacion(evento, nueva, previa) {
    if (!nueva || !Permisos.uid || nueva.asignado_a !== Permisos.uid) return;
    if (previa?.asignado_a === Permisos.uid) return;          // ya era mía (o el cambio lo hice yo)
    if (evento === 'INSERT' && nueva.creado_por === Permisos.uid) return;
    this.mostrar('📌 Nueva tarea asignada',
      `${nueva.titulo}${nueva.empresa ? ' · ' + nueva.empresa : ''}${nueva.fecha_vencimiento ? '\nVence: ' + Util.fmtFecha(nueva.fecha_vencimiento) : ''}`,
      { tag: 'asig-' + nueva.id, tareaId: nueva.id });
  },

  iniciar() {
    this.pintarBoton();
    this.detener();
    // Sin permiso pedido aún no llega ningún aviso: se invita a activarlos (una vez por sesión).
    if (this.soportado() && Notification.permission === 'default' && !sessionStorage.getItem('planner_avisos_invitado')) {
      sessionStorage.setItem('planner_avisos_invitado', '1');
      UI.toast('Activa los avisos de escritorio para enterarte de vencimientos y asignaciones.', { ms: 12000, accion: { texto: 'Activar', fn: () => this.alternar() } });
    }
    this.revisar();
    this.temporizador = setInterval(() => this.revisar(), CONFIG.MINUTOS_AVISOS * 60 * 1000);
  },

  detener() { clearInterval(this.temporizador); this.temporizador = null; },
};

</script>
<script>
/* ── js/componentes.js ── */
// ═══════════════════════════════════════════════════════════════════
// COMPONENTES DE INTERFAZ — piezas HTML reutilizadas por todas las vistas
// ═══════════════════════════════════════════════════════════════════

// Registro de vistas. Cada archivo de js/vistas/ agrega la suya:
//   Vistas.x = { titulo, icono, orden, visible(), render(), montar?() }
const Vistas = {};

const UI = {
  // ── Colaboradores ──────────────────────────────────────────────────
  colorColaborador(id) {
    const idx = App.estado.colaboradores.findIndex(c => c.id === id);
    if (idx < 0) return 'var(--text3)';
    const paleta = App.estado.tema === 'oscuro' ? PALETA_COLABORADORES.oscuro : PALETA_COLABORADORES.claro;
    return paleta[idx % paleta.length];
  },

  avatar(t_o_colab, tam = 26) {
    const c = t_o_colab?.titulo !== undefined ? App.colaboradorDe(t_o_colab) : t_o_colab;
    const nombre = c?.nombre || 'Sin asignar';
    const color = c?.id ? UI.colorColaborador(c.id) : null;
    const fondo = color && color.startsWith('#') ? color : 'var(--bg3)';
    const texto = color && color.startsWith('#') ? Util.textoSobre(color) : 'var(--text2)';
    return `<span class="avatar" title="${Util.esc(nombre)}" style="width:${tam}px;height:${tam}px;font-size:${Math.round(tam * 0.4)}px;background:${fondo};color:${texto}">${c ? Util.esc(Util.iniciales(nombre)) : '?'}</span>`;
  },

  // ── Chips ──────────────────────────────────────────────────────────
  prioridad(p) {
    const def = PRIORIDADES.find(x => x.id === p) || PRIORIDADES[2];
    return `<span class="chip prio-${def.id}">${def.icon} ${def.label}</span>`;
  },

  estado(t) {
    const ef = Metricas.estadoEfectivo(t, Util.hoyISO());
    if (ef === 'vencida') return `<span class="chip est-vencida">⚠ Vencida</span>`;
    const def = ESTADOS.find(x => x.id === ef) || ESTADOS[0];
    return `<span class="chip est-${def.id}">${def.icon} ${def.label}</span>`;
  },

  // Insignia del índice de rendimiento (ícono + número + texto: nunca solo color)
  nivel(indice, { texto = false } = {}) {
    const n = Metricas.nivel(indice);
    if (indice === null || indice === undefined) return `<span class="nivel nivel-na" title="Sin tareas evaluables en el periodo">Sin datos</span>`;
    return `<span class="nivel nivel-${n.id}" title="Índice ${indice} · ${n.label}">${n.icon} ${indice}${texto ? ` <small>${n.label}</small>` : ''}</span>`;
  },

  fecha(t) {
    if (!t.fecha_vencimiento) return '<span class="fecha muted">Sin fecha</span>';
    const hoy = Util.hoyISO();
    let cls = '';
    if (t.estado !== 'completada') {
      if (t.fecha_vencimiento < hoy) cls = 'vencida';
      else if (Metricas.porVencer(t, hoy)) cls = 'pronto';
    }
    return `<span class="fecha ${cls}" title="${Util.fmtFecha(t.fecha_vencimiento)}">📅 ${Util.fmtRelativa(t.fecha_vencimiento)}</span>`;
  },

  // Tiempo de ejecución. Las insignias con data-crono las actualiza el reloj de App cada 15 s y al volver a la pestaña.
  // Con boton: true se agrega el botón ⏸ / ▶ para pausar o reanudar (si la persona puede editar la tarea).
  cronometro(t, { vacio = '', boton = false } = {}) {
    const ms = Metricas.tiempoEjecucion(t);
    if (ms === null) return vacio;
    const pausas = t.pausa_seg ? ` (sin contar ${Util.fmtDuracion(t.pausa_seg * 1000)} en pausa)` : '';
    if (t.estado === 'completada') {
      return `<span class="crono" title="Tiempo de ejecución: del ${Util.esc(Util.fmtFechaHora(t.iniciada_at))} al ${Util.esc(Util.fmtFechaHora(t.completada_at))}${pausas}">⏱ ${Util.fmtDuracion(ms)}</span>`;
    }
    const enPausa = !!t.pausada_at;
    const icoPausa = '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    const icoPlay = '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>';
    const btn = boton && Permisos.editarTarea(t) && Datos.conPausa !== false
      ? `<button type="button" class="btn-crono ${enPausa ? 'reanudar' : ''}" data-accion="pausar" data-id="${t.id}" title="${enPausa ? 'Reanudar el cronómetro' : 'Pausar el cronómetro (almuerzo, salida…)'}" aria-label="${enPausa ? 'Reanudar el cronómetro' : 'Pausar el cronómetro'}">${enPausa ? icoPlay : icoPausa}</button>` : '';
    const insignia = enPausa
      ? `<span class="crono pausado" title="En pausa desde el ${Util.esc(Util.fmtFechaHora(t.pausada_at))}${pausas}">${icoPausa} ${Util.fmtDuracion(ms)}</span>`
      : `<span class="crono activo" data-crono="${Util.esc(t.iniciada_at)}" data-pausa="${t.pausa_seg || 0}" title="En curso desde el ${Util.esc(Util.fmtFechaHora(t.iniciada_at))}${pausas}">⏱ ${Util.fmtDuracion(ms)}</span>`;
    return btn ? `<span class="crono-caja">${insignia}${btn}</span>` : insignia;
  },

  progreso(t) {
    const total = t.checklist.length;
    const hechos = t.checklist.filter(i => i.hecho).length;
    const pct = total ? Util.pct(hechos, total) : (t.estado === 'completada' ? 100 : t.progreso);
    return { pct, texto: total ? `${hechos}/${total}` : `${pct}%` };
  },

  // ── Tarjeta de tarea (tablero, inicio, calendario semanal) ─────────
  tarjeta(t, { arrastrable = true } = {}) {
    const p = UI.progreso(t);
    const hecha = t.estado === 'completada';
    const puede = Permisos.editarTarea(t);
    return `<article class="tarjeta prio-borde-${t.prioridad} ${hecha ? 'hecha' : ''}" data-accion="abrir-tarea" data-id="${t.id}"
        ${arrastrable && puede ? 'draggable="true"' : ''} data-arrastrar="${t.id}">
      <div class="tarjeta-top">
        ${UI.prioridad(t.prioridad)}
        ${t.categoria ? `<span class="chip chip-suave">${Util.esc(t.categoria)}</span>` : ''}
        ${puede ? `<button class="check ${hecha ? 'on' : ''}" data-accion="completar" data-id="${t.id}" title="${hecha ? 'Reabrir tarea' : 'Marcar como completada'}" aria-label="${hecha ? 'Reabrir tarea' : 'Completar tarea'}">✓</button>` : ''}
      </div>
      <h4 class="tarjeta-titulo">${Util.esc(t.titulo)}</h4>
      ${t.empresa ? `<div class="tarjeta-empresa">🏢 ${Util.esc(t.empresa)}</div>` : ''}
      ${p.pct > 0 && !hecha ? `<div class="mini-barra"><span style="width:${p.pct}%"></span></div>` : ''}
      <div class="tarjeta-pie">
        ${UI.fecha(t)}
        <span class="pie-der">
          ${UI.cronometro(t, { boton: true })}
          ${t.checklist.length ? `<span class="muted" title="Lista de verificación">☑ ${p.texto}</span>` : ''}
          ${UI.avatar(t)}
        </span>
      </div>
    </article>`;
  },

  // ── Barra de filtros (tablero, lista, calendario) ──────────────────
  filtros() {
    const f = App.estado.filtros;
    const sel = (campo, etiqueta, opciones) => `<select data-filtro="${campo}" aria-label="${etiqueta}">
        <option value="">${etiqueta}</option>
        ${opciones.map(([v, l]) => `<option value="${Util.esc(v)}" ${f[campo] === v ? 'selected' : ''}>${Util.esc(l)}</option>`).join('')}
      </select>`;
    const colabs = App.estado.colaboradores.map(c => [c.id, c.nombre]);
    const activos = ['texto', 'colaborador', 'estado', 'prioridad', 'categoria', 'dia', 'diaHasta'].some(k => f[k]);
    const rangoActual = FILTRO_RANGOS.find(([, , fn]) => { const [d, h] = fn(Util.hoyISO()); return f.dia === d && (f.diaHasta || f.dia) === h; })?.[0] || '';
    return `<div class="barra-filtros">
      ${Permisos.verEquipo() ? `<div class="segmentado" role="group" aria-label="Alcance">
        <button class="${f.alcance === 'mias' ? 'on' : ''}" data-accion="alcance" data-valor="mias">Mis tareas</button>
        <button class="${f.alcance === 'equipo' ? 'on' : ''}" data-accion="alcance" data-valor="equipo">Equipo</button>
      </div>` : ''}
      <input type="search" data-filtro="texto" placeholder="🔍 Buscar tarea o empresa…" value="${Util.esc(f.texto)}" aria-label="Buscar">
      ${f.alcance === 'equipo' ? sel('colaborador', 'Colaborador', colabs) : ''}
      ${sel('estado', 'Estado', [...ESTADOS.map(e => [e.id, e.label]), ['vencida', 'Vencida']])}
      ${sel('prioridad', 'Prioridad', PRIORIDADES.map(p => [p.id, p.label]))}
      ${sel('categoria', 'Categoría', App.categorias().map(c => [c, c]))}
      <span class="filtro-dia" role="group" aria-label="Filtrar por fechas">
        <select data-filtro="diaSegun" aria-label="Fecha que se filtra" title="Qué fecha de la tarea se compara con el rango">
          ${FILTRO_DIA_SEGUN.map(([v, l]) => `<option value="${v}" ${f.diaSegun === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        <select data-filtro="rango" aria-label="Rango rápido" title="Rango rápido">
          <option value="">Fechas…</option>
          ${FILTRO_RANGOS.map(([v, l]) => `<option value="${v}" ${rangoActual === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select>
        <label class="filtro-fecha"><span>Desde</span><input type="date" data-filtro="dia" value="${Util.esc(f.dia)}" aria-label="Desde" title="Desde (si no pones Hasta, solo ese día)"></label>
        <label class="filtro-fecha"><span>Hasta</span><input type="date" data-filtro="diaHasta" value="${Util.esc(f.diaHasta)}" ${f.dia ? `min="${Util.esc(f.dia)}"` : ''} aria-label="Hasta" title="Hasta (incluido)"></label>
      </span>
      ${activos ? '<button class="btn btn-sm" data-accion="limpiar-filtros">✕ Limpiar</button>' : ''}
    </div>`;
  },

  vacio(icono, titulo, texto, accion = '') {
    return `<div class="vacio"><div class="vacio-icono">${icono}</div><h3>${titulo}</h3><p>${texto}</p>${accion}</div>`;
  },

  // ── Notificaciones ─────────────────────────────────────────────────
  toast(msg, { tipo = 'info', deshacer = null, accion = null, ms = 4500 } = {}) {
    const ct = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast toast-' + tipo;
    el.setAttribute('role', 'status');
    el.innerHTML = `<span>${Util.esc(msg)}</span>`;
    if (deshacer) accion = { texto: 'Deshacer', fn: deshacer };
    if (accion) {
      const b = document.createElement('button');
      b.textContent = accion.texto;
      b.onclick = () => { el.remove(); accion.fn(); };
      el.appendChild(b);
    }
    ct.appendChild(el);
    while (ct.children.length > 3) ct.firstElementChild.remove(); // solo las 3 más recientes
    setTimeout(() => el.remove(), ms);
  },

  // ── Modal genérico ─────────────────────────────────────────────────
  abrirModal(html, { ancho = 560, alCerrar = null } = {}) {
    const capa = document.getElementById('modal');
    capa.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:${ancho}px">${html}</div>`;
    capa.hidden = false;
    UI._alCerrar = alCerrar;
    setTimeout(() => capa.querySelector('[autofocus]')?.focus(), 30);
  },

  cerrarModal() {
    const capa = document.getElementById('modal');
    if (capa.hidden) return;
    capa.hidden = true;
    capa.innerHTML = '';
    const fn = UI._alCerrar; UI._alCerrar = null;
    fn?.();
  },
};

</script>
<script>
/* ── js/vistas/inicio.js ── */
// ═══════════════════════════════════════════════════════════════════
// VISTA: INICIO ("Mi día")
// ═══════════════════════════════════════════════════════════════════

Vistas.inicio = {
  titulo: 'Inicio',
  icono: '🏠',
  orden: 1,
  visible: () => true,

  render() {
    const hoy = Util.hoyISO();
    const perfil = App.estado.perfil;
    const mias = App.estado.tareas.filter(t => App.esMia(t));
    const abiertas = mias.filter(t => t.estado !== 'completada');
    const vencidas = abiertas.filter(t => t.fecha_vencimiento && t.fecha_vencimiento < hoy);
    const paraHoy = abiertas.filter(t => t.fecha_vencimiento === hoy);
    const semana = abiertas.filter(t => t.fecha_vencimiento > hoy && t.fecha_vencimiento <= Util.sumarDias(hoy, 7));
    const sinFecha = abiertas.filter(t => !t.fecha_vencimiento);
    const inicioSem = Util.inicioSemana(hoy);
    const hechasSemana = mias.filter(t => t.estado === 'completada' && (Util.fechaDeTimestamp(t.completada_at) || '') >= inicioSem).length;
    const m = Metricas.calcular(mias.filter(t => Metricas.enRango(t, Metricas.rangoPeriodo('mes', hoy))), hoy);

    const f = new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
    const fechaLarga = f[0].toUpperCase() + f.slice(1);
    const hora = new Date().getHours();
    const saludo = hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches';

    const seccion = (titulo, lista, cls, vacioTxt) => `
      <section class="panel">
        <header class="panel-cab"><h3>${titulo}</h3><span class="contador ${cls}">${lista.length}</span></header>
        <div class="lista-tarjetas">${lista.length ? lista.slice(0, 8).map(t => UI.tarjeta(t, { arrastrable: false })).join('') : `<p class="muted pad">${vacioTxt}</p>`}
        ${lista.length > 8 ? `<button class="btn btn-sm ancho" data-accion="ver-colaborador" data-id="${perfil.id}">Ver las ${lista.length}</button>` : ''}</div>
      </section>`;

    return `
    <div class="hero">
      <div>
        <p class="hero-fecha">${Util.esc(fechaLarga)}</p>
        <h2>${saludo}, ${Util.esc(perfil.nombre.split(' ')[0])}</h2>
        <p class="muted">${abiertas.length ? `Tienes ${abiertas.length} tarea${abiertas.length === 1 ? '' : 's'} abierta${abiertas.length === 1 ? '' : 's'}${vencidas.length ? `, <strong class="txt-rojo">${vencidas.length} vencida${vencidas.length === 1 ? '' : 's'}</strong>` : ''}.` : 'No tienes tareas abiertas. ¡Buen trabajo!'}</p>
        <form class="captura-rapida" data-captura>
          <input name="titulo" placeholder="＋ Escribe una tarea y presiona Enter (vence hoy)" aria-label="Nueva tarea rápida" autocomplete="off" maxlength="300">
        </form>
      </div>
      ${m.indice === null && Permisos.verRendimientoEquipo()
        ? Vistas.inicio.anillo(Metricas.resumenEquipo(Metricas.porColaborador(App.estado.tareas, App.estado.colaboradores, { periodo: 'mes', hoy })).indicePromedio, 'Índice del equipo (mes)')
        : Vistas.inicio.anillo(m.indice, 'Tu índice del mes')}
    </div>

    <div class="kpis">
      ${Vistas.inicio.kpi('Vencidas', vencidas.length, 'rojo', '⚠')}
      ${Vistas.inicio.kpi('Para hoy', paraHoy.length, 'ambar', '◷')}
      ${Vistas.inicio.kpi('Próximos 7 días', semana.length, 'azul', '▦')}
      ${Vistas.inicio.kpi('Completadas esta semana', hechasSemana, 'verde', '✓')}
    </div>

    <div class="rejilla-3">
      ${seccion('⚠ Vencidas', vencidas, 'rojo', 'Nada vencido. 🎉')}
      ${seccion('◷ Hoy', paraHoy, 'ambar', 'Nada programado para hoy.')}
      ${seccion('📅 Próximos 7 días', semana, 'azul', 'Semana despejada.')}
    </div>
    ${sinFecha.length ? `<div class="mt">${seccion('Sin fecha límite', sinFecha, '', '')}</div>` : ''}
    ${Permisos.verRendimientoEquipo() ? Vistas.inicio.resumenEquipo(hoy) : ''}`;
  },

  kpi(etiqueta, valor, color, icono) {
    return `<div class="kpi kpi-${color}"><span class="kpi-icono" aria-hidden="true">${icono}</span><div><div class="kpi-valor">${valor}</div><div class="kpi-etiqueta">${etiqueta}</div></div></div>`;
  },

  // Anillo de progreso (SVG) para un índice 0–100
  anillo(valor, etiqueta) {
    const r = 42, c = 2 * Math.PI * r;
    const v = valor ?? 0;
    const n = Metricas.nivel(valor);
    return `<div class="anillo" title="${etiqueta}: ${valor ?? 'sin datos'}">
      <svg viewBox="0 0 100 100" width="118" height="118" aria-hidden="true">
        <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="9"/>
        <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--nivel-${n.id})" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/>
      </svg>
      <div class="anillo-centro"><strong>${valor ?? '—'}</strong><span>${n.icon} ${n.label}</span></div>
      <div class="anillo-etiqueta">${etiqueta}</div>
    </div>`;
  },

  resumenEquipo(hoy) {
    const filas = Metricas.porColaborador(App.estado.tareas, App.estado.colaboradores, { periodo: 'mes', hoy })
      .filter(f => f.colaborador && f.total > 0)
      .sort((a, b) => (b.indice ?? -1) - (a.indice ?? -1));
    if (!filas.length) return '';
    return `<section class="panel mt">
      <header class="panel-cab"><h3>👥 Equipo este mes</h3><button class="btn btn-sm" data-accion="ir" data-vista="rendimiento">Ver rendimiento →</button></header>
      <div class="equipo-mini">${filas.map(f => {
        return `<button class="equipo-fila" data-accion="ver-colaborador" data-id="${f.clave}">
          ${UI.avatar(f.colaborador, 28)}<span class="equipo-nombre">${Util.esc(f.nombre)}</span>
          <span class="muted">${f.completadas}/${f.total} · ${f.vencidas ? `<span class="txt-rojo">${f.vencidas} vencidas</span>` : 'al día'}</span>
          ${UI.nivel(f.indice)}</button>`;
      }).join('')}</div>
    </section>`;
  },

  montar(main) {
    const form = main.querySelector('[data-captura]');
    form?.addEventListener('submit', async e => {
      e.preventDefault();
      const titulo = form.titulo.value.trim();
      if (!titulo) return;
      form.titulo.disabled = true;
      try {
        await App.crear({ titulo, fecha_vencimiento: Util.hoyISO() });
      } catch (err) { UI.toast(err.message, { tipo: 'error' }); }
      // El render posterior reemplaza el formulario; se devuelve el foco al nuevo.
      requestAnimationFrame(() => requestAnimationFrame(() => document.querySelector('[data-captura] input')?.focus()));
    });
  },

  errorCarga(e) {
    if (e.faltaEsquema) {
      return UI.vacio('🛠️', 'Falta configurar la base de datos',
        `El planner necesita las tablas <code>tareas</code> y <code>tarea_actividad</code> en Supabase.<br>
         Abre el <strong>SQL Editor</strong> de Supabase, ejecuta el archivo <code>supabase/schema.sql</code> del repositorio y luego tus políticas de permisos.`,
        '<button class="btn btn-primario" data-accion="sincronizar">Reintentar</button>');
    }
    return UI.vacio('⚠️', 'No se pudieron cargar las tareas', Util.esc(e.message), '<button class="btn btn-primario" data-accion="sincronizar">Reintentar</button>');
  },
};

</script>
<script>
/* ── js/vistas/tablero.js ── */
// ═══════════════════════════════════════════════════════════════════
// VISTA: TABLERO (kanban). Arrastrar una tarjeta a otra columna cambia
// el campo por el que se agrupa: estado, colaborador o prioridad.
// ═══════════════════════════════════════════════════════════════════

Vistas.tablero = {
  titulo: 'Tablero',
  icono: '🗂️',
  orden: 2,
  visible: () => true,

  columnas() {
    const agrupar = App.estado.tablero.agrupar;
    if (agrupar === 'prioridad') return { campo: 'prioridad', cols: PRIORIDADES.map(p => ({ valor: p.id, titulo: `${p.icon} ${p.label}`, cls: 'prio-' + p.id })) };
    if (agrupar === 'colaborador') {
      const visibles = App.estado.filtros.alcance === 'mias' ? [App.estado.perfil] : App.estado.colaboradores;
      return {
        campo: 'asignado_a',
        cols: [...visibles.map(c => ({ valor: c.id, titulo: Util.esc(c.nombre), avatar: c })), { valor: '', titulo: 'Sin asignar' }],
      };
    }
    return { campo: 'estado', cols: ESTADOS.map(e => ({ valor: e.id, titulo: `${e.icon} ${e.label}`, cls: 'est-' + e.id })) };
  },

  render() {
    const { campo, cols } = this.columnas();
    const tareas = App.tareasVisibles();
    // Completadas archivadas: la columna solo muestra cuántas hay y cómo verlas.
    const archivadas = campo === 'estado' && !App.estado.filtros.estado ? App.tareasVisibles({ estado: 'completada' }).length : 0;
    const orden = (a, b) => (a.fecha_vencimiento || '9999').localeCompare(b.fecha_vencimiento || '9999')
      || PRIORIDADES.findIndex(p => p.id === a.prioridad) - PRIORIDADES.findIndex(p => p.id === b.prioridad);
    const ag = App.estado.tablero.agrupar;
    const datoNueva = campo === 'estado' ? 'data-estado' : campo === 'prioridad' ? 'data-prioridad' : 'data-asignado';

    const columnas = cols.map(col => {
      const lista = tareas.filter(t => (t[campo] || '') === col.valor).sort(orden);
      // Si las tareas completadas son muchas, se muestran las más recientes.
      const recortar = campo === 'estado' && col.valor === 'completada' && lista.length > 30;
      const mostradas = recortar ? lista.slice(-30).reverse() : lista;
      return `<section class="columna ${col.cls || ''}" data-soltar="${campo}" data-valor="${col.valor}" aria-label="${Util.esc(col.titulo.replace(/<[^>]+>/g, ''))}">
        <header class="columna-cab">
          ${col.avatar ? UI.avatar(col.avatar, 22) : ''}
          <h3>${col.titulo}</h3><span class="contador">${col.valor === 'completada' && archivadas ? archivadas : lista.length}</span>
          <button class="btn-icono btn-sm" data-accion="nueva-tarea" ${datoNueva}="${col.valor}" title="Agregar tarea aquí" aria-label="Agregar tarea">＋</button>
        </header>
        <div class="columna-cuerpo">
          ${mostradas.map(t => UI.tarjeta(t)).join('') || (col.valor === 'completada' && archivadas
            ? `<p class="columna-vacia">Suelta tareas aquí para archivarlas<br><button class="btn btn-sm" data-accion="ver-completadas">Ver ${archivadas} completada${archivadas === 1 ? '' : 's'}</button></p>`
            : '<p class="columna-vacia">Suelta tareas aquí</p>')}
          ${recortar ? `<p class="muted pad centrado">Mostrando las 30 más recientes de ${lista.length}</p>` : ''}
        </div>
      </section>`;
    }).join('');

    return `${UI.filtros()}
      <div class="barra-vista">
        <div class="segmentado" role="group" aria-label="Agrupar por">
          <span class="seg-etiqueta">Agrupar por</span>
          ${[['estado', 'Estado'], ['colaborador', 'Colaborador'], ['prioridad', 'Prioridad']].map(([v, l]) =>
            `<button class="${ag === v ? 'on' : ''}" data-accion="agrupar" data-valor="${v}">${l}</button>`).join('')}
        </div>
        <span class="muted">${tareas.length} tareas · arrastra las tarjetas entre columnas</span>
      </div>
      <div class="tablero">${columnas}</div>`;
  },

  acciones: {
    agrupar: el => { App.estado.tablero.agrupar = el.dataset.valor; App.render(); },
  },
};

</script>
<script>
/* ── js/vistas/lista.js ── */
// ═══════════════════════════════════════════════════════════════════
// VISTA: LISTA — tabla ordenable con cambio rápido de estado
// ═══════════════════════════════════════════════════════════════════

Vistas.lista = {
  titulo: 'Lista',
  icono: '☰',
  orden: 3,
  visible: () => true,

  COLUMNAS: [
    ['titulo', 'Tarea'], ['asignado', 'Colaborador'], ['empresa', 'Empresa'], ['prioridad', 'Prioridad'],
    ['estado', 'Estado'], ['fecha_vencimiento', 'Vence'], ['tiempo', 'Tiempo'], ['progreso', 'Progreso'],
  ],

  ordenar(lista) {
    const { orden, dir } = App.estado.lista;
    const pesoPrio = p => PRIORIDADES.findIndex(x => x.id === p);
    const pesoEstado = e => ESTADOS.findIndex(x => x.id === e);
    const val = t => {
      switch (orden) {
        case 'asignado': return App.colaboradorDe(t)?.nombre || '~';
        case 'prioridad': return pesoPrio(t.prioridad);
        case 'estado': return pesoEstado(t.estado);
        case 'progreso': return UI.progreso(t).pct;
        case 'tiempo': return Metricas.tiempoEjecucion(t) ?? -1;
        case 'fecha_vencimiento': return t.fecha_vencimiento || '9999-99-99';
        default: return String(t[orden] || '~').toLowerCase();
      }
    };
    return [...lista].sort((a, b) => {
      const va = val(a), vb = val(b);
      return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
    });
  },

  render() {
    const todas = this.ordenar(App.tareasVisibles());
    const { orden, dir, limite } = App.estado.lista;
    const filas = todas.slice(0, limite);
    const hoy = Util.hoyISO();

    const cab = this.COLUMNAS.map(([k, l]) => `<th><button class="th-orden ${orden === k ? 'on' : ''}" data-accion="ordenar" data-campo="${k}">${l}${orden === k ? (dir === 1 ? ' ▲' : ' ▼') : ''}</button></th>`).join('');

    const cuerpo = filas.map(t => {
      const p = UI.progreso(t);
      const ef = Metricas.estadoEfectivo(t, hoy);
      const puede = Permisos.editarTarea(t);
      const c = App.colaboradorDe(t);
      return `<tr class="fila ${ef === 'vencida' ? 'fila-vencida' : ''} ${t.estado === 'completada' ? 'fila-hecha' : ''}">
        <td class="td-titulo"><div class="td-titulo-in">
          ${puede ? `<button class="check ${t.estado === 'completada' ? 'on' : ''}" data-accion="completar" data-id="${t.id}" aria-label="Completar">✓</button>` : ''}
          <button class="enlace-tarea" data-accion="abrir-tarea" data-id="${t.id}">${Util.esc(t.titulo)}</button>
          ${t.categoria ? `<span class="chip chip-suave">${Util.esc(t.categoria)}</span>` : ''}
        </div></td>
        <td><span class="celda-colab">${UI.avatar(t, 22)} ${Util.esc(c?.nombre || 'Sin asignar')}</span></td>
        <td class="muted">${Util.esc(t.empresa || '—')}</td>
        <td>${UI.prioridad(t.prioridad)}</td>
        <td>${puede
          ? `<select class="sel-estado est-${ef}" data-cambio="estado" data-id="${t.id}" aria-label="Estado">
              ${ESTADOS.map(e => `<option value="${e.id}" ${t.estado === e.id ? 'selected' : ''}>${e.icon} ${e.label}</option>`).join('')}
            </select>${ef === 'vencida' ? ' <span class="chip est-vencida" title="Fecha límite superada">⚠</span>' : ''}`
          : UI.estado(t)}</td>
        <td>${UI.fecha(t)}</td>
        <td>${UI.cronometro(t, { vacio: '<span class="muted">—</span>', boton: true })}</td>
        <td><div class="barra-progreso" title="${p.texto}"><span style="width:${p.pct}%"></span></div><span class="muted mini">${p.texto}</span></td>
      </tr>`;
    }).join('');

    return `${UI.filtros()}
      <div class="barra-vista">
        <span class="muted">${todas.length} tareas${todas.length > filas.length ? ` · mostrando ${filas.length}` : ''}</span>
        <span class="separador"></span>
        <button class="btn btn-sm" data-accion="exportar">⬇ Exportar a Excel</button>
      </div>
      <div class="vidrio"><div class="vidrio-interior">
        ${todas.length ? `<div class="tabla-scroll"><table class="tabla"><thead><tr>${cab}</tr></thead><tbody>${cuerpo}</tbody></table></div>` :
          UI.vacio('🔎', 'Sin tareas', 'No hay tareas con estos filtros.', '<button class="btn btn-primario" data-accion="nueva-tarea">＋ Nueva tarea</button>')}
        ${todas.length > filas.length ? `<div class="centrado pad"><button class="btn" data-accion="ver-mas">Ver ${Math.min(CONFIG.LIMITE_LISTA, todas.length - filas.length)} más</button></div>` : ''}
      </div></div>`;
  },

  acciones: {
    ordenar: el => {
      const s = App.estado.lista;
      if (s.orden === el.dataset.campo) s.dir *= -1; else { s.orden = el.dataset.campo; s.dir = 1; }
      App.render();
    },
    'ver-mas': () => { App.estado.lista.limite += CONFIG.LIMITE_LISTA; App.render(); },
    exportar: () => Importador.exportar(Vistas.lista.ordenar(App.tareasVisibles())),
  },

  alCambiar(el) {
    if (el.dataset.cambio === 'estado') {
      const label = ESTADOS.find(e => e.id === el.value)?.label;
      App.actualizar(el.dataset.id, { estado: el.value }, { mensaje: 'Estado: ' + label }).catch(() => {});
    }
  },
};

</script>
<script>
/* ── js/vistas/calendario.js ── */
// ═══════════════════════════════════════════════════════════════════
// VISTA: CALENDARIO — mes o semana, estilo planner.
// Clic en un día crea una tarea con esa fecha; arrastrar una tarea a
// otro día la reprograma.
// ═══════════════════════════════════════════════════════════════════

Vistas.calendario = {
  titulo: 'Calendario',
  icono: '📅',
  orden: 4,
  visible: () => true,
  MAX_POR_DIA: 3,

  porDia(tareas) {
    const m = new Map();
    for (const t of tareas) {
      if (!t.fecha_vencimiento) continue;
      if (!m.has(t.fecha_vencimiento)) m.set(t.fecha_vencimiento, []);
      m.get(t.fecha_vencimiento).push(t);
    }
    const peso = t => (t.estado === 'completada' ? 10 : 0) + PRIORIDADES.findIndex(p => p.id === t.prioridad);
    for (const l of m.values()) l.sort((a, b) => peso(a) - peso(b));
    return m;
  },

  chip(t, hoy) {
    const ef = Metricas.estadoEfectivo(t, hoy);
    const c = App.colaboradorDe(t);
    const color = c?.id ? UI.colorColaborador(c.id) : 'var(--text3)';
    const puede = Permisos.editarTarea(t);
    const prio = PRIORIDADES.find(p => p.id === t.prioridad);
    return `<button class="ev ev-${ef}" data-accion="abrir-tarea" data-id="${t.id}" ${puede ? 'draggable="true"' : ''} data-arrastrar="${t.id}"
        title="${Util.esc(t.titulo)} · ${Util.esc(c?.nombre || 'Sin asignar')} · ${prio?.label}">
      <span class="ev-punto" style="background:${color}"></span>
      ${t.prioridad === 'urgente' || t.prioridad === 'alta' ? `<span class="ev-prio" aria-hidden="true">${prio.icon}</span>` : ''}
      <span class="ev-texto">${Util.esc(t.titulo)}</span>
    </button>`;
  },

  render() {
    const s = App.estado.cal;
    const hoy = Util.hoyISO();
    const tareas = App.tareasVisibles();
    const porDia = this.porDia(tareas);
    const ref = Util.deISO(s.ref);

    let titulo, cuerpo;
    if (s.modo === 'semana') {
      const ini = Util.inicioSemana(s.ref);
      const fin = Util.sumarDias(ini, 6);
      const a = Util.deISO(ini), b = Util.deISO(fin);
      titulo = `${a.getDate()} ${Util.MESES_CORTOS[a.getMonth()]} – ${b.getDate()} ${Util.MESES_CORTOS[b.getMonth()]} ${b.getFullYear()}`;
      cuerpo = `<div class="semana">${[0, 1, 2, 3, 4, 5, 6].map(i => {
        const iso = Util.sumarDias(ini, i);
        const d = Util.deISO(iso);
        const lista = porDia.get(iso) || [];
        return `<section class="semana-dia ${iso === hoy ? 'es-hoy' : ''} ${i >= 5 ? 'finde' : ''}" data-soltar="fecha_vencimiento" data-valor="${iso}">
          <header><span class="dia-nombre">${Util.DIAS_CORTOS[i]}</span><span class="dia-num">${d.getDate()}</span>
            <button class="btn-icono btn-sm" data-accion="nueva-tarea" data-fecha="${iso}" aria-label="Agregar tarea el ${d.getDate()}">＋</button></header>
          <div class="semana-cuerpo">${lista.map(t => UI.tarjeta(t)).join('') || '<p class="columna-vacia">—</p>'}</div>
        </section>`;
      }).join('')}</div>`;
    } else {
      const y = ref.getFullYear(), mes = ref.getMonth();
      titulo = `${Util.MESES[mes]} ${y}`;
      const primero = new Date(y, mes, 1);
      const inicio = Util.sumarDias(Util.aISO(primero), -((primero.getDay() + 6) % 7));
      const semanas = Math.ceil((((primero.getDay() + 6) % 7) + new Date(y, mes + 1, 0).getDate()) / 7);
      let celdas = '';
      for (let i = 0; i < semanas * 7; i++) {
        const iso = Util.sumarDias(inicio, i);
        const d = Util.deISO(iso);
        const lista = porDia.get(iso) || [];
        const abiertas = lista.filter(t => t.estado !== 'completada').length;
        const extra = lista.length - this.MAX_POR_DIA;
        celdas += `<div class="dia ${d.getMonth() !== mes ? 'fuera' : ''} ${iso === hoy ? 'es-hoy' : ''} ${i % 7 >= 5 ? 'finde' : ''}"
            data-soltar="fecha_vencimiento" data-valor="${iso}" data-accion="nueva-tarea" data-fecha="${iso}" title="Clic para agregar una tarea">
          <div class="dia-cab"><span class="dia-num">${d.getDate()}</span>${abiertas ? `<span class="dia-carga" title="${abiertas} abiertas">${abiertas}</span>` : ''}</div>
          ${lista.slice(0, extra > 0 ? this.MAX_POR_DIA - 1 : this.MAX_POR_DIA).map(t => this.chip(t, hoy)).join('')}
          ${extra > 0 ? `<button class="ev-mas" data-accion="ver-dia" data-fecha="${iso}">+${extra + 1} más</button>` : ''}
        </div>`;
      }
      cuerpo = `<div class="mes">
        ${Util.DIAS_CORTOS.map((n, i) => `<div class="mes-cab ${i >= 5 ? 'finde' : ''}">${n}</div>`).join('')}
        ${celdas}
      </div>`;
    }

    const sinFecha = tareas.filter(t => !t.fecha_vencimiento && t.estado !== 'completada');
    const colabsVisibles = [...new Map(tareas.map(t => App.colaboradorDe(t)).filter(c => c?.id).map(c => [c.id, c])).values()];

    return `${UI.filtros()}
      <div class="cal-barra">
        <div class="cal-nav">
          <button class="btn-icono" data-accion="cal-mover" data-dir="-1" aria-label="Anterior">‹</button>
          <button class="btn btn-sm" data-accion="cal-hoy">Hoy</button>
          <button class="btn-icono" data-accion="cal-mover" data-dir="1" aria-label="Siguiente">›</button>
          <h2 class="cal-titulo">${titulo}</h2>
        </div>
        <div class="segmentado" role="group" aria-label="Vista del calendario">
          <button class="${s.modo === 'mes' ? 'on' : ''}" data-accion="cal-modo" data-valor="mes">Mes</button>
          <button class="${s.modo === 'semana' ? 'on' : ''}" data-accion="cal-modo" data-valor="semana">Semana</button>
        </div>
      </div>
      ${colabsVisibles.length > 1 ? `<div class="leyenda">${colabsVisibles.map(c => `<span class="leyenda-item"><span class="ev-punto" style="background:${UI.colorColaborador(c.id)}"></span>${Util.esc(c.nombre)}</span>`).join('')}
        <span class="leyenda-item"><span class="ev ev-vencida ev-muestra">Vencida</span></span><span class="leyenda-item"><span class="ev ev-completada ev-muestra">Completada</span></span></div>` : ''}
      ${cuerpo}
      ${sinFecha.length ? `<section class="panel mt"><header class="panel-cab"><h3>Sin fecha límite</h3><span class="contador">${sinFecha.length}</span><span class="muted mini">Arrástralas a un día para programarlas</span></header>
        <div class="fila-tarjetas">${sinFecha.slice(0, 12).map(t => UI.tarjeta(t)).join('')}</div></section>` : ''}`;
  },

  acciones: {
    'cal-mover': el => {
      const s = App.estado.cal;
      const dir = +el.dataset.dir;
      if (s.modo === 'semana') s.ref = Util.sumarDias(s.ref, 7 * dir);
      else { const d = Util.deISO(s.ref); s.ref = Util.aISO(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
      App.render();
    },
    'cal-hoy': () => { App.estado.cal.ref = Util.hoyISO(); App.render(); },
    'cal-modo': el => { App.estado.cal.modo = el.dataset.valor; App.render(); },
    'ver-dia': el => {
      const iso = el.dataset.fecha;
      const lista = Vistas.calendario.porDia(App.tareasVisibles()).get(iso) || [];
      const d = Util.deISO(iso);
      UI.abrirModal(`<header class="modal-cab"><h3>${d.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' })}</h3>
          <button class="btn-icono" data-accion="cerrar-modal" aria-label="Cerrar">✕</button></header>
        <div class="lista-tarjetas">${lista.map(t => UI.tarjeta(t, { arrastrable: false })).join('')}</div>
        <div class="modal-pie"><button class="btn btn-primario" data-accion="nueva-tarea" data-fecha="${iso}">＋ Agregar tarea este día</button></div>`, { ancho: 520 });
    },
  },
};

</script>
<script>
/* ── js/vistas/rendimiento.js ── */
// ═══════════════════════════════════════════════════════════════════
// VISTA: RENDIMIENTO — indicadores por colaborador (tabla + gráficas)
// Un administrador ve a todo el equipo; un colaborador solo a sí mismo.
// La fórmula del índice está documentada en js/metricas.js.
// ═══════════════════════════════════════════════════════════════════

Vistas.rendimiento = {
  titulo: 'Rendimiento',
  icono: '📈',
  orden: 5,
  visible: () => true,

  PERIODOS: [['semana', 'Esta semana'], ['mes', 'Este mes'], ['mes_anterior', 'Mes anterior'], ['trimestre', 'Trimestre'], ['anio', 'Este año'], ['todo', 'Todo']],

  SEGMENTOS: [
    { clave: 'completadasOk', label: 'Completadas', color: 'var(--serie-ok)', icono: '✓' },
    { clave: 'tarde', label: 'Completadas con retraso', color: 'var(--serie-tarde)', icono: '◷' },
    { clave: 'pendientes', label: 'Pendientes', color: 'var(--serie-pendiente)', icono: '○' },
    { clave: 'enCurso', label: 'En curso', color: 'var(--serie-curso)', icono: '▷' },
    { clave: 'vencidas', label: 'Vencidas', color: 'var(--serie-vencida)', icono: '⚠' },
  ],

  datos() {
    const hoy = Util.hoyISO();
    const periodo = App.estado.rend.periodo;
    const equipo = Permisos.verRendimientoEquipo();
    const tareas = equipo ? App.estado.tareas : App.estado.tareas.filter(t => App.esMia(t));
    const colabs = equipo ? App.estado.colaboradores : [App.estado.perfil];
    let filas = Metricas.porColaborador(tareas, colabs, { periodo, hoy })
      .map(f => ({ ...f, completadasOk: f.completadas - f.tarde }));
    if (equipo) filas = filas.filter(f => f.total > 0 || (f.colaborador && !CONFIG.ROLES_ADMIN.includes(f.colaborador.rol)));
    filas.sort((a, b) => (b.indice ?? -1) - (a.indice ?? -1) || b.total - a.total);
    return { filas, tareas, resumen: Metricas.resumenEquipo(filas), equipo, hoy };
  },

  render() {
    const { filas, tareas, resumen, equipo, hoy } = this.datos();
    const periodo = App.estado.rend.periodo;
    const pct = v => v === null ? '—' : Math.round(v * 100) + '%';

    return `
      <div class="barra-vista">
        <div class="segmentado" role="group" aria-label="Periodo">
          ${this.PERIODOS.map(([v, l]) => `<button class="${periodo === v ? 'on' : ''}" data-accion="periodo" data-valor="${v}">${l}</button>`).join('')}
        </div>
        <span class="muted mini">${equipo ? 'Todo el equipo' : 'Tus indicadores personales'} · ${this.alcance(periodo, hoy)}</span>
      </div>

      <div class="kpis kpis-5">
        ${Vistas.inicio.kpi('Tareas del periodo', resumen.total, 'azul', '▦')}
        ${Vistas.inicio.kpi('Completadas', resumen.completadas, 'verde', '✓')}
        ${Vistas.inicio.kpi('Puntualidad', pct(resumen.puntualidad), 'ambar', '◷')}
        ${Vistas.inicio.kpi('Vencidas sin completar', resumen.vencidas, 'rojo', '⚠')}
        ${Vistas.inicio.kpi(equipo ? 'Índice promedio' : 'Tu índice', (equipo ? resumen.indicePromedio : filas[0]?.indice) ?? '—', 'violeta', '★')}
      </div>

      <div class="rejilla-graficas">
        <section class="panel">
          <header class="panel-cab"><h3>Distribución de tareas por colaborador</h3></header>
          ${this.graficaBarras(filas)}
        </section>
        <section class="panel">
          <header class="panel-cab"><h3>Tareas completadas por semana</h3><span class="muted mini">Últimas ${CONFIG.SEMANAS_TENDENCIA} semanas</span></header>
          ${this.graficaTendencia(Metricas.tendenciaSemanal(tareas, CONFIG.SEMANAS_TENDENCIA, hoy))}
        </section>
      </div>

      <section class="vidrio mt"><div class="vidrio-interior">
        <header class="panel-cab"><h3>Tabla de rendimiento</h3>
          <span class="muted mini" title="Cumplimiento = completadas ÷ (completadas + vencidas). Puntualidad = completadas a tiempo ÷ completadas con fecha límite.">ⓘ Índice = 50 % cumplimiento + 50 % puntualidad</span>
        </header>
        <div class="tabla-scroll"><table class="tabla tabla-rend">
          <thead><tr><th>Colaborador</th><th class="num">Tareas</th><th class="num">Completadas</th><th class="num">Cumplimiento</th><th class="num">Puntualidad</th>
            <th class="num">Pendientes</th><th class="num">En curso</th><th class="num">Vencidas</th><th class="num">Días prom.</th><th class="num" title="Promedio del tiempo entre salir de Pendiente y completarse">Ejecución prom.</th><th>Índice</th></tr></thead>
          <tbody>${filas.map(f => {
            return `<tr class="fila-click" data-accion="ver-colaborador" data-id="${f.colaborador ? f.clave : ''}" title="Ver tareas de ${Util.esc(f.nombre)}">
              <td><span class="celda-colab">${UI.avatar(f.colaborador || { nombre: f.nombre }, 24)} ${Util.esc(f.nombre)}</span></td>
              <td class="num">${f.total}</td><td class="num">${f.completadas}</td>
              <td class="num">${pct(f.cumplimiento)}</td><td class="num">${pct(f.puntualidad)}</td>
              <td class="num">${f.pendientes}</td><td class="num">${f.enCurso}</td><td class="num ${f.vencidas ? 'txt-rojo' : ''}">${f.vencidas}</td>
              <td class="num">${f.diasPromedio === null ? '—' : f.diasPromedio.toFixed(1)}</td>
              <td class="num">${Util.fmtDuracion(f.ejecucionPromedio)}</td>
              <td>${UI.nivel(f.indice, { texto: true })}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="11" class="centrado muted pad">Sin datos en este periodo</td></tr>`}</tbody>
        </table></div>
      </div></section>`;
  },

  // Qué tareas entran en el periodo elegido, dicho en palabras.
  alcance(periodo, hoy) {
    if (periodo === 'todo') return 'todas las tareas';
    const { desde, hasta } = Metricas.rangoPeriodo(periodo, hoy);
    return `del ${Util.fmtFecha(desde)} al ${Util.fmtFecha(hasta)}: tareas que vencen o se completaron en esas fechas`;
  },

  // Barras horizontales apiladas; la longitud es proporcional al total (escala común).
  graficaBarras(filas) {
    const conDatos = filas.filter(f => f.total > 0);
    if (!conDatos.length) return '<p class="muted pad">Sin tareas en este periodo.</p>';
    const max = Math.max(...conDatos.map(f => f.total));
    const leyenda = `<div class="leyenda">${this.SEGMENTOS.map(s => `<span class="leyenda-item"><span class="muestra" style="background:${s.color}"></span>${s.icono} ${s.label}</span>`).join('')}</div>`;
    const barras = conDatos.map(f => {
      const segs = this.SEGMENTOS.filter(s => f[s.clave] > 0).map(s => {
        const ancho = (f[s.clave] / max) * 100;
        const etiqueta = ancho >= 7 ? `<span class="seg-num">${f[s.clave]}</span>` : '';
        return `<span class="seg" style="width:${ancho}%;background:${s.color}" data-tip="${Util.esc(f.nombre)} · ${s.label}: ${f[s.clave]} de ${f.total}">${etiqueta}</span>`;
      }).join('');
      return `<div class="barra-fila">
        <span class="barra-nombre" title="${Util.esc(f.nombre)}">${Util.esc(f.nombre)}</span>
        <div class="barra-pista">${segs}</div>
        <span class="barra-total">${f.total}</span>
      </div>`;
    }).join('');
    return leyenda + `<div class="grafica-barras" role="img" aria-label="Distribución de tareas por colaborador; los valores exactos están en la tabla de rendimiento">${barras}</div>`;
  },

  // Línea de una sola serie con bandas de hover por semana.
  graficaTendencia(serie) {
    const W = 560, H = 210, I = 34, D = 14, A = 14, B = 28;
    const max = Math.max(4, ...serie.map(s => s.completadas));
    const tope = Math.ceil(max / 4) * 4;
    const x = i => I + (i * (W - I - D)) / Math.max(1, serie.length - 1);
    const y = v => A + (H - A - B) * (1 - v / tope);
    const ticks = [0, tope / 4, tope / 2, (3 * tope) / 4, tope];
    const puntos = serie.map((s, i) => `${x(i).toFixed(1)},${y(s.completadas).toFixed(1)}`).join(' ');
    const area = `${x(0)},${y(0)} ${puntos} ${x(serie.length - 1)},${y(0)}`;
    const paso = (W - I - D) / Math.max(1, serie.length - 1);
    const ult = serie[serie.length - 1];
    const fmtSem = iso => { const d = Util.deISO(iso); return d.getDate() + ' ' + Util.MESES_CORTOS[d.getMonth()]; };

    return `<svg class="grafica-linea" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tareas completadas por semana. Semana actual: ${ult.completadas}">
      <defs><linearGradient id="grad-tendencia" x1="0" x2="1"><stop offset="0" style="stop-color:var(--acento-2)"/><stop offset="1" style="stop-color:var(--acento)"/></linearGradient></defs>
      ${ticks.map(t => `<line class="grid" x1="${I}" x2="${W - D}" y1="${y(t)}" y2="${y(t)}"/><text class="eje" x="${I - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
      ${serie.map((s, i) => i % 2 === serie.length % 2 ? '' : `<text class="eje" x="${x(i)}" y="${H - 8}" text-anchor="middle">${fmtSem(s.semana)}</text>`).join('')}
      <polygon class="area" points="${area}"/>
      <polyline class="linea" points="${puntos}" pathLength="1"/>
      ${serie.map((s, i) => `<g class="banda" data-tip="Semana del ${fmtSem(s.semana)}: ${s.completadas} completada${s.completadas === 1 ? '' : 's'} (${s.aTiempo} a tiempo)">
        <rect x="${x(i) - paso / 2}" y="${A}" width="${paso}" height="${H - A - B}" fill="transparent"/>
        <line class="guia" x1="${x(i)}" x2="${x(i)}" y1="${A}" y2="${H - B}"/>
        <circle class="punto" cx="${x(i)}" cy="${y(s.completadas)}" r="4.5"/>
      </g>`).join('')}
      <text class="valor-final" x="${x(serie.length - 1) - 8}" y="${y(ult.completadas) - 10}" text-anchor="end">${ult.completadas}</text>
    </svg>`;
  },

  acciones: {
    periodo: el => { App.estado.rend.periodo = el.dataset.valor; App.render(); },
  },
};

</script>

    return `<div class="barra-vista"><span class="muted">${App.estado.colaboradores.length} colaboradores · índice del mes en curso</span>
        ${Permisos.administrar() ? '<span class="muted mini">Los colaboradores se gestionan en la tabla <code>perfiles</code> de Supabase.</span>' : ''}</div>

<script>
/* ── js/vistas/notas.js ── */
// ═══════════════════════════════════════════════════════════════════
// VISTA: NOTAS — bloc de notas personal (cada usuario ve solo las suyas)
// La vista se conserva entre repintados (persistente) para no perder lo
// que se está escribiendo cuando llega un cambio de tareas en tiempo real.
// Guardado automático con espera corta; la tabla y su RLS: supabase/notas.sql
// ═══════════════════════════════════════════════════════════════════

const NOTA_COLORES = [
  { id: 'violeta', label: 'Violeta' }, { id: 'amarillo', label: 'Amarillo' }, { id: 'azul', label: 'Azul' },
  { id: 'verde', label: 'Verde' }, { id: 'rosa', label: 'Rosa' }, { id: 'gris', label: 'Gris' },
];

const NOTA_CARPETAS = [
  { id: 'todas', label: 'Todas las notas', icono: 'M5 4h10l4 4v12H5zM14 4v5h5' },
  { id: 'favoritas', label: 'Favoritas', icono: 'M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z' },
  { id: 'recientes', label: 'Recientes', icono: 'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z' },
  { id: 'archivadas', label: 'Archivadas', icono: 'M3 4h18v4H3zM5 8v12h14V8M10 12h4' },
  { id: 'papelera', label: 'Papelera', icono: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13' },
];

const Notas = {
  raiz: null,
  lista: [],
  cargada: false,
  error: null,
  carpeta: 'todas',
  busqueda: '',
  actualId: null,
  pendientes: new Map(),   // id → temporizador de guardado
  estadoGuardado: '',

  // ── Ciclo de vida ─────────────────────────────────────────────────
  reiniciar() {
    this.guardarTodo();
    this.raiz?.remove();
    Object.assign(this, { raiz: null, lista: [], cargada: false, error: null, carpeta: 'todas', busqueda: '', actualId: null, estadoGuardado: '' });
  },

  montar(main) {
    if (!this.raiz) this._crearRaiz();
    main.appendChild(this.raiz);
    if (!this.cargada) this.cargar();
  },

  async cargar() {
    this.error = null;
    try {
      this.lista = await Datos.notas();
    } catch (e) {
      console.error(e);
      this.error = e;
    }
    this.cargada = true;
    this.pintar();
  },

  // ── Consultas ─────────────────────────────────────────────────────
  nota(id) { return this.lista.find(n => n.id === id); },

  texto(html) {
    const d = document.createElement('div');
    d.innerHTML = Notas.limpiar(html || '').replace(/<\/?(div|p|li|h2|h3|ul|ol)\b[^>]*>|<br\s*\/?>/gi, ' $&');
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  },

  enCarpeta(n, carpeta) {
    const borrada = !!n.eliminada_at;
    switch (carpeta) {
      case 'papelera': return borrada;
      case 'archivadas': return !borrada && n.archivada;
      case 'favoritas': return !borrada && !n.archivada && n.favorita;
      case 'recientes': return !borrada && (Date.now() - new Date(n.updated_at).getTime()) < 7 * 864e5;
      default: return !borrada && !n.archivada;
    }
  },

  visibles() {
    const q = Util.normalizar(this.busqueda);
    return this.lista
      .filter(n => this.enCarpeta(n, this.carpeta))
      .filter(n => !q || Util.normalizar(n.titulo + ' ' + this.texto(n.contenido) + ' ' + (n.color || '')).includes(q))
      .sort((a, b) => (b.fijada - a.fijada) || String(b.updated_at).localeCompare(String(a.updated_at)));
  },

  hace(ts) {
    const s = (Date.now() - new Date(ts).getTime()) / 1000;
    if (s < 60) return 'Hace un momento';
    if (s < 3600) return `Hace ${Math.floor(s / 60)} min`;
    if (s < 86400) return `Hace ${Math.floor(s / 3600)} h`;
    const d = Math.floor(s / 86400);
    if (d < 7) return d === 1 ? 'Ayer' : `Hace ${d} días`;
    return Util.fmtFecha(String(ts).slice(0, 10));
  },

  // Solo se conserva el formato que ofrece la barra; todo lo demás se quita.
  limpiar(html) {
    const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
    const permitidos = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'H2', 'H3', 'P', 'DIV', 'BR', 'UL', 'OL', 'LI', 'A']);
    const recorrer = nodo => {
      for (const hijo of [...nodo.childNodes]) {
        if (hijo.nodeType === Node.TEXT_NODE) continue;
        if (hijo.nodeType !== Node.ELEMENT_NODE) { hijo.remove(); continue; }
        if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'SVG', 'MATH', 'TEMPLATE'].includes(hijo.tagName)) { hijo.remove(); continue; }
        recorrer(hijo);
        if (!permitidos.has(hijo.tagName)) { hijo.replaceWith(...hijo.childNodes); continue; }
        for (const a of [...hijo.attributes]) {
          const ok = (hijo.tagName === 'A' && a.name === 'href' && /^(https?:|mailto:)/i.test(a.value.trim()))
            || (hijo.tagName === 'UL' && a.name === 'class' && a.value === 'casillas')
            || (hijo.tagName === 'LI' && a.name === 'data-hecho' && a.value === '1');
          if (!ok) hijo.removeAttribute(a.name);
        }
        if (hijo.tagName === 'A') { hijo.setAttribute('target', '_blank'); hijo.setAttribute('rel', 'noopener noreferrer'); }
      }
    };
    recorrer(doc.body.firstChild);
    return doc.body.firstChild.innerHTML;
  },

  // ── Cambios ───────────────────────────────────────────────────────
  async nueva() {
    const ahora = new Date().toISOString();
    const n = { id: Util.uid(), titulo: '', contenido: '', color: 'violeta', fijada: false, favorita: false, archivada: false, eliminada_at: null, created_at: ahora, updated_at: ahora };
    this.lista.unshift(n);
    if (this.carpeta !== 'todas' && this.carpeta !== 'recientes') this.carpeta = 'todas';
    this.busqueda = '';
    this.actualId = n.id;
    this.raiz.classList.add('con-nota');
    this.pintar();
    this.raiz.querySelector('.nota-titulo')?.focus();
    await this.guardar(n.id, { inmediato: true });
  },

  cambiar(id, cambios, { repintar = true } = {}) {
    const n = this.nota(id);
    if (!n) return;
    Object.assign(n, cambios, { updated_at: new Date().toISOString() });
    if (repintar) this.pintar();
    this.guardar(id);
  },

  guardar(id, { inmediato = false } = {}) {
    clearTimeout(this.pendientes.get(id));
    this._estado('Guardando…');
    const hacer = async () => {
      this.pendientes.delete(id);
      const n = this.nota(id);
      if (!n) return;
      try {
        await Datos.guardarNota({ ...n, contenido: this.limpiar(n.contenido) });
        if (!this.pendientes.size) this._estado('Guardado · ' + this.hace(n.updated_at).toLowerCase());
      } catch (e) {
        console.error(e);
        this._estado('No se pudo guardar');
        UI.toast(e.message, { tipo: 'error' });
      }
    };
    if (inmediato) return hacer();
    this.pendientes.set(id, setTimeout(hacer, 700));
  },

  guardarTodo() {
    for (const id of [...this.pendientes.keys()]) this.guardar(id, { inmediato: true });
  },

  async borrarParaSiempre(id) {
    if (!confirm('¿Borrar esta nota para siempre? No se puede deshacer.')) return;
    try {
      await Datos.borrarNota(id);
      this.lista = this.lista.filter(n => n.id !== id);
      if (this.actualId === id) this.actualId = null;
      this.pintar();
    } catch (e) { UI.toast(e.message, { tipo: 'error' }); }
  },

  _estado(txt) {
    this.estadoGuardado = txt;
    const el = this.raiz?.querySelector('.nota-guardado');
    if (el) el.textContent = txt;
  },

  // ── Interfaz ──────────────────────────────────────────────────────
  _crearRaiz() {
    const r = document.createElement('div');
    r.className = 'notas';
    r.addEventListener('click', e => this._alClic(e));
    r.addEventListener('input', e => this._alEscribir(e));
    r.addEventListener('keydown', e => this._alTecla(e));
    r.addEventListener('paste', e => this._alPegar(e));
    this.raiz = r;
  },

  _svg(d, extra = '') { return `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}><path d="${d}"/></svg>`; },

  pintar() {
    if (!this.raiz) return;
    const visibles = this.visibles();
    if (this.actualId && !this.nota(this.actualId)) this.actualId = null;
    const n = this.nota(this.actualId);
    const cuenta = c => this.lista.filter(x => this.enCarpeta(x, c)).length;
    const carpeta = NOTA_CARPETAS.find(c => c.id === this.carpeta);
    const enfocado = document.activeElement;
    const buscando = enfocado?.classList?.contains('notas-buscar');

    this.raiz.innerHTML = `
      <aside class="notas-carpetas">
        <button class="btn btn-primario ancho notas-nueva" data-n="nueva">${this._svg('M12 5v14M5 12h14')} Nueva nota</button>
        <nav class="panel-vidrio notas-menu" aria-label="Carpetas">
          <div class="notas-etiqueta">Carpetas</div>
          ${NOTA_CARPETAS.map(c => `<button class="notas-carpeta ${c.id === this.carpeta ? 'on' : ''}" data-n="carpeta" data-c="${c.id}" ${c.id === this.carpeta ? 'aria-current="true"' : ''}>
            ${this._svg(c.icono)}<span>${c.label}</span><span class="notas-num">${cuenta(c.id)}</span></button>`).join('')}
        </nav>
        <p class="panel-vidrio notas-privado">${this._svg('M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z')} Solo tú ves tus notas.</p>
      </aside>

      <section class="panel-vidrio notas-lista" aria-label="Lista de notas">
        <label class="notas-busqueda">${this._svg('M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4')}
          <input type="search" class="notas-buscar" placeholder="Buscar en tus notas" aria-label="Buscar notas" value="${Util.esc(this.busqueda)}"></label>
        <h3 class="notas-titulo-lista">${carpeta.label} <span>(${visibles.length})</span></h3>
        <div class="notas-tarjetas">
          ${this.error ? '' : !this.cargada ? '<p class="muted pad">Cargando notas…</p>' : visibles.length ? visibles.map(x => `
            <button class="nota-tarjeta nc-${Util.esc(x.color || 'violeta')} ${x.id === this.actualId ? 'on' : ''}" data-n="abrir" data-id="${Util.esc(x.id)}">
              <span class="nota-tarjeta-cab"><span class="nota-punto"></span><strong>${Util.esc(x.titulo || 'Sin título')}</strong>
                <span class="nota-marcas">${x.fijada ? this._svg('M9 3h6l-1 6 4 3v2H6v-2l4-3zM12 14v7', 'class="nota-marca-fija"') : ''}${x.favorita ? this._svg('M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z', 'class="nota-marca-fav"') : ''}</span></span>
              <span class="nota-resumen">${Util.esc(this.texto(x.contenido).slice(0, 160)) || '<em>Nota vacía</em>'}</span>
              <span class="nota-fecha">${this.hace(x.updated_at)}</span>
            </button>`).join('') : `<p class="muted pad">${this.busqueda ? 'Ninguna nota coincide con la búsqueda.' : this.carpeta === 'papelera' ? 'La papelera está vacía.' : 'Aún no hay notas aquí.'}</p>`}
        </div>
      </section>

      <section class="panel-vidrio notas-editor" aria-label="Editor de notas">
        ${this.error ? this._errorHtml() : n ? this._editorHtml(n) : `
          <div class="vacio notas-vacio">${this._svg('M5 4h10l4 4v12H5zM14 4v5h5M8 13h8M8 17h5', 'width="40" height="40"')}
            <h3>Tu bloc de notas</h3><p>Elige una nota de la lista o crea una nueva.</p>
            <button class="btn btn-primario" data-n="nueva">＋ Nueva nota</button></div>`}
      </section>`;

    if (buscando) {
      const b = this.raiz.querySelector('.notas-buscar');
      b.focus(); b.setSelectionRange(b.value.length, b.value.length);
    }
  },

  _errorHtml() {
    const falta = this.error?.faltaEsquema;
    return `<div class="vacio notas-vacio"><h3>${falta ? 'Falta activar las notas en Supabase' : 'No se pudieron cargar las notas'}</h3>
      <p>${falta ? 'El administrador debe ejecutar una sola vez el archivo <code>supabase/notas.sql</code> en el SQL Editor de Supabase.' : Util.esc(this.error?.message || '')}</p>
      <button class="btn" data-n="reintentar">Reintentar</button></div>`;
  },

  _editorHtml(n) {
    const enPapelera = !!n.eliminada_at;
    const herr = [
      ['bold', 'Negrita', 'M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z'],
      ['italic', 'Cursiva', 'M14 5h-4M14 19h-4M14 5l-4 14'],
      ['underline', 'Subrayado', 'M7 4v7a5 5 0 0 0 10 0V4M5 20h14'],
      ['titulo', 'Título', 'M5 5v14M15 5v14M5 12h10M19 10v9'],
      ['insertUnorderedList', 'Viñetas', 'M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01'],
      ['insertOrderedList', 'Numeración', 'M10 6h10M10 12h10M10 18h10M4 5h1v4M4 15h2l-2 3h2'],
      ['casillas', 'Casillas', 'M4 4h7v7H4zM6 7.5l1.5 1.5 2.5-3M14 7h6M4 14h7v7H4zM14 17h6'],
      ['enlace', 'Enlace', 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1'],
    ];
    const botones = enPapelera ? `
        <button class="btn btn-sm" data-n="restaurar">Restaurar</button>
        <button class="btn btn-sm btn-peligro" data-n="borrar">Borrar para siempre</button>` : `
        <button class="btn-icono ${n.fijada ? 'nota-on-fija' : ''}" data-n="fijar" aria-pressed="${n.fijada}" aria-label="${n.fijada ? 'Desfijar nota' : 'Fijar nota'}" title="${n.fijada ? 'Desfijar' : 'Fijar arriba'}">${this._svg('M9 3h6l-1 6 4 3v2H6v-2l4-3zM12 14v7', n.fijada ? 'fill="currentColor"' : '')}</button>
        <button class="btn-icono ${n.favorita ? 'nota-on-fav' : ''}" data-n="favorita" aria-pressed="${n.favorita}" aria-label="${n.favorita ? 'Quitar de favoritas' : 'Marcar como favorita'}" title="Favorita">${this._svg('M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z', n.favorita ? 'fill="currentColor"' : '')}</button>
        <button class="btn-icono" data-n="archivar" aria-label="${n.archivada ? 'Sacar del archivo' : 'Archivar nota'}" title="${n.archivada ? 'Desarchivar' : 'Archivar'}">${this._svg('M3 4h18v4H3zM5 8v12h14V8M10 12h4')}</button>
        <button class="btn-icono" data-n="papelera" aria-label="Mover a la papelera" title="Mover a la papelera">${this._svg('M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13')}</button>`;
    return `
      <header class="nota-cab">
        <button class="btn-icono nota-volver" data-n="volver" aria-label="Volver a la lista">‹</button>
        <input class="nota-titulo" value="${Util.esc(n.titulo)}" placeholder="Sin título" aria-label="Título de la nota" maxlength="200" ${enPapelera ? 'readonly' : ''}>
        ${botones}
      </header>
      ${enPapelera ? '<p class="nota-aviso">Esta nota está en la papelera. Restáurala para editarla.</p>' : `
      <div class="nota-herramientas" role="toolbar" aria-label="Formato">
        ${herr.map(([cmd, label, d]) => `<button class="btn-icono btn-sm" data-n="formato" data-cmd="${cmd}" aria-label="${label}" title="${label}">${this._svg(d)}</button>`).join('')}
        <span class="nota-sep"></span>
        ${NOTA_COLORES.map(c => `<button class="nota-color nc-${c.id} ${n.color === c.id ? 'on' : ''}" data-n="color" data-color="${c.id}" aria-label="Color ${c.label.toLowerCase()}" aria-pressed="${n.color === c.id}" title="${c.label}"></button>`).join('')}
        <span class="separador"></span>
        <span class="nota-guardado mini muted" aria-live="polite">${Util.esc(this.estadoGuardado || 'Guardado · ' + this.hace(n.updated_at).toLowerCase())}</span>
      </div>`}
      <div class="nota-cuerpo" ${enPapelera ? '' : 'contenteditable="true"'} role="textbox" aria-multiline="true" aria-label="Contenido de la nota" data-placeholder="Escribe aquí…">${this.limpiar(n.contenido)}</div>`;
  },

  // ── Eventos ───────────────────────────────────────────────────────
  _alClic(e) {
    const cuerpo = e.target.closest('.nota-cuerpo');
    // Casillas: clic a la izquierda del renglón marca o desmarca
    const li = e.target.closest('.nota-cuerpo ul.casillas > li');
    if (li && cuerpo?.isContentEditable && e.clientX - li.getBoundingClientRect().left < 26) {
      e.preventDefault();
      li.toggleAttribute('data-hecho');
      if (li.hasAttribute('data-hecho')) li.setAttribute('data-hecho', '1');
      this._guardarCuerpo();
      return;
    }
    // Enlaces dentro de la nota: Ctrl/Cmd + clic los abre
    const a = e.target.closest('.nota-cuerpo a[href]');
    if (a && (e.ctrlKey || e.metaKey)) { e.preventDefault(); window.open(a.href, '_blank', 'noopener'); return; }

    const b = e.target.closest('[data-n]');
    if (!b) return;
    e.preventDefault();
    const n = this.nota(this.actualId);
    switch (b.dataset.n) {
      case 'nueva': this.nueva(); break;
      case 'carpeta': this.carpeta = b.dataset.c; this.pintar(); break;
      case 'abrir':
        this.guardarTodo();
        this.actualId = b.dataset.id; this.estadoGuardado = '';
        this.raiz.classList.add('con-nota');
        this.pintar();
        break;
      case 'volver': this.raiz.classList.remove('con-nota'); break;
      case 'reintentar': this.cargada = false; this.pintar(); this.cargar(); break;
      case 'fijar': n && this.cambiar(n.id, { fijada: !n.fijada }); break;
      case 'favorita': n && this.cambiar(n.id, { favorita: !n.favorita }); break;
      case 'archivar':
        if (!n) break;
        this.cambiar(n.id, { archivada: !n.archivada });
        UI.toast(n.archivada ? 'Nota archivada' : 'Nota sacada del archivo');
        break;
      case 'papelera':
        if (!n) break;
        this.cambiar(n.id, { eliminada_at: new Date().toISOString() }, { repintar: false });
        this.actualId = null; this.raiz.classList.remove('con-nota'); this.pintar();
        UI.toast('Nota movida a la papelera', { deshacer: () => this.cambiar(n.id, { eliminada_at: null }) });
        break;
      case 'restaurar': n && this.cambiar(n.id, { eliminada_at: null }); break;
      case 'borrar': n && this.borrarParaSiempre(n.id); break;
      case 'color': n && this.cambiar(n.id, { color: b.dataset.color }); break;
      case 'formato': this._formato(b.dataset.cmd); break;
    }
  },

  _formato(cmd) {
    const cuerpo = this.raiz.querySelector('.nota-cuerpo');
    if (!cuerpo) return;
    cuerpo.focus();
    if (cmd === 'titulo') {
      const actual = document.queryCommandValue('formatBlock').toLowerCase();
      document.execCommand('formatBlock', false, actual === 'h2' ? 'div' : 'h2');
    } else if (cmd === 'casillas') {
      const sel = getSelection();
      let ul = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement)?.closest('ul');
      if (!ul || !cuerpo.contains(ul)) {
        document.execCommand('insertUnorderedList');
        ul = (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement)?.closest('ul');
      }
      if (ul && cuerpo.contains(ul)) ul.classList.toggle('casillas');
    } else if (cmd === 'enlace') {
      const url = prompt('Dirección del enlace (https://…)');
      if (url && /^(https?:\/\/|mailto:)/i.test(url.trim())) document.execCommand('createLink', false, url.trim());
      else if (url) UI.toast('El enlace debe empezar por https:// o mailto:', { tipo: 'error' });
    } else {
      document.execCommand(cmd);
    }
    this._guardarCuerpo();
  },

  _guardarCuerpo() {
    const n = this.nota(this.actualId);
    const cuerpo = this.raiz.querySelector('.nota-cuerpo');
    if (!n || !cuerpo) return;
    this.cambiar(n.id, { contenido: cuerpo.innerHTML }, { repintar: false });
    this._refrescarTarjeta(n);
  },

  _alEscribir(e) {
    if (e.target.classList.contains('notas-buscar')) { this.busqueda = e.target.value; this.pintar(); return; }
    const n = this.nota(this.actualId);
    if (!n) return;
    if (e.target.classList.contains('nota-titulo')) {
      this.cambiar(n.id, { titulo: e.target.value }, { repintar: false });
      this._refrescarTarjeta(n);
    } else if (e.target.classList.contains('nota-cuerpo')) {
      this._guardarCuerpo();
    }
  },

  _alTecla(e) {
    if (e.target.classList.contains('nota-titulo') && e.key === 'Enter') { e.preventDefault(); this.raiz.querySelector('.nota-cuerpo')?.focus(); }
  },

  // Al pegar se conserva solo el texto (sin estilos de otras páginas)
  _alPegar(e) {
    if (!e.target.closest('.nota-cuerpo')) return;
    e.preventDefault();
    document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
  },

  // Actualiza la tarjeta de la nota en la lista sin repintar el editor
  _refrescarTarjeta(n) {
    const t = this.raiz.querySelector(`.nota-tarjeta[data-id="${CSS.escape(n.id)}"]`);
    if (!t) return;
    t.querySelector('strong').textContent = n.titulo || 'Sin título';
    t.querySelector('.nota-resumen').textContent = this.texto(n.contenido).slice(0, 160) || 'Nota vacía';
    t.querySelector('.nota-fecha').textContent = this.hace(n.updated_at);
  },
};

addEventListener('beforeunload', () => Notas.guardarTodo());

Vistas.notas = {
  titulo: 'Notas',
  icono: '📝',
  orden: 7,
  visible: () => true,
  persistente: true,
  nodo: () => Notas.raiz,
  render: () => '',
  montar: main => Notas.montar(main),
};

/* ── js/vistas/clientes.js ── */
// ═══════════════════════════════════════════════════════════════════
// VISTA: CLIENTES — directorio de clientes con sus claves y vencimientos
//
// La ficha se arma con las listas CLIENTE_CAMPOS y CLIENTE_VENCIMIENTOS:
// para agregar un dato nuevo basta con sumar una línea a la lista. No hace
// falta tocar Supabase: los campos se guardan en la columna jsonb "datos" y
// los vencimientos en "vencimientos". La tabla y su RLS: supabase/clientes.sql
// La vista es persistente (como Notas) para no perder una edición en curso
// cuando llega un cambio de tareas en tiempo real.
// ═══════════════════════════════════════════════════════════════════

// Días antes del vencimiento en que la fila empieza a avisar (amarillo).
const CLIENTE_DIAS_ALERTA = 30;

// Versiones anteriores que se guardan de cada cliente. Si se cambia, cambiar también
// el número en el trigger de supabase/clientes.sql (allí está el límite real).
const CLIENTE_VERSIONES = 5;

// Secciones de la ficha, en orden.
const CLIENTE_SECCIONES = [
  { id: 'datos', titulo: 'Datos' },
  { id: 'claves', titulo: '🔒 Claves' },
];

// Campos de la ficha (además del nombre y la cédula/NIT, que son fijos).
//   tipo:    texto | correo | clave | telefono | codigo
//   excel:   encabezados que se buscan al importar (sin tildes, da igual mayúsculas)
//   extraer: opcional, convierte el valor de la celda antes de guardarlo
//   junto:   opcional, en la ficha se muestra delante de este campo (no en su propia fila)
//   fija:    opcional, se muestra arriba junto al nombre y el NIT (no con los demás datos)
const CLIENTE_CAMPOS = [
  { id: 'lechera_codigo', label: 'Código empresa lechera', tipo: 'codigo', seccion: 'datos', junto: 'lechera_nombre',
    excel: ['EMPRESA LECHERA'], extraer: v => (String(v).trim().match(/^(\d+)(?:\.0+)?(?=\D|$)/) || [])[1] || '' },
  { id: 'lechera_nombre', label: 'Empresa lechera', tipo: 'texto', seccion: 'datos',
    excel: ['EMPRESA LECHERA'], extraer: v => String(v).trim().replace(/^\d+(?:\.0+)?\s*[-–:]?\s*/, '') },
  // Persona: su cédula (su NIT es el mismo número). Empresa: la cédula del representante legal
  // (su nombre no se guarda). La llena el importador.
  { id: 'cedula', label: 'Cédula', tipo: 'texto', seccion: 'datos', fija: true },
  { id: 'correo', label: 'Correo', tipo: 'correo', seccion: 'datos', excel: ['E-MAIL', 'EMAIL', 'CORREO'] },
  { id: 'correo_2', label: 'Correo 2', tipo: 'correo', seccion: 'datos', excel: ['E-MAIL 2', 'EMAIL 2', 'CORREO 2'] },
  { id: 'clave_correo', label: 'Clave correo', tipo: 'clave', seccion: 'claves', excel: ['CLAVE E-MAIL', 'CLAVE EMAIL', 'CLAVE CORREO'] },
  { id: 'clave_correo_2', label: 'Clave correo 2', tipo: 'clave', seccion: 'claves', excel: ['CLAVE E-MAIL 2', 'CLAVE EMAIL 2', 'CLAVE CORREO 2'] },
  { id: 'clave_dian', label: 'Clave DIAN', tipo: 'clave', seccion: 'claves', excel: ['CLAVE DIAN'] },
];

// Vencimientos: cada uno guarda { inicio, fin } (fechas AAAA-MM-DD).
const CLIENTE_VENCIMIENTOS = [
  { id: 'certificado', label: 'Certificado de firma', corto: 'Firma', icono: '🔏', excel: ['VENCIMIENTO CERTIFICADO'] },
  { id: 'resolucion', label: 'Resolución de facturación', corto: 'Resolución', icono: '🧾', excel: ['VENCIMIENTO DE RESOLUCION FACTURACION', 'VENCIMIENTO RESOLUCION FACTURACION', 'VENCIMIENTO RESOLUCION'] },
  { id: 'soporte', label: 'Documento soporte', corto: 'Doc. soporte', icono: '📄', excel: ['VENCIMIENTO DOCUMENTO SOPORTE', 'VENCIMIENTO SOPORTE'] },
];

const Clientes = {
  raiz: null,
  lista: [],
  cargada: false,
  error: null,
  filtro: { texto: '', lechera: '', venc: '', letra: '' },
  abiertoId: null,
  editando: null,      // { id, que: 'datos' | <id de vencimiento> }

  // ── Ciclo de vida ─────────────────────────────────────────────────
  reiniciar() {
    this.raiz?.remove();
    Object.assign(this, { raiz: null, lista: [], cargada: false, error: null, filtro: { texto: '', lechera: '', venc: '', letra: '' }, abiertoId: null, editando: null });
  },

  montar(main) {
    if (!this.raiz) this._crearRaiz();
    main.appendChild(this.raiz);
    if (!this.cargada) this.cargar(); else this.pintar();
  },

  async cargar() {
    this.error = null;
    try {
      this.lista = (await Datos.clientes()).map(g => this.normalizar(g));
    } catch (e) {
      console.error(e);
      this.error = e;
    }
    this.cargada = true;
    this.pintar();
  },

  normalizar(g) {
    return { ...g, nit: g.nit || '', nombre: g.nombre || '', datos: g.datos || {}, vencimientos: g.vencimientos || {}, historial: Array.isArray(g.historial) ? g.historial : [] };
  },

  // ── Consultas ─────────────────────────────────────────────────────
  cliente(id) { return this.lista.find(g => g.id === id); },

  // Empresa: NIT de 9 dígitos que empieza por 8 o 9 (el mismo criterio del importador).
  esEmpresa(g) { return /^[89]\d{8}$/.test(g.nit || ''); },

  // vencido | pronto | ok | sin
  estadoVenc(v, hoy = Util.hoyISO()) {
    if (!v?.fin) return { estado: 'sin', dias: null };
    const dias = Util.diasEntre(hoy, v.fin);
    return { estado: dias < 0 ? 'vencido' : dias <= CLIENTE_DIAS_ALERTA ? 'pronto' : 'ok', dias };
  },

  // Lo más urgente del cliente, para la etiqueta de la fila (null si no hay nada que avisar).
  alerta(g) {
    const hoy = Util.hoyISO();
    const est = CLIENTE_VENCIMIENTOS.map(v => ({ v, ...this.estadoVenc(g.vencimientos[v.id], hoy) }));
    const vencidos = est.filter(e => e.estado === 'vencido');
    if (vencidos.length > 1) return { estado: 'vencido', texto: `${vencidos.length} vencidos` };
    if (vencidos.length) return { estado: 'vencido', texto: `Vencido: ${vencidos[0].v.corto}` };
    const pronto = est.filter(e => e.estado === 'pronto').sort((a, b) => a.dias - b.dias)[0];
    if (pronto) return { estado: 'pronto', texto: `${pronto.v.corto} ${pronto.dias === 0 ? 'vence hoy' : `en ${pronto.dias} día${pronto.dias === 1 ? '' : 's'}`}` };
    return null;
  },

  // Estado general para el filtro de vencimientos
  estadoGeneral(g) {
    const a = this.alerta(g);
    if (a) return a.estado;
    return CLIENTE_VENCIMIENTOS.some(v => g.vencimientos[v.id]?.fin) ? 'ok' : 'sin';
  },

  letra(g) { return Util.normalizar(g.nombre).charAt(0) || '#'; },

  visibles() {
    const f = this.filtro;
