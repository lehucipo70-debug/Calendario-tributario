    const q = Util.normalizar(f.texto);
    const textoBusqueda = g => Util.normalizar([g.nombre, g.nit, ...CLIENTE_CAMPOS.filter(c => c.tipo !== 'clave').map(c => g.datos[c.id] || '')].join(' '));
    return this.lista
      .filter(g => !f.letra || this.letra(g) === f.letra)
      .filter(g => !f.lechera || Util.normalizar(g.datos.lechera_nombre) === f.lechera)
      .filter(g => !f.venc || this.estadoGeneral(g) === f.venc)
      .filter(g => !q || textoBusqueda(g).includes(q))
      .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  },

  // ── Cambios ───────────────────────────────────────────────────────
  async guardar(g, mensaje = 'Guardado') {
    const antes = this.cliente(g.id);
    const copia = antes && structuredClone(antes);
    g.updated_at = new Date().toISOString();
    if (antes) { Object.assign(antes, g); delete antes._nuevo; } else this.lista.push(g);
    this.editando = null;
    this.pintar();
    try {
      const fila = await Datos.guardarCliente(g);
      const actual = this.cliente(g.id);
      if (fila && actual) { Object.assign(actual, this.normalizar(fila)); this.pintar(); }
      UI.toast(mensaje, { tipo: 'ok' });
    } catch (e) {
      console.error(e);
      if (copia) Object.assign(antes, copia); else this.lista = this.lista.filter(x => x.id !== g.id);
      this.pintar();
      UI.toast(e.message, { tipo: 'error' });
    }
  },

  // Lo que cambia entre dos versiones de un cliente: etiquetas, o { label, valor } con el valor de "a".
  diferencias(a, b, { conValor = false } = {}) {
    const igual = (x, y) => (x || '') === (y || '');
    const out = [];
    const agregar = (label, valor) => out.push(conValor ? { label, valor: valor || '(vacío)' } : label);
    if (!igual(a.nombre, b.nombre)) agregar('Nombre', a.nombre);
    if (!igual(a.nit, b.nit)) agregar('NIT', a.nit);
    for (const c of CLIENTE_CAMPOS) {
      if (!igual(a.datos?.[c.id], b.datos?.[c.id])) agregar(c.label, a.datos?.[c.id]);
    }
    for (const v of CLIENTE_VENCIMIENTOS) {
      const x = a.vencimientos?.[v.id] || {}, y = b.vencimientos?.[v.id] || {};
      if (!igual(x.inicio, y.inicio) || !igual(x.fin, y.fin)) {
        agregar(v.label, x.inicio || x.fin ? `${x.inicio ? Util.fmtFecha(x.inicio) : '—'} → ${x.fin ? Util.fmtFecha(x.fin) : '—'}` : '');
      }
    }
    return out;
  },

  // Guarda un cambio sobre un cliente existente pidiendo confirmación.
  confirmarYGuardar(antes, despues, mensaje) {
    const cambios = this.diferencias(antes, despues);
    if (!cambios.length) { this.editando = null; this.pintar(); return; }
    if (!confirm(`¿Seguro desea hacer este cambio?\n\nCambia: ${cambios.join(', ')}`)) return;
    this.guardar(despues, mensaje);
  },

  // ── Versiones ─────────────────────────────────────────────────────
  verVersiones(id) {
    const g = this.cliente(id);
    if (!g) return;
    const versiones = g.historial || [];
    // Cada versión se compara con la que la reemplazó (la siguiente más nueva).
    const filas = versiones.map((v, i) => {
      const siguiente = i === 0 ? g : versiones[i - 1];
      const cambios = this.diferencias(v, siguiente, { conValor: true });
      return `<li class="cli-version">
        <div><b>${v.fecha ? Util.fmtFechaHora(v.fecha) : 'Versión importada'}</b>${v.autor ? ` · ${Util.esc(v.autor)}` : ''}
          <div class="muted mini">${cambios.length ? cambios.map(c => `${Util.esc(c.label)}: <b>${Util.esc(c.valor)}</b>`).join(' · ') : 'Igual a la versión siguiente'}</div></div>
        <button class="btn btn-sm" data-cv="restaurar" data-i="${i}">↺ Restaurar</button></li>`;
    }).join('');
    UI.abrirModal(`<header class="modal-cab"><h3>🕘 Versiones de ${Util.esc(g.nombre)}</h3>
        <button class="btn-icono" data-accion="cerrar-modal" aria-label="Cerrar">✕</button></header>
      <p class="muted mini">Actual: ${Util.fmtFechaHora(g.updated_at) || '—'}${g.actualizado_nombre ? ' · ' + Util.esc(g.actualizado_nombre) : ''}. Se guardan las últimas ${CLIENTE_VERSIONES} versiones anteriores.</p>
      ${filas ? `<ul class="cli-versiones">${filas}</ul>` : '<p class="muted pad centrado">Aún no hay versiones anteriores: aparecen cuando alguien cambia este cliente.</p>'}`, { ancho: 600 });
    document.querySelector('#modal .modal').addEventListener('click', e => {
      const b = e.target.closest('[data-cv="restaurar"]');
      if (!b) return;
      const v = versiones[Number(b.dataset.i)];
      const despues = { ...structuredClone(g), nombre: v.nombre || '', nit: v.nit || '', datos: structuredClone(v.datos || {}), vencimientos: structuredClone(v.vencimientos || {}) };
      const cambios = this.diferencias(g, despues);
      if (!cambios.length) { UI.toast('Esa versión es igual a la actual'); return; }
      if (!confirm(`¿Seguro desea hacer este cambio?\n\nSe restaura la versión del ${v.fecha ? Util.fmtFechaHora(v.fecha) : 'archivo importado'}\nCambia: ${cambios.join(', ')}`)) return;
      UI.cerrarModal();
      this.guardar(despues, 'Versión restaurada');
    });
  },

  nuevo() {
    const g = this.normalizar({ id: Util.uid(), nombre: '', nit: '', _nuevo: true });
    this.lista.push(g);
    Object.assign(this.filtro, { texto: '', lechera: '', venc: '', letra: '' });
    this.abiertoId = g.id;
    this.editando = { id: g.id, que: 'datos' };
    this.pintar();
    this.raiz.querySelector('[name="nombre"]')?.focus();
  },

  async eliminar(id) {
    const g = this.cliente(id);
    if (!g || !confirm(`¿Eliminar a ${g.nombre || 'este cliente'}? No se puede deshacer.`)) return;
    try {
      await Datos.borrarCliente(id);
      this.lista = this.lista.filter(x => x.id !== id);
      this.abiertoId = this.editando = null;
      this.pintar();
      UI.toast('Cliente eliminado');
    } catch (e) { UI.toast(e.message, { tipo: 'error' }); }
  },

  cancelarEdicion() {
    const g = this.cliente(this.editando?.id);
    if (g?._nuevo) { this.lista = this.lista.filter(x => x !== g); this.abiertoId = null; }
    this.editando = null;
    this.pintar();
  },

  async copiar(texto) {
    try { await navigator.clipboard.writeText(texto); UI.toast('Copiado', { tipo: 'ok', ms: 1500 }); }
    catch { UI.toast('No se pudo copiar', { tipo: 'error' }); }
  },

  // ── Interfaz ──────────────────────────────────────────────────────
  _crearRaiz() {
    const r = document.createElement('div');
    r.className = 'clientes';
    r.addEventListener('click', e => this._alClic(e));
    r.addEventListener('input', e => this._alEscribir(e));
    r.addEventListener('change', e => this._alCambiar(e));
    r.addEventListener('submit', e => this._alEnviar(e));
    this.raiz = r;
  },

  chip(estado, texto) {
    const cls = { vencido: 'est-vencida', pronto: 'est-en_revision', ok: 'est-completada', sin: 'chip-suave' }[estado];
    const ico = { vencido: '⚠', pronto: '◷', ok: '✓', sin: '·' }[estado];
    return `<span class="chip ${cls}">${ico} ${Util.esc(texto)}</span>`;
  },

  pintar() {
    if (!this.raiz) return;
    const enfocado = document.activeElement;
    const buscando = enfocado?.classList?.contains('cli-buscar');
    const cursor = buscando ? enfocado.selectionStart : null;

    if (this.error) {
      const falta = this.error.faltaEsquema;
      this.raiz.innerHTML = `<div class="vacio"><h3>${falta ? 'Falta activar Clientes en Supabase' : 'No se pudieron cargar los clientes'}</h3>
        <p>${falta ? 'El administrador debe ejecutar una sola vez el archivo <code>supabase/clientes.sql</code> en el SQL Editor de Supabase.' : Util.esc(this.error.message || '')}</p>
        <button class="btn" data-g="reintentar">Reintentar</button></div>`;
      return;
    }

    const f = this.filtro;
    const visibles = this.visibles();
    const lecheras = [...new Map(this.lista.filter(g => g.datos.lechera_nombre).map(g => [Util.normalizar(g.datos.lechera_nombre), g.datos.lechera_nombre.trim()])).entries()]
      .sort((a, b) => a[1].localeCompare(b[1], 'es'));
    const letras = [...new Set(this.lista.map(g => this.letra(g)))].sort();
    const opt = (v, l, actual) => `<option value="${Util.esc(v)}" ${actual === v ? 'selected' : ''}>${Util.esc(l)}</option>`;

    this.raiz.innerHTML = `
      <div class="barra-filtros">
        <input type="search" class="cli-buscar" placeholder="🔍 Nombre, cédula, NIT, código o empresa lechera…" value="${Util.esc(f.texto)}" aria-label="Buscar cliente">
        <select data-gf="lechera" aria-label="Empresa lechera"><option value="">Empresa lechera</option>${lecheras.map(([v, l]) => opt(v, l, f.lechera)).join('')}</select>
        <select data-gf="venc" aria-label="Vencimientos"><option value="">Vencimientos</option>
          ${opt('vencido', 'Con algo vencido', f.venc)}${opt('pronto', `Vence en ${CLIENTE_DIAS_ALERTA} días`, f.venc)}${opt('ok', 'Todo al día', f.venc)}${opt('sin', 'Sin fechas', f.venc)}</select>
        ${f.texto || f.lechera || f.venc || f.letra ? '<button class="btn btn-sm" data-g="limpiar">✕ Limpiar</button>' : ''}
      </div>
      <div class="cli-letras" role="group" aria-label="Inicial">
        <button class="${f.letra ? '' : 'on'}" data-g="letra" data-l="">Todos</button>
        ${letras.map(l => `<button class="${f.letra === l ? 'on' : ''}" data-g="letra" data-l="${Util.esc(l)}">${Util.esc(l)}</button>`).join('')}
      </div>
      <div class="barra-vista">
        <span class="muted">${this.cargada ? `${visibles.length === this.lista.length ? '' : visibles.length + ' de '}${this.lista.length} clientes · toca un nombre para ver su información` : 'Cargando clientes…'}</span>
        <span class="separador"></span>
        ${Permisos.importar() ? `<label class="btn btn-sm">⬆ Importar Excel<input type="file" accept=".xlsx,.xls" data-g="importar" hidden></label>` : ''}
        <button class="btn btn-sm btn-primario" data-g="nuevo">＋ Nuevo cliente</button>
      </div>
      <div class="cli-lista">
        ${visibles.map(g => this._filaHtml(g)).join('') || (this.cargada ? `<p class="muted pad centrado">${this.lista.length ? 'Ningún cliente coincide con la búsqueda.' : 'Aún no hay clientes. Importa el Excel o crea uno nuevo.'}</p>` : '')}
      </div>`;

    if (buscando) {
      const b = this.raiz.querySelector('.cli-buscar');
      b.focus(); b.setSelectionRange(cursor, cursor);
    }
  },

  _filaHtml(g) {
    const abierto = g.id === this.abiertoId;
    const a = this.alerta(g);
    return `<div class="cli-item ${abierto ? 'abierto' : ''}">
      <button class="cli-cab" data-g="abrir" data-id="${Util.esc(g.id)}" aria-expanded="${abierto}">
        <span class="cli-ini">${Util.esc(Util.iniciales(g.nombre || '?'))}</span>
        <span class="cli-nom"><b>${Util.esc(g.nombre || 'Sin nombre')}</b><span>${g.nit ? 'NIT ' + Util.esc(g.nit) : 'Sin NIT'}</span></span>
        ${a ? this.chip(a.estado, a.texto) : ''}
        <span class="cli-flecha" aria-hidden="true">›</span>
      </button>
      ${abierto ? `<div class="cli-cuerpo">${this._datosHtml(g)}<section><h5>Vencimientos</h5>${CLIENTE_VENCIMIENTOS.map(v => this._vencHtml(g, v)).join('')}</section></div>` : ''}
    </div>`;
  },

  _valorHtml(g, c) {
    const v = g.datos[c.id] || '';
    if (!v) return '<span class="muted">—</span>';
    const copiar = `<button class="btn-icono btn-sm" data-g="copiar" data-id="${Util.esc(g.id)}" data-campo="${c.id}" title="Copiar" aria-label="Copiar ${Util.esc(c.label)}">📋</button>`;
    switch (c.tipo) {
      case 'clave': return `<span class="cli-clave">${Util.esc(v)}</span>${copiar}`;
      case 'correo': return `<a href="mailto:${Util.esc(v)}">${Util.esc(v)}</a>${copiar}`;
      case 'telefono': return `<a href="tel:${Util.esc(v.replace(/[^\d+]/g, ''))}">${Util.esc(v)}</a>${copiar}`;
      case 'codigo': return `<code class="cli-codigo">${Util.esc(v)}</code>`;
      default: return `<span>${Util.esc(v)}</span>`;
    }
  },

  _datosHtml(g) {
    const editando = this.editando?.id === g.id && this.editando.que === 'datos';
    const fila = (label, valor) => `<div class="cli-dato"><span>${Util.esc(label)}</span><span class="cli-valor">${valor}</span></div>`;
    if (editando) {
      const input = (name, label, valor, tipo = 'text') => `<label>${Util.esc(label)}<input name="${name}" type="${tipo}" value="${Util.esc(valor || '')}" ${name === 'nombre' ? 'required' : ''}></label>`;
      return `<form class="cli-form" data-g="form-datos" data-id="${Util.esc(g.id)}"><h5>${g._nuevo ? 'Nuevo cliente' : 'Editar datos'}</h5>
        ${input('nombre', 'Nombre o razón social', g.nombre)}${input('d_cedula', 'Cédula (empresa: la del representante legal)', g.datos.cedula)}${input('nit', 'NIT', g.nit)}
        ${CLIENTE_CAMPOS.filter(c => !c.fija).map(c => input('d_' + c.id, c.label, g.datos[c.id], c.tipo === 'correo' ? 'email' : 'text')).join('')}
        <div class="cli-acciones"><button class="btn btn-sm btn-primario" type="submit">Guardar</button><button class="btn btn-sm" type="button" data-g="cancelar">Cancelar</button>
          ${!g._nuevo && Permisos.esAdmin() ? `<span class="separador"></span><button class="btn btn-sm btn-peligro" type="button" data-g="eliminar" data-id="${Util.esc(g.id)}">Eliminar</button>` : ''}</div>
      </form>`;
    }
    const junto = new Map(CLIENTE_CAMPOS.filter(c => c.junto).map(c => [c.junto, c]));
    const secciones = CLIENTE_SECCIONES.map(s => {
      const campos = CLIENTE_CAMPOS.filter(c => c.seccion === s.id && !c.junto && !c.fija);
      const filas = campos.map(c => {
        const pre = junto.get(c.id);
        const valor = pre && g.datos[pre.id] ? this._valorHtml(g, pre) + ' ' + this._valorHtml(g, c) : this._valorHtml(g, c);
        return fila(c.label, valor);
      }).join('');
      const copiable = (campo, label, v) => v ? Util.esc(v) + ` <button class="btn-icono btn-sm" data-g="copiar" data-id="${Util.esc(g.id)}" data-campo="${campo}" title="Copiar" aria-label="Copiar ${label}">📋</button>` : '<span class="muted">—</span>';
      const fijos = s.id !== 'datos' ? '' : fila('Nombre', Util.esc(g.nombre))
        + fila(this.esEmpresa(g) ? 'Cédula rep. legal' : 'Cédula', copiable('cedula', 'cédula', g.datos.cedula))
        + fila('NIT', copiable('nit', 'NIT', g.nit));
      return `<h5>${Util.esc(s.titulo)}</h5>${fijos}${filas}`;
    }).join('');
    return `<section class="cli-datos">${secciones}<div class="cli-acciones"><button class="btn btn-sm" data-g="editar" data-id="${Util.esc(g.id)}" data-que="datos">✎ Editar datos</button>
      <button class="btn btn-sm" data-g="versiones" data-id="${Util.esc(g.id)}">🕘 Versiones (${g.historial.length})</button></div></section>`;
  },

  _vencHtml(g, v) {
    const val = g.vencimientos[v.id] || {};
    const editando = this.editando?.id === g.id && this.editando.que === v.id;
    const { estado, dias } = this.estadoVenc(val);
    if (editando) {
      return `<form class="cli-venc editando" data-g="form-venc" data-id="${Util.esc(g.id)}" data-venc="${v.id}">
        <div class="cli-venc-cab">${v.icono} ${Util.esc(v.label)}<span class="separador"></span><span class="muted mini">Editando</span></div>
        <div class="cli-venc-form">
          <label>Fecha de inicio<input type="date" name="inicio" value="${Util.esc(val.inicio || '')}"></label>
          <label>Fecha de vencimiento<input type="date" name="fin" value="${Util.esc(val.fin || '')}"></label>
          <div class="cli-acciones"><button class="btn btn-sm" type="button" data-g="cancelar">Cancelar</button><button class="btn btn-sm btn-primario" type="submit">Guardar</button></div>
        </div></form>`;
    }
    const texto = estado === 'sin' ? 'Sin fecha'
      : estado === 'vencido' ? `Venció hace ${-dias} día${dias === -1 ? '' : 's'}`
      : dias === 0 ? 'Vence hoy' : `Vence en ${dias} día${dias === 1 ? '' : 's'}`;
    const total = val.inicio && val.fin ? Util.diasEntre(val.inicio, val.fin) : 0;
    const pct = total > 0 ? Math.min(100, Math.max(0, Math.round(100 * Util.diasEntre(val.inicio, Util.hoyISO()) / total))) : null;
    return `<div class="cli-venc gv-${estado}">
      <div class="cli-venc-cab">${v.icono} ${Util.esc(v.label)}<span class="separador"></span>${this.chip(estado, texto)}
        <button class="btn btn-sm" data-g="editar" data-id="${Util.esc(g.id)}" data-que="${v.id}">✎ Editar</button></div>
      ${pct !== null ? `<div class="cli-venc-barra"><span style="width:${pct}%"></span></div>` : ''}
      <div class="cli-venc-fechas"><span>Inicio · ${val.inicio ? Util.fmtFecha(val.inicio) : '—'}</span><span>Vence · ${val.fin ? Util.fmtFecha(val.fin) : '—'}</span></div>
    </div>`;
  },

  // ── Eventos ───────────────────────────────────────────────────────
  _alClic(e) {
    const b = e.target.closest('[data-g]');
    if (!b || b.tagName === 'FORM' || b.tagName === 'INPUT') return;
    const g = this.cliente(b.dataset.id);
    switch (b.dataset.g) {
      case 'reintentar': this.cargada = false; this.error = null; this.pintar(); this.cargar(); break;
      case 'limpiar': Object.assign(this.filtro, { texto: '', lechera: '', venc: '', letra: '' }); this.pintar(); break;
      case 'letra': this.filtro.letra = b.dataset.l; this.pintar(); break;
      case 'nuevo': if (this.editando) this.cancelarEdicion(); this.nuevo(); break;
      case 'abrir':
        if (this.editando) this.cancelarEdicion();
        this.abiertoId = this.abiertoId === b.dataset.id ? null : b.dataset.id;
        this.pintar();
        break;
      case 'editar': if (this.editando) this.cancelarEdicion(); this.editando = { id: b.dataset.id, que: b.dataset.que }; this.pintar(); break;
      case 'cancelar': this.cancelarEdicion(); break;
      case 'eliminar': this.eliminar(b.dataset.id); break;
      case 'versiones': this.verVersiones(b.dataset.id); break;
      case 'copiar': if (g) this.copiar(b.dataset.campo === 'nit' ? g.nit : g.datos[b.dataset.campo] || ''); break;
    }
  },

  _alEscribir(e) {
    if (e.target.classList.contains('cli-buscar')) { this.filtro.texto = e.target.value; this.pintar(); }
  },

  _alCambiar(e) {
    const t = e.target;
    if (t.dataset.gf) { this.filtro[t.dataset.gf] = t.value; this.pintar(); return; }
    if (t.dataset.g === 'importar' && t.files[0]) { Clientes.importarArchivo(t.files[0]); t.value = ''; }
  },

  _alEnviar(e) {
    e.preventDefault();
    const form = e.target;
    const g = this.cliente(form.dataset.id);
    if (!g) return;
    const fd = new FormData(form);
    const copia = structuredClone({ ...g, _nuevo: undefined });
    delete copia._nuevo;
    if (form.dataset.g === 'form-datos') {
      copia.nombre = String(fd.get('nombre') || '').trim();
      copia.nit = String(fd.get('nit') || '').trim();
      if (!copia.nombre) { UI.toast('Escribe el nombre.', { tipo: 'error' }); return; }
      for (const c of CLIENTE_CAMPOS) copia.datos[c.id] = String(fd.get('d_' + c.id) || '').trim();
      if (g._nuevo) this.guardar(copia, 'Cliente creado');
      else this.confirmarYGuardar(g, copia, 'Datos guardados');
    } else if (form.dataset.g === 'form-venc') {
      const inicio = fd.get('inicio') || null, fin = fd.get('fin') || null;
      if (inicio && fin && fin < inicio) { UI.toast('La fecha de vencimiento no puede ser anterior a la de inicio.', { tipo: 'error' }); return; }
      copia.vencimientos[form.dataset.venc] = { inicio, fin };
      this.confirmarYGuardar(g, copia, 'Vencimiento guardado');
    }
  },

  // ── Importar Excel ────────────────────────────────────────────────
  // Convierte las filas de una hoja en clientes. Pura: no toca la página.
  filasAClientes(filas) {
    const norm = h => Util.normalizar(h).replace(/\s+/g, ' ');
    let filaCab = -1, cab = [];
    for (let i = 0; i < Math.min(8, filas.length); i++) {
      const c = (filas[i] || []).map(norm);
      if (c.includes('PRIMER NOMBRE') || c.some(h => /^(NOMBRE|RAZON SOCIAL)/.test(h))) { filaCab = i; cab = c; break; }
    }
    if (filaCab < 0) return [];
    const col = candidatos => {
      for (const c of candidatos) { const i = cab.indexOf(c); if (i >= 0) return i; }
      for (const c of candidatos) { const i = cab.findIndex(h => h.startsWith(c)); if (i >= 0) return i; }
      return -1;
    };
    // Cédula y NIT pueden venir en columnas separadas: la de cédula manda; si no hay, se usa la de NIT.
    const iCed = col(['CEDULA', 'CEDULA / NIT']);
    const iNit = iCed >= 0 ? iCed : col(['NIT']);
    const iNitEmpresa = cab.indexOf('NIT') !== iNit ? cab.indexOf('NIT') : -1;
    const iPrimer = col(['PRIMER NOMBRE', 'NOMBRE', 'RAZON SOCIAL']);
    // Nombre: PRIMER NOMBRE + SEGUNDO NOMBRE + PRIMER APELLIDO + SEGUNDO APELLIDO
    // (el segundo apellido puede venir en una columna sin encabezado junto al primero).
    const iAp1 = col(['PRIMER APELLIDO']);
    let iAp2 = col(['SEGUNDO APELLIDO']);
    if (iAp2 < 0 && iAp1 >= 0 && !cab[iAp1 + 1]) iAp2 = iAp1 + 1;
    const partesNombre = [iPrimer, col(['SEGUNDO NOMBRE']), iAp1, iAp2].filter(i => i >= 0);
    // Empresas: NIT de 9 dígitos que empieza por 8 o 9, o razón social reconocible.
    const esNitEmpresa = v => /^[89]\d{8}$/.test(v);
    const RAZON_SOCIAL = /\b(S\.?\s?A\.?\s?S|LTDA|INVERSIONES|SOCIEDAD)\b/i;
    const campos = CLIENTE_CAMPOS.map(c => ({ c, i: col(c.excel || []) })).filter(x => x.i >= 0);
    const vencs = CLIENTE_VENCIMIENTOS.map(v => ({ v, i: col(v.excel || []) })).filter(x => x.i >= 0);
    const texto = v => (v == null ? '' : String(v).replace(/\.0+$/, '').trim());

    const out = [];
    for (const f of filas.slice(filaCab + 1)) {
      if (!f) continue;
      const cedula = iNit >= 0 ? texto(f[iNit]).replace(/\s+/g, '') : '';
      const nitCol = iNitEmpresa >= 0 ? texto(f[iNitEmpresa]).replace(/\s+/g, '') : '';
      const nitEmpresa = esNitEmpresa(cedula) ? cedula : esNitEmpresa(nitCol) ? nitCol : '';
      const primer = iPrimer >= 0 ? texto(f[iPrimer]).replace(/\s+/g, ' ') : '';
      let nombre, nit, ced;
      if (primer && !/^\d+$/.test(primer) && (nitEmpresa || RAZON_SOCIAL.test(primer))) {
        // Empresa: la razón social y la cédula del representante legal (su nombre se ignora,
        // igual que lo que venga después de "SAS" en la misma celda, p. ej. "HATO SAMPUES SAS DOMINGO").
        nombre = primer.replace(/^(.*?\bS\.?\s?A\.?\s?S\b\.?).*$/i, '$1');
        nit = nitEmpresa || cedula;
        ced = [cedula, nitCol, ...partesNombre.map(i => texto(f[i]))].find(x => /^\d{5,}$/.test(x) && x !== nit) || '';
      } else {
        // Persona: los números sueltos en las columnas de nombre (cédulas de otra persona) no son parte del nombre.
        nombre = partesNombre.map(i => texto(f[i])).filter(p => p && !/^\d+$/.test(p)).join(' ').replace(/\s+/g, ' ');
        // Persona natural: su NIT es el mismo número de la cédula
        nit = cedula;
        ced = cedula;
      }
      if (!nombre) {
        // Fila con solo una cédula debajo de una empresa: es la del representante legal.
        const ant = out[out.length - 1];
        if (cedula && /^\d{5,}$/.test(cedula) && ant && /^[89]\d{8}$/.test(ant.nit) && !ant.datos.cedula) ant.datos.cedula = cedula;
        continue;
      }
      const datos = ced ? { cedula: ced } : {};
      for (const { c, i } of campos) {
        const v = f[i];
        if (v == null || String(v).trim() === '') continue;
        const val = texto(c.extraer ? c.extraer(v) : v);
        if (val) datos[c.id] = val;
      }
      const vencimientos = {};
      for (const { v, i } of vencs) {
        const fin = Util.parsearFecha(f[i]);
        if (fin) vencimientos[v.id] = { inicio: null, fin };
      }
      // Id estable: reimportar el mismo archivo no duplica clientes.
      const id = 'c-' + (nit ? 'nit-' + nit : 'nom-' + Util.normalizar(nombre).replace(/[^A-Z0-9]+/g, '-'));
      out.push({ id, nombre, nit, datos, vencimientos });
    }
    return [...new Map(out.map(g => [g.id, g])).values()];
  },

  async importarArchivo(archivo) {
    UI.abrirModal(`<header class="modal-cab"><h3>Importar clientes: ${Util.esc(archivo.name)}</h3></header>
      <p id="gimp-estado" class="muted">Leyendo archivo…</p>
      <div class="modal-pie"><span class="separador"></span><button class="btn" data-accion="cerrar-modal">Cerrar</button></div>`, { ancho: 520 });
    const estado = t => { const el = document.getElementById('gimp-estado'); if (el) el.textContent = t; };
    try {
      await Importador.cargarXLSX();
      const wb = XLSX.read(await archivo.arrayBuffer(), { type: 'array', cellDates: true });
      let lista = [];
      for (const nombre of wb.SheetNames) {
        lista = lista.concat(this.filasAClientes(XLSX.utils.sheet_to_json(wb.Sheets[nombre], { header: 1, defval: null, raw: true })));
      }
      if (!lista.length) { estado('No se encontraron clientes. La hoja debe tener una columna PRIMER NOMBRE o NOMBRE.'); return; }
      const existentes = new Set(this.lista.map(g => g.id));
      const nuevos = lista.filter(g => !existentes.has(g.id));
      estado(`Guardando ${nuevos.length} clientes nuevos…`);
      await Datos.importarClientes(nuevos);
      await this.cargar();
      estado(`Listo: ${lista.length} clientes en el archivo, ${nuevos.length} nuevos. Los que ya existían no se modificaron.`);
    } catch (e) {
      console.error(e);
      estado('❌ ' + e.message);
    }
  },
};

Vistas.clientes = {
  titulo: 'Clientes',
  icono: '🏢',
  orden: 6.5,
  visible: () => true,
  persistente: true,
  nodo: () => Clientes.raiz,
  render: () => '',
  montar: main => Clientes.montar(main),
};

</script>
<script>
/* ── js/vistas/chat.js ── */
// ═══════════════════════════════════════════════════════════════════
// VISTA: CHAT — canal general del equipo, grupos (los crea un
// administrador) y mensajes directos privados entre dos personas.
// Mensajes en tiempo real; contador de no leídos en el menú y aviso de
// escritorio. La privacidad la garantizan las políticas RLS de
// supabase/chat.sql: cada quien solo recibe lo que puede leer.
// La vista es persistente (como Notas) para no perder lo que se escribe.
// ═══════════════════════════════════════════════════════════════════

const CHAT_GENERAL_ID = '00000000-0000-0000-0000-000000000001';
const CHAT_COLORES = [
  { id: 'ambar', label: 'Ámbar' }, { id: 'violeta', label: 'Violeta' }, { id: 'azul', label: 'Azul' },
  { id: 'verde', label: 'Verde' }, { id: 'rosa', label: 'Rosa' }, { id: 'gris', label: 'Gris' },
];

const Chat = {
  raiz: null,
  convs: [],
  mensajes: new Map(),      // conversación → [mensajes]
  noLeidos: new Map(),      // conversación → cantidad
  ultimos: new Map(),       // conversación → último mensaje (para la lista)
  enLinea: new Set(),
  escribiendo: new Map(),   // conversación → Map(usuario → temporizador)
  actualId: CHAT_GENERAL_ID,
  editandoId: null,
  busqueda: '',
  iniciado: false,
  error: null,
  presencia: null,
  _ultimoAvisoEscribir: 0,

  // ── Ciclo de vida ─────────────────────────────────────────────────
  async iniciar() {
    if (this.iniciado) return;
    this.iniciado = true;
    try {
      await this.cargarConversaciones();
      Datos.chatSuscribir((tipo, evento, nuevo, anterior) => this._alCambiar(tipo, evento, nuevo, anterior));
      this.presencia = Datos.chatPresencia({
        alEstado: ids => { this.enLinea = new Set(ids); this.pintarLista(); this.pintarCabecera(); },
        alEscribir: p => this._alguienEscribe(p),
      });
    } catch (e) {
      console.warn('[Chat]', e);
      this.error = e;
    }
    this.pintar();
  },

  reiniciar() {
    Datos.chatDetener?.();
    this.raiz?.remove();
    Object.assign(this, { raiz: null, convs: [], mensajes: new Map(), noLeidos: new Map(), ultimos: new Map(), enLinea: new Set(), escribiendo: new Map(), actualId: CHAT_GENERAL_ID, editandoId: null, busqueda: '', iniciado: false, error: null, presencia: null });
  },

  montar(main) {
    if (!this.raiz) this._crearRaiz();
    main.appendChild(this.raiz);
    if (!this.iniciado) this.iniciar(); else this.pintar();
    this._abrir(this.actualId, { enfocar: false });
  },

  // Solo cuenta como "viendo" si la ventana está al frente: si está detrás de otra aplicación, avisa.
  visible() { return App.estado.vista === 'chat' && !document.hidden && document.hasFocus(); },

  async cargarConversaciones() {
    this.convs = await Datos.chatConversaciones();
    // El canal general existe siempre aunque la persona aún no sea "integrante"
    if (!this.convs.some(c => c.id === CHAT_GENERAL_ID)) this.convs.unshift({ id: CHAT_GENERAL_ID, tipo: 'general', nombre: 'Equipo', miembros: [], leido_hasta: null, updated_at: new Date(0).toISOString() });
    await Promise.all(this.convs.map(async c => {
      try {
        const [n, ultimo] = await Promise.all([Datos.chatNoLeidos(c.id, c.leido_hasta), Datos.chatMensajes(c.id, 1)]);
        this.noLeidos.set(c.id, n);
        if (ultimo[0]) this.ultimos.set(c.id, ultimo[0]);
      } catch { /* sin contador */ }
    }));
    this.error = null;
    this._insignia();
  },

  // ── Datos derivados ───────────────────────────────────────────────
  conv(id) { return this.convs.find(c => c.id === id); },
  yo() { return Permisos.uid; },
  persona(id) { return App.colaborador(id) || { id, nombre: 'Alguien' }; },
  nombreCorto(id) { return id === this.yo() ? 'Tú' : this.persona(id).nombre.split(' ')[0]; },
  otro(c) { return c.miembros.find(u => u !== this.yo()); },

  titulo(c) {
    if (!c) return '';
    if (c.tipo === 'general') return 'Equipo';
    if (c.tipo === 'grupo') return c.nombre || 'Grupo';
    return this.persona(this.otro(c)).nombre;
  },

  directoCon(uid) { return this.convs.find(c => c.tipo === 'directo' && c.miembros.includes(uid) && c.miembros.includes(this.yo())); },

  totalNoLeidos() { let n = 0; for (const v of this.noLeidos.values()) n += v; return n; },

  integrantes(c) {
    if (!c) return [];
    if (c.tipo === 'general') return App.estado.colaboradores.map(x => x.id);
    return c.miembros;
  },

  _insignia() { if (App.estado.perfil) App._pintarNav(); },

  // ── Cambios en tiempo real ────────────────────────────────────────
  async _alCambiar(tipo, evento, nuevo, anterior) {
    if (tipo === 'recargar') {      // modo demo: otra pestaña cambió los datos
      await this.cargarConversaciones();
      for (const id of [...this.mensajes.keys()]) this.mensajes.set(id, await Datos.chatMensajes(id));
      if (this.visible()) this._marcarLeido(this.actualId);
      this.pintar();
      return;
    }
    if (tipo === 'mensaje') return this._alMensaje(evento, nuevo, anterior);
    if (tipo === 'conversacion') {
      const c = this.conv(nuevo?.id || anterior?.id);
      if (evento === 'UPDATE' && c) {
        // Cada mensaje nuevo toca updated_at: basta con actualizar la fila, sin recargar todo
        Object.assign(c, { nombre: nuevo.nombre, color: nuevo.color, updated_at: nuevo.updated_at });
        this.pintarLista(); this.pintarCabecera();
        return;
      }
      if (evento === 'DELETE' && c) {
        this.convs = this.convs.filter(x => x !== c);
        this.mensajes.delete(c.id); this.noLeidos.delete(c.id); this._insignia();
        if (this.actualId === c.id) this._abrir(CHAT_GENERAL_ID, { enfocar: false }); else this.pintarLista();
        return;
      }
    } else if (tipo === 'miembro') {
      const fila = evento === 'DELETE' ? anterior : nuevo;
      const c = this.conv(fila?.conversacion_id);
      if (evento === 'UPDATE') {   // alguien marcó como leído: no cambia nada en pantalla
        if (c && fila.usuario_id === this.yo()) c.leido_hasta = fila.leido_hasta;
        return;
      }
      if (c && fila?.usuario_id && fila.usuario_id !== this.yo()) {
        // Entró o salió otra persona de una conversación que ya veo
        c.miembros = evento === 'DELETE' ? c.miembros.filter(u => u !== fila.usuario_id) : [...new Set([...c.miembros, fila.usuario_id])];
        this.pintarCabecera();
        return;
      }
    }
    // Conversación nueva o cambio en mis accesos: se recarga la lista una sola vez
    this._recargarPronto();
  },

  _recargarPronto() {
    clearTimeout(this._recarga);
    this._recarga = setTimeout(async () => {
      try { await this.cargarConversaciones(); } catch { return; }
      if (!this.conv(this.actualId)) { this._abrir(CHAT_GENERAL_ID, { enfocar: false }); return; }
      if (this.visible()) this._marcarLeido(this.actualId);
      this.pintarLista(); this.pintarCabecera();
    }, 400);
  },

  async _alMensaje(evento, m, anterior) {
    if (evento === 'DELETE') {
      for (const [id, lista] of this.mensajes) this.mensajes.set(id, lista.filter(x => x.id !== anterior?.id));
      this.pintarMensajes();
      return;
    }
    if (!m?.conversacion_id) return;
    if (!this.conv(m.conversacion_id)) { try { await this.cargarConversaciones(); } catch { return; } }
    const c = this.conv(m.conversacion_id);
    if (!c) return;
    const lista = this.mensajes.get(c.id);
    if (evento === 'UPDATE') {
      if (lista) { const i = lista.findIndex(x => x.id === m.id); if (i >= 0) lista[i] = m; }
      this.pintarMensajes();
      return;
    }
    // INSERT
    if (lista && !lista.some(x => x.id === m.id)) lista.push(m);
    this.ultimos.set(c.id, m);
    c.updated_at = m.created_at;
    this._dejarDeEscribir(c.id, m.autor_id);
    if (m.autor_id !== this.yo()) {
      if (c.id === this.actualId && this.visible()) {
        this._marcarLeido(c.id);
      } else {
        this.noLeidos.set(c.id, (this.noLeidos.get(c.id) || 0) + 1);
        this._insignia();
        const donde = c.tipo === 'directo' ? '' : ` en # ${this.titulo(c)}`;
        Avisos.mostrar(`💬 ${this.persona(m.autor_id).nombre}${donde}`, this.textoPlano(m.texto).slice(0, 180), {
          tag: 'chat-' + c.id, alClic: () => { App.ir('chat'); this._abrir(c.id); },
        });
      }
    }
    this.pintarLista();
    if (c.id === this.actualId) this.pintarMensajes({ alFinal: m.autor_id === this.yo() });
  },

  _alguienEscribe({ conv, uid }) {
    if (!uid || uid === this.yo() || !this.conv(conv)) return;
    if (!this.escribiendo.has(conv)) this.escribiendo.set(conv, new Map());
    const mapa = this.escribiendo.get(conv);
    clearTimeout(mapa.get(uid));
    mapa.set(uid, setTimeout(() => this._dejarDeEscribir(conv, uid), 4000));
    this.pintarEscribiendo(); this.pintarLista();
  },

  _dejarDeEscribir(conv, uid) {
    const mapa = this.escribiendo.get(conv);
    if (!mapa?.has(uid)) return;
    clearTimeout(mapa.get(uid)); mapa.delete(uid);
    this.pintarEscribiendo(); this.pintarLista();
  },

  // ── Acciones ──────────────────────────────────────────────────────
  async _abrir(id, { enfocar = true } = {}) {
    if (!this.conv(id)) id = CHAT_GENERAL_ID;
    const cambio = id !== this.actualId;
    this.actualId = id; this.editandoId = null;
    if (cambio || !this.mensajes.has(id)) this.pintar();
    if (!this.mensajes.has(id)) {
      try { this.mensajes.set(id, await Datos.chatMensajes(id)); }
      catch (e) { UI.toast(e.message, { tipo: 'error' }); this.mensajes.set(id, []); }
      if (this.actualId !== id) return;
    }
    const ultimo = this.mensajes.get(id).at(-1);
    if (ultimo && !(this.ultimos.get(id)?.created_at > ultimo.created_at)) this.ultimos.set(id, ultimo);
    this.pintarMensajes({ alFinal: true });
    if (this.visible()) this._marcarLeido(id);
    if (enfocar && matchMedia('(min-width: 761px)').matches) this.raiz?.querySelector('.chat-texto')?.focus();
  },

  _marcarLeido(id) {
    const c = this.conv(id);
    if (!c) return;
    if (this.noLeidos.get(id)) { this.noLeidos.set(id, 0); this._insignia(); this.pintarLista(); }
    const ultimo = this.ultimos.get(id)?.created_at;
    if (c.leido_hasta && (!ultimo || ultimo <= c.leido_hasta)) return;   // ya está al día
    // Se agrupan las escrituras: varios mensajes seguidos = una sola actualización
    this._leidoPendiente ??= new Map();
    clearTimeout(this._leidoPendiente.get(id));
    this._leidoPendiente.set(id, setTimeout(async () => {
      this._leidoPendiente.delete(id);
      // Nunca antes del último mensaje, aunque el reloj del equipo esté atrasado
      const ahora = new Date().toISOString();
      const hasta = ultimo && ultimo > ahora ? ultimo : ahora;
      try { c.leido_hasta = await Datos.chatMarcarLeido(id, hasta); } catch (e) { console.warn('[Chat] leído', e); }
    }, c.leido_hasta ? 1500 : 0));
  },

  async _abrirDirecto(uid) {
    let c = this.directoCon(uid);
    if (!c) {
      try { c = await Datos.chatCrearConversacion({ tipo: 'directo', miembros: [uid] }); this.convs.push(c); }
      catch (e) { UI.toast(e.message, { tipo: 'error' }); return; }
    }
    this.raiz.classList.add('con-conv');
    this._abrir(c.id);
  },

  async enviar() {
    const caja = this.raiz.querySelector('.chat-texto');
    const texto = caja.value.trim();
    if (!texto) return;
    if (texto.length > 4000) { UI.toast('El mensaje es muy largo (máximo 4000 caracteres).', { tipo: 'error' }); return; }
    const convId = this.actualId;
    caja.value = ''; this._autoAltura(caja); this._ocultarSugerencias();
    const temporal = { id: 'tmp-' + Util.uid(), conversacion_id: convId, autor_id: this.yo(), texto, created_at: new Date().toISOString(), editado_at: null, enviando: true };
    const lista = this.mensajes.get(convId) || [];
    lista.push(temporal); this.mensajes.set(convId, lista);
    this.pintarMensajes({ alFinal: true });
    try {
      const m = await Datos.chatEnviar(convId, texto);
      const i = lista.indexOf(temporal);
      if (lista.some(x => x.id === m.id)) lista.splice(i, 1); else lista[i] = m;   // el tiempo real pudo llegar antes
      const c = this.conv(convId); if (c) c.updated_at = m.created_at;
      this.ultimos.set(convId, m);
      this.pintarMensajes({ alFinal: true }); this.pintarLista();
    } catch (e) {
      lista.splice(lista.indexOf(temporal), 1);
      if (!caja.value) { caja.value = texto; this._autoAltura(caja); }
      this.pintarMensajes();
      UI.toast(e.message, { tipo: 'error' });
    }
  },

  async guardarEdicion(id) {
    const caja = this.raiz.querySelector(`.chat-editar[data-id="${CSS.escape(id)}"]`);
    const texto = caja?.value.trim();
    if (!texto) return;
    try {
      const m = await Datos.chatEditar(id, texto);
      const lista = this.mensajes.get(m.conversacion_id) || [];
      const i = lista.findIndex(x => x.id === id); if (i >= 0) lista[i] = m;
      this.editandoId = null; this.pintarMensajes();
    } catch (e) { UI.toast(e.message, { tipo: 'error' }); }
  },

  async borrar(id) {
    if (!confirm('¿Borrar este mensaje? Nadie podrá volver a verlo.')) return;
    try {
      await Datos.chatBorrarMensaje(id);
      for (const [k, lista] of this.mensajes) this.mensajes.set(k, lista.filter(x => x.id !== id));
      this.pintarMensajes();
    } catch (e) { UI.toast(e.message, { tipo: 'error' }); }
  },

  // ── Grupos (solo administradores) ────────────────────────────────
  abrirGrupo(c = null) {
    if (!Permisos.esAdmin()) return;
    const sel = new Set(c ? c.miembros.filter(u => u !== this.yo()) : []);
    const color = c?.color || 'ambar';
    const otros = App.estado.colaboradores.filter(x => x.id !== this.yo());
    UI.abrirModal(`<form class="chat-grupo-form" novalidate>
        <header class="modal-cab"><h3>${c ? 'Editar grupo' : 'Nuevo grupo'}</h3><button type="button" class="btn-icono btn-sm" data-accion="cerrar-modal" aria-label="Cerrar">✕</button></header>
        <p class="muted mini">Solo los integrantes pueden leer los mensajes del grupo.</p>
        <label class="chat-campo">Nombre del grupo<input name="nombre" maxlength="60" required value="${Util.esc(c?.nombre || '')}" placeholder="Ej. Tributario"></label>
        <div class="chat-campo">Color<div class="chat-colores" role="radiogroup" aria-label="Color del grupo">
          ${CHAT_COLORES.map(x => `<label class="chat-color cc-${x.id}" title="${x.label}"><input type="radio" name="color" value="${x.id}" ${x.id === color ? 'checked' : ''} aria-label="${x.label}"></label>`).join('')}
        </div></div>
        <fieldset class="chat-campo chat-personas"><legend>Integrantes</legend>
          ${otros.map(p => `<label class="chat-persona"><input type="checkbox" name="miembro" value="${Util.esc(p.id)}" ${sel.has(p.id) ? 'checked' : ''}>${UI.avatar(p, 30)}<span>${Util.esc(p.nombre)}</span></label>`).join('') || '<p class="muted mini">No hay más personas en el equipo.</p>'}
        </fieldset>
        <div class="modal-pie">
          ${c ? '<button type="button" class="btn btn-peligro" data-chat-borrar>Borrar grupo</button>' : ''}
          <span class="separador"></span>
          <button type="button" class="btn" data-accion="cerrar-modal">Cancelar</button>
          <button type="submit" class="btn btn-primario">${c ? 'Guardar' : 'Crear grupo'}</button>
        </div>
      </form>`, { ancho: 480 });
    const form = document.querySelector('.chat-grupo-form');
    form.querySelector('[name="nombre"]').focus();
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const nombre = form.nombre.value.trim();
      if (!nombre) { form.nombre.focus(); UI.toast('Escribe el nombre del grupo.', { tipo: 'error' }); return; }
      const miembros = [...form.querySelectorAll('[name="miembro"]:checked')].map(x => x.value);
      const datos = { nombre, color: form.querySelector('[name="color"]:checked')?.value || 'ambar' };
      try {
        if (c) {
          await Datos.chatEditarGrupo(c.id, { ...datos, miembros: [this.yo(), ...miembros] }, c.miembros);
          UI.toast('Grupo actualizado', { tipo: 'ok' });
        } else {
          const nuevo = await Datos.chatCrearConversacion({ tipo: 'grupo', ...datos, miembros });
          this.convs.push(nuevo); this.actualId = nuevo.id;
          UI.toast('Grupo creado', { tipo: 'ok' });
        }
        UI.cerrarModal();
        await this.cargarConversaciones();
        this._abrir(this.actualId);
      } catch (err) { UI.toast(err.message, { tipo: 'error' }); }
    });
    form.querySelector('[data-chat-borrar]')?.addEventListener('click', async () => {
      if (!confirm(`¿Borrar el grupo "${c.nombre}" y todos sus mensajes?`)) return;
      try {
        await Datos.chatBorrarConversacion(c.id);
        this.convs = this.convs.filter(x => x.id !== c.id); this.mensajes.delete(c.id); this.noLeidos.delete(c.id);
        UI.cerrarModal(); this._abrir(CHAT_GENERAL_ID);
      } catch (err) { UI.toast(err.message, { tipo: 'error' }); }
    });
  },

  // ── Formato de los mensajes ───────────────────────────────────────
  textoPlano(texto) { return String(texto).replace(/\[\[tarea:([\w-]+)\]\]/g, (_, id) => '📋 ' + (App.tarea(id)?.titulo || 'tarea')); },

  formatear(texto) {
    const primeros = new Map(App.estado.colaboradores.map(p => [Util.normalizar(p.nombre.split(' ')[0]), p]));
    let html = Util.esc(texto);
    html = html.replace(/\[\[tarea:([\w-]+)\]\]/g, (_, id) => {
      const t = App.tarea(id);
      if (!t) return '<span class="chat-tarea no">📋 Tarea no disponible</span>';
      const est = ESTADOS.find(e => e.id === t.estado)?.label || '';
      return `<button class="chat-tarea" data-c="tarea" data-id="${Util.esc(t.id)}" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10M9 12h10M9 19h10M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/></svg>
        <span><strong>${Util.esc(t.titulo)}</strong><small>${[t.empresa, t.fecha_vencimiento ? 'vence ' + Util.fmtFecha(t.fecha_vencimiento) : '', est].filter(Boolean).map(Util.esc).join(' · ')}</small></span><em>Abrir →</em></button>`;
    });
    html = html.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, (_, a, url) => `${a}<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
    html = html.replace(/(^|[\s(])@([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)/g, (todo, a, nombre) => {
      const p = primeros.get(Util.normalizar(nombre));
      return p ? `${a}<span class="chat-mencion ${p.id === this.yo() ? 'a-mi' : ''}">@${Util.esc(nombre)}</span>` : todo;
    });
    return html.replace(/\n/g, '<br>');
  },

  hora(ts) { return new Date(ts).toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' }); },

  dia(ts) {
    const d = Util.fechaDeTimestamp(ts), hoy = Util.hoyISO();
    if (d === hoy) return 'Hoy';
    if (d === Util.sumarDias(hoy, -1)) return 'Ayer';
    return new Date(ts).toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
  },

  // ── Interfaz ──────────────────────────────────────────────────────
  _svg(d, t = 18) { return `<svg viewBox="0 0 24 24" width="${t}" height="${t}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`; },

  _crearRaiz() {
    const r = document.createElement('div');
    r.className = 'chat';
    r.addEventListener('click', e => this._alClic(e));
    r.addEventListener('input', e => this._alEscribir(e));
    r.addEventListener('keydown', e => this._alTecla(e));
    this.raiz = r;
    if (!this._oyenteVisible) {
      this._oyenteVisible = () => { if (this.visible()) this._marcarLeido(this.actualId); };
      document.addEventListener('visibilitychange', this._oyenteVisible);
      addEventListener('focus', this._oyenteVisible);
    }
  },

  pintar() {
    if (!this.raiz) return;
    const enfocado = document.activeElement;
    const borrador = this.raiz.querySelector('.chat-texto')?.value || '';
    const conBorrador = enfocado?.classList?.contains('chat-texto');
    this.raiz.innerHTML = `
      <aside class="panel-vidrio chat-lista" aria-label="Conversaciones"></aside>
      <section class="panel-vidrio chat-conv" aria-label="Conversación">
        ${this.error ? this._errorHtml() : `
        <header class="chat-cab"></header>
        <div class="chat-mensajes" aria-live="polite"></div>
        <div class="chat-escribiendo" aria-live="polite"></div>
        <form class="chat-redactar" novalidate>
          <div class="chat-sugerencias" hidden></div>
          <button type="button" class="btn-icono" data-c="mencionar" aria-label="Mencionar a alguien" title="Mencionar (@)">@</button>
          <button type="button" class="btn-icono" data-c="tareas" aria-label="Referenciar una tarea" title="Referenciar una tarea">${this._svg('M9 5h10M9 12h10M9 19h10M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2')}</button>
          <textarea class="chat-texto" rows="1" maxlength="4000" aria-label="Mensaje" placeholder="Escribe un mensaje…" title="Enter envía · Shift + Enter nueva línea"></textarea>
          <button type="submit" class="btn btn-primario chat-enviar" aria-label="Enviar">${this._svg('M4 12 20 4l-6 16-3-7z')}</button>
        </form>`}
      </section>`;
    this.raiz.querySelector('.chat-redactar')?.addEventListener('submit', e => { e.preventDefault(); this.enviar(); });
    this.pintarLista(); this.pintarCabecera(); this.pintarMensajes({ alFinal: true }); this.pintarEscribiendo();
    const caja = this.raiz.querySelector('.chat-texto');
    if (caja && borrador) { caja.value = borrador; this._autoAltura(caja); }
    if (caja && conBorrador) caja.focus();
  },

  _errorHtml() {
    const falta = this.error?.faltaEsquema;
    return `<div class="vacio chat-vacio"><h3>${falta ? 'Falta activar el chat en Supabase' : 'No se pudo cargar el chat'}</h3>
      <p>${falta ? 'El administrador debe ejecutar una sola vez el archivo <code>supabase/chat.sql</code> en el SQL Editor de Supabase.' : Util.esc(this.error?.message || '')}</p>
      <button class="btn" data-c="reintentar">Reintentar</button></div>`;
  },

  _avatarConv(c) {
    if (c.tipo === 'general') return '<span class="chat-av chat-av-general">#</span>';
    if (c.tipo === 'grupo') return `<span class="chat-av chat-av-grupo cc-${Util.esc(c.color || 'ambar')}">${Util.esc((c.nombre || 'G')[0].toUpperCase())}</span>`;
    const p = this.persona(this.otro(c));
    return `<span class="chat-av-persona">${UI.avatar(p, 40)}${this.enLinea.has(p.id) ? '<span class="chat-en-linea" title="En línea"></span>' : ''}</span>`;
  },

  _filaConv(c, extra = {}) {
    const lista = this.mensajes.get(c?.id) || [];
    const ultimo = lista.filter(x => !x.enviando).pop() || this.ultimos.get(c?.id);
    const n = c ? this.noLeidos.get(c.id) || 0 : 0;
    const escribe = c && this.escribiendo.get(c.id)?.size;
    const resumen = escribe ? '<em class="chat-escribe-mini">escribiendo…</em>'
      : ultimo ? Util.esc((ultimo.autor_id === this.yo() ? 'Tú: ' : c.tipo === 'directo' ? '' : this.nombreCorto(ultimo.autor_id) + ': ') + this.textoPlano(ultimo.texto))
      : Util.esc(extra.vacio || '');
    const hora = c && c.updated_at > '1971' ? (Util.fechaDeTimestamp(c.updated_at) === Util.hoyISO() ? this.hora(c.updated_at) : this.dia(c.updated_at).replace(/^(\w+),.*/, '$1')) : '';
    return `<button class="chat-item ${c && c.id === this.actualId ? 'on' : ''}" ${c ? `data-c="abrir" data-id="${Util.esc(c.id)}"` : `data-c="directo" data-uid="${Util.esc(extra.uid)}"`}>
      ${extra.avatar || this._avatarConv(c)}
      <span class="chat-item-txt"><span class="chat-item-fila"><strong>${Util.esc(extra.nombre || this.titulo(c))}</strong><small>${hora}</small></span>
        <span class="chat-item-fila"><span class="chat-item-res">${resumen}</span>${n ? `<span class="nav-badge">${n > 99 ? '99+' : n}</span>` : ''}</span></span>
    </button>`;
  },

  pintarLista() {
    const el = this.raiz?.querySelector('.chat-lista');
    if (!el) return;
    const q = Util.normalizar(this.busqueda);
    const ok = txt => !q || Util.normalizar(txt).includes(q);
    const general = this.conv(CHAT_GENERAL_ID);
    const grupos = this.convs.filter(c => c.tipo === 'grupo' && ok(c.nombre)).sort((a, b) => b.updated_at.localeCompare(a.updated_at));
    const personas = App.estado.colaboradores.filter(p => p.id !== this.yo() && ok(p.nombre))
      .map(p => ({ p, c: this.directoCon(p.id) }))
      .sort((a, b) => (b.c?.updated_at || '').localeCompare(a.c?.updated_at || '') || a.p.nombre.localeCompare(b.p.nombre, 'es'));
    const enfocado = document.activeElement?.classList?.contains('chat-buscar');
    el.innerHTML = `
      <label class="notas-busqueda">${this._svg('M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4', 15)}<input type="search" class="chat-buscar" placeholder="Buscar conversación" aria-label="Buscar conversación" value="${Util.esc(this.busqueda)}"></label>
      <div class="chat-secciones">
        ${general && ok('Equipo general') ? `<div class="chat-seccion">Canal general</div>${this._filaConv(general)}` : ''}
        ${grupos.length || Permisos.esAdmin() ? `<div class="chat-seccion"><span>Grupos</span>${Permisos.esAdmin() ? '<button class="btn btn-sm" data-c="nuevo-grupo" title="Crear grupo">＋ Grupo</button>' : ''}</div>` : ''}
        ${grupos.map(c => this._filaConv(c)).join('') || (Permisos.esAdmin() && !q ? '<p class="muted mini chat-ayuda">Crea grupos para hablar con varias personas a la vez.</p>' : '')}
        <div class="chat-seccion">Mensajes directos</div>
        ${personas.map(({ p, c }) => c ? this._filaConv(c) : this._filaConv(null, { uid: p.id, nombre: p.nombre, vacio: 'Escríbele un mensaje', avatar: `<span class="chat-av-persona">${UI.avatar(p, 40)}${this.enLinea.has(p.id) ? '<span class="chat-en-linea" title="En línea"></span>' : ''}</span>` })).join('') || '<p class="muted mini chat-ayuda">No hay más personas en el equipo.</p>'}
      </div>`;
    if (enfocado) { const b = el.querySelector('.chat-buscar'); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
  },

  pintarCabecera() {
    const el = this.raiz?.querySelector('.chat-cab');
    const c = this.conv(this.actualId);
    if (!el || !c) return;
    const ids = this.integrantes(c);
    const enLinea = ids.filter(u => this.enLinea.has(u)).length;
    const sub = c.tipo === 'directo' ? (this.enLinea.has(this.otro(c)) ? '<span class="chat-verde">En línea</span>' : 'Conversación privada')
      : `${c.tipo === 'general' ? 'Canal general' : 'Grupo'} · ${ids.length} integrante${ids.length === 1 ? '' : 's'}${enLinea ? ` · <span class="chat-verde">${enLinea} en línea</span>` : ''}`;
    el.innerHTML = `
      <button class="btn-icono chat-volver" data-c="volver" aria-label="Volver a las conversaciones">‹</button>
      ${this._avatarConv(c)}
      <div class="chat-cab-txt"><h2>${Util.esc(this.titulo(c))}</h2><small>${sub}</small></div>
      <span class="chat-cab-gente">${ids.slice(0, 5).map(u => UI.avatar(this.persona(u), 28)).join('')}</span>
      ${c.tipo === 'grupo' && Permisos.esAdmin() ? '<button class="btn btn-sm" data-c="editar-grupo">Gestionar</button>' : ''}`;
  },

  pintarMensajes({ alFinal = false } = {}) {
    const el = this.raiz?.querySelector('.chat-mensajes');
    if (!el) return;
    const cerca = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
    const lista = this.mensajes.get(this.actualId);
    if (!lista) { el.innerHTML = '<p class="muted pad centrado">Cargando mensajes…</p>'; return; }
    if (!lista.length) {
      const c = this.conv(this.actualId);
      el.innerHTML = `<div class="vacio chat-vacio">${this._svg('M4 5h16v11H8l-4 4z', 40)}<h3>${c?.tipo === 'directo' ? 'Aún no hay mensajes' : 'Empieza la conversación'}</h3><p>${c?.tipo === 'directo' ? 'Lo que escriban aquí solo lo ven ustedes dos.' : 'Escribe el primer mensaje.'}</p></div>`;
      return;
    }
    let html = '', diaPrevio = '', previo = null;
    for (const m of lista) {
      const dia = Util.fechaDeTimestamp(m.created_at);
      if (dia !== diaPrevio) { html += `<div class="chat-dia"><span>${this.dia(m.created_at)}</span></div>`; diaPrevio = dia; previo = null; }
      const propio = m.autor_id === this.yo();
      const seguido = previo && previo.autor_id === m.autor_id && (new Date(m.created_at) - new Date(previo.created_at)) < 5 * 60000;
      const editando = this.editandoId === m.id;
      html += `<div class="chat-msj ${propio ? 'propio' : ''} ${seguido ? 'seguido' : ''} ${m.enviando ? 'enviando' : ''}" data-id="${Util.esc(m.id)}">
        ${propio ? '' : `<span class="chat-msj-av">${seguido ? '' : UI.avatar(this.persona(m.autor_id), 34)}</span>`}
        <div class="chat-msj-cuerpo">
          ${seguido ? '' : `<div class="chat-msj-cab"><strong>${Util.esc(propio ? 'Tú' : this.persona(m.autor_id).nombre)}</strong> · ${this.hora(m.created_at)}${m.editado_at ? ' · <em>editado</em>' : ''}</div>`}
          ${editando ? `<div class="chat-burbuja chat-burbuja-edit"><textarea class="chat-editar" data-id="${Util.esc(m.id)}" maxlength="4000" aria-label="Editar mensaje">${Util.esc(m.texto)}</textarea>
              <div class="chat-edit-pie"><small class="muted">Enter guarda · Esc cancela</small><button class="btn btn-sm" data-c="cancelar-edicion">Cancelar</button><button class="btn btn-sm btn-primario" data-c="guardar-edicion" data-id="${Util.esc(m.id)}">Guardar</button></div></div>`
            : `<div class="chat-burbuja">${this.formatear(m.texto)}${seguido && m.editado_at ? ' <em class="chat-editado">(editado)</em>' : ''}</div>`}
          ${propio && !editando && !m.enviando ? `<span class="chat-acciones"><button class="btn btn-sm" data-c="editar" data-id="${Util.esc(m.id)}">Editar</button><button class="btn btn-sm btn-peligro" data-c="borrar" data-id="${Util.esc(m.id)}">Borrar</button></span>` : ''}
        </div>
      </div>`;
      previo = m;
    }
    el.innerHTML = html;
    if (alFinal || cerca) el.scrollTop = el.scrollHeight;
    if (this.editandoId) { const t = el.querySelector('.chat-editar'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); this._autoAltura(t); } }
  },

  pintarEscribiendo() {
    const el = this.raiz?.querySelector('.chat-escribiendo');
    if (!el) return;
    const quienes = [...(this.escribiendo.get(this.actualId)?.keys() || [])].map(u => this.nombreCorto(u));
    el.innerHTML = quienes.length ? `<span class="chat-puntos"><i></i><i></i><i></i></span>${Util.esc(quienes.join(', '))} ${quienes.length > 1 ? 'están' : 'está'} escribiendo…` : '';
  },

  // ── Sugerencias: @menciones y tareas ──────────────────────────────
  _sugerir(items, alElegir) {
    const el = this.raiz.querySelector('.chat-sugerencias');
    if (!items.length) { this._ocultarSugerencias(); return; }
    this._elegir = alElegir; this._items = items;
    el.innerHTML = items.map((x, i) => `<button type="button" class="chat-sug ${i === 0 ? 'on' : ''}" data-c="sugerencia" data-i="${i}">${x.html}</button>`).join('');
    el.hidden = false;
  },

  _ocultarSugerencias() { const el = this.raiz?.querySelector('.chat-sugerencias'); if (el) { el.hidden = true; el.innerHTML = ''; } this._items = null; },

  _insertar(caja, inicio, fin, texto) {
    caja.setRangeText(texto, inicio, fin, 'end');
    caja.focus(); this._autoAltura(caja); this._ocultarSugerencias();
  },

  _revisarMencion(caja) {
    const antes = caja.value.slice(0, caja.selectionStart);
    const m = antes.match(/(^|\s)@([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]*)$/);
    if (!m) { if (this._items?.[0]?.tipo === 'persona') this._ocultarSugerencias(); return; }
    const q = Util.normalizar(m[2]);
    const gente = this.integrantes(this.conv(this.actualId)).filter(u => u !== this.yo()).map(u => this.persona(u))
      .filter(p => Util.normalizar(p.nombre).startsWith(q) || Util.normalizar(p.nombre).includes(' ' + q)).slice(0, 6);
    const inicio = caja.selectionStart - m[2].length - 1;
    this._sugerir(gente.map(p => ({ tipo: 'persona', html: `${UI.avatar(p, 24)}<span>${Util.esc(p.nombre)}</span>`, p })),
      it => this._insertar(caja, inicio, caja.selectionStart, '@' + it.p.nombre.split(' ')[0] + ' '));
  },

  _mostrarTareas(caja, filtro = '') {
    const q = Util.normalizar(filtro);
    const tareas = App.estado.tareas.filter(t => t.estado !== 'completada' && (!q || Util.normalizar(t.titulo + ' ' + (t.empresa || '')).includes(q)))
      .sort((a, b) => (a.fecha_vencimiento || '9').localeCompare(b.fecha_vencimiento || '9')).slice(0, 7);
    const pos = caja.selectionStart;
    this._sugerir(tareas.map(t => ({ tipo: 'tarea', html: `${this._svg('M9 5h10M9 12h10M9 19h10M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2', 16)}<span><strong>${Util.esc(t.titulo)}</strong><small>${Util.esc([t.empresa, t.fecha_vencimiento ? Util.fmtFecha(t.fecha_vencimiento) : ''].filter(Boolean).join(' · '))}</small></span>`, t })),
      it => this._insertar(caja, pos, pos, (pos && !/\s$/.test(caja.value.slice(0, pos)) ? ' ' : '') + `[[tarea:${it.t.id}]] `));
    if (!tareas.length) UI.toast('No hay tareas abiertas para referenciar.');
  },

  _autoAltura(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; },

  // ── Eventos ───────────────────────────────────────────────────────
  _alClic(e) {
    const b = e.target.closest('[data-c]');
    if (!b) { if (!e.target.closest('.chat-redactar')) this._ocultarSugerencias(); return; }
    e.preventDefault();
    const caja = this.raiz.querySelector('.chat-texto');
    switch (b.dataset.c) {
      case 'abrir': this.raiz.classList.add('con-conv'); this._abrir(b.dataset.id); break;
      case 'directo': this._abrirDirecto(b.dataset.uid); break;
      case 'volver': this.raiz.classList.remove('con-conv'); break;
      case 'nuevo-grupo': this.abrirGrupo(); break;
      case 'editar-grupo': this.abrirGrupo(this.conv(this.actualId)); break;
      case 'reintentar': this.iniciado = false; this.error = null; this.iniciar(); break;
      case 'tarea': if (App.tarea(b.dataset.id)) TareaModal.abrir(b.dataset.id); break;
      case 'editar': this.editandoId = b.dataset.id; this.pintarMensajes(); break;
      case 'cancelar-edicion': this.editandoId = null; this.pintarMensajes(); break;
      case 'guardar-edicion': this.guardarEdicion(b.dataset.id); break;
      case 'borrar': this.borrar(b.dataset.id); break;
      case 'mencionar': {
        const pos = caja.selectionStart;
        this._insertar(caja, pos, pos, (pos && !/\s$/.test(caja.value.slice(0, pos)) ? ' ' : '') + '@');
        this._revisarMencion(caja);
        break;
      }
      case 'tareas': this._mostrarTareas(caja); break;
      case 'sugerencia': { const it = this._items?.[+b.dataset.i]; if (it) this._elegir(it); break; }
    }
  },

  _alEscribir(e) {
    const t = e.target;
    if (t.classList.contains('chat-buscar')) { this.busqueda = t.value; this.pintarLista(); return; }
    if (t.classList.contains('chat-editar')) { this._autoAltura(t); return; }
    if (!t.classList.contains('chat-texto')) return;
    this._autoAltura(t);
    this._revisarMencion(t);
    if (Date.now() - this._ultimoAvisoEscribir > 2500 && t.value.trim()) {
      this._ultimoAvisoEscribir = Date.now();
      try { this.presencia?.escribiendo(this.actualId); } catch { /* sin presencia */ }
    }
  },

  _alTecla(e) {
    const t = e.target;
    if (t.classList.contains('chat-editar')) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.guardarEdicion(t.dataset.id); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.editandoId = null; this.pintarMensajes(); }
      return;
    }
    if (!t.classList.contains('chat-texto')) return;
    const sug = this.raiz.querySelector('.chat-sugerencias');
    if (this._items && !sug.hidden) {
      const botones = [...sug.querySelectorAll('.chat-sug')];
      const i = botones.findIndex(x => x.classList.contains('on'));
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const j = (i + (e.key === 'ArrowDown' ? 1 : -1) + botones.length) % botones.length;
        botones.forEach((x, k) => x.classList.toggle('on', k === j));
        return;
      }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); this._elegir(this._items[Math.max(0, i)]); return; }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this._ocultarSugerencias(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); this.enviar(); }
  },
};

Vistas.chat = {
  titulo: 'Chat',
  icono: '💬',
  orden: 7.5,
  visible: () => true,
  persistente: true,
  nodo: () => Chat.raiz,
  insignia: () => Chat.totalNoLeidos(),
  render: () => '',
  montar: main => Chat.montar(main),
};

</script>
<script>
/* ── js/tarea-modal.js ── */
// ═══════════════════════════════════════════════════════════════════
// VENTANA DE TAREA — crear, editar, lista de verificación y seguimiento
// ═══════════════════════════════════════════════════════════════════

const TareaModal = {
  id: null,          // null = tarea nueva
  original: null,
  checklist: [],

  abrirNueva(pre = {}) {
    if (!Permisos.crearTarea()) return;
    const limpio = Object.fromEntries(Object.entries(pre).filter(([, v]) => v !== undefined));
    const asignado = 'asignado_a' in limpio ? (limpio.asignado_a || null) : Permisos.uid;
    this._abrir(null, {
      titulo: '', descripcion: '', empresa: '', categoria: 'Otro', prioridad: 'media', estado: 'pendiente',
      fecha_inicio: null, fecha_vencimiento: null, progreso: 0, checklist: [], ...limpio,
      asignado_a: asignado && (asignado === Permisos.uid || Permisos.asignarAOtros()) ? asignado : Permisos.uid,
    });
  },

  abrir(id) {
    const t = App.tarea(id);
    if (t) this._abrir(id, structuredClone(t));
  },

  _abrir(id, t) {
    this.id = id;
    this.original = t;
    this.checklist = structuredClone(t.checklist || []);
    const editable = !id || Permisos.editarTarea(t);
    const dis = editable ? '' : 'disabled';
    const opcionesColab = App.estado.colaboradores
      .filter(c => Permisos.asignarAOtros() || c.id === Permisos.uid || c.id === t.asignado_a)
      .map(c => `<option value="${c.id}" ${c.id === t.asignado_a ? 'selected' : ''}>${Util.esc(c.nombre)}</option>`).join('');
    const creador = id && t.creado_por ? App.colaborador(t.creado_por)?.nombre : null;

    UI.abrirModal(`
      <form id="form-tarea" class="form-tarea" novalidate>
        <header class="modal-cab">
          <input name="titulo" class="input-titulo" placeholder="Nombre de la tarea" value="${Util.esc(t.titulo)}" maxlength="300" required ${dis} ${!id ? 'autofocus' : ''} aria-label="Título">
          <button type="button" class="btn-icono" data-accion="cerrar-modal" aria-label="Cerrar">✕</button>
        </header>
        ${id ? `<p class="muted mini meta-tarea">${UI.estado(t)} ${creador ? `· Creada por ${Util.esc(creador)}` : ''} ${t.created_at ? '· ' + Util.fmtFechaHora(t.created_at) : ''}
          ${t.completada_at ? '· Completada ' + Util.fmtFechaHora(t.completada_at) : ''}
          ${Metricas.tiempoEjecucion(t) !== null ? `· ${t.estado === 'completada' ? 'Tiempo de ejecución' : (t.pausada_at ? 'En pausa · lleva' : 'En curso desde ' + Util.fmtFechaHora(t.iniciada_at) + ', lleva')} ${UI.cronometro(t, { boton: true })}` : ''}</p>` : ''}
        <div class="tarea-grid ${id ? '' : 'sin-seguimiento'}">
          <div class="tarea-principal">
            <div class="campos">
              <label>Colaborador
                <select name="asignado_a" ${dis} ${Permisos.asignarAOtros() ? '' : 'title="Solo un administrador puede asignar a otros"'}>
                  ${Permisos.asignarAOtros() ? `<option value="" ${!t.asignado_a ? 'selected' : ''}>Sin asignar</option>` : ''}${opcionesColab}
                </select></label>
              <label>Estado
                <select name="estado" ${dis}>${ESTADOS.map(e => `<option value="${e.id}" ${t.estado === e.id ? 'selected' : ''}>${e.icon} ${e.label}</option>`).join('')}</select></label>
              <label>Prioridad
                <select name="prioridad" ${dis}>${PRIORIDADES.map(p => `<option value="${p.id}" ${t.prioridad === p.id ? 'selected' : ''}>${p.icon} ${p.label}</option>`).join('')}</select></label>
              <label>Categoría
                <input name="categoria" list="lista-categorias" value="${Util.esc(t.categoria || '')}" ${dis} maxlength="60">
                <datalist id="lista-categorias">${App.categorias().map(c => `<option value="${Util.esc(c)}">`).join('')}</datalist></label>
              <label>Fecha de inicio<input type="date" name="fecha_inicio" value="${t.fecha_inicio || ''}" ${dis}></label>
              <label>Fecha límite<input type="date" name="fecha_vencimiento" value="${t.fecha_vencimiento || ''}" ${dis}></label>
              <label class="campo-ancho">Empresa / cliente
                <input name="empresa" list="lista-empresas" value="${Util.esc(t.empresa || '')}" ${dis} maxlength="200" placeholder="Opcional">
                <datalist id="lista-empresas">${[...new Set(App.estado.tareas.map(x => x.empresa).filter(Boolean))].sort().slice(0, 300).map(e => `<option value="${Util.esc(e)}">`).join('')}</datalist></label>
            </div>
            <label class="campo-ancho">Descripción
              <textarea name="descripcion" rows="3" ${dis} placeholder="Detalles, instrucciones, enlaces…">${Util.esc(t.descripcion || '')}</textarea></label>

            <div class="bloque">
              <div class="bloque-cab"><strong>Lista de verificación</strong><span class="muted mini" id="check-resumen"></span></div>
              <ul class="checklist" id="checklist"></ul>
              ${editable ? `<div class="check-nuevo"><input id="check-input" placeholder="＋ Agregar paso y presionar Enter" maxlength="200" aria-label="Nuevo paso"><button type="button" class="btn btn-sm" data-accion="check-agregar">Agregar</button></div>` : ''}
            </div>
            <div class="bloque" id="bloque-progreso">
              <label>Progreso manual: <strong id="progreso-valor">${t.progreso || 0}%</strong>
                <input type="range" name="progreso" min="0" max="100" step="10" value="${t.progreso || 0}" ${dis}></label>
            </div>
          </div>
          ${id ? `<aside class="tarea-seguimiento">
            <strong>Seguimiento</strong>
            <ol class="timeline" id="timeline"><li class="muted">Cargando…</li></ol>
            <div class="comentar">
              <textarea id="comentario" rows="2" placeholder="Escribe una actualización o comentario…" maxlength="2000" aria-label="Comentario"></textarea>
              <button type="button" class="btn btn-sm btn-primario" data-accion="comentar">Comentar</button>
            </div>
          </aside>` : ''}
        </div>
        <footer class="modal-pie">
          ${id && Permisos.eliminarTarea(t) ? '<button type="button" class="btn btn-peligro" data-accion="eliminar-tarea">🗑 Eliminar</button>' : ''}
          <span class="separador"></span>
          <button type="button" class="btn" data-accion="cerrar-modal">${editable ? 'Cancelar' : 'Cerrar'}</button>
          ${editable ? `<button type="submit" class="btn btn-primario" id="btn-guardar">${id ? 'Guardar cambios' : 'Crear tarea'}</button>` : ''}
        </footer>
      </form>`, { ancho: id ? 900 : 640 });

    this._editable = editable;
    this._pintarChecklist();
    const form = document.getElementById('form-tarea');
    form.addEventListener('submit', e => { e.preventDefault(); this.guardar(); });
    form.progreso?.addEventListener('input', e => { document.getElementById('progreso-valor').textContent = e.target.value + '%'; });
    document.getElementById('check-input')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); this.acciones['check-agregar'](); }
    });
    form.addEventListener('change', e => {
      if (e.target.dataset.check) {
        const item = this.checklist.find(i => i.id === e.target.dataset.check);
        if (item) { item.hecho = e.target.checked; this._pintarChecklist(); }
      }
    });
    if (id) this._cargarSeguimiento();
  },

  _pintarChecklist() {
    const ul = document.getElementById('checklist');
    if (!ul) return;
    const dis = this._editable ? '' : 'disabled';
    ul.innerHTML = this.checklist.map(i => `<li class="${i.hecho ? 'hecho' : ''}">
        <label><input type="checkbox" data-check="${i.id}" ${i.hecho ? 'checked' : ''} ${dis}> <span>${Util.esc(i.texto)}</span></label>
        ${this._editable ? `<button type="button" class="btn-icono btn-sm" data-accion="check-quitar" data-item="${i.id}" aria-label="Quitar paso">✕</button>` : ''}
      </li>`).join('') || '<li class="muted mini">Sin pasos. Divide la tarea en pasos para medir el avance automáticamente.</li>';
    const hechos = this.checklist.filter(i => i.hecho).length;
    document.getElementById('check-resumen').textContent = this.checklist.length ? `${hechos}/${this.checklist.length} · ${Util.pct(hechos, this.checklist.length)}%` : '';
    // Con pasos, el progreso se calcula solo; sin pasos se ajusta a mano.
    document.getElementById('bloque-progreso').hidden = this.checklist.length > 0;
  },

  async _cargarSeguimiento() {
    const ol = document.getElementById('timeline');
    const id = this.id;
    try {
      const items = await Datos.actividad(id);
      if (this.id !== id || !document.getElementById('timeline')) return;
      ol.innerHTML = items.length ? items.map(a => `<li class="tl-tipo-${a.tipo}">
          <div class="tl-cab"><strong>${Util.esc(a.autor_nombre || 'Sistema')}</strong><span class="muted mini">${Util.fmtFechaHora(a.created_at)}</span></div>
          <div class="${a.tipo === 'comentario' ? 'tl-comentario' : 'muted mini'}">${Util.esc(a.texto)}</div>
        </li>`).join('') : '<li class="muted mini">Aún no hay actividad.</li>';
      ol.scrollTop = ol.scrollHeight;
    } catch (e) {
      ol.innerHTML = `<li class="muted mini">${Util.esc(e.message)}</li>`;
    }
  },

  _leerFormulario() {
    const f = document.getElementById('form-tarea');
    const v = n => (f[n]?.value ?? '').trim();
    const datos = {
      titulo: v('titulo'),
      descripcion: v('descripcion') || null,
      asignado_a: v('asignado_a') || null,
      estado: v('estado'),
      prioridad: v('prioridad'),
      categoria: v('categoria') || 'Otro',
      empresa: v('empresa') || null,
      fecha_inicio: v('fecha_inicio') || null,
      fecha_vencimiento: v('fecha_vencimiento') || null,
      checklist: this.checklist,
    };
    if (!this.checklist.length) datos.progreso = Number(v('progreso')) || 0;
    return datos;
  },

  async guardar() {
    const datos = this._leerFormulario();
    if (!datos.titulo) { UI.toast('Escribe el nombre de la tarea.', { tipo: 'error' }); document.querySelector('#form-tarea [name=titulo]').focus(); return; }
    if (datos.fecha_inicio && datos.fecha_vencimiento && datos.fecha_inicio > datos.fecha_vencimiento) {
      UI.toast('La fecha de inicio no puede ser posterior a la fecha límite.', { tipo: 'error' }); return;
    }
    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;
    try {
      if (!this.id) {
        await App.crear(datos);
      } else {
        // Solo se envían los campos que cambiaron
        const cambios = {};
        const norm = x => JSON.stringify(x === '' || x === undefined ? null : x);
        for (const [k, val] of Object.entries(datos)) {
          if (norm(val) !== norm(this.original[k])) cambios[k] = val;
        }
        if (Object.keys(cambios).length) await App.actualizar(this.id, cambios, { mensaje: 'Tarea guardada', deshacible: false });
      }
      UI.cerrarModal();
    } catch (e) {
      if (!this.id) UI.toast(e.message, { tipo: 'error' });
      if (btn.isConnected) btn.disabled = false;
    }
  },

  acciones: {
    'check-agregar': () => {
      const input = document.getElementById('check-input');
      const texto = input?.value.trim();
      if (!texto) return;
      TareaModal.checklist.push({ id: Util.uid(), texto, hecho: false });
      input.value = '';
      TareaModal._pintarChecklist();
      input.focus();
    },
    'check-quitar': el => {
      TareaModal.checklist = TareaModal.checklist.filter(i => i.id !== el.dataset.item);
      TareaModal._pintarChecklist();
    },
    'eliminar-tarea': async () => {
      if (await App.eliminar(TareaModal.id)) UI.cerrarModal();
    },
    comentar: async el => {
      const ta = document.getElementById('comentario');
      const texto = ta.value.trim();
      if (!texto) return;
      el.disabled = true;
      try {
        await Datos.registrarActividad(TareaModal.id, 'comentario', texto);
        ta.value = '';
        await TareaModal._cargarSeguimiento();
      } catch (e) { UI.toast(e.message, { tipo: 'error' }); }
      el.disabled = false;
    },
  },
};
