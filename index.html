/* ── js/datos.js ── */
// ═══════════════════════════════════════════════════════════════════
// CAPA DE DATOS
//
// Dos implementaciones con la misma interfaz:
//   · SupabaseStore — producción (tablas: tareas, tarea_actividad, perfiles)
//   · LocalStore    — modo demo, guarda en el navegador
// El resto de la app solo usa `Datos`, nunca Supabase directamente.
//
// Interfaz:
//   iniciar() · login(email, pass) · sesion() · logout() · recuperar(email)
//   colaboradores() · tareas() · crearTarea(t) · actualizarTarea(id, cambios)
//   eliminarTarea(id) · actividad(tareaId) · registrarActividad(tareaId, tipo, texto)
//   importarTareas(lista) · suscribir(cb)
// ═══════════════════════════════════════════════════════════════════

class ErrorDatos extends Error {
  constructor(mensaje, { codigo, original, faltaEsquema = false } = {}) {
    super(mensaje);
    this.codigo = codigo;
    this.original = original;
    this.faltaEsquema = faltaEsquema;
  }
}

// Filtro por fechas de la barra de filtros: qué fecha de la tarea se compara con el rango elegido.
// Las fechas con hora se pasan al día local (Colombia), no al de UTC.
const FILTRO_DIA_SEGUN = [['todas', 'Todas las fechas'], ['completada', 'Completadas'], ['creada', 'Creadas'], ['modificada', 'Modificadas'], ['vence', 'Que vencen']];
// Atajos del rango: [id, etiqueta, (hoy) => [desde, hasta]]
const FILTRO_RANGOS = [
  ['hoy', 'Hoy', h => [h, h]],
  ['ayer', 'Ayer', h => [Util.sumarDias(h, -1), Util.sumarDias(h, -1)]],
  ['semana', 'Esta semana', h => [Util.inicioSemana(h), Util.sumarDias(Util.inicioSemana(h), 6)]],
  ['semana_anterior', 'Semana pasada', h => [Util.sumarDias(Util.inicioSemana(h), -7), Util.sumarDias(Util.inicioSemana(h), -1)]],
  ['mes', 'Este mes', h => { const r = Metricas.rangoPeriodo('mes', h); return [r.desde, r.hasta]; }],
  ['mes_anterior', 'Mes pasado', h => { const r = Metricas.rangoPeriodo('mes_anterior', h); return [r.desde, r.hasta]; }],
];
// Rango efectivo: con solo "Desde" es ese día; con solo "Hasta", todo hasta ese día.
function rangoFiltroDia(f) {
  let desde = f.dia || null, hasta = f.diaHasta || f.dia || null;
  if (desde && hasta && desde > hasta) [desde, hasta] = [hasta, desde];
  return desde || hasta ? { desde, hasta } : null;
}
const FILTRO_DIA_FECHA = {
  // Sin condición: la tarea entra si vence, se creó o se completó dentro del rango
  todas: t => [t.fecha_vencimiento, Util.fechaDeTimestamp(t.created_at), Util.fechaDeTimestamp(t.completada_at)],
  completada: t => Util.fechaDeTimestamp(t.completada_at),
  creada: t => Util.fechaDeTimestamp(t.created_at),
  modificada: t => Util.fechaDeTimestamp(t.updated_at),
  vence: t => t.fecha_vencimiento,
};

const CAMPOS_TAREA = ['titulo', 'descripcion', 'asignado_a', 'asignado_nombre', 'empresa', 'categoria', 'prioridad', 'estado',
  'fecha_inicio', 'fecha_vencimiento', 'progreso', 'checklist', 'etiquetas', 'completada_at', 'iniciada_at', 'pausada_at', 'pausa_seg', 'origen_ref'];

// Momento en que una tarea empieza a contar tiempo de ejecución, según el cambio de estado
// (lo mismo hace el trigger de supabase/cronometro.sql). undefined = no cambia.
//   pendiente → en progreso / en revisión: empieza ahora
//   pendiente → completada directo:         sin tiempo medido
//   → pendiente:                            se detiene y se borra
//   completada → reabierta:                 conserva el inicio original (si no había, empieza ahora)
function iniciadaAlCambiar(antes, despues, iniciadaAntes) {
  if (despues === antes) return undefined;
  if (despues === 'pendiente') return null;
  if (antes && antes !== 'pendiente' && iniciadaAntes) return undefined;
  return despues === 'completada' ? null : new Date().toISOString();
}

function normalizarTarea(t) {
  return {
    ...t,
    titulo: t.titulo || '(sin título)',
    estado: t.estado || 'pendiente',
    prioridad: t.prioridad || 'media',
    progreso: Number(t.progreso) || 0,
    pausa_seg: Number(t.pausa_seg) || 0,
    checklist: Array.isArray(t.checklist) ? t.checklist : [],
    etiquetas: Array.isArray(t.etiquetas) ? t.etiquetas : [],
  };
}

// Solo columnas conocidas; evita mandar campos internos a la base de datos.
function limpiarParaGuardar(obj) {
  const out = {};
  for (const k of CAMPOS_TAREA) if (k in obj) out[k] = obj[k] === '' ? null : obj[k];
  return out;
}

// ─────────────────────────────────────────────────────────────────────
// SUPABASE
// ─────────────────────────────────────────────────────────────────────
class SupabaseStore {
  constructor() { this.sb = null; this.canal = null; this.usuario = null; this.perfil = null; }

  get modo() { return 'supabase'; }

  async iniciar() {
    if (!window.supabase?.createClient) throw new ErrorDatos('No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.');
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth: { autoRefreshToken: true, persistSession: true },
    });
  }

  _error(error, accion) {
    const msg = error?.message || String(error);
    const faltaEsquema = error?.code === '42P01' || error?.code === 'PGRST205' || /does not exist|could not find the table/i.test(msg);
    if (faltaEsquema) return new ErrorDatos('Falta crear las tablas del planner en Supabase (ejecuta supabase/schema.sql).', { codigo: error.code, original: error, faltaEsquema });
    if (error?.code === 'PGRST116' || error?.code === '42501' || /row-level security|permission denied/i.test(msg)) {
      return new ErrorDatos('No tienes permiso para ' + accion + '.', { codigo: error.code, original: error });
    }
    return new ErrorDatos('Error al ' + accion + ': ' + msg, { codigo: error?.code, original: error });
  }

  async _cargarPerfil(user) {
    const { data } = await this.sb.from(CONFIG.TABLAS.perfiles).select('*').eq('id', user.id).maybeSingle();
    this.usuario = user;
    this.perfil = {
      id: user.id,
      nombre: data?.nombre || user.email.split('@')[0],
      correo: data?.correo || user.email,
      rol: (data?.rol || 'colaborador').toLowerCase(),
    };
    return this.perfil;
  }

  async login(email, pass) {
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw new ErrorDatos(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message);
    return this._cargarPerfil(data.user);
  }

  async sesion() {
    const { data } = await this.sb.auth.getSession();
    return data?.session?.user ? this._cargarPerfil(data.session.user) : null;
  }

  async logout() {
    if (this.canal) { this.sb.removeChannel(this.canal); this.canal = null; }
    await this.sb.auth.signOut();
    this.usuario = this.perfil = null;
  }

  async recuperar(email) {
    const { error } = await this.sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
    if (error) throw new ErrorDatos('No se pudo enviar el enlace: ' + error.message);
  }

  async colaboradores() {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.perfiles).select('*').order('nombre');
    if (error) throw this._error(error, 'leer los colaboradores');
    return (data || [])
      .filter(p => p.activo !== false)
      .map(p => ({ id: p.id, nombre: p.nombre || p.correo || 'Sin nombre', correo: p.correo || '', rol: (p.rol || 'colaborador').toLowerCase() }));
  }

  async tareas() {
    // PostgREST devuelve como máximo 1000 filas por consulta: se pagina.
    const todas = [];
    const PAGINA = 1000;
    for (let desde = 0; ; desde += PAGINA) {
      const { data, error } = await this.sb.from(CONFIG.TABLAS.tareas).select('*')
        .order('fecha_vencimiento', { ascending: true, nullsFirst: false })
        .order('id')
        .range(desde, desde + PAGINA - 1);
      if (error) throw this._error(error, 'leer las tareas');
      todas.push(...data);
      if (data.length < PAGINA) break;
    }
    // Pausa del cronómetro: disponible si ya se ejecutó supabase/pausa.sql
    if (todas.length) this.conPausa = 'pausada_at' in todas[0];
    return todas.map(normalizarTarea);
  }

  // Si aún no se ejecutó supabase/cronometro.sql, la columna iniciada_at no existe:
  // se deja de enviar y la app sigue funcionando sin cronómetro.
  _limpiar(obj) {
    const out = limpiarParaGuardar(obj);
    if (this.sinCronometro) delete out.iniciada_at;
    if (this.conPausa === false) { delete out.pausada_at; delete out.pausa_seg; }
    return out;
  }

  async _reintentarSinCronometro(fn) {
    const r = await fn();
    if (r.error?.code === 'PGRST204' && /iniciada_at/.test(r.error.message) && !this.sinCronometro) {
      console.warn('[cronómetro] Falta la columna iniciada_at: ejecuta supabase/cronometro.sql');
      this.sinCronometro = true;
      return fn();
    }
    if (r.error?.code === 'PGRST204' && /pausada_at|pausa_seg/.test(r.error.message) && this.conPausa !== false) {
      console.warn('[cronómetro] Faltan las columnas de pausa: ejecuta supabase/pausa.sql');
      this.conPausa = false;
      return fn();
    }
    return r;
  }

  async crearTarea(t) {
    const { data, error } = await this._reintentarSinCronometro(() =>
      this.sb.from(CONFIG.TABLAS.tareas).insert({ ...this._limpiar(t), creado_por: this.usuario?.id }).select().single());
    if (error) throw this._error(error, 'crear la tarea');
    return normalizarTarea(data);
  }

  async actualizarTarea(id, cambios) {
    const { data, error } = await this._reintentarSinCronometro(() =>
      this.sb.from(CONFIG.TABLAS.tareas).update(this._limpiar(cambios)).eq('id', id).select().single());
    if (error) throw this._error(error, 'modificar esta tarea');
    return normalizarTarea(data);
  }

  async eliminarTarea(id) {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.tareas).delete().eq('id', id).select('id');
    if (error) throw this._error(error, 'eliminar esta tarea');
    if (!data?.length) throw new ErrorDatos('No tienes permiso para eliminar esta tarea.');
  }

  async actividad(tareaId) {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.actividad).select('*').eq('tarea_id', tareaId).order('created_at');
    if (error) throw this._error(error, 'leer el seguimiento');
    return data || [];
  }

  async registrarActividad(tareaId, tipo, texto) {
    const fila = { tarea_id: tareaId, tipo, texto, autor_id: this.usuario?.id, autor_nombre: this.perfil?.nombre };
    const { data, error } = await this.sb.from(CONFIG.TABLAS.actividad).insert(fila).select().single();
    if (error) throw this._error(error, 'guardar el seguimiento');
    return data;
  }

  // ── Notas personales (RLS: cada usuario solo ve y escribe las suyas) ──
  async notas() {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.notas).select('*').order('updated_at', { ascending: false });
    if (error) throw this._error(error, 'leer tus notas');
    return data || [];
  }

  async guardarNota(n) {
    const fila = { id: n.id, titulo: n.titulo, contenido: n.contenido, color: n.color, fijada: n.fijada, favorita: n.favorita, archivada: n.archivada, eliminada_at: n.eliminada_at, updated_at: n.updated_at };
    const { error } = await this.sb.from(CONFIG.TABLAS.notas).upsert(fila);
    if (error) throw this._error(error, 'guardar la nota');
  }

  async borrarNota(id) {
    const { error } = await this.sb.from(CONFIG.TABLAS.notas).delete().eq('id', id);
    if (error) throw this._error(error, 'borrar la nota');
  }

  // ── Chat del equipo (RLS: general para todos; grupos y directos solo para sus integrantes) ──
  async chatConversaciones() {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.chatConv).select('*, chat_miembros(usuario_id, leido_hasta)').order('updated_at', { ascending: false });
    if (error) throw this._error(error, 'leer el chat');
    return (data || []).map(c => {
      const miembros = c.chat_miembros || [];
      const { chat_miembros, ...resto } = c;
      return { ...resto, miembros: miembros.map(m => m.usuario_id), leido_hasta: miembros.find(m => m.usuario_id === this.usuario?.id)?.leido_hasta || null };
    });
  }

  async chatMensajes(convId, limite = 200) {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.chatMsj).select('*').eq('conversacion_id', convId).order('created_at', { ascending: false }).limit(limite);
    if (error) throw this._error(error, 'leer los mensajes');
    return (data || []).reverse();
  }

  async chatNoLeidos(convId, desde) {
    let q = this.sb.from(CONFIG.TABLAS.chatMsj).select('id', { count: 'exact', head: true }).eq('conversacion_id', convId).neq('autor_id', this.usuario?.id);
    if (desde) q = q.gt('created_at', desde);
    const { count, error } = await q;
    if (error) throw this._error(error, 'contar mensajes');
    return count || 0;
  }

  async chatEnviar(convId, texto) {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.chatMsj).insert({ conversacion_id: convId, texto }).select().single();
    if (error) throw this._error(error, 'enviar el mensaje');
    return data;
  }

  async chatEditar(id, texto) {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.chatMsj).update({ texto, editado_at: new Date().toISOString() }).eq('id', id).select().single();
    if (error) throw this._error(error, 'editar el mensaje');
    return data;
  }

  async chatBorrarMensaje(id) {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.chatMsj).delete().eq('id', id).select('id');
    if (error) throw this._error(error, 'borrar el mensaje');
    if (!data?.length) throw new ErrorDatos('No tienes permiso para borrar este mensaje.');
  }

  async chatMarcarLeido(convId, hasta) {
    const ahora = hasta || new Date().toISOString();
    const { data, error } = await this.sb.from(CONFIG.TABLAS.chatMiem).update({ leido_hasta: ahora }).eq('conversacion_id', convId).eq('usuario_id', this.usuario?.id).select('conversacion_id');
    if (error) throw this._error(error, 'marcar como leído');
    if (!data?.length) {
      // Primera vez en el canal general: la persona se suma como integrante
      const r = await this.sb.from(CONFIG.TABLAS.chatMiem).insert({ conversacion_id: convId, usuario_id: this.usuario?.id, leido_hasta: ahora });
      if (r.error && r.error.code !== '23505') throw this._error(r.error, 'marcar como leído');
    }
    return ahora;
  }

  async chatCrearConversacion({ tipo, nombre = '', color = 'violeta', miembros = [] }) {
    const { data: c, error } = await this.sb.from(CONFIG.TABLAS.chatConv).insert({ tipo, nombre, color, creado_por: this.usuario?.id }).select().single();
    if (error) throw this._error(error, tipo === 'grupo' ? 'crear el grupo' : 'abrir la conversación');
    const ids = [...new Set([this.usuario?.id, ...miembros])];
    const r = await this.sb.from(CONFIG.TABLAS.chatMiem).insert(ids.map(u => ({ conversacion_id: c.id, usuario_id: u })));
    if (r.error) {
      await this.sb.from(CONFIG.TABLAS.chatConv).delete().eq('id', c.id);
      throw this._error(r.error, 'agregar los integrantes');
    }
    return { ...c, miembros: ids, leido_hasta: null };
  }

  async chatEditarGrupo(id, { nombre, color, miembros }, antes = []) {
    const { error } = await this.sb.from(CONFIG.TABLAS.chatConv).update({ nombre, color }).eq('id', id);
    if (error) throw this._error(error, 'editar el grupo');
    const nuevos = miembros.filter(u => !antes.includes(u));
    const quitar = antes.filter(u => !miembros.includes(u));
    if (nuevos.length) {
      const r = await this.sb.from(CONFIG.TABLAS.chatMiem).insert(nuevos.map(u => ({ conversacion_id: id, usuario_id: u })));
      if (r.error) throw this._error(r.error, 'agregar integrantes');
    }
    if (quitar.length) {
      const r = await this.sb.from(CONFIG.TABLAS.chatMiem).delete().eq('conversacion_id', id).in('usuario_id', quitar);
      if (r.error) throw this._error(r.error, 'quitar integrantes');
    }
  }

  async chatBorrarConversacion(id) {
    const { error } = await this.sb.from(CONFIG.TABLAS.chatConv).delete().eq('id', id);
    if (error) throw this._error(error, 'borrar el grupo');
  }

  // cb(tipo: 'mensaje' | 'conversacion' | 'miembro', evento, nuevo, anterior)
  chatSuscribir(cb) {
    this.chatDetener();
    const t = CONFIG.TABLAS;
    this.canalChat = this.sb.channel('chat-rt')
      .on('postgres_changes', { event: '*', schema: 'public', table: t.chatMsj }, p => cb('mensaje', p.eventType, p.new, p.old))
      .on('postgres_changes', { event: '*', schema: 'public', table: t.chatConv }, p => cb('conversacion', p.eventType, p.new, p.old))
      .on('postgres_changes', { event: '*', schema: 'public', table: t.chatMiem }, p => cb('miembro', p.eventType, p.new, p.old))
      .subscribe();
  }

  // Quién está en línea y quién está escribiendo (no se guarda en la base de datos)
  chatPresencia({ alEstado, alEscribir }) {
    const uid = this.usuario?.id;
    const ch = this.sb.channel('chat-presencia', { config: { presence: { key: uid } } });
    ch.on('presence', { event: 'sync' }, () => alEstado(Object.keys(ch.presenceState())))
      .on('broadcast', { event: 'escribiendo' }, ({ payload }) => alEscribir(payload))
      .subscribe(async estado => { if (estado === 'SUBSCRIBED') await ch.track({ desde: new Date().toISOString() }); });
    this.canalPresencia = ch;
    return { escribiendo: conv => ch.send({ type: 'broadcast', event: 'escribiendo', payload: { conv, uid } }) };
  }

  chatDetener() {
    if (this.canalChat) { this.sb.removeChannel(this.canalChat); this.canalChat = null; }
    if (this.canalPresencia) { this.sb.removeChannel(this.canalPresencia); this.canalPresencia = null; }
  }

  // ── Clientes (todos los usuarios ven y editan; solo administradores borran) ──
  async clientes() {
    const todos = [];
    const PAGINA = 1000;
    for (let desde = 0; ; desde += PAGINA) {
      const { data, error } = await this.sb.from(CONFIG.TABLAS.clientes).select('*').order('nombre').order('id').range(desde, desde + PAGINA - 1);
      if (error) throw this._error(error, 'leer los clientes');
      todos.push(...(data || []));
      if (!data || data.length < PAGINA) return todos;
    }
  }

  async guardarCliente(g) {
    // El historial de versiones lo arma el trigger de supabase/clientes.sql; aquí no se envía.
    const fila = { id: g.id, nombre: g.nombre, nit: g.nit || null, datos: g.datos, vencimientos: g.vencimientos };
    const { data, error } = await this.sb.from(CONFIG.TABLAS.clientes).upsert(fila).select().single();
    if (error) throw this._error(error, 'guardar el cliente');
    return data;
  }

  async borrarCliente(id) {
    const { data, error } = await this.sb.from(CONFIG.TABLAS.clientes).delete().eq('id', id).select('id');
    if (error) throw this._error(error, 'eliminar el cliente');
    if (!data?.length) throw new ErrorDatos('Solo un administrador puede eliminar clientes.');
  }

  async importarClientes(lista) {
    for (let i = 0; i < lista.length; i += 200) {
      const lote = lista.slice(i, i + 200).map(g => ({ id: g.id, nombre: g.nombre, nit: g.nit || null, datos: g.datos, vencimientos: g.vencimientos }));
      const { error } = await this.sb.from(CONFIG.TABLAS.clientes).upsert(lote, { onConflict: 'id', ignoreDuplicates: true });
      if (error) throw this._error(error, 'importar los clientes');
    }
  }

  async importarTareas(lista, alAvanzar) {
    let hechas = 0;
    for (let i = 0; i < lista.length; i += 500) {
      const lote = lista.slice(i, i + 500);
      // origen_ref evita duplicados al reimportar el mismo archivo
      const { error } = await this._reintentarSinCronometro(() => this.sb.from(CONFIG.TABLAS.tareas)
        .upsert(lote.map(t => ({ ...this._limpiar(t), creado_por: this.usuario?.id })), { onConflict: 'origen_ref', ignoreDuplicates: true }));
      if (error) throw this._error(error, 'importar tareas');
      hechas += lote.length;
      alAvanzar?.(hechas, lista.length);
    }
    return hechas;
  }

  // cb(evento, tareaNueva, tareaAnterior, estadoConexion)
  suscribir(cb) {
    if (this.canal) this.sb.removeChannel(this.canal);
    this.canal = this.sb.channel('tareas-rt')
      .on('postgres_changes', { event: '*', schema: 'public', table: CONFIG.TABLAS.tareas }, p => {
        cb(p.eventType, p.new && Object.keys(p.new).length ? normalizarTarea(p.new) : null, p.old || null);
      })
      .subscribe(estado => cb('estado', null, null, estado === 'SUBSCRIBED'));
  }
}

// ─────────────────────────────────────────────────────────────────────
// LOCAL (modo demo)
// ─────────────────────────────────────────────────────────────────────
class LocalStore {
  constructor() { this.CLAVE = 'planner_demo_v1'; this.db = null; this.perfil = null; }

  get modo() { return 'demo'; }

  async iniciar() {
    try { this.db = JSON.parse(localStorage.getItem(this.CLAVE) || 'null'); } catch { this.db = null; }
    if (!this.db?.colaboradores) { this.db = DatosDemo.generar(); this._guardar(); }
  }

  _guardar() { try { localStorage.setItem(this.CLAVE, JSON.stringify(this.db)); } catch { /* almacenamiento lleno o bloqueado */ } }

  reiniciar() { this.db = DatosDemo.generar(); this._guardar(); }

  async login(email) {
    const correo = String(email).trim().toLowerCase();
    const c = this.db.colaboradores.find(x => x.correo === correo) || this.db.colaboradores.find(x => x.rol === 'admin');
    this.perfil = { ...c };
    sessionStorage.setItem('planner_demo_sesion', c.id);
    return this.perfil;
  }

  async sesion() {
    const id = sessionStorage.getItem('planner_demo_sesion');
    const c = id && this.db.colaboradores.find(x => x.id === id);
    return c ? (this.perfil = { ...c }) : null;
  }

  async logout() { sessionStorage.removeItem('planner_demo_sesion'); this.perfil = null; }
  async recuperar() { /* en demo no hay correos */ }

  async colaboradores() { return this.db.colaboradores.map(c => ({ ...c })); }
  conPausa = true;
  async tareas() { return this.db.tareas.map(t => normalizarTarea(structuredClone(t))); }

  async crearTarea(t) {
    const ahora = new Date().toISOString();
    const nueva = normalizarTarea({
      estado: 'pendiente', prioridad: 'media', progreso: 0, checklist: [], etiquetas: [],
      ...limpiarParaGuardar(t), id: Util.uid(), creado_por: this.perfil?.id, created_at: ahora, updated_at: ahora,
    });
    if (nueva.estado === 'completada' && !nueva.completada_at) nueva.completada_at = ahora;
    if (nueva.iniciada_at === undefined) nueva.iniciada_at = ['en_progreso', 'en_revision'].includes(nueva.estado) ? ahora : null;
    this.db.tareas.push(nueva);
    this._guardar();
    return structuredClone(nueva);
  }

  async actualizarTarea(id, cambios) {
    const t = this.db.tareas.find(x => x.id === id);
    if (!t) throw new ErrorDatos('La tarea ya no existe.');
    const limpio = limpiarParaGuardar(cambios);
    // Igual que el trigger de la base de datos: completada_at se gestiona solo.
    if (limpio.estado && limpio.estado !== t.estado) {
      if (!('completada_at' in limpio)) limpio.completada_at = limpio.estado === 'completada' ? new Date().toISOString() : null;
      if (!('iniciada_at' in limpio)) {
        const ini = iniciadaAlCambiar(t.estado, limpio.estado, t.iniciada_at);
        if (ini !== undefined) limpio.iniciada_at = ini;
      }
    }
    Object.assign(t, limpio, { updated_at: new Date().toISOString() });
    this._guardar();
    return normalizarTarea(structuredClone(t));
  }

  async eliminarTarea(id) {
    this.db.tareas = this.db.tareas.filter(x => x.id !== id);
    this.db.actividad = this.db.actividad.filter(a => a.tarea_id !== id);
    this._guardar();
  }

  async actividad(tareaId) { return this.db.actividad.filter(a => a.tarea_id === tareaId).sort((a, b) => a.created_at.localeCompare(b.created_at)); }

  async registrarActividad(tareaId, tipo, texto) {
    const a = { id: Util.uid(), tarea_id: tareaId, tipo, texto, autor_id: this.perfil?.id, autor_nombre: this.perfil?.nombre, created_at: new Date().toISOString() };
    this.db.actividad.push(a);
    this._guardar();
    return a;
  }

  async notas() { return (this.db.notas || []).filter(n => n.usuario_id === this.perfil?.id).map(n => ({ ...n })); }

  async guardarNota(n) {
    this.db.notas ||= [];
    const i = this.db.notas.findIndex(x => x.id === n.id);
    const fila = { ...n, usuario_id: this.perfil?.id };
    if (i >= 0) this.db.notas[i] = fila; else this.db.notas.push(fila);
    this._guardar();
  }

  async borrarNota(id) { this.db.notas = (this.db.notas || []).filter(n => n.id !== id); this._guardar(); }

  // ── Chat (modo demo): mismas reglas de privacidad que en Supabase ──
  _chat() {
    if (!this.db.chat) {
      const ahora = Date.now(), hace = min => new Date(ahora - min * 60000).toISOString();
      const general = { id: CHAT_GENERAL_ID, tipo: 'general', nombre: 'Equipo', color: 'violeta', creado_por: null, created_at: hace(600), updated_at: hace(20) };
      this.db.chat = {
        conversaciones: [general],
        miembros: [],
        mensajes: [
          { id: Util.uid(), conversacion_id: general.id, autor_id: 'u-ana', texto: 'Buenos días equipo. Hoy cierro la conciliación de Comercial Andina.', created_at: hace(95), editado_at: null },
          { id: Util.uid(), conversacion_id: general.id, autor_id: 'u-carlos', texto: '@Ana yo te paso los extractos de octubre en un rato.', created_at: hace(80), editado_at: null },
          { id: Util.uid(), conversacion_id: general.id, autor_id: 'u-yohana', texto: 'Listo, ya quedó el informe de exógena ✅', created_at: hace(20), editado_at: null },
        ],
      };
      this._guardar();
    }
    return this.db.chat;
  }

  _chatVisible(c) { return c.tipo === 'general' || this._chat().miembros.some(m => m.conversacion_id === c.id && m.usuario_id === this.perfil?.id); }

  async chatConversaciones() {
    const ch = this._chat(), yo = this.perfil?.id;
    return ch.conversaciones.filter(c => this._chatVisible(c)).map(c => {
      const miembros = ch.miembros.filter(m => m.conversacion_id === c.id);
      return { ...c, miembros: miembros.map(m => m.usuario_id), leido_hasta: miembros.find(m => m.usuario_id === yo)?.leido_hasta || null };
    }).sort((a, b) => b.updated_at.localeCompare(a.updated_at));
  }

  async chatMensajes(convId, limite = 200) {
    const c = this._chat().conversaciones.find(x => x.id === convId);
    if (!c || !this._chatVisible(c)) return [];
    return this._chat().mensajes.filter(m => m.conversacion_id === convId).sort((a, b) => a.created_at.localeCompare(b.created_at)).slice(-limite).map(m => ({ ...m }));
  }

  async chatNoLeidos(convId, desde) {
    return (await this.chatMensajes(convId)).filter(m => m.autor_id !== this.perfil?.id && (!desde || m.created_at > desde)).length;
  }

  async chatEnviar(convId, texto) {
    const ch = this._chat();
    const m = { id: Util.uid(), conversacion_id: convId, autor_id: this.perfil?.id, texto, created_at: new Date().toISOString(), editado_at: null };
    ch.mensajes.push(m);
    const c = ch.conversaciones.find(x => x.id === convId);
    if (c) c.updated_at = m.created_at;
    this._guardar();
    return { ...m };
  }

  async chatEditar(id, texto) {
    const m = this._chat().mensajes.find(x => x.id === id && x.autor_id === this.perfil?.id);
    if (!m) throw new ErrorDatos('No tienes permiso para editar este mensaje.');
    Object.assign(m, { texto, editado_at: new Date().toISOString() });
    this._guardar();
    return { ...m };
  }

  async chatBorrarMensaje(id) {
    const ch = this._chat();
    if (!ch.mensajes.some(x => x.id === id && x.autor_id === this.perfil?.id)) throw new ErrorDatos('No tienes permiso para borrar este mensaje.');
    ch.mensajes = ch.mensajes.filter(x => x.id !== id);
    this._guardar();
  }

  async chatMarcarLeido(convId, hasta) {
    const ch = this._chat(), yo = this.perfil?.id, ahora = hasta || new Date().toISOString();
    const m = ch.miembros.find(x => x.conversacion_id === convId && x.usuario_id === yo);
    if (m) m.leido_hasta = ahora; else ch.miembros.push({ conversacion_id: convId, usuario_id: yo, leido_hasta: ahora });
    this._guardar();
    return ahora;
  }

  async chatCrearConversacion({ tipo, nombre = '', color = 'violeta', miembros = [] }) {
    if (tipo === 'grupo' && !CONFIG.ROLES_ADMIN.includes(this.perfil?.rol)) throw new ErrorDatos('Solo un administrador puede crear grupos.');
    const ch = this._chat(), ahora = new Date().toISOString();
    const c = { id: Util.uid(), tipo, nombre, color, creado_por: this.perfil?.id, created_at: ahora, updated_at: ahora };
    const ids = [...new Set([this.perfil?.id, ...miembros])];
    ch.conversaciones.push(c);
    ids.forEach(u => ch.miembros.push({ conversacion_id: c.id, usuario_id: u, leido_hasta: ahora }));
    this._guardar();
    return { ...c, miembros: ids, leido_hasta: ahora };
  }

  async chatEditarGrupo(id, { nombre, color, miembros }) {
    const ch = this._chat(), c = ch.conversaciones.find(x => x.id === id);
    if (!c) return;
    Object.assign(c, { nombre, color });
    const ahora = new Date().toISOString();
    ch.miembros = ch.miembros.filter(m => m.conversacion_id !== id || miembros.includes(m.usuario_id));
    miembros.forEach(u => { if (!ch.miembros.some(m => m.conversacion_id === id && m.usuario_id === u)) ch.miembros.push({ conversacion_id: id, usuario_id: u, leido_hasta: ahora }); });
    this._guardar();
  }

  async chatBorrarConversacion(id) {
    const ch = this._chat();
    ch.conversaciones = ch.conversaciones.filter(c => c.id !== id);
    ch.miembros = ch.miembros.filter(m => m.conversacion_id !== id);
    ch.mensajes = ch.mensajes.filter(m => m.conversacion_id !== id);
    this._guardar();
  }

  // Entre pestañas del mismo navegador llega como "recargar"
  chatSuscribir(cb) {
    this.chatDetener();
    this._oyenteChat = e => { if (e.key === this.CLAVE) { try { this.db = JSON.parse(e.newValue); cb('recargar'); } catch { /* ignorar */ } } };
    addEventListener('storage', this._oyenteChat);
  }

  chatPresencia({ alEstado }) { alEstado([this.perfil?.id]); return { escribiendo() {} }; }

  chatDetener() { if (this._oyenteChat) removeEventListener('storage', this._oyenteChat); this._oyenteChat = null; }

  async clientes() {
    if (!this.db.clientes) { this.db.clientes = DatosDemo.clientes(); this._guardar(); }
    return structuredClone(this.db.clientes);
  }

  async guardarCliente(g) {
    this.db.clientes ||= [];
    const i = this.db.clientes.findIndex(x => x.id === g.id);
    const fila = structuredClone({ id: g.id, nombre: g.nombre, nit: g.nit, datos: g.datos, vencimientos: g.vencimientos,
      updated_at: new Date().toISOString(), actualizado_nombre: this.perfil?.nombre || null, historial: [] });
    // Igual que el trigger de la base de datos: la versión anterior pasa al historial.
    const ant = this.db.clientes[i];
    if (ant) {
      const v = { nombre: ant.nombre, nit: ant.nit, datos: ant.datos, vencimientos: ant.vencimientos, fecha: ant.updated_at || null, autor: ant.actualizado_nombre || null };
      fila.historial = [v, ...(ant.historial || [])].slice(0, CLIENTE_VERSIONES);
    }
    if (i >= 0) this.db.clientes[i] = fila; else this.db.clientes.push(fila);
    this._guardar();
    return structuredClone(fila);
  }

  async borrarCliente(id) {
    if (!Permisos.esAdmin()) throw new ErrorDatos('Solo un administrador puede eliminar clientes.');
    this.db.clientes = (this.db.clientes || []).filter(g => g.id !== id);
    this._guardar();
  }

  async importarClientes(lista) {
    this.db.clientes ||= [];
    const ids = new Set(this.db.clientes.map(g => g.id));
    for (const g of lista) if (!ids.has(g.id)) this.db.clientes.push(structuredClone(g));
    this._guardar();
  }

  async importarTareas(lista, alAvanzar) {
    const refs = new Set(this.db.tareas.map(t => t.origen_ref).filter(Boolean));
    let n = 0;
    for (const t of lista) {
      if (t.origen_ref && refs.has(t.origen_ref)) continue;
      await this.crearTarea(t);
      if (t.origen_ref) refs.add(t.origen_ref);
      n++;
    }
    alAvanzar?.(lista.length, lista.length);
    return n;
  }

  suscribir(cb) {
    // Sincroniza entre pestañas del mismo navegador.
    window.addEventListener('storage', e => {
      if (e.key !== this.CLAVE) return;
      try { this.db = JSON.parse(e.newValue); cb('recargar'); } catch { /* ignorar */ }
    });
    cb('estado', null, null, true);
  }
}

const DatosDemo = {
  generar() {
    const hoy = Util.hoyISO();
    const colaboradores = [

    ];
    const empresas = ['Comercial Andina SAS', 'Inversiones del Valle', 'Textiles Medellín', 'Agro Caribe', 'Logística Bogotá'];
    const plantillas = [
      ['Declaración de IVA bimestral', 'Tributario', 'alta'],

      ['Revisión de soportes', 'Auditoría', 'media'],
      ['ICA municipal', 'Tributario', 'alta'],
      ['Actualizar RUT', 'Administrativo', 'baja'],
    ];
    // Generador pseudoaleatorio con semilla: los datos demo son siempre iguales.
    let semilla = 7;
    const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
    const elegir = arr => arr[Math.floor(azar() * arr.length)];
    const ts = (iso, h = 10) => { const d = Util.deISO(iso); d.setHours(h); return d.toISOString(); };

    const tareas = [];
    const equipo = colaboradores.filter(c => c.rol !== 'admin');
    // Cada colaborador tiene un ritmo distinto para que el rendimiento varíe.
    const ritmo = { 'u-ana': 0.92, 'u-carlos': 0.7, 'u-yohana': 0.82, 'u-andres': 0.5 };
    for (let i = 0; i < 64; i++) {
      const c = equipo[i % equipo.length];
      const [titulo, categoria, prioridad] = elegir(plantillas);
      const offset = Math.round(azar() * 70) - 45; // de -45 a +25 días
      const vence = Util.sumarDias(hoy, offset);
      const creada = Util.sumarDias(vence, -(3 + Math.round(azar() * 10)));
      let estado = 'pendiente', completada_at = null;
      if (offset < 0) {
        if (azar() < ritmo[c.id]) {
          estado = 'completada';
          const retraso = azar() < ritmo[c.id] ? -Math.round(azar() * 3) : 1 + Math.round(azar() * 5);
          completada_at = ts(Util.sumarDias(vence, retraso) > hoy ? hoy : Util.sumarDias(vence, retraso));
        } else {
          estado = elegir(['pendiente', 'en_progreso']);
        }
      } else {
        estado = elegir(['pendiente', 'pendiente', 'en_progreso', 'en_revision', 'completada']);
        if (estado === 'completada') completada_at = ts(hoy, 8);
      }
      const checklist = azar() < 0.5 ? [
        { id: Util.uid(), texto: 'Recopilar información', hecho: estado !== 'pendiente' },
        { id: Util.uid(), texto: 'Preparar borrador', hecho: estado === 'completada' || estado === 'en_revision' },
        { id: Util.uid(), texto: 'Validar y enviar', hecho: estado === 'completada' },
      ] : [];
      tareas.push({
        id: 't-' + i, titulo, descripcion: '', asignado_a: c.id, asignado_nombre: null, creado_por: 'u-admin',
        empresa: elegir(empresas), categoria, prioridad, estado,
        fecha_inicio: null, fecha_vencimiento: vence,
        progreso: estado === 'completada' ? 100 : estado === 'en_revision' ? 80 : estado === 'en_progreso' ? 40 : 0,
        checklist, etiquetas: [], completada_at, iniciada_at: null, origen_ref: null,
        created_at: ts(creada, 9), updated_at: ts(creada, 9),
      });
    }
    // Cronómetro: las tareas iniciadas empezaron entre 1 hora y 4 días antes de completarse (o de ahora).
    for (const t of tareas) {
      if (t.estado === 'pendiente') continue;
      const fin = t.completada_at ? Date.parse(t.completada_at) : Date.now();
      const ini = fin - (1 + azar() * 95) * 3600000, creada = Date.parse(t.created_at);
      t.iniciada_at = new Date(creada < fin ? Math.max(creada, ini) : ini).toISOString();
    }
    return { colaboradores, tareas, actividad: [] };
  },

  clientes() {
    const d = n => Util.sumarDias(Util.hoyISO(), n);
    const g = (id, nombre, nit, codigo, lechera, correo, venc) => ({

      g('g-demo-4', 'Inversiones El Roble SAS', '901280555', '', 'Auralac', 'roble@demo.co', { certificado: [-10, 355], resolucion: [-730, -70] }),
      g('g-demo-5', 'Jorge Restrepo Gil', '71234567', '8342', 'Lácteos Betania', 'jorge@demo.co', { certificado: [-640, -270], resolucion: [-760, -30], soporte: [-332, 33] }),
      g('g-demo-6', 'Luz Dary Henao Tobón', '39441902', '1749', 'Alquería', 'luzdary@demo.co', { certificado: [null, 500] }),
    ];

// NOTIFICACIONES A MICROSOFT TEAMS (opcional)
// Se configura en js/config.js. Sin URL configurada, no hace nada.
// ═══════════════════════════════════════════════════════════════════

const Teams = {
  urlPara(nombreColaborador) {
    const clave = Util.normalizar(nombreColaborador);
    for (const [nombre, url] of Object.entries(CONFIG.TEAMS_WEBHOOKS_POR_COLABORADOR)) {
      if (Util.normalizar(nombre) === clave) return url;
    }
    return CONFIG.TEAMS_WEBHOOK_URL;
  },

  async enviar(titulo, texto, nombreColaborador) {
    const url = Teams.urlPara(nombreColaborador);
    if (!url) return;
    const payload = {
      type: 'message',
      attachments: [{
        contentType: 'application/vnd.microsoft.card.adaptive',
        content: {
          $schema: 'http://adaptivecards.io/schemas/adaptive-card.json',
          type: 'AdaptiveCard',
          version: '1.4',
          body: [
            { type: 'TextBlock', text: titulo, weight: 'Bolder', size: 'Medium', wrap: true },
            { type: 'TextBlock', text: texto, wrap: true },
          ],
        },
      }],
    };
    try {
      await fetch(url, { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    } catch {
      // Algunos flujos de Power Automate bloquean CORS: se reintenta sin leer respuesta.
      try { await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) }); }
      catch (e) { console.warn('[Teams] No se pudo notificar:', e); }
    }
  },
};
