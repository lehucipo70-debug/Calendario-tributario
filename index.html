<script>
/* ── js/importar.js ── */
// ═══════════════════════════════════════════════════════════════════
// IMPORTAR / EXPORTAR EXCEL
// La conversión de filas a tareas (filasATareas) es pura y se prueba
// en tests/; la lectura del archivo usa SheetJS cargado bajo demanda.
// ═══════════════════════════════════════════════════════════════════

const Importador = (() => {
  const U = typeof Util !== 'undefined' ? Util : require('./utils.js').Util;
  const XLSX_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';

  const COLS = {
    titulo: ['TAREA', 'TITULO', 'ACTIVIDAD', 'ASUNTO'],
    colaborador: ['COLABORADOR', 'RESPONSABLE', 'ASIGNADO A', 'ASIGNADO', 'CONTADOR', 'ENCARGADO'],
    fecha: ['FECHA LIMITE', 'FECHA VENCIMIENTO', 'FECHA DE VENCIMIENTO', 'VENCIMIENTO', 'VENCE', 'FECHA'],
    fecha_inicio: ['FECHA INICIO', 'FECHA DE INICIO', 'INICIO'],
    empresa: ['EMPRESA', 'EMPRESAS', 'CLIENTE', 'RAZON SOCIAL', 'NOMBRE DE EMPRESA'],
    categoria: ['CATEGORIA', 'TIPO DE TAREA', 'AREA'],
    prioridad: ['PRIORIDAD'],
    estado: ['ESTADO'],
    descripcion: ['DESCRIPCION', 'DETALLE', 'OBSERVACIONES', 'NOTAS'],
    impuesto: ['TIPO DE IMPUESTO', 'IMPUESTO'],
    periodo: ['PERIODO'],
  };
  const MESES = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];

  // Busca por prioridad de candidato: primero coincidencia exacta, luego por palabras
  // completas ("FECHA VENCIMIENTO 2026" sirve para VENCIMIENTO; "TAREA" no sirve para AREA).
  function buscarCol(cabeceras, candidatos, excluir = []) {
    const ok = h => !excluir.some(x => h.includes(x));
    const contiene = (h, c) => (' ' + h.replace(/[^A-Z0-9]+/g, ' ') + ' ').includes(' ' + c + ' ');
    for (const c of candidatos) { const i = cabeceras.findIndex(h => h === c && ok(h)); if (i >= 0) return i; }
    for (const c of candidatos) { const i = cabeceras.findIndex(h => contiene(h, c) && ok(h)); if (i >= 0) return i; }
    return -1;
  }

  function mapearEstado(v) {
    const s = U.normalizar(v);
    if (!s) return 'pendiente';
    if (/COMPLET|PRESENTAD|HECH|TERMINAD|FINALIZAD|CERRAD|^SI$|^OK$/.test(s)) return 'completada';
    if (/REVISI/.test(s)) return 'en_revision';
    if (/PROGRES|CURSO|PROCESO/.test(s)) return 'en_progreso';
    return 'pendiente';
  }

  function mapearPrioridad(v) {
    const s = U.normalizar(v);
    if (/URGENT|CRITIC/.test(s)) return 'urgente';
    if (/ALTA|HIGH/.test(s)) return 'alta';
    if (/BAJA|LOW/.test(s)) return 'baja';
    return s ? 'media' : null;
  }

  // Hash FNV-1a de 2×32 bits: referencia estable para no duplicar al reimportar.
  function huella(s) {
    let a = 0x811c9dc5, b = 0x01000193 ^ s.length;
    for (let i = 0; i < s.length; i++) {
      a = Math.imul(a ^ s.charCodeAt(i), 16777619);
      b = Math.imul(b ^ s.charCodeAt(s.length - 1 - i), 16777619);
    }
    return (a >>> 0).toString(16).padStart(8, '0') + (b >>> 0).toString(16).padStart(8, '0');
  }

  function texto(v) { return v == null || v === 'null' ? '' : String(v).trim(); }

  // hojas: [{ nombre, filas: [[celda, …], …] }] → { tareas, log }
  function filasATareas(hojas, colaboradores) {
    const porNombre = new Map();
    for (const c of colaboradores) {
      porNombre.set(U.normalizar(c.nombre), c);
      const primero = U.normalizar(c.nombre).split(' ')[0];
      if (primero && !porNombre.has(primero)) porNombre.set(primero, c);
    }
    const asignar = nombre => {
      const n = U.normalizar(nombre);
      if (!n) return { asignado_a: null, asignado_nombre: null };
      const c = porNombre.get(n) || porNombre.get(n.split(' ')[0]);
      return c ? { asignado_a: c.id, asignado_nombre: null } : { asignado_a: null, asignado_nombre: nombre.trim() };
    };

    const tareas = [], log = [];
    const sinCoincidencia = new Set();

    for (const hoja of hojas) {
      const filas = hoja.filas || [];
      let filaCab = -1, cab = [];
      for (let i = 0; i < Math.min(8, filas.length); i++) {
        const c = (filas[i] || []).map(U.normalizar);
        // Un título suelto ("CALENDARIO EMPRESAS 2026") no es encabezado: se exigen 2+ columnas.
        if (c.filter(Boolean).length >= 2 && c.some(h => COLS.titulo.includes(h) || COLS.empresa.some(e => h.includes(e)))) { filaCab = i; cab = c; break; }
      }
      if (filaCab < 0) { log.push(`· "${hoja.nombre}": sin encabezados reconocibles, se omite`); continue; }

      const col = {
        titulo: buscarCol(cab, COLS.titulo),
        colaborador: buscarCol(cab, COLS.colaborador),
        fecha: buscarCol(cab, COLS.fecha, ['INICIO', 'ENTREGA', 'PRESENTACION']),
        fecha_inicio: buscarCol(cab, COLS.fecha_inicio),
        empresa: buscarCol(cab, COLS.empresa),
        categoria: buscarCol(cab, COLS.categoria),
        prioridad: buscarCol(cab, COLS.prioridad),
        estado: buscarCol(cab, COLS.estado),
        descripcion: buscarCol(cab, COLS.descripcion),
        impuesto: buscarCol(cab, COLS.impuesto),
        periodo: buscarCol(cab, COLS.periodo),
      };
      const modoPlanner = col.titulo >= 0;
      const tributarioPlano = !modoPlanner && col.impuesto >= 0 && col.fecha >= 0;
      // Formato ancho del calendario tributario: una columna de fecha por mes.
      let colsMes = !modoPlanner && !tributarioPlano
        ? cab.map((h, i) => ({ i, mes: MESES.findIndex(m => h.includes(m)) })).filter(x => x.mes >= 0 && !cab[x.i].includes('ENTREGA'))
        : [];
      // Sin meses pero con una columna de vencimiento: una tarea por fila con el nombre de la hoja.
      if (!modoPlanner && !tributarioPlano && !colsMes.length && col.fecha >= 0) colsMes = [{ i: col.fecha, mes: -1 }];
      if (!modoPlanner && !tributarioPlano && !colsMes.length) { log.push(`· "${hoja.nombre}": no tiene columnas de tarea ni de fechas, se omite`); continue; }

      let n = 0;
      for (let r = filaCab + 1; r < filas.length; r++) {
        const f = filas[r] || [];
        const val = k => (col[k] >= 0 ? texto(f[col[k]]) : '');
        const empresa = val('empresa');
        const colab = val('colaborador');
        const base = {
          empresa: empresa || null,
          descripcion: val('descripcion') || null,
          ...asignar(colab),
        };
        if (colab && !base.asignado_a) sinCoincidencia.add(colab);

        const agregar = (titulo, fecha, extra = {}) => {
          const estado = col.estado >= 0 ? mapearEstado(f[col.estado]) : 'pendiente';
          const t = {
            ...base, titulo: titulo.slice(0, 300), fecha_vencimiento: fecha, estado,
            prioridad: mapearPrioridad(val('prioridad')) || extra.prioridad || 'media',
            categoria: val('categoria') || extra.categoria || 'Otro',
            fecha_inicio: col.fecha_inicio >= 0 ? U.parsearFecha(f[col.fecha_inicio]) : null,
            progreso: estado === 'completada' ? 100 : 0,
            checklist: [], etiquetas: [],
            // Lo importado como completado se toma como entregado en su fecha límite.
            completada_at: estado === 'completada' && fecha ? U.deISO(fecha).toISOString() : null,
          };
          t.origen_ref = 'xls:' + huella([hoja.nombre, t.titulo, empresa, fecha, colab].join('|'));
          tareas.push(t);
          n++;
        };

        if (modoPlanner) {
          const titulo = val('titulo');
          if (titulo) agregar(titulo, U.parsearFecha(f[col.fecha]));
        } else if (tributarioPlano) {
          const imp = val('impuesto'), per = val('periodo'), fecha = U.parsearFecha(f[col.fecha]);
          if (imp && fecha && empresa) agregar(per ? `${imp} · ${per}` : imp, fecha, { categoria: 'Tributario', prioridad: 'alta' });
        } else if (empresa && U.normalizar(empresa) !== 'EMPRESA') {
          for (const { i, mes } of colsMes) {
            const fecha = U.parsearFecha(f[i]);
            const sufijo = mes >= 0 ? ' · ' + MESES[mes][0] + MESES[mes].slice(1).toLowerCase() : '';
            if (fecha) agregar(hoja.nombre + sufijo, fecha, { categoria: 'Tributario', prioridad: 'alta' });
          }
        }
      }
      log.push(`✓ "${hoja.nombre}": ${n} tareas`);
    }
    if (sinCoincidencia.size) {
      log.push(`⚠ ${sinCoincidencia.size} nombre(s) sin perfil en el sistema (quedan sin asignar, con el nombre guardado): ${[...sinCoincidencia].slice(0, 8).join(', ')}${sinCoincidencia.size > 8 ? '…' : ''}`);
    }
    return { tareas, log };
  }

  async function cargarXLSX() {
    if (window.XLSX) return;
    await new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = XLSX_URL; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar la librería de Excel (sin conexión).'));
      document.head.appendChild(s);
    });
  }

  function progreso(pct, estado, lineas) {
    const el = document.getElementById('imp-estado');
    if (!el) return;
    el.textContent = estado;
    document.getElementById('imp-barra').style.width = pct + '%';
    if (lineas) document.getElementById('imp-log').innerHTML = lineas.map(l => `<div>${U.esc(l)}</div>`).join('');
  }

  // ── Actualizar desde Excel ──────────────────────────────────────────
  // Si la hoja trae la columna "Código" (exportada por la página), cada fila con código
  // actualiza esa misma tarea (solo lo que cambió) y las filas sin código se crean.
  function hojaConCodigo(hojas) {
    for (const hoja of hojas) {
      const filas = hoja.filas || [];
      for (let i = 0; i < Math.min(8, filas.length); i++) {
        const c = (filas[i] || []).map(U.normalizar);
        const iCod = c.findIndex(h => h.startsWith('CODIGO'));
        if (iCod >= 0 && c.some(h => COLS.titulo.includes(h))) return { hoja, filaCab: i, cab: c, iCod };
      }
    }
    return null;
  }

  // Exportación antigua de la página (sin código): subirla duplicaría todas las tareas.
  function esExportacionSinCodigo(hojas) {
    return hojas.some(h => (h.filas || []).slice(0, 8).some(f => { const c = (f || []).map(U.normalizar); return c.includes('COMPLETADA EL') && c.includes('INICIADA EL'); }));
  }

  function planActualizacion(det, tareasActuales, colaboradores) {
    const { hoja, filaCab, cab, iCod } = det;
    const col = {
      titulo: buscarCol(cab, COLS.titulo), colaborador: buscarCol(cab, COLS.colaborador),
      fecha: buscarCol(cab, COLS.fecha, ['INICIO', 'ENTREGA', 'PRESENTACION', 'COMPLETADA']),
      fecha_inicio: buscarCol(cab, COLS.fecha_inicio, ['INICIADA']), empresa: buscarCol(cab, COLS.empresa),
      categoria: buscarCol(cab, COLS.categoria), prioridad: buscarCol(cab, COLS.prioridad),
      estado: buscarCol(cab, COLS.estado), descripcion: buscarCol(cab, COLS.descripcion),
    };
    const porId = new Map(tareasActuales.map(t => [String(t.id), t]));
    const refs = new Set(tareasActuales.map(t => t.origen_ref).filter(Boolean));
    const porNombre = new Map();
    for (const c of colaboradores) {
      porNombre.set(U.normalizar(c.nombre), c);
      const primero = U.normalizar(c.nombre).split(' ')[0];
      if (primero && !porNombre.has(primero)) porNombre.set(primero, c);
    }
    const buscarColab = n => { const k = U.normalizar(n); return k ? porNombre.get(k) || porNombre.get(k.split(' ')[0]) || null : null; };
    const nombreEstado = id => ESTADOS.find(e => e.id === id)?.label || id;
    const nombrePrio = id => PRIORIDADES.find(x => x.id === id)?.label || id;
    const actualizar = [], nuevas = [], avisos = [];
    let sinCambios = 0;
    const vistos = new Set();
    const filas = hoja.filas || [];
    for (let r = filaCab + 1; r < filas.length; r++) {
      const f = filas[r] || [];
      const val = k => (col[k] >= 0 ? texto(f[col[k]]) : '');
      const codigo = texto(f[iCod]);
      const titulo = val('titulo');
      if (!codigo && !titulo) continue;
      const fila = r + 1;
      if (!codigo) {
        // Fila nueva (sin código): se crea como tarea nueva
        const colab = val('colaborador'), c = buscarColab(colab);
        if (colab && !c) avisos.push(`Fila ${fila}: "${colab}" no es un colaborador; la tarea nueva queda sin asignar.`);
        const fecha = col.fecha >= 0 ? U.parsearFecha(f[col.fecha]) : null;
        const estado = mapearEstado(val('estado'));
        const ref = 'xls:' + huella([hoja.nombre, titulo, val('empresa'), fecha, colab].join('|'));
        // Ya se creó al subir este archivo antes: no se repite
        if (refs.has(ref)) { sinCambios++; continue; }
        refs.add(ref);
        nuevas.push({
          titulo: titulo.slice(0, 300), asignado_a: c?.id || null, empresa: val('empresa') || null,
          categoria: val('categoria') || 'Otro', prioridad: mapearPrioridad(val('prioridad')) || 'media', estado,
          fecha_inicio: col.fecha_inicio >= 0 ? U.parsearFecha(f[col.fecha_inicio]) : null, fecha_vencimiento: fecha,
          descripcion: val('descripcion') || null, progreso: estado === 'completada' ? 100 : 0, checklist: [], etiquetas: [],
          completada_at: estado === 'completada' && fecha ? U.deISO(fecha).toISOString() : null,
          origen_ref: ref,
        });
        continue;
      }
      const t = porId.get(codigo);
      if (!t) { avisos.push(`Fila ${fila}: el código ${codigo} no existe (¿tarea eliminada?). Se omite.`); continue; }
      if (vistos.has(codigo)) { avisos.push(`Fila ${fila}: el código ${codigo} está repetido. Se usa solo la primera fila.`); continue; }
      vistos.add(codigo);
      const cambios = {}, textos = [];
      // Vacío, null y undefined cuentan igual: solo se marca lo que de verdad cambió
      const igual = (a, b) => (a === '' || a == null ? null : a) === (b === '' || b == null ? null : b);
      const poner = (campo, nuevo, viejo, txt) => { if (!igual(nuevo, viejo)) { cambios[campo] = nuevo; textos.push(txt); } };
      if (titulo) poner('titulo', titulo.slice(0, 300), t.titulo, `nombre → "${titulo}"`);
      if (col.colaborador >= 0 && val('colaborador')) {
        const c = buscarColab(val('colaborador'));
        if (c) poner('asignado_a', c.id, t.asignado_a, `colaborador → ${c.nombre}`);
        else avisos.push(`Fila ${fila}: "${val('colaborador')}" no es un colaborador; no se cambia el responsable.`);
      }
      if (col.empresa >= 0) poner('empresa', val('empresa') || null, t.empresa, `empresa → ${val('empresa') || '(vacía)'}`);
      if (col.categoria >= 0 && val('categoria')) poner('categoria', val('categoria'), t.categoria, `categoría → ${val('categoria')}`);
      if (col.prioridad >= 0) { const pr = mapearPrioridad(val('prioridad')); if (pr) poner('prioridad', pr, t.prioridad, `prioridad → ${nombrePrio(pr)}`); }
      // "Vencida" lo calcula la página: no es un estado que se guarde
      if (col.estado >= 0 && val('estado') && U.normalizar(val('estado')) !== 'VENCIDA') {
        const es = mapearEstado(val('estado')); poner('estado', es, t.estado, `estado → ${nombreEstado(es)}`);
      }
      if (col.fecha_inicio >= 0) { const d = U.parsearFecha(f[col.fecha_inicio]); poner('fecha_inicio', d, t.fecha_inicio, `inicio → ${d ? U.fmtFecha(d) : '(sin fecha)'}`); }
      if (col.fecha >= 0) { const d = U.parsearFecha(f[col.fecha]); poner('fecha_vencimiento', d, t.fecha_vencimiento, `fecha límite ${t.fecha_vencimiento ? U.fmtFecha(t.fecha_vencimiento) : '(sin fecha)'} → ${d ? U.fmtFecha(d) : '(sin fecha)'}`); }
      if (col.descripcion >= 0) poner('descripcion', val('descripcion') || null, t.descripcion, 'descripción');
      if (textos.length) actualizar.push({ t, cambios, textos }); else sinCambios++;
    }
    const otras = det.otrasHojas || [];
    return { actualizar, nuevas, sinCambios, avisos, otras };
  }

  async function aplicarActualizacion(plan) {
    let hechas = 0, fallas = 0;
    const total = plan.actualizar.length;
    for (const { t, cambios, textos } of plan.actualizar) {
      try {
        if (!Permisos.editarTarea(t)) throw new Error('sin permiso');
        const { enviar } = App._derivar(t, cambios);
        const guardada = await Datos.actualizarTarea(t.id, enviar);
        App._reemplazar(guardada);
        App._registrar(t.id, 'edicion', 'Actualizó desde Excel: ' + textos.join(' · '));
      } catch (e) { fallas++; console.warn('[actualizar desde Excel]', t.id, e.message); }
      hechas++;
      progreso(10 + Math.round(70 * hechas / Math.max(1, total)), `Actualizando… ${hechas}/${total}`);
    }
    let creadas = 0;
    if (plan.nuevas.length) {
      progreso(85, `Creando ${plan.nuevas.length} tareas nuevas…`);
      creadas = await Datos.importarTareas(plan.nuevas, () => {});
    }
    return { actualizadas: total - fallas, fallas, creadas };
  }

  function mostrarPlan(plan, archivo) {
    const lista = plan.actualizar.slice(0, 40).map(({ t, textos }) =>
      `<li><strong>${U.esc(t.titulo)}</strong>${t.empresa ? ' · ' + U.esc(t.empresa) : ''}<br><span class="muted mini">${U.esc(textos.join(' · '))}</span></li>`).join('');
    UI.abrirModal(`<header class="modal-cab"><h3>Actualizar desde Excel</h3><button type="button" class="btn-icono btn-sm" data-accion="cerrar-modal" aria-label="Cerrar">✕</button></header>
      <p class="muted mini">${U.esc(archivo.name)} · revisa los cambios antes de guardar.</p>
      <div class="imp-resumen">
        <div><strong>${plan.actualizar.length}</strong><span>se actualizan</span></div>
        <div><strong>${plan.nuevas.length}</strong><span>tareas nuevas</span></div>
        <div><strong>${plan.sinCambios}</strong><span>sin cambios</span></div>
      </div>
      ${plan.otras.length ? `<p class="mini muted">Solo se lee la hoja con la columna Código; se ignoran: ${U.esc(plan.otras.join(', '))}.</p>` : ''}
      ${plan.avisos.length ? `<details class="imp-avisos" open><summary>${plan.avisos.length} aviso${plan.avisos.length > 1 ? 's' : ''}</summary>${plan.avisos.slice(0, 30).map(a => `<div>${U.esc(a)}</div>`).join('')}</details>` : ''}
      ${lista ? `<ul class="imp-cambios">${lista}</ul>${plan.actualizar.length > 40 ? `<p class="muted mini">…y ${plan.actualizar.length - 40} más.</p>` : ''}` : ''}
      <p id="imp-estado" class="muted mini"></p>
      <div class="barra-progreso grande" hidden><span id="imp-barra" style="width:0%"></span></div>
      <div id="imp-log" class="imp-log" hidden></div>
      <div class="modal-pie"><span class="separador"></span>
        <button class="btn" data-accion="cerrar-modal" id="imp-cancelar">Cancelar</button>
        <button class="btn btn-primario" id="imp-aplicar" ${plan.actualizar.length || plan.nuevas.length ? '' : 'disabled'}>Guardar cambios</button>
      </div>`, { ancho: 620 });
    document.getElementById('imp-aplicar').addEventListener('click', async e => {
      const btn = e.currentTarget;
      if (btn.dataset.listo) { UI.cerrarModal(); return; }
      btn.disabled = true;
      btn.textContent = 'Guardando…';
      document.getElementById('imp-cancelar')?.setAttribute('hidden', '');
      document.querySelector('.modal .barra-progreso')?.removeAttribute('hidden');
      try {
        const r = await aplicarActualizacion(plan);
        await App.cargar();
        App.render();
        progreso(100, `✅ Listo: ${r.actualizadas} actualizadas, ${r.creadas} nuevas${r.fallas ? `, ${r.fallas} no se pudieron guardar` : ''}. Ya puedes cerrar esta ventana.`);
      } catch (err) { console.error(err); progreso(100, '❌ ' + err.message); }
      // Al terminar, el mismo botón cierra la ventana
      btn.dataset.listo = '1';
      btn.textContent = 'Cerrar';
      btn.disabled = false;
    });
  }

  async function importarArchivo(archivo) {
    if (archivo.size > 20 * 1024 * 1024) { UI.toast('El archivo supera 20 MB.', { tipo: 'error' }); return; }
    UI.abrirModal(`<header class="modal-cab"><h3>Importar: ${U.esc(archivo.name)}</h3></header>
      <p id="imp-estado" class="muted">Leyendo archivo…</p>
      <div class="barra-progreso grande"><span id="imp-barra" style="width:5%"></span></div>
      <div id="imp-log" class="imp-log"></div>
      <div class="modal-pie"><span class="separador"></span><button class="btn" data-accion="cerrar-modal">Cerrar</button></div>`, { ancho: 520 });
    try {
      await cargarXLSX();
      progreso(20, 'Procesando hojas…');
      const wb = XLSX.read(await archivo.arrayBuffer(), { type: 'array', cellDates: true });
      const hojas = wb.SheetNames.map(nombre => ({ nombre, filas: XLSX.utils.sheet_to_json(wb.Sheets[nombre], { header: 1, defval: null, raw: true }) }));
      const det = hojaConCodigo(hojas);
      if (det) {
        det.otrasHojas = hojas.filter(h => h !== det.hoja).map(h => h.nombre);
        mostrarPlan(planActualizacion(det, App.estado.tareas, App.estado.colaboradores), archivo);
        return;
      }
      if (esExportacionSinCodigo(hojas)) {
        progreso(100, '⚠ Este archivo es una exportación anterior de la página, sin la columna Código: subirlo crearía todas las tareas otra vez (repetidas). Descarga de nuevo con "Exportar a Excel" (ya trae el código), haz tus cambios en ese archivo y súbelo.');
        return;
      }
      const { tareas, log } = filasATareas(hojas, App.estado.colaboradores);
      if (!tareas.length) { progreso(100, 'No se encontraron tareas en el archivo.', log); return; }
      progreso(40, `Guardando ${tareas.length} tareas…`, log);
      const creadas = await Datos.importarTareas(tareas, (hechas, total) => progreso(40 + Math.round(55 * hechas / total), `Guardando… ${hechas}/${total}`));
      await App.cargar();
      App.render();
      progreso(100, `Listo: ${tareas.length} tareas procesadas${Datos.modo === 'demo' ? `, ${creadas} nuevas` : ' (las repetidas se omiten)'}.`, log);
    } catch (e) {
      console.error(e);
      progreso(100, '❌ ' + e.message);
    }
  }

  async function exportar(tareas) {
    // La primera columna es el código interno: al volver a subir el archivo, la tarea se actualiza en vez de duplicarse.
    const cab = ['Código (no modificar)', 'Tarea', 'Colaborador', 'Empresa', 'Categoría', 'Prioridad', 'Estado', 'Fecha inicio', 'Fecha límite', 'Completada el', 'A tiempo', 'Iniciada el', 'Tiempo de ejecución (h)', 'Progreso %', 'Descripción'];
    const hoy = U.hoyISO();
    const filas = tareas.map(t => {
      const ef = Metricas.estadoEfectivo(t, hoy);
      const at = Metricas.aTiempo(t);
      return [t.id, t.titulo, App.colaboradorDe(t)?.nombre || '', t.empresa || '', t.categoria || '',
        PRIORIDADES.find(p => p.id === t.prioridad)?.label || '', ef === 'vencida' ? 'Vencida' : ESTADOS.find(e => e.id === t.estado)?.label || '',
        t.fecha_inicio || '', t.fecha_vencimiento || '', U.fechaDeTimestamp(t.completada_at) || '', at === null ? '' : at ? 'Sí' : 'No',
        t.iniciada_at && t.estado !== 'pendiente' ? U.fmtFechaHora(t.iniciada_at) : '', (ms => ms === null ? '' : Math.round(ms / 360000) / 10)(Metricas.tiempoEjecucion(t)),
        UI.progreso(t).pct, t.descripcion || ''];
    });
    const nombre = 'planner_tareas_' + hoy;
    try {
      await cargarXLSX();
      const ws = XLSX.utils.aoa_to_sheet([cab, ...filas]);
      ws['!cols'] = cab.map((h, i) => ({ wch: i === 1 || i === cab.length - 1 ? 40 : i === 0 ? 14 : 16 }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Tareas');
      XLSX.writeFile(wb, nombre + '.xlsx');
    } catch {
      // Sin la librería, se descarga CSV (Excel también lo abre).
      const csv = [cab, ...filas].map(f => f.map(v => /[",\n;]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = nombre + '.csv';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    UI.toast(`${tareas.length} tareas exportadas`, { tipo: 'ok' });
  }

  return { filasATareas, mapearEstado, mapearPrioridad, huella, importarArchivo, exportar, cargarXLSX, hojaConCodigo, planActualizacion, esExportacionSinCodigo };
})();

if (typeof module !== 'undefined') module.exports = { Importador };

</script>
<script>
/* ── js/login.js ── */
// ═══════════════════════════════════════════════════════════════════
// PANTALLA DE INICIO DE SESIÓN (+ fondo animado decorativo)
// ═══════════════════════════════════════════════════════════════════

const Login = {
  el: id => document.getElementById(id),

  mostrar() {
    this.el('login').hidden = false;
    this.el('demo-tip').hidden = Datos.modo !== 'demo';
    this.formulario('entrar');
    Escena3D.iniciar(1);
  },

  ocultar() {
    this.el('login').hidden = true;
    Escena3D.iniciar(CONFIG.FONDO_EN_APP);
  },

  formulario(cual) {
    this.el('frm-entrar').hidden = cual !== 'entrar';
    this.el('frm-recuperar').hidden = cual !== 'recuperar';
    this.mensaje('', '');
  },

  mensaje(texto, tipo) {
    const m = this.el('login-msg');
    m.textContent = texto;
    m.className = 'login-msg ' + tipo;
    m.hidden = !texto;
  },
  error(texto) { this.mensaje(texto, 'error'); },

  async entrar(e) {
    e?.preventDefault();
    const email = this.el('inp-email').value.trim();
    const pass = this.el('inp-pass').value;
    if (!email || (!pass && Datos.modo !== 'demo')) { this.error('Ingresa correo y contraseña.'); return; }
    const btn = this.el('btn-entrar');
    btn.disabled = true; btn.textContent = 'Entrando…';
    try {
      const perfil = await Datos.login(email, pass);
      this.el('inp-pass').value = '';
      await App.entrar(perfil);
    } catch (err) {
      this.error(err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Iniciar sesión';
    }
  },

  async recuperar(e) {
    e?.preventDefault();
    const email = this.el('inp-rec-email').value.trim();
    if (!email) { this.error('Ingresa tu correo.'); return; }
    try {
      await Datos.recuperar(email);
      this.mensaje('Enlace enviado. Revisa tu correo (también la carpeta de spam).', 'ok');
    } catch (err) { this.error(err.message); }
  },
};

// Fondo animado: una malla de puntos en perspectiva que ondula como el mar
// (violeta → coral → naranja) y estrellas que titilan arriba. Está detrás de
// todo: a plena intensidad en el inicio de sesión y más tenue dentro de la
// aplicación (CONFIG.FONDO_EN_APP). Canvas 2D: no necesita librerías.
const Escena3D = {
  s: null,

  detener() {
    if (!this.s) return;
    cancelAnimationFrame(this.s.frame);
    removeEventListener('mousemove', this.s.onMouse);
    removeEventListener('resize', this.s.onResize);
    this.s = null;
  },

  // intensidad: 0 = apagado, 1 = como en el inicio de sesión. Si ya está
  // corriendo, solo cambia la intensidad (con transición suave).
  iniciar(intensidad = 1) {
    if (intensidad <= 0) { this.detener(); document.getElementById('fondo-canvas')?.getContext('2d')?.clearRect(0, 0, innerWidth, innerHeight); return; }
    if (this.s) { this.s.objetivo = intensidad; if (this.s.quieto) { this.s.k = intensidad; this.s.dibujar(0); } return; }
    const canvas = document.getElementById('fondo-canvas');
    const ctx = canvas?.getContext('2d');
    if (!ctx) return;
    const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const mezcla = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(',');
    const violeta = [139, 92, 246], coral = [255, 77, 109], naranja = [255, 138, 61];
    // Color según la posición en pantalla: violeta a la izquierda, coral al centro, naranja a la derecha.
    const colores = Array.from({ length: 41 }, (_, i) => { const t = i / 40; return t < 0.5 ? mezcla(violeta, coral, t * 2) : mezcla(coral, naranja, (t - 0.5) * 2); });
    const estrellas = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.55, r: 0.5 + Math.random(), f: Math.random() * Math.PI * 2, v: 0.6 + Math.random() * 1.6 }));

    let w = 0, h = 0, dpr = 1, mx = 0, my = 0, cx = 0, cy = 0;
    const onResize = () => {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (quieto) dibujar(0);
    };
    const onMouse = e => { mx = e.clientX / w - 0.5; my = e.clientY / h - 0.5; };

    const dibujar = t => {
      ctx.clearRect(0, 0, w, h);
      const k = s.k;
      const oscuro = document.documentElement.dataset.theme === 'dark';
      cx += (mx - cx) * 0.04; cy += (my - cy) * 0.04;

      for (const e of estrellas) {
        ctx.globalAlpha = k * (oscuro ? 0.55 : 0.35) * (0.3 + 0.7 * Math.abs(Math.sin(e.f + t * e.v)));
        ctx.fillStyle = oscuro ? '#fda4af' : '#e11d48';
        ctx.beginPath(); ctx.arc(e.x * w - cx * 20, e.y * h - cy * 12, e.r, 0, 6.283); ctx.fill();
      }

      // Malla en perspectiva: z=5 (fila del fondo, en el horizonte) a z=2 (fila del frente, al pie).
      const FILAS = 30, COLS = Math.max(36, Math.min(110, Math.round(w / 13)));
      const horizonte = h * ((w < 700 ? 0.6 : 0.52) + cy * 0.03);
      const piso = h + 30 - horizonte;
      const amplitud = Math.min(h, 900) * 0.2;
      ctx.globalCompositeOperation = oscuro ? 'lighter' : 'source-over';
      for (let fi = 0; fi < FILAS; fi++) {
        const z = 5 - (fi / (FILAS - 1)) * 3;
        const prof = (1 / z - 0.2) / 0.3;          // 0 al fondo, 1 al frente
        const escala = 5 / z;
        for (let c = 0; c < COLS; c++) {
          const xn = (c / (COLS - 1)) * 2 - 1;     // -1 … 1
          const px = w / 2 + (xn * 0.62 * w - cx * 60) * escala;
          if (px < -8 || px > w + 8) continue;
          const xw = xn * 6;
          const y = Math.sin(xw * 0.9 + t * 1.2) * Math.cos(z * 1.4 + t * 0.8) * 0.6 + Math.sin(xw * 0.4 - z * 0.9 + t * 0.6) * 0.4;
          const py = horizonte + piso * prof - y * amplitud * (0.35 + prof * 0.65);
          const r = (0.9 + prof * 2.6) * (1 + y * 0.3);
          ctx.globalAlpha = k * Math.max(0.1, Math.min(1, (0.4 + prof * 0.6) * (0.8 + y * 0.3)));
          ctx.fillStyle = `rgb(${colores[Math.max(0, Math.min(40, Math.round((px / w) * 40)))]})`;
          ctx.beginPath(); ctx.arc(px, py, Math.max(r, 0.4), 0, 6.283); ctx.fill();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    };

    const s = { onMouse, onResize, frame: 0, k: intensidad, objetivo: intensidad, quieto, dibujar, n: 0 };
    this.s = s;
    addEventListener('resize', onResize);
    onResize();
    if (quieto) return;
    addEventListener('mousemove', onMouse);
    const t0 = performance.now();
    const animar = ahora => {
      s.frame = requestAnimationFrame(animar);
      s.k += (s.objetivo - s.k) * 0.05;
      // Dentro de la aplicación basta con 30 cuadros por segundo: ahorra batería.
      if (s.objetivo < 1 && Math.abs(s.objetivo - s.k) < 0.01 && (s.n++ & 1)) return;
      dibujar((ahora - t0) / 1000);
    };
    s.frame = requestAnimationFrame(animar);
  },
};

</script>
<script>
/* ── js/app.js ── */
// ═══════════════════════════════════════════════════════════════════
// APLICACIÓN — estado global, acciones sobre tareas, eventos y arranque
//
// Flujo: un evento del usuario → una acción de App → Datos (Supabase o
// demo) → App.render() vuelve a pintar la vista activa a partir del estado.
// ═══════════════════════════════════════════════════════════════════

const App = {
  estado: {
    perfil: null,
    colaboradores: [],
    tareas: [],
    conectado: false,
    errorCarga: null,
    vista: 'inicio',
    tema: 'claro',
    filtros: { alcance: 'mias', texto: '', colaborador: '', estado: '', prioridad: '', categoria: '', dia: '', diaHasta: '', diaSegun: 'todas' },
    tablero: { agrupar: 'estado' },
    lista: { orden: 'fecha_vencimiento', dir: 1, limite: CONFIG.LIMITE_LISTA },
    cal: { modo: 'mes', ref: Util.hoyISO() },
    rend: { periodo: 'todo' },
  },

  // ── Consultas sobre el estado ──────────────────────────────────────
  tarea(id) { return this.estado.tareas.find(t => t.id === id); },

  colaborador(id) { return this.estado.colaboradores.find(c => c.id === id) || null; },

  colaboradorDe(t) {
    if (t.asignado_a) return this.colaborador(t.asignado_a) || { id: t.asignado_a, nombre: t.asignado_nombre || 'Colaborador' };
    if (t.asignado_nombre) return { id: null, nombre: t.asignado_nombre };
    return null;
  },

  categorias() {
    return [...new Set([...CATEGORIAS, ...this.estado.tareas.map(t => t.categoria).filter(Boolean)])];
  },

  esMia(t) {
    const uid = Permisos.uid;
    return t.asignado_a === uid || (!t.asignado_a && t.creado_por === uid);
  },

  // Tareas que el usuario ve en tablero, lista y calendario.
  // Las completadas se archivan: solo aparecen con el filtro de estado "Completada"
  // o con el filtro de fechas (para auditar, en ese rango se ven todas, también las completadas).
  tareasVisibles({ sinFiltros = false, estado = this.estado.filtros.estado } = {}) {
    const f = this.estado.filtros;
    let lista = this.estado.tareas;
    if (f.alcance === 'mias' || !Permisos.verEquipo()) lista = lista.filter(t => this.esMia(t));
    if (sinFiltros) return lista;
    const hoy = Util.hoyISO();
    const q = Util.normalizar(f.texto);
    const fechaDia = FILTRO_DIA_FECHA[f.diaSegun] || FILTRO_DIA_FECHA.todas;
    const rango = rangoFiltroDia(f);
    const dentro = d => !!d && (!rango.desde || d >= rango.desde) && (!rango.hasta || d <= rango.hasta);
    const enRango = t => [].concat(fechaDia(t)).some(dentro);
    return lista.filter(t =>
      (!f.colaborador || t.asignado_a === f.colaborador) &&
      (estado ? (estado === 'vencida' ? Metricas.estadoEfectivo(t, hoy) === 'vencida' : t.estado === estado) : rango || t.estado !== 'completada') &&
      (!rango || enRango(t)) &&
      (!f.prioridad || t.prioridad === f.prioridad) &&
      (!f.categoria || t.categoria === f.categoria) &&
      (!q || Util.normalizar(`${t.titulo} ${t.empresa || ''} ${t.descripcion || ''}`).includes(q)));
  },

  // ── Acciones sobre tareas ──────────────────────────────────────────
  async crear(datos) {
    const base = { estado: 'pendiente', prioridad: 'media', categoria: 'Otro', asignado_a: Permisos.uid, ...datos };
    if (base.estado === 'completada') { base.progreso = 100; base.completada_at ??= new Date().toISOString(); }
    if (['en_progreso', 'en_revision'].includes(base.estado)) base.iniciada_at ??= new Date().toISOString();
    const t = await Datos.crearTarea(base);
    if (!this.tarea(t.id)) { this.estado.tareas.push(t); this._version++; }
    this._registrar(t.id, 'creacion', 'Creó la tarea');
    if (t.asignado_a && t.asignado_a !== Permisos.uid) this._notificarAsignacion(t);
    this.render();
    UI.toast('Tarea creada', { tipo: 'ok' });
    return t;
  },

  // Calcula los campos que dependen de otros (progreso, fecha de completado).
  _derivar(t, cambios) {
    const c = { ...cambios };
    if ('checklist' in c && c.checklist.length) c.progreso = Util.pct(c.checklist.filter(i => i.hecho).length, c.checklist.length);
    if (c.estado === 'completada' && t.estado !== 'completada') c.progreso = 100;
    if (c.estado && c.estado !== 'completada' && t.estado === 'completada' && (c.progreso ?? t.progreso) === 100) c.progreso = 80;
    // completada_at se envía siempre: las gráficas dependen de ella y no todas las bases
    // de datos tienen el trigger que la fija (si existe, el trigger tiene la última palabra).
    // Si el cambio ya trae las fechas (por ejemplo, al Deshacer), se respetan: así deshacer
    // un paso a Pendiente no reinicia el cronómetro ni deshacer una reapertura lo alarga.
    if (c.estado && c.estado !== t.estado && !('completada_at' in c)) c.completada_at = c.estado === 'completada' ? new Date().toISOString() : null;
    // Cronómetro: empieza al salir de Pendiente y se detiene al completar (ver iniciadaAlCambiar).
    if (c.estado && !('iniciada_at' in c)) {
      const ini = iniciadaAlCambiar(t.estado, c.estado, t.iniciada_at);
      if (ini !== undefined) c.iniciada_at = ini;
    }
    // Pausa: volver a Pendiente la borra; completar una tarea en pausa cierra la pausa
    // (el tiempo pausado no cuenta).
    if (c.estado && c.estado !== t.estado && Datos.conPausa !== false && !('pausada_at' in c)) {
      if (c.estado === 'pendiente') { if (t.pausada_at || t.pausa_seg) Object.assign(c, { pausada_at: null, pausa_seg: 0 }); }
      else if (c.estado === 'completada' && t.pausada_at) {
        const fin = Date.parse(c.completada_at || t.completada_at || new Date().toISOString());
        c.pausa_seg = (t.pausa_seg || 0) + Math.max(0, Math.round((fin - Date.parse(t.pausada_at)) / 1000));
        c.pausada_at = null;
      }
    }
    return { enviar: c, local: {} };
  },

  async actualizar(id, cambios, { mensaje = null, deshacible = true } = {}) {
    const t = this.tarea(id);
    if (!t) return;
    if (!Permisos.editarTarea(t)) { UI.toast('No tienes permiso para modificar esta tarea.', { tipo: 'error' }); return; }
    const antes = structuredClone(t);
    const { enviar, local } = this._derivar(t, cambios);
    Object.assign(t, enviar, local);
    this._version++;
    this.render();
    try {
      const guardada = await Datos.actualizarTarea(id, enviar);
      this._reemplazar(guardada);
      this._registrarCambios(antes, guardada);
      if (guardada.estado === 'completada' && antes.estado !== 'completada') this._notificarCompletada(guardada);
      if (guardada.asignado_a && guardada.asignado_a !== antes.asignado_a && guardada.asignado_a !== Permisos.uid) this._notificarAsignacion(guardada);
      this.render();
      if (mensaje) {
        const revertir = {};
        for (const k of Object.keys(enviar)) revertir[k] = antes[k] ?? null;
        UI.toast(mensaje, { tipo: 'ok', deshacer: deshacible ? () => this.actualizar(id, revertir, { mensaje: 'Cambio revertido', deshacible: false }) : null });
      }
      return guardada;
    } catch (e) {
      this._reemplazar(antes);
      this.render();
      UI.toast(e.message, { tipo: 'error' });
      throw e;
    }
  },

  async eliminar(id) {
    const t = this.tarea(id);
    if (!t) return false;
    if (!Permisos.eliminarTarea(t)) { UI.toast('No tienes permiso para eliminar esta tarea.', { tipo: 'error' }); return false; }
    if (!confirm(`¿Eliminar la tarea "${t.titulo}"? Esta acción no se puede deshacer.`)) return false;
    try {
      await Datos.eliminarTarea(id);
      this.estado.tareas = this.estado.tareas.filter(x => x.id !== id);
      this._version++;
      this.render();
      UI.toast('Tarea eliminada');
      return true;
    } catch (e) { UI.toast(e.message, { tipo: 'error' }); return false; }
  },

  // Pausa o reanuda el cronómetro (almuerzo, salidas…). El tiempo en pausa no cuenta.
  pausar(id) {
    const t = this.tarea(id);
    if (!t || !t.iniciada_at || !['en_progreso', 'en_revision'].includes(t.estado)) return;
    if (Datos.conPausa === false) {
      UI.toast('Para pausar el cronómetro, el administrador debe ejecutar supabase/pausa.sql en Supabase.', { tipo: 'error' });
      return;
    }
    const enPausa = !!t.pausada_at;
    const cambios = enPausa
      ? { pausada_at: null, pausa_seg: (t.pausa_seg || 0) + Math.max(0, Math.round((Date.now() - Date.parse(t.pausada_at)) / 1000)) }
      : { pausada_at: new Date().toISOString() };
    return this.actualizar(id, cambios, { mensaje: enPausa ? 'Cronómetro reanudado' : 'Cronómetro en pausa: el tiempo no corre hasta que lo reanudes', deshacible: false })
      .then(g => { if (g) this._registrar(id, 'edicion', enPausa ? 'Reanudó el cronómetro' : 'Pausó el cronómetro'); })
      .catch(() => {});
  },

  completar(id) {
    const t = this.tarea(id);
    if (!t) return;
    const hecha = t.estado === 'completada';
    return this.actualizar(id, { estado: hecha ? 'en_progreso' : 'completada' }, { mensaje: hecha ? 'Tarea reabierta' : '✓ Tarea completada · la encuentras en el filtro Completada' }).catch(() => {});
  },

  // Arrastrar y soltar: campo = estado | asignado_a | prioridad | fecha_vencimiento
  mover(id, campo, valor) {
    const t = this.tarea(id);
    if (!t) return;
    valor = valor || null;
    if ((t[campo] || null) === valor) return;
    if (campo === 'asignado_a' && valor !== Permisos.uid && !Permisos.asignarAOtros()) {
      UI.toast('Solo un administrador puede asignar tareas a otros colaboradores.', { tipo: 'error' });
      return;
    }
    const textos = {
      estado: () => 'Movida a ' + (ESTADOS.find(e => e.id === valor)?.label || valor),
      asignado_a: () => 'Asignada a ' + (this.colaborador(valor)?.nombre || 'nadie'),
      prioridad: () => 'Prioridad: ' + (PRIORIDADES.find(p => p.id === valor)?.label || valor),
      fecha_vencimiento: () => 'Reprogramada para el ' + Util.fmtFecha(valor),
    };
    this.actualizar(id, { [campo]: valor }, { mensaje: textos[campo]?.() || 'Tarea actualizada' }).catch(() => {});
  },

  _reemplazar(t) {
    const i = this.estado.tareas.findIndex(x => x.id === t.id);
    if (i >= 0) this.estado.tareas[i] = t; else this.estado.tareas.push(t);
    this._version++;
  },

  // ── Seguimiento (bitácora de cada tarea) ──────────────────────────
  _registrar(tareaId, tipo, texto) {
    Datos.registrarActividad(tareaId, tipo, texto).catch(e => console.warn('[seguimiento]', e.message));
  },

  _registrarCambios(antes, despues) {
    const nombreEstado = id => ESTADOS.find(e => e.id === id)?.label || id;
    if (antes.estado !== despues.estado) this._registrar(despues.id, 'estado', `Cambió el estado: ${nombreEstado(antes.estado)} → ${nombreEstado(despues.estado)}`);
    if ((antes.asignado_a || null) !== (despues.asignado_a || null)) this._registrar(despues.id, 'asignacion', `Asignó la tarea a ${this.colaborador(despues.asignado_a)?.nombre || 'nadie'}`);
    if ((antes.fecha_vencimiento || null) !== (despues.fecha_vencimiento || null)) this._registrar(despues.id, 'fecha', `Cambió la fecha límite: ${Util.fmtFecha(antes.fecha_vencimiento)} → ${Util.fmtFecha(despues.fecha_vencimiento)}`);
    if (antes.prioridad !== despues.prioridad) this._registrar(despues.id, 'edicion', `Cambió la prioridad a ${PRIORIDADES.find(p => p.id === despues.prioridad)?.label}`);
  },

  // ── Microsoft Teams ────────────────────────────────────────────────
  _notificarCompletada(t) {
    Teams.enviar('✅ Tarea completada', `**${t.titulo}**${t.empresa ? ' · ' + t.empresa : ''}\n\nCompletada por **${this.estado.perfil?.nombre}**`, this.colaboradorDe(t)?.nombre);
  },
  _notificarAsignacion(t) {
    const quien = this.colaborador(t.asignado_a)?.nombre || 'un colaborador';
    Teams.enviar('📌 Nueva tarea asignada', `**${t.titulo}** asignada a **${quien}**${t.fecha_vencimiento ? '\n\nVence: ' + Util.fmtFecha(t.fecha_vencimiento) : ''}`, quien);
  },

  // ── Navegación y render ────────────────────────────────────────────
  ir(vista) {
    if (!Vistas[vista] || !Vistas[vista].visible()) vista = 'inicio';
    if (location.hash !== '#/' + vista) history.replaceState(null, '', '#/' + vista);
    this.estado.vista = vista;
    window.scrollTo(0, 0);
    this.render();
  },

  _pendienteRender: false,
  render() {
    if (this._pendienteRender) return;
    this._pendienteRender = true;
    requestAnimationFrame(() => { this._pendienteRender = false; this._pintar(); });
  },

  _pintar() {
    if (!this.estado.perfil) return;
    const main = document.getElementById('main');
    // Conservar el foco del buscador entre repintados
    const activo = document.activeElement;
    const filtroActivo = activo?.dataset?.filtro;
    const cursor = filtroActivo ? activo.selectionStart : null;
    // Y lo que se esté escribiendo en la captura rápida (un cambio remoto repinta la vista).
    const captura = main.querySelector('[data-captura] input:not(:disabled)');
    const textoCaptura = captura?.value || '';
    const focoCaptura = !!captura && activo === captura;
    this._hoyPintado = Util.hoyISO();

    this._pintarNav();
    const v = Vistas[this.estado.vista];
    document.getElementById('titulo-vista').textContent = v.titulo;
    document.body.dataset.vista = this.estado.vista;
    if (this.estado.errorCarga) {
      main.innerHTML = Vistas.inicio.errorCarga(this.estado.errorCarga);
    } else if (v.persistente && v.nodo?.() && main.firstElementChild === v.nodo()) {
      // La vista se actualiza sola: repintarla borraría lo que se está escribiendo.
    } else {
      main.innerHTML = v.render();
      v.montar?.(main);
    }

    if (filtroActivo) {
      const el = main.querySelector(`[data-filtro="${filtroActivo}"]`);
      if (el) { el.focus(); if (cursor !== null && el.setSelectionRange) el.setSelectionRange(cursor, cursor); }
    }
    const nuevaCaptura = main.querySelector('[data-captura] input');
    if (nuevaCaptura && (textoCaptura || focoCaptura)) {
      nuevaCaptura.value = textoCaptura;
      if (focoCaptura) nuevaCaptura.focus();
    }
  },

  _pintarNav() {
    const hoy = Util.hoyISO();
    const misVencidas = this.estado.tareas.filter(t => this.esMia(t) && Metricas.estadoEfectivo(t, hoy) === 'vencida').length;
    const items = Object.entries(Vistas).filter(([, v]) => v.visible()).sort((a, b) => a[1].orden - b[1].orden);
    const html = items.map(([id, v]) => `<button class="${id === this.estado.vista ? 'activo' : ''}" data-accion="ir" data-vista="${id}" ${id === this.estado.vista ? 'aria-current="page"' : ''}>
        <span class="nav-icono">${v.icono}</span><span class="nav-texto">${v.titulo}</span>
        ${id === 'inicio' && misVencidas ? `<span class="nav-badge" title="Tus tareas vencidas">${misVencidas}</span>` : ''}
        ${v.insignia?.() ? `<span class="nav-badge" title="Sin leer">${v.insignia() > 99 ? '99+' : v.insignia()}</span>` : ''}
      </button>`).join('');
    document.getElementById('nav').innerHTML = html;
    // Punto en el botón del menú cuando hay mensajes sin leer y las pestañas están ocultas
    document.querySelector('.menu-movil')?.classList.toggle('con-aviso', items.some(([, v]) => v.insignia?.()));
    this._ajustarNav();
  },

  // Si las pestañas no caben junto a los botones de la barra, se usa el menú lateral.
  _ajustarNav() {
    const cuerpo = document.body;
    cuerpo.classList.remove('nav-compacta', 'nav-ajustada');
    if (innerWidth <= 1240) return;
    const nav = document.getElementById('nav'), nueva = document.querySelector('.btn-nueva');
    if (!nav?.firstElementChild || !nueva) return;
    const cabe = () => nav.lastElementChild.getBoundingClientRect().right <= nueva.getBoundingClientRect().left - 8;
    if (cabe()) return;
    cuerpo.classList.add('nav-ajustada'); // primero, pestañas más juntas
    if (cabe()) return;
    cuerpo.classList.remove('nav-ajustada');
    const lateral = nav.closest('.lateral');
    lateral.style.transition = 'none'; // sin animación de deslizamiento al cambiar de modo
    cuerpo.classList.add('nav-compacta');
    void lateral.offsetWidth;
    lateral.style.transition = '';
  },

  // ── Sesión ─────────────────────────────────────────────────────────
  async entrar(perfil) {
    this.estado.perfil = perfil;
    Permisos.usar(perfil);
    this.estado.filtros.alcance = Permisos.esAdmin() ? 'equipo' : 'mias';
    Login.ocultar();
    document.getElementById('app').hidden = false;
    this._pintarUsuario();
    document.getElementById('main').innerHTML = '<div class="cargando">Cargando tareas…</div>';
    await this.cargar();
    this._pintarUsuario(); // de nuevo: el color del avatar depende de la lista de colaboradores
    this._conexiones = 0;
    Datos.suscribir((evento, nueva, anterior, conectado) => this._alCambiar(evento, nueva, anterior, conectado));
    Chat.iniciar();
    clearInterval(this._temporizadorRefresco);
    this._temporizadorRefresco = setInterval(() => this.refrescar(), CONFIG.SEGUNDOS_REFRESCO * 1000);
    clearInterval(this._temporizadorCrono);
    this._temporizadorCrono = setInterval(() => this._actualizarCronometros(), 15000);
    // Con la pestaña en segundo plano el navegador frena los temporizadores: al volver se ponen al día.
    if (!this._cronoAlVolver) {
      this._cronoAlVolver = () => { if (!document.hidden && this.estado.perfil) this._actualizarCronometros(); };
      document.addEventListener('visibilitychange', this._cronoAlVolver);
      addEventListener('focus', this._cronoAlVolver);
    }
    const desdeHash = location.hash.replace('#/', '');
    this.ir(Vistas[desdeHash] ? desdeHash : 'inicio');
    Avisos.iniciar();
  },

  async cargar() {
    try {
      const [colabs, tareas] = await Promise.all([
        Datos.colaboradores().catch(e => { if (e.faltaEsquema) throw e; console.warn(e.message); return []; }),
        Datos.tareas(),
      ]);
      // Si las políticas solo devuelven el propio perfil, igual debe aparecer el usuario actual.
      if (!colabs.some(c => c.id === this.estado.perfil.id)) colabs.push({ ...this.estado.perfil });
      colabs.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
      this.estado.colaboradores = colabs;
      this.estado.tareas = tareas;
      this.estado.errorCarga = null;
    } catch (e) {
      console.error(e);
      this.estado.errorCarga = e;
    }
  },

  // Resincronización silenciosa. El tiempo real no basta: pierde los cambios hechos
  // mientras el canal estuvo caído (suspensión, wifi) y, por las políticas RLS, no
  // avisa cuando una tarea deja de ser visible (p. ej. se reasigna a otra persona).
  // Solo repinta si los datos (o el día) cambiaron.
  _version: 0,            // sube con cada cambio local o remoto aplicado al estado
  _refrescando: false,
  _ultimoRefresco: 0,
  async refrescar({ forzar = false } = {}) {
    if (!this.estado.perfil || this._refrescando || document.hidden) return;
    if (!forzar && Date.now() - this._ultimoRefresco < 10000) return;
    this._refrescando = true;
    this._ultimoRefresco = Date.now();
    const version = this._version;
    const perfil = this.estado.perfil;
    try {
      const [colabs, tareas] = await Promise.all([Datos.colaboradores().catch(() => null), Datos.tareas()]);
      // Si mientras tanto hubo cambios (propios o en tiempo real), estos datos ya son viejos.
      if (version !== this._version || this.estado.perfil !== perfil) return;
      let cambio = JSON.stringify(tareas) !== JSON.stringify(this.estado.tareas);
      if (cambio) {
        // Asignaciones y cambios de estado que no llegaron por tiempo real también avisan.
        const previas = new Map(this.estado.tareas.map(t => [t.id, t]));
        for (const t of tareas) {
          const previa = previas.get(t.id);
          if (!previa || previa.asignado_a !== t.asignado_a || previa.estado !== t.estado) Avisos.alCambiarRemoto(previa ? 'UPDATE' : 'INSERT', t, previa);
        }
        this.estado.tareas = tareas;
        Avisos.revisar();
      }
      if (colabs?.length) {
        if (!colabs.some(c => c.id === perfil.id)) colabs.push({ ...perfil });
        colabs.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
        if (JSON.stringify(colabs) !== JSON.stringify(this.estado.colaboradores)) { this.estado.colaboradores = colabs; cambio = true; }
      }
      if (this.estado.errorCarga) { this.estado.errorCarga = null; cambio = true; }
      if (cambio || this._hoyPintado !== Util.hoyISO()) this.render();
    } catch (e) {
      console.warn('[refresco]', e.message);
    } finally {
      this._refrescando = false;
    }
  },

  async sincronizar() {
    await this.cargar();
    this.render();
    if (!this.estado.errorCarga) UI.toast('Datos actualizados', { tipo: 'ok' });
  },

  // Avanza los cronómetros visibles sin repintar la vista.
  _actualizarCronometros() {
    const ahora = Date.now();
    document.querySelectorAll('[data-crono]').forEach(el => {
      el.textContent = '⏱ ' + Util.fmtDuracion(ahora - Date.parse(el.dataset.crono) - (Number(el.dataset.pausa) || 0) * 1000);
    });
  },

  async salir() {
    Avisos.detener();
    clearInterval(this._temporizadorRefresco);
    clearInterval(this._temporizadorCrono);
    Notas.reiniciar();
    Clientes.reiniciar();
    Chat.reiniciar();
    await Datos.logout();
    this.estado.perfil = null;
    this.estado.tareas = [];
    // El siguiente usuario empieza limpio: sin la vista ni los filtros del anterior.
    this.estado.vista = 'inicio';
    Object.assign(this.estado.filtros, { texto: '', colaborador: '', estado: '', prioridad: '', categoria: '', dia: '', diaHasta: '' });
    this.estado.lista.limite = CONFIG.LIMITE_LISTA;
    history.replaceState(null, '', location.pathname + location.search);
    document.getElementById('app').hidden = true;
    UI.cerrarModal();
    Login.mostrar();
  },

  _alCambiar(evento, nueva, anterior, conectado) {
    if (evento === 'estado') {
      this.estado.conectado = conectado;
      const punto = document.getElementById('punto-conexion');
      if (punto) { punto.classList.toggle('off', !conectado); punto.title = conectado ? 'Conectado en tiempo real' : 'Sin conexión en tiempo real'; }
      // Al reconectar se recupera lo que cambió mientras el canal estuvo caído.
      if (conectado && this._conexiones++ > 0) this.refrescar({ forzar: true });
      return;
    }
    if (evento === 'recargar') { this.cargar().then(() => this.render()); return; }
    if (evento === 'DELETE' && anterior?.id) this.estado.tareas = this.estado.tareas.filter(t => t.id !== anterior.id);
    else if (nueva) {
      const previa = this.tarea(nueva.id);
      Avisos.alCambiarRemoto(evento, nueva, previa);
      // Se combina con la tarea conocida: el evento puede omitir columnas que no cambiaron.
      this._reemplazar(previa ? { ...previa, ...nueva } : nueva);
      Avisos.revisar(); // una tarea nueva o reprogramada puede vencer hoy: no esperar al siguiente ciclo
    }
    this._version++;
    this.render();
  },

  _pintarUsuario() {
    const p = this.estado.perfil;
    const rol = Permisos.esAdmin() ? 'Administrador' : 'Colaborador';
    document.getElementById('usuario').innerHTML = `
      ${UI.avatar(p, 30)}
      <div class="usuario-info"><strong>${Util.esc(p.nombre)}</strong><span>${rol}${Datos.modo === 'demo' ? ' · demo' : ''}</span></div>
      <span id="punto-conexion" class="punto-conexion off" title="Conectando…"></span>`;
  },

  aplicarTema(tema) {
    this.estado.tema = tema;
    document.documentElement.dataset.theme = tema === 'oscuro' ? 'dark' : 'light';
    try { localStorage.setItem('planner_tema2', tema); } catch { /* sin almacenamiento */ }
    const b = document.getElementById('btn-tema');
    // Sol para pasar a claro, luna para pasar a oscuro
    const d = tema === 'oscuro'
      ? 'M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'
      : 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z';
    if (b) b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  },
};

// ═══════════════════════════════════════════════════════════════════
// EVENTOS (delegados: un solo listener por tipo para toda la página)
// ═══════════════════════════════════════════════════════════════════
const Acciones = {
  'ir': el => App.ir(el.dataset.vista),
  'nueva-tarea': el => TareaModal.abrirNueva({ fecha_vencimiento: el.dataset.fecha, estado: el.dataset.estado, asignado_a: el.dataset.asignado, prioridad: el.dataset.prioridad }),
  'abrir-tarea': el => TareaModal.abrir(el.dataset.id),
  'completar': el => App.completar(el.dataset.id),
  'pausar': el => App.pausar(el.dataset.id),
  'alcance': el => { App.estado.filtros.alcance = el.dataset.valor; if (el.dataset.valor === 'mias') App.estado.filtros.colaborador = ''; App.render(); },
  'ver-completadas': () => { App.estado.filtros.estado = 'completada'; App.render(); },
  'limpiar-filtros': () => { Object.assign(App.estado.filtros, { texto: '', colaborador: '', estado: '', prioridad: '', categoria: '', dia: '', diaHasta: '' }); App.render(); },
  'ver-colaborador': el => {
    Object.assign(App.estado.filtros, { alcance: 'equipo', colaborador: el.dataset.id || '', estado: el.dataset.estado || '' });
    App.ir('lista');
  },
  'avisos': () => Avisos.alternar(),
  'tema': () => App.aplicarTema(App.estado.tema === 'oscuro' ? 'claro' : 'oscuro'),
  'salir': () => App.salir(),
  'sincronizar': () => App.sincronizar(),
  'cerrar-modal': () => UI.cerrarModal(),
  'menu': () => document.body.classList.toggle('menu-abierto'),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-accion]');
  if (!el) {
    if (e.target.id === 'modal') UI.cerrarModal();
    return;
  }
  const fn = Acciones[el.dataset.accion] || Vistas[App.estado.vista]?.acciones?.[el.dataset.accion] || TareaModal.acciones[el.dataset.accion];
  if (!fn) return;
  e.preventDefault();
  e.stopPropagation();
  if (el.dataset.accion === 'ir') document.body.classList.remove('menu-abierto');
  fn(el, e);
});

document.addEventListener('input', e => {
  const campo = e.target.dataset?.filtro;
  if (campo === 'texto') { App.estado.filtros.texto = e.target.value; App.render(); }
});
document.addEventListener('change', e => {
  const campo = e.target.dataset?.filtro;
  if (campo === 'rango') {
    const r = FILTRO_RANGOS.find(([v]) => v === e.target.value);
    const [desde, hasta] = r ? r[2](Util.hoyISO()) : ['', ''];
    Object.assign(App.estado.filtros, { dia: desde, diaHasta: hasta === desde ? '' : hasta });
    App.render(); return;
  }
  // Al escribir el año a mano el navegador avisa fechas a medias (0002, 0020, 0202…):
  // se ignoran para no repintar y borrar lo que se está escribiendo.
  if ((campo === 'dia' || campo === 'diaHasta') && e.target.value && e.target.value.slice(0, 4) < '1990') return;
  if (campo && campo !== 'texto') { App.estado.filtros[campo] = e.target.value; App.render(); return; }
  const fn = Vistas[App.estado.vista]?.alCambiar;
  if (e.target.dataset?.cambio && fn) fn(e.target);
});

// Tooltips de gráficas: cualquier elemento con data-tip
document.addEventListener('mouseover', e => {
  const el = e.target.closest?.('[data-tip]');
  const tip = document.getElementById('tooltip');
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip;
  tip.hidden = false;
});
document.addEventListener('mousemove', e => {
  const tip = document.getElementById('tooltip');
  if (tip.hidden) return;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = e.clientY + 18 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 18;
  tip.style.transform = `translate(${x}px, ${y}px)`;
});

// Arrastrar y soltar
document.addEventListener('dragstart', e => {
  const el = e.target.closest?.('[data-arrastrar]');
  if (!el) return;
  e.dataTransfer.setData('text/plain', el.dataset.arrastrar);
  e.dataTransfer.effectAllowed = 'move';
  requestAnimationFrame(() => el.classList.add('arrastrando'));
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('.arrastrando, .sobre').forEach(x => x.classList.remove('arrastrando', 'sobre'));
});
document.addEventListener('dragover', e => {
  const zona = e.target.closest?.('[data-soltar]');
  if (!zona) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.sobre').forEach(x => x !== zona && x.classList.remove('sobre'));
  zona.classList.add('sobre');
});
document.addEventListener('drop', e => {
  const zona = e.target.closest?.('[data-soltar]');
  if (!zona) return;
  e.preventDefault();
  zona.classList.remove('sobre');
  const id = e.dataTransfer.getData('text/plain');
  if (id) App.mover(id, zona.dataset.soltar, zona.dataset.valor);
});

let _navMedida = 0;
addEventListener('resize', () => { cancelAnimationFrame(_navMedida); _navMedida = requestAnimationFrame(() => App._ajustarNav()); });
document.fonts?.ready.then(() => App._ajustarNav());

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { UI.cerrarModal(); document.body.classList.remove('menu-abierto'); return; }
  const escribiendo = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if (!escribiendo && App.estado.perfil && document.getElementById('modal').hidden && e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    TareaModal.abrirNueva();
  }
});

// Al volver a la pestaña o a la ventana se resincroniza (refrescar limita la frecuencia).
document.addEventListener('visibilitychange', () => { if (!document.hidden) App.refrescar(); });
window.addEventListener('focus', () => App.refrescar());

window.addEventListener('hashchange', () => {
  const v = location.hash.replace('#/', '');
  if (App.estado.perfil && v !== App.estado.vista && Vistas[v]) App.ir(v);
});

// ═══════════════════════════════════════════════════════════════════
// ARRANQUE
// ═══════════════════════════════════════════════════════════════════
(async () => {
  let tema = 'oscuro';
  try { tema = localStorage.getItem('planner_tema2') || 'oscuro'; } catch { /* sin almacenamiento */ }
  App.aplicarTema(tema);
  try {
    await Datos.iniciar();
    const perfil = await Datos.sesion();
    if (perfil) { await App.entrar(perfil); return; }
  } catch (e) {
    console.error(e);
    Login.error(e.message);
  }
  Login.mostrar();
})();

</script>
</body>
