// ── INLINE EDITING ──────────────────────────────────────────
let editingCell = null; // { rowId, field, originalValue }

function startEdit(rowId, field, currentValue, el) {
  if (currentPerfil?.rol !== 'admin') return;
  if (editingCell) cancelEdit();
  editingCell = { rowId, field, originalValue: currentValue };
  const input = document.createElement(
    field === 'observaciones' ? 'textarea' : 'input'
  );
  input.value = currentValue || '';
  input.style.cssText = 'width:100%;padding:4px 8px;border-radius:6px;border:1px solid var(--blue);background:var(--bg2);color:var(--text);font-size:13px;font-family:inherit';
  input.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(input.value); }
    if (e.key === 'Escape') cancelEdit();
  };
  input.onblur = () => setTimeout(() => saveEdit(input.value), 150);
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();
}

function cancelEdit() {
  editingCell = null;
  renderAll();
}

async function saveEdit(newValue) {
  if (!editingCell) return;
  const { rowId, field, originalValue } = editingCell;
  editingCell = null;
  if (newValue === originalValue) { renderAll(); return; }

  const rec = DATA.find(r => r.id === rowId);
  if (!rec) return;

  // Update in memory immediately
  if (field.startsWith('extra_')) {
    const extraKey = field.replace('extra_', '');
    if (!rec.campos_extra) rec.campos_extra = {};
    rec.campos_extra[extraKey] = newValue;
  } else {
    rec[field] = newValue;
  }

  // Save to Supabase
  if (supabase && rec._db_id) {
    let updateObj = {};
    if (field === 'empresa') updateObj.empresa_nombre = newValue;
    else if (field === 'nit') updateObj.empresa_nit = newValue;
    else if (field === 'contador') updateObj.contador = newValue;
    else if (field === 'impuesto') updateObj.impuesto = newValue;
    else if (field === 'periodo') updateObj.periodo = newValue;
    else if (field === 'fecha') updateObj.fecha_vencimiento = newValue;
    else if (field === 'grupo') updateObj.grupo = newValue;
    else if (field === 'municipio') updateObj.municipio = newValue;
    else if (field === 'observaciones') updateObj.observaciones = newValue;
    else if (field.startsWith('extra_')) updateObj.campos_extra = rec.campos_extra;

    const { error } = await supabase.from('obligaciones')
      .update({ ...updateObj, updated_at: new Date().toISOString() })
      .eq('id', rec._db_id);

    if (error) {
      showToast('❌ Error al guardar: ' + error.message);
      // Revert
      if (field.startsWith('extra_')) {
        const extraKey = field.replace('extra_', '');
        rec.campos_extra[extraKey] = originalValue;
      } else { rec[field] = originalValue; }
    } else {
      showToast('✅ Guardado correctamente');
      // Log to historial
      if (supabase) {
        await supabase.from('historial_cambios').insert({
          usuario_nombre: currentPerfil?.nombre || 'Admin',
          accion: 'EDICIÓN_DIRECTA',
          tabla_afectada: 'obligaciones',
          registro_id: rec._db_id,
          valor_anterior: { [field]: originalValue },
          valor_nuevo: { [field]: newValue },
          descripcion: rec.empresa + ' · ' + rec.impuesto + ' · campo: ' + field
        });
      }
    }
  }
  renderAll();
}

function editableCell(rowId, field, value, extraStyle) {
  const isAdmin = currentPerfil?.rol === 'admin';
  if (!isAdmin) return `<td>${value || '—'}</td>`;
  return `<td style="cursor:pointer;${extraStyle||''}" 
    onclick="startEdit('${escH(rowId)}','${field}','${escH(String(value||''))}',this)"
    title="Clic para editar">${value || '<span style="color:var(--text3);font-style:italic">editar</span>'}</td>`;
}

// ── BOOT ─────────────────────────────────────────────
(async () => {
  // Try to init Supabase
  await initSB();

  // Show offline tip if no Supabase
  if (!SB_READY) {
    document.getElementById('offline-tip').style.display = 'block';
  }

  // If Supabase connected, check for existing session
  if (supabase) {
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.user) {
        currentUser   = session.user;
        currentPerfil = await getSBPerfil(currentUser.id);
        await enterApp();
        return;
      }
    } catch(e) { console.warn('Session check error:', e); }
  }

  // Show login screen (already visible by default)
})();
</script>
