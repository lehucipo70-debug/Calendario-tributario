<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Tributario 2026</title>
<style>
  :root {
    --bg: #f8fafc; --bg2: #ffffff; --bg3: #f1f5f9; --border: #e2e8f0;
    --text: #0f172a; --text2: #475569; --text3: #94a3b8;
    --blue: #3b82f6; --blue-light: #eff6ff; --blue-text: #1d4ed8;
    --green: #10b981; --green-light: #ecfdf5; --green-text: #065f46;
    --red: #ef4444; --red-light: #fef2f2; --red-text: #991b1b;
    --amber: #f59e0b; --amber-light: #fffbeb; --amber-text: #92400e;
    --gray-light: #f8fafc; --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
    --radius: 12px;
  }
  .dark {
    --bg: #0f172a; --bg2: #1e293b; --bg3: #334155; --border: #334155;
    --text: #f1f5f9; --text2: #94a3b8; --text3: #64748b;
    --blue-light: #1e3a5f; --blue-text: #93c5fd;
    --green-light: #064e3b; --green-text: #6ee7b7;
    --red-light: #450a0a; --red-text: #fca5a5;
    --amber-light: #451a03; --amber-text: #fcd34d;
    --gray-light: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
  
  /* Layout */
  header { position: sticky; top:0; z-index:50; background: var(--bg2); border-bottom: 1px solid var(--border); backdrop-filter: blur(8px); }
  .header-inner { max-width:1400px; margin:0 auto; padding:0 16px; height:56px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .logo { display:flex; align-items:center; gap:10px; }
  .logo-icon { width:36px; height:36px; background: linear-gradient(135deg,#3b82f6,#6366f1); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .logo-text h1 { font-size:15px; font-weight:700; }
  .logo-text p { font-size:11px; color:var(--text3); }
  nav { display:flex; gap:4px; }
  nav button { padding:6px 12px; border-radius:8px; border:none; background:transparent; color:var(--text2); font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; white-space:nowrap; }
  nav button:hover { background:var(--bg3); color:var(--text); }
  nav button.active { background:var(--blue); color:#fff; }
  .header-actions { display:flex; gap:8px; align-items:center; }
  .btn-icon { width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--bg2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; transition:background .15s; }
  .btn-icon:hover { background:var(--bg3); }
  
  main { max-width:1400px; margin:0 auto; padding:20px 16px; }

  /* Cards */
  .card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); }
  .card-pad { padding:20px; }
  .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:16px; }
  .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  @media(max-width:900px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:600px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} nav button span.label{display:none;} }

  /* Stat cards */
  .stat-card { padding:16px; }
  .stat-label { font-size:11px; color:var(--text2); font-weight:500; text-transform:uppercase; letter-spacing:.5px; }
  .stat-value { font-size:36px; font-weight:800; margin:4px 0; }
  .stat-bar { height:4px; border-radius:2px; background:var(--bg3); overflow:hidden; margin-top:8px; }
  .stat-fill { height:4px; border-radius:2px; }
  .c-blue { color:var(--blue); } .fill-blue { background:var(--blue); }
  .c-green { color:var(--green); } .fill-green { background:var(--green); }
  .c-red { color:var(--red); } .fill-red { background:var(--red); }
  .c-amber { color:var(--amber); } .fill-amber { background:var(--amber); }

  /* Filters */
  .filters { display:flex; flex-wrap:wrap; gap:8px; padding:16px; border-bottom:1px solid var(--border); }
  input[type=text], input[type=month], select {
    padding:7px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); font-size:13px;
    outline:none; transition:border-color .15s;
  }
  input[type=text]:focus, select:focus { border-color:var(--blue); }
  input[type=text] { flex:1; min-width:200px; }
  .btn { padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg2); color:var(--text2); font-size:13px; cursor:pointer; transition:all .15s; }
  .btn:hover { background:var(--bg3); }
  .btn-primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  .btn-primary:hover { background:#2563eb; }
  .btn-success { background:var(--green); color:#fff; border-color:var(--green); font-size:12px; padding:4px 10px; }
  .btn-success:hover { background:#059669; }
  .btn-ghost { background:transparent; border:none; color:var(--text3); cursor:pointer; font-size:12px; padding:4px 8px; border-radius:6px; }
  .btn-ghost:hover { color:var(--red); background:var(--red-light); }
  .filter-count { font-size:12px; color:var(--text3); padding:0 16px 12px; }

  /* Table */
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:10px 14px; font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.4px; background:var(--bg3); border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:9px 14px; border-bottom:1px solid var(--border); font-size:13px; }
  tr:hover td { background:var(--bg3); }
  tr:last-child td { border-bottom:none; }

  /* Status badges & row colors */
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .b-green { background:var(--green-light); color:var(--green-text); }
  .b-red { background:var(--red-light); color:var(--red-text); }
  .b-amber { background:var(--amber-light); color:var(--amber-text); }
  .b-gray { background:var(--bg3); color:var(--text2); }
  .b-blue { background:var(--blue-light); color:var(--blue-text); }
  .row-green { border-left:3px solid var(--green); }
  .row-red { border-left:3px solid var(--red); }
  .row-amber { border-left:3px solid var(--amber); }
  .row-gray { border-left:3px solid var(--border); }

  /* Progress bar multi */
  .progress-multi { height:8px; border-radius:4px; background:var(--bg3); overflow:hidden; display:flex; }
  .progress-label { display:flex; gap:16px; margin-top:8px; }
  .progress-label span { font-size:11px; color:var(--text2); display:flex; align-items:center; gap:4px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* Contador cards */
  .cnt-card { padding:20px; }
  .cnt-avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#6366f1,#8b5cf6); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:18px; flex-shrink:0; }
  .mini-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:12px 0; }
  .mini-stat { padding:8px 12px; border-radius:8px; }
  .mini-stat b { display:block; font-size:22px; font-weight:800; }
  .mini-stat span { font-size:11px; }
  .ms-green { background:var(--green-light); color:var(--green-text); }
  .ms-red { background:var(--red-light); color:var(--red-text); }
  .ms-amber { background:var(--amber-light); color:var(--amber-text); }
  .ms-gray { background:var(--bg3); color:var(--text2); }

  /* Calendar */
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); }
  .cal-head { text-align:center; padding:8px; font-size:11px; font-weight:600; color:var(--text2); background:var(--bg3); border-bottom:1px solid var(--border); }
  .cal-cell { min-height:80px; padding:4px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); vertical-align:top; }
  .cal-cell:nth-child(7n) { border-right:none; }
  .cal-day-num { font-size:12px; font-weight:500; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
  .cal-today .cal-day-num { background:var(--blue); color:#fff; }
  .cal-event { font-size:10px; padding:1px 4px; border-radius:3px; margin-top:2px; truncate:clip; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:default; }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(4px); }
  .modal { background:var(--bg2); border-radius:16px; padding:24px; width:100%; max-width:480px; box-shadow:0 25px 50px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto; }
  .modal h3 { font-size:17px; font-weight:700; margin-bottom:4px; }
  .modal p.sub { font-size:13px; color:var(--text2); margin-bottom:16px; }
  textarea { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-size:13px; font-family:inherit; resize:vertical; outline:none; }
  .modal-actions { display:flex; gap:8px; margin-top:16px; }
  .modal-actions button { flex:1; padding:10px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; border:none; transition:all .15s; }
  .modal-confirm { background:var(--green); color:#fff; }
  .modal-confirm:hover { background:#059669; }
  .modal-cancel { background:var(--bg3); color:var(--text); }
  .modal-cancel:hover { background:var(--border); }

  /* Empresa cards */
  .emp-card { padding:16px; cursor:pointer; transition:box-shadow .15s; }
  .emp-card:hover { box-shadow:0 4px 12px rgba(0,0,0,.15); }
  .emp-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  .emp-tag { font-size:10px; padding:2px 6px; border-radius:4px; background:var(--blue-light); color:var(--blue-text); }

  /* Misc */
  .section-title { font-size:18px; font-weight:700; margin-bottom:16px; }
  .mb4 { margin-bottom:16px; } .mb3 { margin-bottom:12px; }
  .mt3 { margin-top:12px; } .mt2 { margin-top:8px; }
  .flex { display:flex; } .items-center { align-items:center; }
  .justify-between { justify-content:space-between; } .gap-2 { gap:8px; }
  .gap-3 { gap:12px; } .text-sm { font-size:13px; } .text-xs { font-size:11px; }
  .font-mono { font-family:monospace; }
  .text-muted { color:var(--text2); }
  .truncate { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .empty { text-align:center; padding:48px; color:var(--text3); font-size:14px; }
  .ring-red { outline:1px solid var(--red); }
  .venc-item { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-radius:8px; margin-bottom:4px; }
  .imp-row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .imp-name { width:160px; font-size:12px; font-weight:500; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .imp-bar { flex:1; height:6px; border-radius:3px; background:var(--bg3); overflow:hidden; }
  .imp-fill { height:6px; border-radius:3px; background:var(--green); }
  .imp-pct { font-size:11px; color:var(--text2); width:60px; text-align:right; }
  .cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .detail-list { margin-top:12px; max-height:400px; overflow-y:auto; }
  .mobile-nav { display:none; }
  @media(max-width:700px) { nav { display:none; } .mobile-nav { display:flex; overflow-x:auto; gap:4px; padding:8px 16px; border-top:1px solid var(--border); } }
  .history-note { font-size:11px; color:var(--text3); font-style:italic; margin-top:2px; }

  /* ── AUTH SCREEN ── */
  .auth-overlay { position:fixed;inset:0;background:linear-gradient(135deg,#1e3a5f,#0f172a);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px; }
  .auth-card { background:#1e293b;border:1px solid #334155;border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.5); }
  .auth-logo { text-align:center;margin-bottom:28px; }
  .auth-logo .icon { font-size:48px;display:block;margin-bottom:8px; }
  .auth-logo h1 { color:#f1f5f9;font-size:22px;font-weight:800; }
  .auth-logo p { color:#64748b;font-size:13px;margin-top:4px; }
  .auth-tab { display:flex;gap:2px;background:#0f172a;border-radius:10px;padding:3px;margin-bottom:24px; }
  .auth-tab button { flex:1;padding:8px;border-radius:8px;border:none;background:transparent;color:#64748b;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s; }
  .auth-tab button.active { background:#3b82f6;color:#fff; }
  .auth-field { margin-bottom:14px; }
  .auth-field label { display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:5px; }
  .auth-field input { width:100%;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:14px;outline:none;transition:border-color .15s; }
  .auth-field input:focus { border-color:#3b82f6; }
  .auth-btn { width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .15s; }
  .auth-btn:hover { opacity:.9; }
  .auth-btn:disabled { opacity:.5;cursor:not-allowed; }
  .auth-error { background:#450a0a;border:1px solid #991b1b;color:#fca5a5;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px; }
  .auth-success { background:#064e3b;border:1px solid #065f46;color:#6ee7b7;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px; }
  .auth-link { text-align:center;margin-top:16px;font-size:12px;color:#64748b; }
  .auth-link button { background:none;border:none;color:#3b82f6;cursor:pointer;font-size:12px;text-decoration:underline; }
  
  /* ── USER BADGE ── */
  .user-badge { display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:20px;background:var(--bg3);border:1px solid var(--border); }
  .user-avatar { width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0; }
  .user-info { font-size:11px;line-height:1.3; }
  .user-name { font-weight:600;color:var(--text); }
  .user-role { color:var(--text3); }
  .btn-logout { padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;cursor:pointer;transition:all .15s; }
  .btn-logout:hover { background:var(--red-light);color:var(--red-text);border-color:var(--red); }

  /* ── REALTIME INDICATOR ── */
  .realtime-dot { width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse-dot 2s infinite; }
  .realtime-dot.offline { background:#ef4444;animation:none; }
  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
  .toast { position:fixed;bottom:20px;right:20px;z-index:300;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;animation:slideIn .3s ease;max-width:320px; }
  @keyframes slideIn { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

  /* ── ADMIN PANEL ── */
  .admin-table th { background:var(--bg3); }
  .badge-admin { background:#fef3c7;color:#92400e;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700; }
  .badge-contador { background:#eff6ff;color:#1d4ed8;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700; }

  /* ── HISTORIAL ── */
  .hist-item { padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px; }
  .hist-icon { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0; }
  .hist-icon.update { background:#eff6ff; }
  .hist-body { flex:1; }
  .hist-desc { font-size:13px;font-weight:500; }
  .hist-meta { font-size:11px;color:var(--text3);margin-top:2px; }

</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-overlay" style="position:fixed;inset:0;background:linear-gradient(135deg,#1e3a5f,#0f172a);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px">
  <div style="background:#1e293b;border:1px solid #334155;border-radius:20px;padding:36px;width:100%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.5)">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:48px">📋</div>
      <h1 style="color:#f1f5f9;font-size:20px;font-weight:800;margin:8px 0 4px">Calendario Tributario</h1>
      <p style="color:#64748b;font-size:13px">Gestión tributaria 2026</p>
    </div>

    <div id="offline-tip" style="display:none;background:#172554;border:1px solid #1d4ed8;border-radius:8px;padding:10px;font-size:12px;color:#93c5fd;margin-bottom:14px;text-align:center">
      ⚡ Modo sin conexión — cualquier correo y contraseña funcionan
    </div>
    <div id="auth-err" style="display:none;background:#450a0a;border:1px solid #991b1b;color:#fca5a5;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px"></div>
    <div id="auth-ok"  style="display:none;background:#064e3b;border:1px solid #065f46;color:#6ee7b7;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px"></div>

    <!-- LOGIN -->
    <div id="frm-login">
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:5px">Correo electrónico</label>
        <input id="inp-email" type="email" placeholder="correo@empresa.com"
          style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:14px;outline:none;box-sizing:border-box"
          onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <div style="margin-bottom:16px">
        <label style="display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:5px">Contraseña</label>
        <input id="inp-pass" type="password" placeholder="Tu contraseña"
          style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:14px;outline:none;box-sizing:border-box"
          onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <button id="btn-login" onclick="doLogin()"
        style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-size:15px;font-weight:700;cursor:pointer">
        Iniciar sesión
      </button>
      <div style="text-align:center;margin-top:14px">
        <button onclick="showFrm('rec')" style="background:none;border:none;color:#3b82f6;cursor:pointer;font-size:12px;text-decoration:underline">¿Olvidaste tu contraseña?</button>
      </div>
    </div>

    <!-- RECOVERY -->
    <div id="frm-rec" style="display:none">
      <p style="color:#94a3b8;font-size:13px;margin-bottom:14px">Te enviaremos un enlace de recuperación.</p>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:5px">Correo electrónico</label>
        <input id="inp-rec-email" type="email" placeholder="correo@empresa.com"
          style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:14px;outline:none;box-sizing:border-box" />
      </div>
      <button onclick="doRecovery()"
        style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-size:15px;font-weight:700;cursor:pointer">
        Enviar enlace
      </button>
      <div style="text-align:center;margin-top:14px">
        <button onclick="showFrm('login')" style="background:none;border:none;color:#3b82f6;cursor:pointer;font-size:12px;text-decoration:underline">← Volver</button>
      </div>
    </div>
  </div>
</div>

<!-- MAIN APP (hidden until login) -->
<div id="app" style="display:none">
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">📋</div>
        <div class="logo-text">
          <h1>Calendario Tributario</h1>
          <p id="hdr-sub">2026</p>
        </div>
      </div>
      <nav id="main-nav"></nav>
      <div class="header-actions" id="hdr-right">

async function decompress(b64) {
  const bin   = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ds     = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(bytes); writer.close();
  const chunks = [];
  const reader = ds.readable.getReader();
  while (true) { const {done, value} = await reader.read(); if (done) break; chunks.push(value); }
  const out = new Uint8Array(chunks.reduce((n, c) => n + c.length, 0));
  let off = 0; for (const ch of chunks) { out.set(ch, off); off += ch.length; }
  return JSON.parse(new TextDecoder().decode(out));
}

// ── VERSION HISTORY ─────────────────────────────────────────
// Stores last 5 uploaded Excel versions with metadata
const VERSION_KEY = 'trib_versions_v1';
const MAX_VERSIONS = 5;

function saveVersion(fileName, data, columnMap) {
  try {
    const versions = getVersions();
    const newVersion = {
      id: Date.now(),
      fileName,
      date: new Date().toISOString(),
      recordCount: data.length,
      columnMap, // original column structure from Excel
      data       // full dataset snapshot
    };
    versions.unshift(newVersion);
    if (versions.length > MAX_VERSIONS) versions.pop();
    localStorage.setItem(VERSION_KEY, JSON.stringify(versions));
    return newVersion.id;
  } catch(e) { console.warn('Version save failed:', e); return null; }
}

function getVersions() {
  try { return JSON.parse(localStorage.getItem(VERSION_KEY) || '[]'); } catch { return []; }
}

function deleteVersion(id) {
  const versions = getVersions().filter(v => v.id !== id);
  localStorage.setItem(VERSION_KEY, JSON.stringify(versions));
}

function loadDynamicTabs() {
  try {
    const stored = JSON.parse(localStorage.getItem('dyn_tabs_v1') || '{}');
    DYNAMIC_TABS = stored;
    // Register each stored dynamic tab
    for (const id of Object.keys(DYNAMIC_TABS)) {
      const tab = DYNAMIC_TABS[id];
      if (!TABS.find(t => t.id === id)) {
        TABS.push({ id, icon: tab.icon, label: tab.label });
      }
    }
  } catch {}
}

function renderNav() {
  const nav = document.getElementById('main-nav');
  const mnav = document.getElementById('mobile-nav');
  if (!nav) return;
  nav.innerHTML = TABS.map(t=>`<button class="${t.id===state.tab?'active':''}" onclick="setTab('${t.id}')">${t.icon} <span class="label">${t.label}</span></button>`).join('');
  if (mnav) mnav.innerHTML = TABS.map(t=>`<button class="btn ${t.id===state.tab?'btn-primary':''}" onclick="setTab('${t.id}')" style="flex-shrink:0;padding:6px 10px;font-size:12px">${t.icon} ${t.label}</button>`).join('');
}

let state = { dark:false, tab:'dashboard', filters:{}, search:'', calYear:2026, calMonth:5 };

// ── AUTH UI HELPERS ──────────────────────────────────
function showFrm(name) {
  document.getElementById('frm-login').style.display = name==='login' ? 'block' : 'none';
  document.getElementById('frm-rec').style.display   = name==='rec'   ? 'block' : 'none';
  document.getElementById('auth-err').style.display  = 'none';
  document.getElementById('auth-ok').style.display   = 'none';
}
function authErr(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('auth-ok').style.display = 'none';
}
function authOk(msg) {
  const el = document.getElementById('auth-ok');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('auth-err').style.display = 'none';
}

// ── SUPABASE INIT ────────────────────────────────────
async function initSB() {
  if (!SB_READY) return false;
  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { autoRefreshToken:true, persistSession:true }
    });
    return true;
  } catch(e) { console.warn('Supabase init error:', e); return false; }
}

async function getSBPerfil(uid) {
  try {
    const { data, error } = await supabase.from('perfiles').select('*').eq('id', uid).single();
    if (error) { console.warn('getSBPerfil error:', error.message); return null; }
    return data;
  } catch(e) { console.warn('getSBPerfil failed:', e); return null; }
}

// ── LOGIN ────────────────────────────────────────────
async function doLogin() {
  const email = (document.getElementById('inp-email').value || '').trim();
  const pass  = (document.getElementById('inp-pass').value  || '');
  if (!email || !pass) { authErr('Ingresa correo y contraseña.'); return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  btn.style.opacity = '0.7';

  try {
    if (!supabase) {
      // ── MODO OFFLINE ──
      currentUser   = { email, id:'local' };
      currentPerfil = { rol:'admin', nombre: email.split('@')[0], correo: email };
      await enterApp();
    } else {
      // ── MODO ONLINE ──
      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
      if (error) {
        authErr(error.message.includes('Invalid') ? 'Correo o contraseña incorrectos.' : error.message);
        return;
      }
      currentUser   = data.user;
      currentPerfil = await getSBPerfil(currentUser.id);
      await enterApp();
    }
  } catch(err) {
    authErr('Error inesperado: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
    btn.style.opacity = '1';
  }
}

async function doRecovery() {
  const email = (document.getElementById('inp-rec-email').value || '').trim();
  if (!email) { authErr('Ingresa tu correo.'); return; }
  if (supabase) {
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href
    });
    if (error) { authErr('Error al enviar enlace: ' + error.message); return; }
  }
  authOk('Enlace enviado. Revisa tu correo (incluyendo spam).');
}

async function doLogout() {
  if (supabase) await supabase.auth.signOut();
  if (_realtimeChannel && supabase) { supabase.removeChannel(_realtimeChannel); _realtimeChannel = null; }
  currentUser = null; currentPerfil = null; DATA = []; persisted = {};
  TABS = [
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'obligaciones',icon:'📋',label:'Obligaciones'},
    {id:'contadores',icon:'👤',label:'Contadores'},
    {id:'calendario',icon:'📅',label:'Calendario'},
    {id:'empresas',icon:'🏢',label:'Empresas'},
  ];
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('inp-email').value = '';
  document.getElementById('inp-pass').value  = '';
  showFrm('login');
}

// ── ENTER APP ────────────────────────────────────────
let _isEnteringApp = false;
async function enterApp() {
  if (_isEnteringApp) return;
  _isEnteringApp = true;
  // Add admin tabs if needed
  if (currentPerfil?.rol === 'admin') {
    if (!TABS.find(t => t.id === 'admin')) {
      TABS.push({id:'admin',    icon:'⚙️', label:'Admin'});
      TABS.push({id:'historial',icon:'📜', label:'Historial'});
    }
  }

  // Show app, hide auth
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  // Render user badge
  const nombre  = currentPerfil?.nombre || currentUser?.email?.split('@')[0] || 'Usuario';
  const isAdmin = currentPerfil?.rol === 'admin';
  document.getElementById('hdr-right').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700">${nombre[0]?.toUpperCase()||'U'}</div>
      <div style="font-size:11px;line-height:1.3">
        <div style="font-weight:600">${nombre}</div>
        <div style="color:var(--text3)">${isAdmin?'👑 Admin':'📊 Contador'}</div>
      </div>
      <div id="rt-dot" style="width:8px;height:8px;border-radius:50%;background:#94a3b8" title="Estado conexión"></div>
    </div>
    <button onclick="doLogout()" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:11px;cursor:pointer">Salir</button>
    <button class="btn-icon" id="btn-dark">🌙</button>`;

  // Add sync button to header
  const syncBtn = document.createElement('button');
  syncBtn.id = 'btn-sync';
  syncBtn.title = 'Sincronizar datos';
  syncBtn.style.cssText = 'padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s';
  syncBtn.innerHTML = '🔄 Sincronizar';
  syncBtn.onclick = syncData;
  document.getElementById('hdr-right').prepend(syncBtn);

  // Re-attach dark mode
  document.getElementById('btn-dark').addEventListener('click', () => {
    state.dark = !state.dark;
    document.documentElement.classList.toggle('dark', state.dark);
    document.getElementById('btn-dark').textContent = state.dark ? '☀️' : '🌙';
  });

  // Load data
  document.getElementById('main-content').innerHTML = '<div class="empty">⏳ Cargando datos...</div>';

  // Load persisted state
  await loadPersistedState();
  loadDynamicTabs(); // Restore dynamic tabs from previous import

  // Load obligations
  DATA = await loadObligations();

  // Filter for contador role
  if (currentPerfil?.rol === 'contador' && currentPerfil?.nombre) {
    const nombre = currentPerfil.nombre.toUpperCase().trim();
    if (['JAT','ILP','EXTERNO'].includes(nombre)) {
      // Firma login — filter by grupo
      state.filters.grupo = nombre;
      state.filters.contador = '';
    } else {
      // Regular contador — filter by name
      state.filters.contador = currentPerfil.nombre;
      state.filters.grupo = '';
    }
  }

  renderAll();
  initRealtime();
  _isEnteringApp = false;
}

// ── DATA LOADING ─────────────────────────────────────
async function loadObligations() {
  if (supabase) {
    try {
      const { data, error } = await supabase
        .from('obligaciones').select('*')
        .order('fecha_vencimiento');
      if (!error && data?.length) {
        useSupabase = true;
        return data.map(r => ({
          id:   r.empresa_nit + '||' + r.impuesto + '||' + r.periodo + '||' + r.fecha_vencimiento + '||' + (r.municipio||''),
          empresa: r.empresa_nombre,
          nit:     r.empresa_nit,
          contador: r.contador || '',
          impuesto: r.impuesto,
          periodo:  r.periodo,
          fecha:    r.fecha_vencimiento,
          grupo:       r.grupo || '',
          municipio: r.municipio || '', campos_extra: r.campos_extra || null,
          _db_id:      r.id,
          _estado_db: r.estado,
          _pres_por:  r.presentado_por,
          _pres_at:   r.fecha_presentacion,
          _obs:       r.observaciones,
        }));
      }
    } catch(e) {
      console.warn('Supabase data error:', e);
      showToast('⚠️ Error conectando a Supabase. Mostrando datos locales.');
    }
  }
  useSupabase = false;
  return await decompress(DATA_B64);
}

async function loadPersistedState() {
  if (supabase && useSupabase) { persisted = {}; return; }
  try {
    const userChanges = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    persisted = userChanges;
  } catch { persisted = {}; }
}

function saveLocal() {
  if (!useSupabase) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(persisted)); } catch {}
  }
}

// ── REALTIME ─────────────────────────────────────────
let _realtimeChannel = null;
function initRealtime() {
  if (!supabase) return;
  // Clean up existing channel before creating new one
  if (_realtimeChannel) { supabase.removeChannel(_realtimeChannel); _realtimeChannel = null; }
  const dot = document.getElementById('rt-dot');
  _realtimeChannel = supabase.channel('obl-rt')
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'obligaciones'}, payload => {
      const r   = payload.new;
      const key = r.empresa_nit + '||' + r.impuesto + '||' + r.periodo + '||' + r.fecha_vencimiento + '||' + (r.municipio||'');
      const idx = DATA.findIndex(x => x.id === key);
      if (idx >= 0) {
        DATA[idx]._estado_db = r.estado;
        DATA[idx]._pres_por  = r.presentado_por;
        DATA[idx]._pres_at   = r.fecha_presentacion;
        DATA[idx]._obs       = r.observaciones;
      }
      showToast(`✅ ${r.empresa_nombre} · ${r.impuesto} → ${r.estado}`);
      renderAll();
    })
    .subscribe(status => {
      if (dot) dot.style.background = status === 'SUBSCRIBED' ? '#10b981' : '#ef4444';
    });
}

// ── MODAL ────────────────────────────────────────────
function openModal(key, empresa, impuesto, periodo) {
  modalKey = key;
  document.getElementById('modal-sub').textContent = empresa + ' · ' + impuesto + ' · ' + periodo;
  document.getElementById('modal-obs').value = '';
  document.getElementById('modal').style.display = 'flex';
}

async function confirmPresent() {
  if (!modalKey) return;
  const obs  = document.getElementById('modal-obs').value;
  const rec  = DATA.find(r => r.id === modalKey);
  const name = currentPerfil?.nombre || 'Usuario';

  if (useSupabase && rec?._db_id) {
    const { error } = await supabase.from('obligaciones').update({
      estado: 'Presentado', fecha_presentacion: new Date().toISOString(),
      presentado_por: name, observaciones: obs || null
    }).eq('id', rec._db_id);
    if (error) { showToast('❌ Error al guardar'); return; }
    rec._estado_db = 'Presentado'; rec._pres_por = name;
    rec._pres_at   = new Date().toISOString(); rec._obs = obs;
  } else {
    persisted[modalKey] = { status:'Presentado', at: new Date().toISOString(), por: name, obs };
    saveLocal();
  }
  document.getElementById('modal').style.display = 'none';
  renderAll();
}

async function unmark(key) {
  const rec = DATA.find(r => r.id === key);
  if (useSupabase && rec?._db_id) {
    await supabase.from('obligaciones').update({
      estado:'Pendiente', fecha_presentacion:null, presentado_por:null
    }).eq('id', rec._db_id);
    rec._estado_db = 'Pendiente'; rec._pres_por = null; rec._pres_at = null;
  } else {
    delete persisted[key]; saveLocal();
  }
  renderAll();
}

// ═══════════════════════════════════════════════════
// RENDER FUNCTIONS (original, untouched)
// ═══════════════════════════════════════════════════
function getStatus(rec) {
  // Supabase mode: use DB estado
  if (useSupabase && rec._estado_db) {
    if (rec._estado_db === 'Presentado') return 'Presentado';
    const d = new Date(rec.fecha);
    if (d < TODAY) return 'Vencido';
    return (d - TODAY)/86400000 <= WARN_DAYS ? 'Próximo' : 'Pendiente';
  }
  // Offline mode: use persisted state
  if (persisted[rec.id]?.status === 'Presentado') return 'Presentado';
  const d = new Date(rec.fecha);
  if (d < TODAY) return 'Vencido';
  const diff = (d - TODAY)/86400000;
  if (diff <= WARN_DAYS) return 'Próximo';
  return 'Pendiente';
}

function fmtDate(s) {
  if(!s) return '-';
  const str = String(s).trim();
  // Format: YYYY-MM-DD (standard)
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
    const [y,m,d] = str.substring(0,10).split('-');
    return d+'/'+m+'/'+y;
  }
  // Format: "Tuesday, July 14, 2026" or "July 14, 2026"
  try {
    const d = new Date(str);
    if (!isNaN(d.getTime())) {
      const dd = String(d.getDate()).padStart(2,'0');
      const mm = String(d.getMonth()+1).padStart(2,'0');
      return dd+'/'+mm+'/'+d.getFullYear();
    }
  } catch(e) {}
  return str;
}

function rowClass(st) {
  return st==='Presentado'?'row-green':st==='Vencido'?'row-red':st==='Próximo'?'row-amber':'row-gray';
}
function badgeClass(st) {
  return st==='Presentado'?'b-green':st==='Vencido'?'b-red':st==='Próximo'?'b-amber':'b-gray';
}
function bgClass(st) {
  return st==='Presentado'?'var(--green-light)':st==='Vencido'?'var(--red-light)':st==='Próximo'?'var(--amber-light)':'var(--bg3)';
}

function impBadge(imp) {
  return `<span class="badge b-blue" style="font-size:10px">${imp}</span>`;

function markBtn(key, empresa, impuesto, periodo) {
  return `<button class="btn btn-success" onclick="openModal('${escH(key)}','${escH(empresa)}','${escH(impuesto)}','${escH(periodo)}')">✓ Marcar</button>`;
}

function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

function filteredData() {
  const f = state.filters, q = (state.search||'').toLowerCase();
  return DATA.filter(r => {
    const st = getStatus(r);
    if(f.contador && r.contador!==f.contador) return false;
    if(f.empresa && r.empresa!==f.empresa) return false;
    if(f.impuesto && r.impuesto!==f.impuesto) return false;
    if(f.status && st!==f.status) return false;
    if(f.mes && !r.fecha.startsWith(f.mes)) return false;
    if(f.grupo && r.grupo!==f.grupo) return false;
    // Dynamic extra column filters
    for (const col of getExtraCols()) {
      const fkey = 'extra_' + col.key;
      if (f[fkey] && r.campos_extra?.[col.key] !== f[fkey]) return false;
    }
    if(q && !r.empresa.toLowerCase().includes(q) && !(r.nit||'').includes(q) && !r.impuesto.toLowerCase().includes(q) && !r.contador.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

function allContadores() { return [...new Set(DATA.map(r=>r.contador).filter(Boolean))].sort(); }
function allEmpresas()   { return [...new Set(DATA.map(r=>r.empresa))].sort(); }
function allGrupos()    { return [...new Set(DATA.map(r=>r.grupo).filter(Boolean))].sort(); }
function allImpuestos()  { return [...new Set(DATA.map(r=>r.impuesto))].sort(); }

// ─── SELECTS ────────────────────────────────────────────────────────────────
function makeSelect(id, label, opts, val, onchange) {
  let html = `<select id="${id}" onchange="${onchange}">`;
  html += `<option value="">${label}</option>`;
  opts.forEach(o=>{ html+=`<option value="${escH(o)}" ${val===o?'selected':''}>${o}</option>`; });
  html += '</select>';
  return html;
}

// ─── RENDER DASHBOARD ───────────────────────────────────────────────────────
// ── EXTRA COLUMNS HELPERS ─────────────────────────
function getExtraCols() {
  // Use cached result within same render cycle
  if (window._cachedExtraCols) return window._cachedExtraCols;
  // Detect extra columns from loaded DATA
  const colMap = {};
  for (const r of DATA) {
    if (r.campos_extra) {
      for (const key of Object.keys(r.campos_extra)) {
        if (!colMap[key]) {
          colMap[key] = { key, label: key.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) };
        }
      }
    }
  }
  window._cachedExtraCols = Object.values(colMap);
  return window._cachedExtraCols;
}

function allExtraVals(key) {
  return [...new Set(DATA.map(r => r.campos_extra?.[key]).filter(v => v != null && v !== ''))].sort();
}

function renderContadorExtras(obs) {
  const extraCols = getExtraCols();
  if (!extraCols.length) return '';
  let html = '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:11px">';
  for (const col of extraCols) {
    const vals = allExtraVals(col.key);
    if (!vals.length) continue;
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">';
    html += '<span style="color:var(--text2);font-weight:600">' + col.label + ':</span>';
    for (const val of vals) {
      const count = obs.filter(r => r.campos_extra?.[col.key] === val).length;
      if (!count) continue;
      const color = val==='SI'?'var(--green)':val==='NO'?'var(--red)':'var(--blue)';
      html += '<span style="background:var(--bg3);padding:1px 6px;border-radius:10px;color:' + color + '">' + val + ': ' + count + '</span>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderExtraSummary() {
  const extraCols = getExtraCols();
  if (!extraCols.length) return '';

  let html = '<div style="margin-top:16px">';
  html += '<strong style="font-size:14px;display:block;margin-bottom:12px">📊 Resumen por indicadores adicionales</strong>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px">';

  for (const col of extraCols) {
    const vals = allExtraVals(col.key);
    if (!vals.length) continue;

    html += '<div class="card" style="padding:16px">';
    html += '<strong style="font-size:13px;display:block;margin-bottom:10px">📌 ' + col.label + '</strong>';

    for (const val of vals) {
      const obs = DATA.filter(r => r.campos_extra?.[col.key] === val);
      const pres = obs.filter(r => getStatus(r) === 'Presentado').length;
      const pct  = obs.length ? (pres/obs.length*100).toFixed(0) : 0;
      const color = val === 'SI' ? 'var(--green)' : val === 'NO' ? 'var(--red)' : 'var(--blue)';

      html += '<div style="margin-bottom:10px">';
      html += '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">';
      html += '<span style="font-weight:600">' + val + '</span>';
      html += '<span style="color:var(--text2)">' + obs.length + ' obligaciones · ' + pct + '%</span>';
      html += '</div>';
      html += '<div style="height:6px;border-radius:3px;background:var(--bg3);overflow:hidden">';
      html += '<div style="height:6px;border-radius:3px;background:' + color + ';width:' + pct + '%"></div>';
      html += '</div>';

      // List companies for this value
      const empresas = [...new Set(obs.map(r => r.empresa))].slice(0, 5);
      html += '<div style="font-size:10px;color:var(--text3);margin-top:3px">' + empresas.join(', ') + (obs.length > 5 ? '...' : '') + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

function renderDynamicTab(tabId) {
  const tab = DYNAMIC_TABS[tabId];
  if (!tab) return '<div class="empty">Pestaña no encontrada</div>';

  const rows = tab.data || [];
  if (!rows.length) return '<div class="empty">Sin datos en esta pestaña</div>';

  // Get all column names from data
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))];

  // Detect if any col looks like a date
  const isDate = v => v && /^\d{4}-\d{2}-\d{2}/.test(String(v));

  // Build filter state for this tab
  const fkey = 'dynfilter_' + tabId;
  if (!state.filters[fkey]) state.filters[fkey] = {};
  const f = state.filters[fkey];

  // Apply filters
  let filtered = rows.filter(r => {
    for (const [k, v] of Object.entries(f)) {
      if (v && String(r[k]||'').trim() !== v) return false;
    }
    return true;
  });

  // Build filter selects for cols with <= 20 unique values
  const filterSelects = cols.map(col => {
    const vals = [...new Set(rows.map(r => String(r[col]||'').trim()).filter(Boolean))];
    if (vals.length > 20 || vals.length === 0) return '';
    let sel = `<select onchange="setDynFilter('${tabId}','${col}',this.value)" style="padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px">`;
    sel += `<option value="">${col}</option>`;
    vals.sort().forEach(v => {
      const selected = f[col] === v ? 'selected' : '';
      sel += `<option value="${escH(v)}" ${selected}>${v}</option>`;
    });
    sel += '</select>';
    return sel;
  }).filter(Boolean).join('');

  // Build summary cards for key metrics
  const summaryCards = cols.slice(0, 4).map(col => {
    const vals = [...new Set(rows.map(r => String(r[col]||'').trim()).filter(Boolean))];
    if (vals.length > 10) return '';
    const counts = {};
    vals.forEach(v => { counts[v] = rows.filter(r => String(r[col]||'').trim() === v).length; });
    const cards = Object.entries(counts).map(([v,c]) => {
      const pct = (c/rows.length*100).toFixed(0);
      const isPos = ['SI','YES','OK','PAGADO','PRESENTADO'].includes(v.toUpperCase());
      const isNeg = ['NO','PENDIENTE','VENCIDO'].includes(v.toUpperCase());
      const color = isPos?'var(--green)':isNeg?'var(--red)':'var(--blue)';
      return `<div style="padding:12px 16px;border-radius:10px;background:var(--bg3);min-width:120px">
        <div style="font-size:11px;color:var(--text2);margin-bottom:4px">${col}: <strong>${v}</strong></div>
        <div style="font-size:24px;font-weight:800;color:${color}">${c}</div>
        <div style="height:4px;border-radius:2px;background:var(--bg2);margin-top:6px">
          <div style="height:4px;border-radius:2px;background:${color};width:${pct}%"></div>
        </div>
        <div style="font-size:10px;color:var(--text3);margin-top:3px">${pct}% del total</div>
      </div>`;
    }).join('');
    return cards ? `<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">${col}</div><div style="display:flex;flex-wrap:wrap;gap:8px">${cards}</div></div>` : '';
  }).filter(Boolean).join('');

  // Build table
  const thead = cols.map(c => `<th>${c}</th>`).join('');
  const tbody = filtered.slice(0, 500).map(r => {
    const tds = cols.map(col => {
      const v = r[col] != null ? String(r[col]).trim() : '—';
      const isPos = ['SI','YES','OK','PAGADO','PRESENTADO'].includes(v.toUpperCase());
      const isNeg = ['NO','PENDIENTE','VENCIDO'].includes(v.toUpperCase());
      const badge = (isPos || isNeg) ? `<span class="badge ${isPos?'b-green':'b-red'}">${v}</span>` : (isDate(v) ? `<span class="font-mono" style="font-size:12px">${fmtDate(v)}</span>` : v);
      return `<td>${badge}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px">
    <h2 style="font-size:18px;font-weight:700">${tab.icon} ${tab.label}</h2>
    <div style="display:flex;gap:8px;align-items:center">
      <span style="font-size:12px;color:var(--text2)">${filtered.length} de ${rows.length} registros</span>
      <button onclick="clearDynFilter('${tabId}')" class="btn" style="font-size:12px">Limpiar filtros</button>
      <button onclick="exportDynTab('${tabId}')" class="btn btn-primary" style="font-size:12px">📥 Exportar Excel</button>
    </div>
  </div>

  ${summaryCards ? `<div class="card card-pad mb4">${summaryCards}</div>` : ''}

  <div class="card mb4">
    <div class="filters">${filterSelects || '<span style="color:var(--text3);font-size:13px">Sin filtros disponibles para esta hoja</span>'}</div>
    <div class="filter-count">${filtered.length} registros</div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>${thead}</tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>
  </div>`;
}

function setDynFilter(tabId, col, val) {
  const fkey = 'dynfilter_' + tabId;
  if (!state.filters[fkey]) state.filters[fkey] = {};
  state.filters[fkey][col] = val;
  renderAll();
}

function clearDynFilter(tabId) {
  state.filters['dynfilter_' + tabId] = {};
  renderAll();
}

function exportDynTab(tabId) {
  const tab = DYNAMIC_TABS[tabId];
  if (!tab || !tab.data.length) return;
  const cols = [...new Set(tab.data.flatMap(r => Object.keys(r)))];
  const csvEscape = v => { const s = String(v ?? ''); return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const rows = tab.data.map(r => cols.map(c => csvEscape(r[c])).join(','));
  const csv = [cols.map(c => csvEscape(c)).join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = tabId + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 100);
}

function renderCalendario() {
  const y=state.calYear, m=state.calMonth;
  const prefix=y+'-'+String(m+1).padStart(2,'0');
  const monthObs=DATA.filter(r=>r.fecha.startsWith(prefix) && getStatus(r)!=='Presentado');

  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayStr=TODAY.toISOString().split('T')[0];

  let calCells='';
  for(let i=0;i<firstDay;i++) calCells+=`<div class="cal-cell"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayObs=monthObs.filter(r=>r.fecha===ds);
    const isToday=ds===todayStr;
    calCells+=`<div class="cal-cell ${isToday?'cal-today':''}">
      <div class="cal-day-num">${d}</div>

  const listItems=monthObs.sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(r=>{

      </div>
    </div>`;
  }).join('');

  return `

    <h2 class="section-title" style="margin-bottom:0">${MONTH_NAMES[m]} ${y}</h2>

      <button class="btn" onclick="navCal(-1)">← Anterior</button>

  </div>

function showEmpresaDetail(nitOrEmp, empresa) {
  const obs = DATA.filter(r=>nitOrEmp && r.nit ? r.nit===nitOrEmp : r.empresa===empresa);
  const pres=obs.filter(r=>getStatus(r)==='Presentado').length;
  const venc=obs.filter(r=>getStatus(r)==='Vencido').length;
  const prox=obs.filter(r=>getStatus(r)==='Próximo').length;
  const nit=obs[0]?.nit||'';
  document.getElementById('dm-title').textContent=empresa;
  document.getElementById('dm-sub').textContent='NIT: '+(nit||'N/A')+' · '+obs.length+' obligaciones';
  // Dynamic extra cols summary for this empresa
  const extraCols = getExtraCols();
  let extraHtml = '';
  if (extraCols.length) {
    extraHtml = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">';
    for (const col of extraCols) {
      // Get unique values for this col within this empresa's obligations
      const empVals = [...new Set(obs.map(r => r.campos_extra?.[col.key]).filter(v => v != null && v !== ''))];
      for (const val of empVals) {
        const count = obs.filter(r => r.campos_extra?.[col.key] === val).length;
        if (!count) continue;
        // Auto color based on value content
        const isPositive = ['SI','YES','OK','PAGADO','PRESENTADO','ACTIVO'].includes(val.toUpperCase());
        const isNegative = ['NO','NO PAGADO','VENCIDO','INACTIVO','PENDIENTE'].includes(val.toUpperCase());
        const bg = isPositive?'var(--green-light)':isNegative?'var(--red-light)':'var(--blue-light)';
        const tc = isPositive?'var(--green-text)':isNegative?'var(--red-text)':'var(--blue-text)';
        extraHtml += '<span style="background:'+bg+';color:'+tc+';padding:2px 8px;border-radius:10px;font-size:11px">'+col.label+': '+val+' ('+count+')</span>';
      }
    }
    extraHtml += '</div>';
  }

  const badges=`<div class="flex gap-2 mt2 mb3">
    <span class="badge b-green">${pres} Presentadas</span>
    <span class="badge b-red">${venc} Vencidas</span>
    <span class="badge b-amber">${prox} Próximas</span>
  </div>` + extraHtml;
  const items=obs.sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(r=>{
    const st=getStatus(r);
    return `<div class="venc-item ${rowClass(st)}" style="background:${bgClass(st)};margin-bottom:4px">
      <div>
        <span style="font-weight:600;font-size:13px">${r.impuesto}</span>
        <span class="text-xs text-muted" style="margin-left:8px">${r.periodo}</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-mono text-xs">${fmtDate(r.fecha)}</span>

          ?`<button class="btn btn-success" onclick="openModal('${escH(r.id)}','${escH(r.empresa)}','${escH(r.impuesto)}','${escH(r.periodo)}')">✓</button>`
          :`<button class="btn-ghost" onclick="unmark('${escH(r.id)}')">↩</button>`
        }
      </div>
    </div>`;
  }).join('');
  document.getElementById('dm-body').innerHTML=badges+`<div class="detail-list">${items}</div>`;
  document.getElementById('detail-modal').style.display='flex';
}

}

async function restoreVersion(id) {
  const versions = getVersions();
  const ver = versions.find(v => v.id === id);
  if (!ver) return;
  if (!confirm(`¿Combinar versión "${ver.fileName}" con los datos actuales?\nSe agregarán los registros que no existan actualmente.`)) return;

  showToast('⏳ Restaurando versión...');
  
  if (supabase) {
    // Get existing keys to avoid duplicates
    const { data: existing } = await supabase.from('obligaciones')
      .select('empresa_nit,impuesto,periodo,fecha_vencimiento,municipio');
    const existingKeys = new Set((existing||[]).map(r => 
      r.empresa_nit+'||'+r.impuesto+'||'+r.periodo+'||'+r.fecha_vencimiento+'||'+(r.municipio||'')));

    // Filter only records that don't exist
    const toAdd = ver.data.filter(r => {
      const k = (r.empresa_nit||r.empresa_nit)+'||'+r.impuesto+'||'+r.periodo+'||'+r.fecha_vencimiento+'||'+(r.municipio||'');
      return !existingKeys.has(k);
    });

    if (!toAdd.length) { showToast('ℹ️ No hay registros nuevos para combinar'); return; }

    for (let i = 0; i < toAdd.length; i += 300) {
      await supabase.from('obligaciones').upsert(toAdd.slice(i,i+300), 
        { onConflict: 'empresa_nit,impuesto,periodo,fecha_vencimiento,municipio' });
    }
    showToast(`✅ ${toAdd.length} registros combinados desde versión anterior`);
    DATA = await loadObligations();
    renderAll();
  } else {
    showToast('⚠️ Conecta Supabase para restaurar versiones');
  }
}

// ── DOWNLOAD CURRENT DATA AS EXCEL ─────────────────────────
async function downloadCurrentExcel(versionId) {
  // Load SheetJS if needed
  if (!window.XLSX) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }

  let sourceData = DATA;
  let fileName = 'calendario_tributario_' + new Date().toISOString().split('T')[0] + '.xlsx';

  // If restoring a specific version
  if (versionId) {
    const versions = getVersions();
    const ver = versions.find(v => v.id === versionId);
    if (!ver) { showToast('❌ Versión no encontrada'); return; }
    sourceData = ver.data;
    fileName = 'version_' + new Date(ver.date).toLocaleDateString('es-CO').replace(/\//g,'-') + '_' + ver.fileName;
  }

  // Build Excel rows — same column structure as original upload
  const colHeaders = [
    'GRUPO', 'EMPRESA', 'NIT', 'MUNICIPIO', 'CONTADOR',
    'TIPO DE IMPUESTO', 'PERÍODO', 'FECHA VENCIMIENTO', 'ESTADO'
  ];

  // Add extra col headers from data
  const extraCols = getExtraCols();
  const allHeaders = [...colHeaders, ...extraCols.map(c => c.label.toUpperCase())];

  const rows = sourceData.map(r => {
    const base = [
      r.grupo || '',
      r.empresa || '',
      r.nit || '',
      r.municipio || r.campos_extra?.municipio || '',
      r.contador || '',
      r.impuesto || '',
      r.periodo || '',
      r.fecha || r.fecha_vencimiento || '',
      getStatus(r)
    ];
    const extras = extraCols.map(c => r.campos_extra?.[c.key] || '');
    return [...base, ...extras];
  });

  const wsData = [allHeaders, ...rows];
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(wsData);

  // Style header row
  const headerRange = XLSX.utils.decode_range(ws['!ref']);
  for (let C = headerRange.s.c; C <= headerRange.e.c; C++) {
    const cellRef = XLSX.utils.encode_cell({r:0, c:C});
    if (!ws[cellRef]) continue;
    ws[cellRef].s = { font:{bold:true, color:{rgb:'FFFFFF'}}, fill:{fgColor:{rgb:'1E3A5F'}, patternType:'solid'} };
  }

  // Auto column widths
  ws['!cols'] = allHeaders.map(h => ({ wch: Math.max(h.length + 2, 15) }));

  XLSX.utils.book_append_sheet(wb, ws, 'IMPUESTOS 2026');
  XLSX.writeFile(wb, fileName);
  showToast('✅ Excel descargado: ' + fileName);
}

async function importData() {
  if (!supabase) { alert('Configura Supabase primero.'); return; }
  showToast('⏳ Importando datos...');
  try {
    const raw      = await decompress(DATA_B64);
    const defaults = await decompress(PERSISTED_B64);

    // Empresas
    const empMap = {};
    raw.forEach(r => {
      const nit = (r.nit||'').trim();
      if (nit && !empMap[nit]) empMap[nit] = {nit, razon_social: r.empresa.trim(), contador_responsable: r.contador||null};
    });
    await supabase.from('empresas').upsert(Object.values(empMap), {onConflict:'nit'});

    // Obligaciones in chunks
    const oblArr = raw.map(r => {
      const key = (r.nit||r.empresa).trim()+'||'+r.impuesto+'||'+r.periodo;
      const pre = defaults[key]?.status === 'Presentado';
      return {
        empresa_nit: (r.nit||r.empresa).trim(), empresa_nombre: r.empresa.trim(),
        impuesto: r.impuesto, subimpuesto: r.subimpuesto||null,
        periodo: r.periodo, fecha_vencimiento: r.fecha,
        estado: pre ? 'Presentado' : 'Pendiente',
        fecha_presentacion: pre ? defaults[key].at : null,
        presentado_por: pre ? 'Cargue inicial' : null,
        observaciones: pre ? 'Anterior al 22/06/2026' : null,
        contador: r.contador||null,
        grupo: r.grupo||null
      };
    });
    for (let i = 0; i < oblArr.length; i += 500) {
      await supabase.from('obligaciones').upsert(oblArr.slice(i,i+500), {onConflict:'empresa_nit,impuesto,periodo,fecha_vencimiento,municipio'});
    }
    showToast(`✅ ${oblArr.length} obligaciones importadas`);
    DATA = await loadObligations();
    renderAll();
  } catch(e) { showToast('❌ Error: ' + e.message); console.error(e); }
}
window.importData = importData;

async function handleExcelFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  // Validate file size (max 20MB)
  if (file.size > 20 * 1024 * 1024) {
    alert('El archivo es demasiado grande. Máximo permitido: 20MB. Tu archivo: ' + (file.size/1024/1024).toFixed(1) + 'MB');
    event.target.value = '';
    return;
  }
  // Validate file extension
  if (!file.name.match(/\.xlsx?$/i)) {
    alert('Formato no válido. Solo se aceptan archivos .xlsx o .xls');
    event.target.value = '';
    return;
  }
  event.target.value = ''; // reset so same file can be selected again

  // Show modal
  const modal = document.getElementById('import-modal');
  modal.style.display = 'flex';
  document.getElementById('import-log').innerHTML = '';
  document.getElementById('import-close-btn').style.display = 'none';
  setImportProgress(5, 'Cargando librería Excel...', '📦 Iniciando importación de: ' + file.name);

  try {
    // Load SheetJS dynamically
    if (!window.XLSX) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    setImportProgress(15, 'Leyendo archivo...', '📖 Leyendo hojas del Excel...');

    // Read file
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array', cellDates: true });
    const SKIP_SHEETS = ['INICIO','Hoja1','Sheet1'];
    const sheets = wb.SheetNames.filter(n => !SKIP_SHEETS.includes(n));
    setImportProgress(25, 'Procesando hojas...', `📋 ${sheets.length} hojas encontradas: ${sheets.join(', ')}`);

    // Detect main data sheet vs extra sheets
    // Main data sheet: has empresa/nit/contador columns
    // Extra sheets: anything else → becomes a dynamic tab
    const mainSheets = [];
    const extraSheets = [];
    for (const sn of sheets) {
      const ws = wb.Sheets[sn];
      const sr = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, nrows:5});
      const headerStr = (sr[0]||[]).concat(sr[1]||[]).join(' ').toUpperCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const isMain = ['EMPRESA','NIT','IMPUESTO','TIPO DE IMPUESTO'].some(k => headerStr.includes(k));
      if (isMain) mainSheets.push(sn);
      else extraSheets.push(sn);
    }
    setImportProgress(27, 'Clasificando hojas...', 
      `📊 Hojas de datos: ${mainSheets.join(', ')||'ninguna'} | Pestañas nuevas: ${extraSheets.join(', ')||'ninguna'}`);

    // Process extra sheets → dynamic tabs
    for (const sn of extraSheets) {
      const ws = wb.Sheets[sn];
      const jsonData = XLSX.utils.sheet_to_json(ws, {defval:null, raw:false, dateNF:'yyyy-mm-dd'});
      if (!jsonData.length) continue;
      // Clean null values
      const cleanData = jsonData.map(row => {
        const clean = {};
        for (const [k,v] of Object.entries(row)) {
          if (v != null && String(v).trim() !== '' && String(v) !== 'null') {
            clean[k.trim()] = String(v).trim();
          }
        }
        return clean;
      }).filter(r => Object.keys(r).length > 0);
      if (!cleanData.length) continue;
      // Icon detection based on sheet name
      const snu = sn.toUpperCase();
      const icon = snu.includes('AUDIT') ? '🔍'
        : snu.includes('PAGO') ? '💰'
        : snu.includes('MUNICIPIO') || snu.includes('CIUDAD') ? '🏙️'
        : snu.includes('RESUMEN') || snu.includes('REPORTE') ? '📈'
        : snu.includes('EXPORT') ? '📤'
        : snu.includes('CONTAD') ? '👤'
        : snu.includes('EMPRESA') ? '🏢'
        : snu.includes('VENCIM') ? '⚠️'
        : '📄';
      const tabId = 'dyn_' + sn.toLowerCase().replace(/[^a-z0-9]/g,'_').substring(0,20);
      DYNAMIC_TABS[tabId] = { id: tabId, label: sn, icon, data: cleanData };
      if (!TABS.find(t => t.id === tabId)) {
        TABS.push({ id: tabId, icon, label: sn });
      }
      setImportProgress(28, 'Creando pestañas...', `  ${icon} Pestaña creada: "${sn}" (${cleanData.length} registros)`);
    }
    saveDynamicTabs();

    // Column name mappings
    const COL_EMPRESA  = ['EMPRESA','EMPRESAS','NOMBRE','RAZON SOCIAL','CLIENTE','NOMBRE DE EMPRESA'];
    const COL_NIT      = ['NIT','NIT EMPRESA','IDENTIFICACION'];
    const COL_CONTADOR = ['CONTADOR','RESPONSABLE','ENCARGADO','CONTADOR RESPONSABLE'];
    // Known columns to skip when detecting extras
    const KNOWN_COLS   = ['GRUPO','FIRMA','EMPRESA','EMPRESAS','NOMBRE','RAZON SOCIAL','CLIENTE',
      'NIT','NIT EMPRESA','IDENTIFICACION','CONTADOR','RESPONSABLE','ENCARGADO',
      'TIPO DE IMPUESTO','IMPUESTO','PERIODO','PERÍODO','FECHA VENCIMIENTO',
      'VENCIMIENTO','DIGITO','DÍGITO'];
    // Note: FECHA ENTREGA, ESTADO, PAGO, TIPO etc. are treated as EXTRA columns
    // Store detected extra column names globally
    window._extraCols = window._extraCols || [];
    const MONTH_MAP = {
      'ENERO':1,'FEBRERO':2,'MARZO':3,'ABRIL':4,'MAYO':5,'JUNIO':6,
      'JULIO':7,'AGOSTO':8,'SEPTIEMBRE':9,'OCTUBRE':10,'NOVIEMBRE':11,'DICIEMBRE':12
    };
    const MONTH_LABELS = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio',
      'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

    // Normalize: remove accents for robust matching
    function norm(s) {
      return (s||'').toString().trim().toUpperCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '');
    }

    function findCol(headers, candidates) {
      for (let i = 0; i < headers.length; i++) {
        const hu = norm(headers[i]);
        if (candidates.some(c => hu.includes(norm(c)))) return i;
      }
      return -1;
    }

    function cleanNit(v) {
      if (!v) return '';
      return String(v).trim().replace(/[^0-9]/g,'').substring(0,12);
    }

    function parseDate(v) {
      if (v == null || v === '') return null;
      if (v instanceof Date) return v.toISOString().split('T')[0];
      const s = String(v).trim();
      // Format: 2026-07-14
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
      // Format: Tuesday, July 14, 2026 or July 14, 2026
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        return y + '-' + m + '-' + day;
      }
      // Format: 14/07/2026 or 07/14/2026
      const parts = s.split(/[\/\-\.]/);
      if (parts.length === 3) {
        if (parts[2].length === 4) return parts[2]+'-'+parts[1].padStart(2,'0')+'-'+parts[0].padStart(2,'0');
        if (parts[0].length === 4) return parts[0]+'-'+parts[1].padStart(2,'0')+'-'+parts[2].padStart(2,'0');
      }
      return null;
    }

    // Process each sheet
    const allObs = [];
    const empMap = {};

    for (const sheetName of sheets) {
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: false, dateNF: 'yyyy-mm-dd' });
      console.log('Sheet:', sheetName, 'Rows:', rows.length, 'First row:', rows[0], 'Second row:', rows[1]);
      if (!rows || rows.length < 2) continue;

      // Find header row (search up to row 5)
      let headerRow = -1;
      let headers = [];
      for (let i = 0; i < Math.min(6, rows.length); i++) {
        const rowStr = (rows[i]||[]).map(v => (v||'').toString()).join(' ').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        if (COL_EMPRESA.some(k => rowStr.includes(k))) {
          headerRow = i;
          headers = (rows[i]||[]).map(h => (h||'').toString().trim().toUpperCase());
          break;
        }
      }
      if (headerRow === -1) continue;

      const empCol = findCol(headers, COL_EMPRESA);
      const nitCol = findCol(headers, COL_NIT);
      const cntCol = findCol(headers, COL_CONTADOR);
      if (empCol === -1) continue;

      // Detect format: FLAT (one row per obligation) vs WIDE (dates as columns)
      // FLAT format has: TIPO DE IMPUESTO, PERÍODO, FECHA VENCIMIENTO as columns
      const tipoCol   = headers.findIndex(h => norm(h).includes('TIPO') || (norm(h).includes('IMPUESTO') && h.length > 10));
      const periodoCol= headers.findIndex(h => norm(h).includes('PERIODO'));
      const fechaCol  = headers.findIndex(h => (norm(h).includes('VENCIMIENTO') || norm(h).includes('FECHA VEN')) && !norm(h).includes('ENTREGA'));
      const grupoCol  = headers.findIndex(h => norm(h).includes('GRUPO') || norm(h).includes('FIRMA'));
      const municipioCol = headers.findIndex(h => norm(h).includes('MUNICIPIO') || norm(h).includes('CIUDAD'));
      const isFlat    = tipoCol >= 0 && periodoCol >= 0 && fechaCol >= 0;
      // Store column map for version history
      window._lastColumnMap = { empCol, nitCol, cntCol, tipoCol, periodoCol, fechaCol, grupoCol, municipioCol, headers, sheetName };
      console.log('Cols detected — tipo:', tipoCol, 'periodo:', periodoCol, 'fecha:', fechaCol, 'grupo:', grupoCol, 'isFlat:', isFlat);

      // WIDE format: find date columns (month names in headers)
      const dateCols = [];
      if (!isFlat) {
        headers.forEach((h, idx) => {
          for (const [mName, mNum] of Object.entries(MONTH_MAP)) {
            if (h.includes(mName) && !h.includes('ENTREGA')) {
              dateCols.push({ idx, label: MONTH_LABELS[mNum] + ' 2026' });
            }
          }
          if ((h.includes('VENCIMIENTO') || h.includes('PAGO')) && !h.includes('ENTREGA')) {
            dateCols.push({ idx, label: h });
          }
        });
      }

      let sheetCount = 0;
      for (let r = headerRow + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        const rawEmp = row[empCol];
        const empresa = (rawEmp != null && rawEmp !== 'null') ? String(rawEmp).trim() : '';
        if (!empresa || empresa.toUpperCase() === 'EMPRESAS' || empresa.toUpperCase() === 'EMPRESA' || empresa.length < 2) continue;

        const rawNit = nitCol >= 0 ? row[nitCol] : null;
        const nit      = rawNit != null && rawNit !== 'null' ? cleanNit(String(rawNit)) : '';
        const rawCnt = cntCol >= 0 ? row[cntCol] : null;
        const contador = rawCnt != null && rawCnt !== 'null' ? String(rawCnt).trim() : '';
        const rawGrp = grupoCol >= 0 ? row[grupoCol] : null;
        const grupo    = rawGrp != null && rawGrp !== 'null' ? String(rawGrp).trim() : '';
        const empKey   = nit || empresa;

        if (!empMap[empKey]) empMap[empKey] = { nit, razon_social: empresa, contador_responsable: contador };

        if (isFlat) {
          // FLAT format: one row = one obligation
          const rawTipo   = row[tipoCol];
          const rawPeriodo= row[periodoCol];
          const rawFecha  = row[fechaCol];
          const impuesto  = (rawTipo   != null && rawTipo   !== 'null') ? String(rawTipo).trim()   : '';
          const periodo   = (rawPeriodo!= null && rawPeriodo!== 'null') ? String(rawPeriodo).trim() : '';
          const fecha     = parseDate(rawFecha);
          if (sheetCount === 0 && r <= headerRow + 3) {
            console.log('Row debug:', r, 'empresa:', empresa, 'impuesto:', impuesto, 'periodo:', periodo, 'fecha:', fecha, 'rawFecha:', rawFecha, 'row[fechaCol]:', row[fechaCol]);
          }
          if (!fecha || !impuesto || !empresa) continue;
          const rawMun = municipioCol >= 0 ? row[municipioCol] : null;
          const municipio = (rawMun != null && rawMun !== 'null') ? String(rawMun).trim() : '';
          const id = (nit||empresa) + '||' + impuesto + '||' + periodo + '||' + (fecha||'') + '||' + municipio;
          // Detect extra columns
          const extras = {};
          headers.forEach((h, ci) => {
            if (!h) return;
            const hn = norm(h);
            const isKnown = KNOWN_COLS.some(k => {
              const kn = norm(k);
              return hn === kn || hn.startsWith(kn) && kn.length > 4;
            });
            if (!isKnown && row[ci] != null && String(row[ci]).trim() !== '' && String(row[ci]) !== 'null') {
              const key = h.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
              const label = h; // normalized header as label
              extras[key] = String(row[ci]).trim();
              if (!window._extraCols.find(c => c.key === key)) {
                window._extraCols.push({ key, label });
              }
            }
          });

          allObs.push({
            empresa_nit: nit || empresa, empresa_nombre: empresa,
            impuesto, periodo, fecha_vencimiento: fecha,
            contador, grupo, municipio,
            campos_extra: Object.keys(extras).length > 0 ? extras : null,
            _id: id
          });
          sheetCount++;
        } else {
          // WIDE format: dates spread across columns
          const cols = dateCols.length > 0 ? dateCols : [];
          if (cols.length === 0) {
            for (let c = Math.max(empCol, nitCol >= 0 ? nitCol : 0, cntCol >= 0 ? cntCol : 0) + 2; c < row.length; c++) {
              const d = parseDate(row[c]);
              if (d) cols.push({ idx: c, label: headers[c] || 'Período' });
            }
          }
          for (const { idx, label } of cols) {
            const fecha = parseDate(row[idx]);
            if (!fecha) continue;
            const id = (nit||empresa) + '||' + sheetName + '||' + label + '||' + fecha;
            allObs.push({
              empresa_nit: nit || empresa, empresa_nombre: empresa,
              impuesto: sheetName, periodo: label,
              fecha_vencimiento: fecha, contador, grupo, _id: id
            });
            sheetCount++;
          }
        }
      }
      setImportProgress(25 + Math.round(sheets.indexOf(sheetName)/sheets.length*40),
        'Procesando ' + sheetName + '...',
        `  ✓ ${sheetName}: ${sheetCount} obligaciones`);
    }

    setImportProgress(70, 'Guardando en base de datos...', `📊 Total: ${allObs.length} obligaciones encontradas`);

    if (allObs.length === 0) {
      setImportProgress(100, 'Sin datos para importar.', '⚠️ No se encontraron obligaciones en el archivo.');
      document.getElementById('import-close-btn').style.display = 'block';
      return;
    }

    // Save to Supabase or localStorage
    if (supabase) {
      // Upsert empresas
      const empArr = Object.values(empMap).filter(e => e.nit);
      if (empArr.length > 0) {
        await supabase.from('empresas').upsert(empArr, { onConflict: 'nit', ignoreDuplicates: false });
        setImportProgress(75, 'Guardando empresas...', `  ✓ ${empArr.length} empresas actualizadas`);
      }

      // Get existing presented states to preserve them
      const { data: existing } = await supabase.from('obligaciones')
        .select('empresa_nit,impuesto,periodo,estado,fecha_presentacion,presentado_por,observaciones');
      const existingMap = {};
      (existing||[]).forEach(r => {
        existingMap[r.empresa_nit+'||'+r.impuesto+'||'+r.periodo] = r;
      });

      // Deduplicate allObs by _id (same empresa+impuesto+periodo)
      const dedupMap = {};
      for (const o of allObs) { dedupMap[o._id] = o; }
      const dedupObs = Object.values(dedupMap);
      console.log('After dedup:', dedupObs.length, 'from', allObs.length);

      // Upsert obligaciones preserving Presentado state
      const oblArr = dedupObs.map(o => {
        const prev = existingMap[o._id];
        return {
          empresa_nit: o.empresa_nit,
          empresa_nombre: o.empresa_nombre,
          impuesto: o.impuesto,
          periodo: o.periodo,
          fecha_vencimiento: o.fecha_vencimiento,
          contador: o.contador,
          estado: prev?.estado === 'Presentado' ? 'Presentado' : 'Pendiente',
          fecha_presentacion: prev?.fecha_presentacion || null,
          presentado_por: prev?.presentado_por || null,
          observaciones: prev?.observaciones || null,
          grupo: o.grupo || null,
          municipio: o.municipio || null,
          campos_extra: o.campos_extra || null,
        };
      });

      let saved = 0;
      for (let i = 0; i < oblArr.length; i += 300) {
        const chunk = oblArr.slice(i, i+300);
        const { error } = await supabase.from('obligaciones')
          .upsert(chunk, { onConflict: 'empresa_nit,impuesto,periodo,fecha_vencimiento,municipio' });
        if (error) throw error;
        saved += chunk.length;
        setImportProgress(75 + Math.round(saved/oblArr.length*20),
          'Guardando obligaciones...', null);
      }
      setImportProgress(98, 'Recargando datos...', `  ✓ ${oblArr.length} obligaciones guardadas en Supabase`);
      DATA = await loadObligations();
      // Save version snapshot
      saveVersion(file.name, oblArr, window._lastColumnMap || {});
      setImportProgress(99, 'Guardando versión...', `  📦 Versión guardada (${new Date().toLocaleString('es-CO')})`);
    } else {
      // Offline: update persisted state
      allObs.forEach(o => {
        // preserve existing Presentado
        if (!persisted[o._id]) {
          // new record, leave as default
        }
      });
      // Update DATA in memory
      DATA = allObs.map(o => ({
        id: o._id, empresa: o.empresa_nombre, nit: o.empresa_nit,
        contador: o.contador, impuesto: o.impuesto, periodo: o.periodo, fecha: o.fecha_vencimiento
      }));
      setImportProgress(98, 'Datos cargados en memoria.', `  ✓ ${allObs.length} obligaciones cargadas (modo offline)`);
    }

    setImportProgress(100, '¡Importación completada!', `✅ Proceso finalizado exitosamente.`);
    document.getElementById('import-close-btn').style.display = 'block';
    renderAll();

  } catch(err) {
    console.error(err);
    setImportProgress(100, 'Error en la importación', '❌ Error: ' + err.message);
    document.getElementById('import-close-btn').style.display = 'block';
  }
}

// ── SYNC DATA ────────────────────────────────────────
async function syncData() {
  const btn = document.getElementById('btn-sync');
  if (btn) { btn.innerHTML = '⏳ Sincronizando...'; btn.disabled = true; }

  try {
    const prevTotal     = DATA.length;
    const prevEmpresas  = new Set(DATA.map(r => r.nit || r.empresa)).size;
    const prevImpuestos = new Set(DATA.map(r => r.impuesto)).size;
    const prevContadores= new Set(DATA.map(r => r.contador).filter(Boolean)).size;
    const prevGrupos    = new Set(DATA.map(r => r.grupo).filter(Boolean)).size;

    // Reload from Supabase
    DATA = await loadObligations();
    await loadPersistedState();

    const newTotal      = DATA.length;
    const newEmpresas   = new Set(DATA.map(r => r.nit || r.empresa)).size;
    const newImpuestos  = new Set(DATA.map(r => r.impuesto)).size;
    const newContadores = new Set(DATA.map(r => r.contador).filter(Boolean)).size;
    const newGrupos     = new Set(DATA.map(r => r.grupo).filter(Boolean)).size;

    // Build change summary
    const changes = [];
    if (newTotal      !== prevTotal)      changes.push(`${newTotal > prevTotal ? '+' : ''}${newTotal - prevTotal} obligaciones`);
    if (newEmpresas   !== prevEmpresas)   changes.push(`${newEmpresas > prevEmpresas ? '+' : ''}${newEmpresas - prevEmpresas} empresas`);
    if (newImpuestos  !== prevImpuestos)  changes.push(`${newImpuestos > prevImpuestos ? '+' : ''}${newImpuestos - prevImpuestos} tipos de impuesto`);
    if (newContadores !== prevContadores) changes.push(`${newContadores > prevContadores ? '+' : ''}${newContadores - prevContadores} contadores`);
    if (newGrupos     !== prevGrupos)     changes.push(`${newGrupos > prevGrupos ? '+' : ''}${newGrupos - prevGrupos} firmas`);

    const msg = changes.length > 0
      ? '🔄 Actualizado: ' + changes.join(', ')
      : '✅ Todo al día — sin cambios nuevos';

    showToast(msg);
    renderAll();

    // Update header subtitle
    const sub = document.getElementById('hdr-sub');
    if (sub) sub.textContent = `2026 · ${newTotal} obligaciones`;

  } catch(e) {
    showToast('❌ Error al sincronizar: ' + e.message);
  } finally {
    if (btn) { btn.innerHTML = '🔄 Sincronizar'; btn.disabled = false; }
  }
}
